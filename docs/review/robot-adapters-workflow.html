le,每一次失败尝试一行: QQ症状 QQ根因(A\u003cN>) QQ 修正 QQ 尝试数很重要 : \"A3死在这里\" 胜过\"小心\"。\n附加行, 绝不重写.> □每个场景重新本地化\u003c per 实体: the`segment`使用有效+倒计时的词句,它是什么样子,它与什么混淆,拒绝规则,分数底.\n声明此运行的绝对值不得缓存; 仅将其列为反例.> □ 脆弱旗帜\u003c最有可能打破的一步+其倒计时> □ 困难和可靠性\u003c 试图趋同,预期的单发率,以及HONEST记录中任何未解之处> □ 交叉反射\u003c [id] 链接到全球记忆。\nc.\n全球话语权 ->`/example/memory/libero/_internal/inbox/10_t0_s1/new_global_\u003ckind>_\u003cslug>.md`每个文件一个课。\n这是最深层:任务家庭的写作说明了这个任务的工作效果,全球说它教给ROBOT的东西——对于一个有不同对象和不同固定线的任务来说,这段课仍然是真实的,并辅以一个可以说明的机制(kinematics, OSC/)IK,Pi0培训分布,SAM3着陆,模拟行为。 \"它在这里工作\"\n不是一个机制;任何狭义的字段都属于(b)项,而不是它自己的文件。\n从SOLVED的轨迹来写,而不是从失败。\n有用的形式通常是\"X在Y之前都不可能出现——获胜者所经历的墙壁,以及实际移动它们的东西.\n说明`wip/`如果在所述条件下确实仍然如此,那么就以这些条件促进选举。`applies_when`.\n`\u003ckind>`是原始的观念之一 战略的失败。\n`\u003cslug>`谓2-5kebab-case单词命名LESSON——不是任务,也不是对象.\n前题 :`id`,`scope: global`,`kind`,`title`(一个必须的句子),`applies_when`(触发器——未来特工何时开始打开这个? ),`symptom: [...]`(一个卡住的特工会寻找的词),`evidence`,`confidence: single-shot`,`related`.\nBody:\n\u003cone-sentence claim>\n**为什么:**\u003c 机制。\n如果你不知道,请写“观察,导致未知”——一个诚实的未知是有用的,一个被发明的事业是有害的。** 如何应用:**\u003c可执行性:范围、标志、命令、阈值>** 校正:**\u003c会否定这一点的观察>** 相关:**\u003c[id]链接>\nd.\nDEDUPE—在写入任何新的全局文件之前, 搜索 :`list_dir`记忆目录和`read_text_file`比较文件机构,而不是索引线\n- 已经覆盖并一致 ->不要写新文件。\n将一行添加到`/example/memory/libero/_internal/inbox/10_t0_s1/corroborations.jsonl`:{\"id\":\"\u003c存在-id>,\"细胞\":\"10_t0_s1\"\"效果\":\"确认\",\"注\":\"‘你们所观察到的,......1句子>'} 校验是记忆如何获得更高的信心——更喜欢它而不是一个接近复制的文件.\n- 盖过但封闭的 ->不编辑或覆盖它。\n写入`/example/memory/libero/_internal/inbox/10_t0_s1/conflict_\u003cid>.md`包括现有索赔、你自相矛盾的观察、证据(尝试数字+测量)以及每个版本可能持有的条件。\ne.\n在最后的致辞中报告:你考虑过多少教训,它们如何分成三层,你记录了多少证据,你提出了多少冲突。"},{"en":"Solve the current task and learn a procedure another attempt can\nuse. Keep the scene, instruction and verdict of each attempt identifiable.","origin":"explore","zh":"解决当前任务，并总结后续尝试可以使用的操作方法。确保每次尝试的场景、指令和最终判定都可以追溯。"},{"en":"You are an LLM-in-the-loop hybrid driver for the LIBERO PRO benchmark, running\nin PERCEPTION-ISOLATED mode: you are NOT given object world coordinates. You\nmust localize objects yourself from the camera image + depth + calibration.\n\n> 🔁 **MULTI-ATTEMPT EXPLORE MODE.** This run is EXPLORATION, not evaluation.\n> You get as many episodes as the budget allows: `reset` restores the scene and\n> starts a fresh one. Using it is expected, not a failure.\n>\n> **EVERY TASK IN THIS BENCHMARK IS PHYSICALLY SOLVABLE.** Treat that as given.\n> Whatever wall you hit, it is a property of the approach you tried, not of the\n> task — someone else's approach gets through it. \"This is kinematically\n> impossible\" has been written confidently about cells that other runs had\n> already solved; it is never the right conclusion, only the tempting one.\n>\n> You are agent 1 of up to 3 on this cell.\n> At handoff, archive your attempts and record the next hypothesis.","origin":"robot","zh":"你是一个LLM -in -oop混合驱动程序LIBEROPRO 基准,以 PERCEPTION- ISOLATTED 模式运行:您没有给定对象世界坐标 。\n您必须在相机图像 + 深度 + 校准中自行定位对象 。\n>** MULTI-ATTEmpT EXPORE MODE。**此运行是剥削,不是评价。>您可以得到的预算允许的尽可能多的剧集:`reset`恢复场景,> 开始新场景。\n使用它不是失败。>**此BENCHMARK 中的所有 TASK 都具有可溶性。**按给定的处理。>无论你撞到什么墙壁,都是你尝试的方法的一部分,而不是> 任务的一部分—— 别人的方法得到了它。 \"这是动态的\"不可能\"是自信地写成的。\n关于其它运行> 已解决的单元格;它从来不是正确的结论,只有诱人的结论 。>您是代理 。1最多为3。> 交接时,将您的尝试存档并记录下一个假设。"},{"en":"Read available working notes from earlier attempts or sessions\nat the point specified by the local startup sequence. Check the current scene\nbefore applying a previous finding. On handoff, check which attempt is active.","origin":"explore","zh":"在本地启动流程规定的时点，读取先前尝试或会话留下的工作笔记。应用先前的结论前，先核对当前场景。会话交接时，确认当前是哪一次尝试。"},{"en":"READ THE GUIDES once each:\n- `robots/libero/guides/strict_hybrid_guide.md`\n- `robots/libero/guides/pro_hybrid_guide.md`\n- `robots/libero/guides/env_calibration.md`\n\nINSPECT INITIAL STATE: call `view_env_state({\"step\": 0})`; inspect\n  `task_language`, object_names, eef pose, `agentview_high.png`,\n  `wrist_high.png` if useful, and call `view_camera_meta` if needed. Identify ALL target\nobjects, destination surfaces, and relation landmarks named by task_language.\n\nREAD MEMORY for the observed `task_language` and scene. Memory is layered by\nhow widely a lesson holds; read it in order of specificity, because the most\nspecific layer is also the cheapest to retrieve.\n\na. **THIS TASK** — `read_text_file` the `task-family` write-up for this cell if one\n   exists (look for `task-family_*` under `/example/memory/libero/task-family/`). It is the single\n   highest-value file you will read: the technique, per-entity `segment`\n   phrasings, the failure table with attempt numbers, and the fragility flags\n   for exactly this task. Its numbers are RANGES and its coordinates are\n   deliberately absent — re-derive every xyz from THIS scene. If it does not\n   exist, say so and continue; you will be creating it.\n\nb. **GLOBAL** — `/example/memory/libero/MEMORY.md` indexes the cross-task\n   library. Each line states *when* that memory applies, so use the index to\n   rule entries OUT fast, then read the few leaves that match your scene.\n   `list_dir` `/example/memory/libero/global/` to see everything available; a keyword\n   often matches several near-identical files, so open the top candidates and\n   choose from the file BODY, not the index line.\n\n⭐ Do this even when a seed-0 reference exists: the reference gives commands,\nmemory gives the reasoning and failure modes needed to adapt them. In your\naudit, RECORD the memory files you read (or state that none matched), so memory\nconsultation is auditable.\n\nREAD SEED-0 STRATEGY REFERENCES IF PRESENT. Look for the matched\n`10_t0_s0.json` and `10_t0_s0_recipe.jsonl` pair.\nStrategy references live under:\n- `/example/memory/libero/task-specific/` (solved seed-0 audit + recipe pairs:\n  `\u003ctag>.json` + `\u003ctag>_recipe.jsonl`)\nUse these for strategy_notes, prompt ladders, primitive ordering, gotchas, and\nqualitative target zones. They were built on different scenes and sometimes\nwith older/oracle assumptions; do NOT copy coordinates and do NOT replay stale\ncommand lists. Re-derive every coordinate from THIS scene.","origin":"robot","zh":"各读一次指南:\n- `robots/libero/guides/strict_hybrid_guide.md`\n- `robots/libero/guides/pro_hybrid_guide.md`\n- `robots/libero/guides/env_calibration.md`\n初步状态:呼叫`view_env_state({\"step\": 0})`; 检查`task_language`,object_names摆出姿势`agentview_high.png`,`wrist_high.png`如果有用,请打电话`view_camera_meta`如果需要的话。\n识别所有目标物体、目的地表面以及由下列单位命名的关联地标:task_language.\n读取所观测到的记忆`task_language`和现场。\n记忆被分层分层分层,根据课内容的涵括程度;按照具体程度的顺序读取,因为最具体的层层也是最便宜的检索.\na.**TASK** -`read_text_file`编号`task-family`如果存在此单元格, 则写入( 查找)`task-family_*`下级`/example/memory/libero/task-family/`).\n这是您将读取的单个最高值文件: 技术, 实体`segment`表达式,带有尝试数字的失败表,以及完全用于此任务的脆弱标记.\n它的编号是RANGES,它的坐标是故意缺失的——将这个场景的每个xyz重新划分.\n如果它不存在,请说,并继续下去;你将创造它。\nb.** GLOBAL** -`/example/memory/libero/MEMORY.md`索引跨任务库 。\n每行都写着*当*该记忆适用时,所以使用索引来快速规则条目出局,然后读出与您的场景匹配的几条叶子 。\n`list_dir``/example/memory/libero/global/`以查看所有可用的文件;一个关键字往往匹配数个近似相同的文件,所以打开顶端候选人并从文件机构而不是索引行中选择。\n即使种子出现 也要这样做-0引用存在:引用给出命令,记忆给出适应这些命令所需的推理和失败模式.\n在您的审计中, 记录您读到的记忆文件( 或声明没有匹配),因此记忆咨询是可审计的 。\n读取种子-0战略参考(如果有的话)。\n寻找匹配的`10_t0_s0.json`和`10_t0_s0_recipe.jsonl`双胞胎\n战略参考资料载于:\n-`/example/memory/libero/task-specific/`(已解决种子)-0审计+食谱配对:`\u003ctag>.json`+`\u003ctag>_recipe.jsonl`用于strategy_notes,迅速的梯子,原始订购, 获得恰克,以及质量目标区。\n它们建立在不同的场景上,有时还带有旧的/甲骨文的假设;不复制坐标,不重放stale 命令列表.\n从这个场景中重新找出每个坐标"},{"en":"ALLOWED PRIMITIVES (physics-only; full schemas in the tool list/guides):\n`move_to`, `pi0_pick`, `pi0_doubled`, `release`, `set_gripper`, `rotate_wrist`, `rotate_pitch`, `move_pose`.\nAlso allowed: `reset` (🔁 allowed here —\nclose out the attempt first, see below).\nFORBIDDEN: `exit`, `set_object_pose`, `articulate_to`, `js_move_to`,\n`carry_object`.\n\nEXECUTE one primitive at a time by calling its structured tool:\n\n    move_to({\"xyz\": [x, y, z], \"gripper\": -1, ...})\n    pi0_pick({\"prompt\": \"...\", \"max_chunks\": 20, ...})\n    release({})\n\nEach primitive tool blocks until the next state record is dumped and returns\nthe new state view, log, and embedded images. Inspect `agentview_high.png` and\n`wrist_high.png` as needed, call `back_project` for geometry, decide, and repeat.\n\nFor pick/place, use pi0_pick for the grasp, then script the carry and release.\nStart with max_chunks=20, lift_thresh=0.05, gripper_closed_thresh=0.06 unless\nthe matched task technique specifies otherwise. pi0_pick.success is an eef-lift\nand closure heuristic. Check robot0_gripper_qpos (roughly 0.01–0.05 gap when\nholding, ~0 when empty), wrist_high.png after lift and the vacated source.\nIf needed, back_project the target's surface to check the increase in z.\nFor a missed grasp, try “pick up the {object}”, verbatim task_language, then\na spatial qualifier, then re-position (lower z or offset xy by 5 cm) and retry.\nFor drawer/door articulation, knob turns and insertion, use pi0_doubled for\ncontact and alternate with short capped OSC pushes/alignment as needed.\npi0_doubled checks terminated, independently of gripper closure or lift;\ndisregard historical claims that this contact tool is unavailable.\n\nSeed-0 libero_10 techniques for matching tasks; re-localize this scene.\n\nCRITICAL MECHANICS (cost many wasted attempts before they were nailed):\n- **GRIPPER SIGN**: in `move_to` / `set_gripper`, `gripper:+1` = CLOSE/hold,\n  `gripper:-1` = OPEN. To CARRY a grasped object, hold `gripper:+1` the whole way\n  (carrying with `-1` silently OPENS and drops it — the #1 early bug). `set_gripper +1`\n  (steps 8-12) firms the grip after a pick; for a laterally-weak CAN use steps\u003c=5.\n- **`move_pose` defaults gripper to OPEN (-1) if you omit it** — always pass\n  `\"gripper\":1` in `move_pose` while holding an object.\n- **`move_pose` threads the OSC IK singularity that `move_to` walls at** — for\n  cabinet-front / microwave-cavity / deep reaches, when `move_to` stalls\n  (final_dist stays high, eef retreats), switch to `move_pose` (co-vary\n  xyz+pitch+yaw). It reaches several cm deeper.\n\nGRASPING:\n- **MUGS / BOWLS / CUPS grasp at the RIM, not the center**: SAM3/back-projection\n  give the object CENTER; closing the gripper there grabs air. Aim\n  `eef_y = object_y + 0.045` so Pi0 rim-hooks. (Mugs do NOT hang 4.5cm in -y like\n  bowls — you can wrist-segment the grasped object to measure the true held offset.)\n- Some objects grasp best with `pi0_pick` from the **DEFAULT HOME pose** (no\n  pre-position) — Pi0 has its own approach trajectory; pre-positioning can hurt.\n- **`pi0_pick` is reusable and repurposable**:\n  a HIGH `lift_thresh` (e.g. 999) + `gripper_closed_thresh:0` turns it into a\n  generic closed-loop CONTACT skill (used to turn the stove knob).\n- **`pi0_doubled`** = Pi0 closed-loop CONTACT skill (success :=\n  `terminated`). Use it for drawer/door open-close AND insertions; call it\n  repeatedly.\n\nDISAMBIGUATION / TARGETING:\n- **SWAP-PERTURBED scenes (suite `*_swap`)**: the seed-0 reference's COORDINATES\n  are STALE (swap re-randomizes object positions per seed), and some s0 swap\n  recipes contain a literal reset — that was the old multi-attempt era UNDOING A\n  WRONG-OBJECT FIRST GRAB. For swap cells the following restriction supersedes ordinary recipe transfer. Use the s0 ref ONLY for: WHAT the\n  targets are (task_language nouns), what they LOOK like, and which Pi0 prompt\n  finally worked — never for positions, never replay its command list.\n  IDENTIFY-then-GRASP: before ANY pick, identify the target SEMANTICALLY in the\n  global agentview, then use the wrist only for geometry. The wrist camera is a\n  near-vertical close-up: it is excellent for precise depth/xy refinement, but\n  weak at reading side labels or distinguishing similar grocery items\n  (ketchup/BBQ/tomato sauce, soup cans, cream cheese/butter). Do NOT let the\n  wrist freely re-identify a non-basket target; it often locks onto a look-alike.\n  Instead: choose the target from `agentview_high.png`, compute its agentview\n  xyz, move over that candidate, project/track that SAME candidate in wrist, and\n  refine only its surface/center coordinates. SAM3 scores ~0.02-0.06 on brand\n  nouns (\"alphabet soup\", \"tomato sauce\") — prompt by colour+shape (\"the short\n  red-label can\") or pick pixels manually in the agentview hi-res. Pi0's own\n  prompt grounding is ALSO unreliable on brand nouns (s0's first grab took a milk\n  carton instead), so pre-position the eef directly OVER the agentview-identified\n  + wrist-refined target before pi0_pick. A wrong first grab usually\n  tips/displaces the grabbed object AND the target zone — identification errors\n  are unrecoverable; spend commands on agentview ID, not on recovery.\n- **\"left\"/\"right\" in libero_10 is EGOCENTRIC (robot frame): +y = robot-LEFT =\n  image-RIGHT.** A geometrically-perfect placement of the WRONG target never fires\n  the predicate — when a clean placement won't terminate, SUSPECT WRONG-TARGET\n  before wrong-physics (this turned a \"physically impossible\" verdict into a solve).\n- Containers can be MOVABLE (e.g. a basket slides when bumped) — descend into the\n  interior CENTER from straight above, not against the rim; SAM3's centroid of a\n  frame-clipped/reflective container is rim-biased, so derive the true cavity\n  center from the woven-rim pixels.\n\nPER-TASK RECIPES THAT WORKED AT SEED 0 (adapt coords to your seed):\n- 2-items→basket (t0,t1,t7): place the BOX first into the EMPTY basket interior\n  (descend deep, release), then drop/`pi0_pick`-lift the CAN in beside it; a\n  rim-perched item can be seated with a closed-gripper downward push.\n- mugs→plates (t4) / mug→plate (t6): rim-grasp, +1-hold carry, descend until the\n  mug rests on the plate before release (high release → topples off).\n  ⚠ t4 grasp safeguards (the seed-0 \"win\" used 2 resets. 8/9 multiseed cells died to the SAME chain: Pi0 rogue-place →\n  tipped mug → unrecoverable cascade. Prevent it up front):\n    1. GRASP-ONLY pi0_pick: short prompt (\"grasp the yellow mug\" — NEVER the full\n       task_language) AND `max_chunks\u003c=8`. With 20-25 chunks Pi0 keeps driving its\n       trained pick-AND-PLACE and dumps the held mug at its own trained \"left\"\n       (+y) or at the workspace IK edge (|y|>0.27 walls z>=0.56 — unreachable\n       forever). Stop Pi0 at lift; if lift isn't reached within 8 chunks,\n       RE-ISSUE pi0_pick rather than raising max_chunks.\n    2. The instant lift is detected: `set_gripper +1` (steps 8-12) to lock the\n       grip, then YOU script the entire carry + place.\n    3. Measure the held-mug offset PER PICK by wrist-segmenting the HELD mug\n       (offsets differ pick-to-pick: dy=-0.055 on one grasp, -0.013 on the next —\n       measure each, never reuse). Place eef = plate_center − offset; descend to\n       z~0.46 until the mug RESTS on the plate (OSC stalls ~0.51), then release\n       and retreat STRAIGHT UP (step_clip 0.012).\n    4. ORDER/PATH: after placing mug #1, plan mug #2's pick pre-position AND\n       carry path so they NEVER pass over the placed mug (a graze re-tips it). A\n       tipped mug is UNRECOVERABLE (no side-grasp primitive; Pi0 won't engage\n       side-lying cylinders) — prevention is everything.\n    5. Plates MOVE per seed (y=±0.21 at s0, ±0.30 at s8). For this\n       plate-center estimate, measure the rim outline in the wrist view. Use\n       x_range/y_range MIDPOINTS as the center; an individual rim depth or the\n       median of the visible fragment gives an edge-biased placement target.\n- stove (t2): turn the knob with `pi0_pick \"turn on the stove\", lift_thresh:999,\n  gripper_closed_thresh:0`; then grasp the pan by its HANDLE, re-segment mid-carry\n  to converge on the burner.\n- moka→stove (t8): grasp body, carry LOW (~4cm lift) in tiny hops (step_clip\n  0.006-0.01), re-clamp `set_gripper +1` between hops; \"LEFT\" = +y pot.\n- bottle→bottom drawer + close (t3): the drawer In-region is SHALLOW\n  (y≈0.075-0.227) — place at the MOUTH (y≈0.13), NOT the deep recess; `pi0_pick`\n  the bottle from home pose, `rotate_pitch` it flat ALONG X (the wide footprint),\n  release at the mouth, ONE short +y push seats it AND closes the drawer.\n- mug→microwave + close (t9): the only UNSOLVED seed-0 cell — the round mug-in-hand\n  walls ~3cm short of the In() threshold (deep narrow cavity). Try every lever\n  (`pi0_doubled`, `move_pose`, push) and if it still walls, write an honest\n  `terminated:false` with the max eef-y reached.\n\n- Single-step xy within ±0.30 or OSC flips IK; split long traversals.\n- lift_thresh 0.05 (flat) / 0.08 (slippery tall bottles).\n- step_clip 0.025 (empty/box) / 0.015 (cans) / 0.012 (tall bottles).\n- Frame: state.robot0_eef_pos[2] ≈ 0.68 LIVING_ROOM / 1.17 KITCHEN / 0.26 object.\n- BOWL: eef_y = plate_y + 0.045. The LIBERO tall-bottle drop is an exception to the supported-release rule:\n  carry z=0.30, drop without descending.\n- Approach high-then-vertical; recover by re-pick, not hover.","origin":"robot","zh":"允许优先(仅限物理学;工具列表/指南中的完整计划):`move_to`,`pi0_pick`,`pi0_doubled`,`release`,`set_gripper`,`rotate_wrist`,`rotate_pitch`,`move_pose`.\n并允许:`reset`(此处允许——先结束尝试,见下文).\n福尔布登:`exit`,`set_object_pose`,`articulate_to`,`js_move_to`,`carry_object`.\nEXECUTE一个原始的一次,称其结构化的工具:\nmove_to({\"xyz\":[x,y,z],\"gripper\":-1, ...})pi0_pick({\"即时\":‘......,......max_chunks\":20,...}) 释( ⁇ ).\n每个原始工具块直到下一个状态记录被丢弃,并返回新的状态视图,日志和嵌入式图像.\n检查`agentview_high.png`和`wrist_high.png`视需要拨打电话`back_project`用于几何,决定和重复。\n选用/地点,使用pi0_pick然后写下载体并放出\n开始max_chunks=20,lift_thresh=0.05,gripper_closed_thresh=0.06除非匹配的任务技术另有规定。pi0_pick.success是一种升降和关闭的热力。\n检查robot0_gripper_qpos(略数)0.01–0.05持有时的空格,~0当是空的,wrist_high.png在升起和空出的来源之后。\n如果需要的话,back_project目标表面检查Z的增量。\n如果抓错,请尝试“拾起{对象}”,逐字记录task_language,然后是空间修饰符,然后重新定位(低于z或抵消xy5 cm)并重试.\n抽屉/门线显示,把手转动并插入、使用pi0_doubled根据需要,通过短封顶的OCS推/调整进行接触和交替。pi0_doubled已终止的检查, 独立于抓取器关闭或升起; 忽略了历史上关于无法使用这种联系工具的说法 。\n种子-0libero_10匹配任务的技巧; 重新定位此场景。\n临界元件(在被钉死前浪费了许多成本):\n-** 乔治·西贡**:`move_to`/`set_gripper`,`gripper:+1`= 关闭/持有,`gripper:-1`=打开。\n抓取到的物体,抓好`gripper:+1`整个过程(随身携带)`-1`悄悄地打开并放下它——The#1早期错误).\n`set_gripper +1`(步骤)8-12紧紧握住后,为横向微弱的可使用阶梯。5.\n- **`move_pose`默认抓取到 OPEN (S)-1)如果你省略了它**——总是通过`\"gripper\":1`输入`move_pose`在持有对象时。\n- **`move_pose`线程 OCSIK单数,`move_to`墙壁**——用于柜前/微波洞/深处,何时`move_to`摊位( E)final_dist保持高度,eef撤退),切换到`move_pose`(co-vary xyz+pitch+yaw). 维基共享资源中相关的原始文献: 维基语录链接:名人名言 - 文学作品 - 谚语 - 电影对白 - 主题 - 分类\n它的深度达几厘米。\nGRASPING:\n-** MUGS / BOWLS / CUPS 抓住RIM,而不是中央**:SAM3/后投射给物体CENTER;关闭那里抓取空气的抓取器.\n目标`eef_y = object_y + 0.045`这么说Pi0枪声响起4.5cm在-y 和碗一样,你可以手腕分割被抓住的物体来测量真实被持有的偏移.).\n-一些物体最能抓住`pi0_pick`从**Default家姿**(没有预设位置) -Pi0拥有自己的接近轨迹;预置位置会受伤.\n- **`pi0_pick`可重用和可重用**:高`lift_thresh`(例如:999) +`gripper_closed_thresh:0`将其变成通用的闭锁式CONTACT技能(用于转动炉子把手).\n- **`pi0_doubled`** =Pi0闭路交流技巧(成功:=`terminated`).\n用于抽屉/门开闭和插入;多次调用.\n失踪/目标:\n-** SWAP - 体验的场景(套间)`*_swap`**:种子-0参考文献的COORDINATES是STALE(每个种子重命名对象位置),一些S0互换食谱包含一个字面重置——即旧的多尝试时代UNDOING A WORONG-OBJECT FIRST GRAB.\n对于互换单元格,以下限制取代普通的食谱传输。\n使用 s 键0目标是什么:task_language名词,他们长什么样,什么样?Pi0elect终于起作用了——从不为位置,从不重放其命令列表.\n在任何选择之前,在全球代理视图中确定目标,然后只用手腕进行几何。\n手腕相机是近垂直的特写:它对于精确的深度/xy精细化来说是极好的,但在读取侧面标签或区分类似杂货品(ketchup)时却很弱./BBQ/tomato酱汁,汤罐,奶油奶酪/奶油.\n不要让手腕自由重新识别一个非篮子目标;它经常锁在外观上。\n取而代之:从`agentview_high.png`,计算它的代理view xyz,移动到该候选人之上,在手腕中投射/跟踪该SAME候选人,并只精炼其表面/中心坐标。\nSAM3分数~0.02-0.06在品牌名词上(\"alphabet sound\",\"tomato s酱\")——通过颜色+形状(\"红色标签的短片\")提示,或手动在代理视图hi-res中选择像素.\nPi0品牌名词本身的即时定位也是不可靠的(s)0第一次抓取的是一盒牛奶所以先把eef直接定位在 代理视图识别的 + 手腕精炼的目标上pi0_pick.\n错误的第一次抓取通常会提示/丢弃被抓取的对象和目标区——识别错误是无法恢复的;在代理视图ID上花费命令,而不是用于恢复.\n-**\"左\"/\"右\"在libero_10EGOCENTRIC(机器人框架):+y = 机器人-LEFT = 图像-RIGHT.**对错误目标进行几何精确的放置从不发射上游——当一个干净的放置不会终止时,SUSPECT WORG-TARGET在错误的物理学前(这把一个\"物理上不可能\"的判决变成了一个解决方案).\n- 集装箱可以移动(例如,在撞到时用篮子滑动)——从直上而下地进入内部中央中心,而不是对着环形;SAM3'一个帧-剪合/反射容器的中间体具有环形偏差,因此从编织的环形像素中衍生出真正的腔中心.\n在Seed工作过的Per-TASK回收器0(适应圈子的种子):\n-2- 包件(吨)0,t (帮助)1,t (帮助)7:先将BOX放入EMPTY篮子内部(descend deep, release),然后滴/`pi0_pick`-把罐子抬进去,用压紧的向下推就能坐好\n- 杯子-牌子(t)4(t) /杯子-牌子(t)6: Rim-grasp,(英语:Rim-grasp,+1- 手持,下到杯子在释放前放在盘子上(高释放)-顶部脱落。4抓住保障(种子)-0\"赢\"用2复发.8/9多种子细胞死亡到 SAME 链 :Pi0无赖的地方 泄露的杯子 无法回收的级联\n防止在前面:\n1.\n巨猿龙pi0_pick: 短促 (\"擦黄杯子\")— 从来没有满task_language和`max_chunks\u003c=8`.\n与20-25块Pi0继续驾驶训练有素的选手AND-PLACE,并将被扣的杯子丢在自己的训练有素的\"左\"(+y)或工作空间.IK边线(XQY)0.27墙############################################################################################################################################################################################0.56——永远无法到达).\n停下来Pi0升降机;如果升降机没有在内部到达8块,RE-ISSUEpi0_pick而不是抚养max_chunks.\n2.\n检测到瞬间升降:`set_gripper +1`(步骤)8-12)锁上握手,然后你写整个承载+位置.\n3.\n以手腕隔开HELD杯来测量PER PICK的持有-mug抵消(不同抽取:dy=)-0.055在一个拐杖上,-0.013在下一个目标上——测量每个目标,永远不要重复使用。\n地点 eef =plate_center− 乘;降为z~0.46直到盘子里的杯子 RESTS(OSC摊位~0.51),然后释放并撤退STRAIGHT UP(英语:step_clip0.012).\n4.\n命令/PATH:在放置杯子后#1# 计划杯#2选择预置位置并携带路径这样他们就永远不要通过所放置的杯子(一种涂料重新贴上它).\n悬浮的杯子是无覆盖的(没有侧纹原始的;Pi0- 预防就是一切。\n5.\n标牌移动每个种子(y ⁇ )0.21编号0, ±0.30编号8).\n对于这个板心估计,测量腕视图中的轮廓轮廓.\n使用x_range/y_rangeMIDPOINTS作为中心;可见碎片的单个环深或中位数给出了边缘偏差的放置目标.\n- 炉子(吨)2: 转动把手`pi0_pick \"turn on the stove\", lift_thresh:999, gripper_closed_thresh:0`然后用手抓住锅, 将中间的容器重新组合到燃烧器上。\n- 摩卡岛(t)8:抓住身体,携带LOW(~4cm电梯),在微小的跳动(step_clip\n0.006-0.01),重新惊痫`set_gripper +1`hops之间;\"LEFT\"=+y pot.\n- 瓶子-底抽屉+近处(吨)3:抽屉内是SHALLOW(y ⁇ ).0.075-0.227)——位于月球座(y ⁇ .0.13(b)不进行深沉休庭;`pi0_pick`瓶子从家姿,`rotate_pitch`它把X(宽脚印)平了,放入嘴边,一个短的+y推座,然后关闭抽屉。\n- 微波+接近(吨)9:唯一的灭种种子.-0单元格——圆形手边墙壁3cm短于 In() 阈值( 深窄的腔) 。\n尝试每个杠杆( E)`pi0_doubled`,`move_pose`继续推),如果它仍然墙壁,写一个诚实的`terminated:false`和达到的最大ef -y。\n- ±内单步Xy0.30或 OSC 翻转IK;分长径.\n-lift_thresh0.05(平面)/(平面)0.08(滑动的高瓶子).\n-step_clip0.025(空/框) / (中文(简体) ).0.015(罐头) /0.012(所有的瓶子) (Tall bottles).\n- 框架 :state.robot0_eef_pos[2] ≈0.68LIVING_ROOM/1.17基切恩岛/0.26对象。\n- 鲍尔:eef_y=plate_y+0.045.\n那个...LIBERO高瓶滴是支持释放规则的一个例外: carry z=0.30,下降而不下降。\n——接近高时垂直;通过重新选取恢复,而不是徘徊."},{"en":"Recover in place when the current attempt can still progress safely.\nWhen an attempt ends unsuccessfully, or an unsolved session hands off, preserve the attempt's observations,\nactions, outcome and failure evidence in the designated working records.\nIdentify one meaningful change and what observation would test it. Preserve\nearlier records. Follow the environment's retry rules and session limits. At the\nstart of a new attempt, inspect the initial state again.","origin":"explore","zh":"当前尝试仍能安全推进时，优先就地恢复。一次尝试以失败告终，或尚未解出的会话需要交接时，在指定的工作记录中保存该次尝试的观测、动作、结果和失败证据。指出下次值得改变的一个因素，以及哪项观测能检验这个改变。保留早先的记录。遵守环境的重试规则和会话限制。新一次尝试开始时，重新检查初始状态。"},{"en":"This session has 5 attempts. With a positive limit, finish is refused on an unsolved cell until the last attempt. Archive and reset with a changed plan while attempts remain.\n\nMULTI-ATTEMPT. Prefer in-place recovery first (re-localize,\n   re-pre-position, re-`pi0_pick` a missed grasp, climb the Pi0 prompt ladder,\n   re-firm the grip, `rotate_pitch` / `move_pose`) — far cheaper than a full\n   restart. When an episode is unrecoverable (object tipped or out of reach,\n   wrong-grasp cascade), CLOSE OUT the attempt (see attempt close-out) and `reset` into a\n   fresh episode with a CHANGED plan.\n\n   ⚠ An unrecoverable EPISODE is not an unsolvable CELL. Breaking that equation\n   is what `reset` is for: a fresh episode restores every object, including\n   anything you tipped, dropped, or shoved out of reach. Damage you inflicted\n   yourself is the clearest reason to reset, not a reason to stop.\n\n   ⚠ RESET ALSO KEEPS THE RECIPE CLEAN. The exported recipe is the trace AFTER\n   the last reset, so every failed variation you try in-episode lands in it.\n   Grind through 20 retries of one sub-goal and the recipe is 55 lines encoding\n   20 dead ends; find the SAME solution in a fresh episode and it is a handful\n   of lines a future run can follow. Once you have burned roughly 5+ failed\n   variations on a single sub-goal AND you know what the fix is, prefer: close\n   out, `reset`, execute the fix from the start. Weigh that against progress you\n   would discard — if the rest of the episode was clean and only the last step\n   is unsolved, grinding may still be right. Say which you chose in the archive.\n\n   ⚠ Every attempt must differ from all prior attempts in at least one NAMED\n   lever (order, prompt, max_chunks, pose strategy, target choice). A reset with\n   an unchanged plan is wasted budget and a duplicate archive entry.\n\n   Before handing off, consider distinct classes of approaches:\n     - scripted OSC pushes / servos;\n     - the trained contact skill (`pi0_doubled`), from a clean pose;\n     - changing how the servo advances (`step_clip`, `max_steps`, `tol`) rather\n       than the target;\n     - changing the contact GEOMETRY — where on the object you touch, and at\n       what wrist pose. A wall along one axis often opens along another;\n     - changing an EARLIER step so the blocking state never arises at all.\n   If several classes are still untried, you are not out of ideas yet.\n\n   When you do hand off, say in the audit which classes you exhausted and which\n   you would try next. That sentence is the most valuable thing you leave the\n   next agent.\n\n   NO teleport primitives (`set_object_pose` / `articulate_to` / `js_move_to` /\n   `carry_object` — forbidden; a goal past OSC reach is approached physically or\n   honestly reported, never warped). NO object world coords are provided — you\n   MUST localize via perception.\n\nRECOVERY (in-place FIRST, then reset): re-localize (objects may have moved);\nre-pre-position and re-`pi0_pick` on the next prompt-ladder rung; split long\ntraversals into \u003c0.30 xy waypoints; for a door/drawer/knob use a SHORT capped\nOSC push or `pi0_doubled`, never one long push — it NaNs MuJoCo. If the episode\nis unrecoverable, close out the attempt, `reset`, and try a changed plan.\nNever warp.\n\n\nCLOSE OUT EVERY FAILED ATTEMPT — the moment an unsuccessful attempt ends, whether you are\nabout to `reset` or about to stop. Two steps, in order:\n\na. ARCHIVE IT. Write `/example/runs/10_t0_s1/attempts/attempt_\u003cN>_failed.json` (N starts\n   at 1 and CONTINUES across attempts — never overwrite an existing file) with:\n   suite, task, seed, `libero_terminated:false`, your final state, the command\n   sequence you issued, `changed_lever_vs_attempt\u003cN-1>` naming the one thing you\n   varied (omit on attempt 1), and `strategy_notes` saying exactly what you tried\n   and WHY it failed. Write it as if a stranger had to reconstruct your reasoning —\n   this is what the final task-family write-up is mined from, and what the NEXT agent\n   on this cell reads before acting.\n\nb. NOTE WHAT YOU LEARNED, NOW — as WORKING NOTES, not as corpus entries. Append\n   to `/example/memory/libero/_internal/inbox/10_t0_s1/wip/notes.md`: what this attempt established, the\n   measurements behind it, and which walls you hit. One short section per\n   attempt, headed `## Attempt \u003cN>`. Write it here rather than at the end\n   because this is when the mechanism is clearest in your mind.\n\n   ⚠ These are NOTES, not conclusions. Phrase walls as observations bounded by\n   what you actually varied — \"scripted -y pushes with step_clip 0.025 stall at\n   eef y≈-0.118\", never \"the drawer is kinematically unreachable\". Name the\n   method the wall was measured under; you do not yet know which walls are\n   properties of the task and which are properties of your approach.\n\n   ⚠ Nothing goes into the final `task-family`/`global` files or the `task-specific` layer at\n   this point. Those are written once, after the cell is solved.\n\nIf continuing in this session, `reset` and try again with a plan that differs in a NAMED lever.","origin":"robot","zh":"本届会议5尝试。\n如果有正限,则在未解的单元格上拒绝完成,直到最后一次尝试为止。\n继续尝试时, 将计划更改, 归档并重置 。\nMULTI-ATTEMPT.\n优先就地回收(重新定位,重新定位,重新定位).`pi0_pick`错失了抓住,爬上Pi0迅速的梯子, 重新确认握力,`rotate_pitch`/`move_pose`)——远比全面重启便宜.\n当一集无法恢复时(对象被泄露或无法到达,错误的加压级联),CLOSEOUT尝试(见尝试关闭)和`reset`进入一个新鲜的剧集 与CHANGED计划。\nQQ 无法恢复的 EPISODE不是无法解决的 CELL.\n打破这个方程式是什么`reset`用于: 新的一集恢复每一个物体, 包括任何你向外透露的, 掉落的,或被推离的物体。\n你给自己造成的伤害是重新设置的最明确的理由,不是停止的原因。\n也保留了回程车。\n出口的食谱是上次重置后的痕量 ATER,所以每个失败的变体你尝试其中的集成土地。\n闪烁通过20重审一个次级目标,其方法是55线条编码20死尾;在新插曲中找到 SAME 解决方案,而它是少数的线条 未来运行可以遵循 。\n一旦你被烧伤了5+ 单个次级目标的变数失败,你知道什么是固定的,宁可:关闭,`reset`,从开始执行固定。\n如果剩下的剧集是干净的,只有最后一步还没有解决,那么磨碎也许仍然是正确的。\n说出你在档案中选择的。\n* 每一项尝试都必须与以前所有尝试有所不同,至少使用一种命名操纵杆(命令、即时、即时、即时)max_chunks,提出策略,目标选择).\n预算被浪费,档案条目重复。\n在交接之前,考虑不同的办法类别:\n- OSC推/服务器脚本;\n- 训练有素的联络技能(`pi0_doubled`由干净的姿势;\n- 改变伺服器的推进方式(`step_clip`,`max_steps`,`tol`而不是目标;\n- 改变联系人GEOMETRY——你摸到的物体上的位置,以及手腕的姿势.\n沿一个轴线的一堵墙往往沿另一个轴线打开;\n- 改变一个EARLIER步骤,所以阻断状态从来没有出现过。\n如果几个班还未经考核,你还没有失去想法。\n当你们交手的时候,请在审计中说:你们耗尽了哪几门课,接下来你们将尝试哪门课。\n这句话是你留下的下一个特工最有价值的东西\n无远程传送原生生物( Q)`set_object_pose`/`articulate_to`/`js_move_to`/`carry_object`——禁止;通过OCS到达的目标被实际或诚实地报告,从未扭曲过。\n没有提供对象世界编码——你通过感知来本地化。\nRECOVERY(在位置FIRST,然后重置):重新定位(对象可能已经移动);重新预置和重置.`pi0_pick`下个快速拉杆; 将长横线分割为\u003c0.30xy 路口;为一扇门/drawer/knob使用加盖 OSC 推力的SHORT 或`pi0_doubled`从来没有一个长时间的推力——是NaNs MujoCo.\n如果剧集无法恢复,结束尝试,`reset`,并尝试一个改变的计划。\nNever warp.\n关闭每一次失败的尝试——一经失败的尝试结束,无论你是否准备`reset`或即将停止。\n两个步骤,顺序是:\na.\nARCHIVE IT.\n写入`/example/runs/10_t0_s1/attempts/attempt_\u003cN>_failed.json`(N开始于1并贯穿各种尝试——从不覆盖现有文件),使用:套件、任务、种子、`libero_terminated:false`你最后的状态,你发布的命令序列,`changed_lever_vs_attempt\u003cN-1>`指定您所变更的一件事( 尝试时的图像)1),以及`strategy_notes`说出你所尝试的,为什么它失败。\n写它仿佛一个陌生人不得不重新构思你的推理——这是最后的任务-家庭的写作来源,也是这个细胞上的NEXT代理在行动前所读到的.\nb.\n注意你现在学到了什么作为工作说明 而不是作为物证条目\n附录为`/example/memory/libero/_internal/inbox/10_t0_s1/wip/notes.md`:这个尝试是什么,它背后的测量, 以及你撞到的墙壁。\n每一次尝试一个短节,标题是`## Attempt \u003cN>`.\n把它写在这里,而不是在结尾 因为这是当你的大脑中最清晰的机制。\n这些是说明,而不是结论。\n将墙作为观察物的词组,以你实际所不同的为界——“标注的”y推step_clip0.025在 ef y\\\\ \\ \\ \\ \\ \\-0.118\",从来没有\"抽屉 动静是无法到达的。\"\n命名墙壁测量的方法;您尚不知道哪些墙壁是任务属性, 哪些是您方法属性 。\n决赛没有结果`task-family`/`global`文件或文档`task-specific`分层。\n这些都写了一次,在细胞解开之后。\n如果本届会议继续举行,`reset`并再次尝试,用一个在命名杠杆上不同的计划。"},{"en":"After confirmed success, use the recorded successful attempt\nto describe the procedure. Keep failed attempts and corrections attributable\nto the attempt where they occurred. Distinguish observed effects from possible\nexplanations and state the conditions under which the technique might transfer.\nKeep working notes and memory proposals in their designated writable locations.\nLeave published memory and runner-generated traces intact. Base a winning\nsequence on the recorded actions of the successful attempt in execution order.\nOne success supports a single observation; wider reliability needs additional evidence. An unsolved exit or handoff\nshould preserve the evidence, remaining blocker and next hypothesis. Claim a\nsuccessful trajectory only when the recorded outcome supports it.\n\nBegin each proposed task-family or global memory Markdown file with parseable\nYAML frontmatter. Fill in the actual values for the current run and quote\nstrings containing YAML punctuation. Use single-shot for one successful cell.\nInclude attempt counts and seed lists when those facts are recorded.\n\nTask-family proposal:\n\n---\nscope: task-family\nsuite: \u003csuite>\nregime: \u003cregime>\ntask_id: \u003ctask identifier>\ntask_language: \"\u003cverbatim task instruction>\"\nevidence:\n  cells: [\"\u003ccell identifier>\"]\nconfidence: single-shot\n---\n\nGlobal proposal:\n\n---\nscope: global\nkind: \u003cprimitive|perception|strategy|failure|infra>\ntitle: \"\u003clesson title>\"\napplies_when: \"\u003cconditions for applying the lesson>\"\nevidence:\n  cells: [\"\u003ccell identifier>\"]\nconfidence: single-shot\n---\n\nUse the environment's naming conventions for optional id and related fields.","origin":"explore","zh":"成功得到确认后，根据成功尝试的记录描述操作方法。失败和修正都要归到它们实际发生的那次尝试。区分观察到的效果与可能的解释，并说明该方法在什么条件下可能适用于其他尝试。将工作笔记和记忆提案写入各自指定的可写位置。保留已发布的记忆和运行程序生成的轨迹。按成功尝试实际执行的动作和顺序整理成功操作序列。一次成功只支持一条观察结论；要主张一种做法在更广范围内可靠，还需要额外证据。任务尚未解出便退出或交接时，应当保留现有证据、剩余阻碍和下一项待验证的假设。只有记录的结果提供了支持，才能声称获得成功轨迹。\n\n每个 task-family 或 global 记忆提案的 Markdown 文件都要以可解析的 YAML frontmatter 开头。填写本次运行的实际值，包含 YAML 标点的字符串应加引号。只有一个成功评测单元时，使用 single-shot。记录中有相应数据时，填写尝试次数和种子列表。\n\n任务族（task-family）提案：\n\n---\nscope: task-family\nsuite: \u003csuite>\nregime: \u003cregime>\ntask_id: \u003c任务标识>\ntask_language: \"\u003c逐字抄录的任务指令>\"\nevidence:\n  cells: [\"\u003c评测单元标识>\"]\nconfidence: single-shot\n---\n\n全局（global）提案：\n\n---\nscope: global\nkind: \u003cprimitive|perception|strategy|failure|infra>\ntitle: \"\u003c经验标题>\"\napplies_when: \"\u003c适用这条经验的条件>\"\nevidence:\n  cells: [\"\u003c评测单元标识>\"]\nconfidence: single-shot\n---\n\n可选的 id 和 related 字段按当前环境的命名约定填写。"},{"en":"YOUR GOAL: produce top-level `terminated == true`, then distil what you\nlearned into memory.\n\nMemory has three layers, and you write to all of them:\n  `task-specific`   the audit `/example/runs/10_t0_s1/10_t0_s1.json` plus the replayable\n           `10_t0_s1_recipe.jsonl` the runner exports — a matched pair\n           describing the ONE sequence that worked. SOLVED CELLS ONLY.\n  `task-family`  one curated task write-up consolidating technique, parameter ranges,\n           per-entity recognition and the failure table from attempt notes.\n  `global` cross-task lessons, one per md file.\n\nMemory is produced in TWO STAGES, and the distinction matters:\n\n  DURING exploration, at every attempt close-out, you write WORKING NOTES into\n  `/example/memory/libero/_internal/inbox/10_t0_s1/wip/`. Capture the mechanism while it is fresh — details you\n  postpone are details you will summarise badly.\n\n  AFTER the cell is SOLVED, you consolidate those notes plus the winning run\n  into the FINAL `task-family` and `global` files. Only the consolidated version is\n  meant to be merged into the shared corpus.\n\n⚠ WHY THE SECOND STAGE EXISTS. A lesson drawn only from failures is often\nwrong. A real example from this corpus: one run declared \"the drawer cannot be\nclosed, the pose is kinematically unreachable\" after two failed attempts — while\nanother run on the same cell had already closed that drawer. Failing tells you\nwhere the walls SEEM to be, and only from inside one method; success tells you\nwhich of them were real. So record the failures, but let the corpus-grade\nstatement wait until you know the answer.\n\n⚠ And when you do state it, do not invent the mechanism. That same run knew\nWHICH parameters the winning attempt used but not WHY they helped — the honest\nmemory says \"closed it with step_clip 0.03 and max_steps 150\", not a story about\nforce. `**Why:** observed, cause unknown` is a legitimate and useful entry.\n\n⚠ If the cell is never solved, the working notes stay in `wip/` and nothing is\npromoted. That is a correct outcome, not a wasted run: the next agent reads\n`wip/` and your attempt archives, and starts from where you stopped.\n\nWHEN the latest state has top-level `terminated == true`, or when the session\nhandoff rule permits an unsolved exit. Truncation alone is unsolved.\nIf neither holds and the episode is stuck, do NOT\ncome here: close out the attempt and `reset` instead.\na. If SOLVED: write the audit so it MATCHES the exported recipe — see DISTIL\n   step (a) for the correspondence rules and the self-check.\n   If UNSOLVED: write `/example/runs/10_t0_s1/10_t0_s1.json` recording suite,\n   task_id, seed, regime, `libero_terminated:false`, total attempts,\n   final_state, why this session ended, and where each\n   attempt stalled. Claim NO trajectory — there is no recipe to match.\nb. Run the DISTIL pass below.\nc. Call `finish`.\n\nDISTIL — consolidate this cell into memory. Budget ~25 tool calls.\n\n⚠ Write ONLY under `/example/memory/libero/_internal/inbox/10_t0_s1/` (via `write_text_file`). NEVER create,\nedit, rename or delete anything else under `/example/memory/libero/` — it is a reviewed,\nshared corpus and other cells may be running against it. A human merges the\ninbox later.\n\n⚠ NAMING for global md files: the `id` is the BARE slug — the filename with the\n`new_`/`task-family_` prefix, the kind, and any `_draft` suffix stripped.\n  `new_global_strategy_diagonal-face-perpendicular-push.md`\n    -> `id: diagonal-face-perpendicular-push`                      ✅\n    -> `id: new-global-diagonal-face-perpendicular-push`           ❌\n`new_` marks \"awaiting review\" and scope/kind already have frontmatter fields;\nrepeating them inside the id breaks every cross-reference once a human merges\nthe file under its final name.\n\n⚠ FRONTMATTER MUST PARSE AS YAML. Never START a value with a quote unless the\nWHOLE value is quoted — `applies_when: \"put X away\" after X was dropped` is a\nparse error. Quote any value containing `: `. In frontmatter `related:` is a\nplain list of bare ids; `[[...]]` is BODY-only syntax.\n\n⚠ THIS PASS RUNS ONLY WHEN THE CELL IS SOLVED. If it is not, you write the\nunsolved audit (see attempt close-out), leave `wip/notes.md` and the attempt archives as they\nare, and stop. Nothing is promoted from `wip/`. A conclusion drawn only from\nfailures is the one kind of memory that actively misleads the next agent —\n`wip/` is where it belongs until a success confirms or refutes it.\n\nWhen the cell IS solved, consolidate in one pass: re-read `wip/notes.md` and\nevery `attempts/*.json`, then write the three layers below. Each wall you noted\nalong the way is now decidable — say which ones the winning run went THROUGH\n(they were artefacts of the method) and which it went AROUND (they were real).\n\na. TASK LAYER — **ONLY IF SOLVED.** The audit JSON and the recipe JSONL must be\n   a MATCHED PAIR describing the SAME trajectory. Write the audit from the\n   successful portion of `states.json`. After you call `finish`, the Python\n   runner exports the recipe from that ground-truth trace; after a `reset` it\n   keeps only commands issued after the LAST reset — exactly the sequence that\n   worked. The automatic finalizer publishes the pair only when both files\n   exist and the recorded episode reached top-level `terminated:true`.\n     - `strategy_notes` states the winning sequence step by step, in the same\n       order as the successful state trace, with the parameters actually used. How you\n       localized belongs in one opening sentence; the failure history belongs in\n       the task-family write-up and the attempt archives, not here.\n     - `pick_result` keys name the RECIPE STEPS they came from (e.g.\n       `bowl_pi0_pick_step3`), not bare object names.\n     - Record suite, task_id, seed, regime:\"strict_perception\", final_state,\n       `libero_terminated:true`, and how many attempts it took.\n     - SELF-CHECK: re-read the successful state trace and your notes side by\n       side. Every manipulation command must be accounted for, and the notes\n       must not invent a step absent from the trace.\n\nb. TASK-FAMILY LAYER -> `/example/memory/libero/_internal/inbox/10_t0_s1/task-family_10_t0_s1_draft.md`. ONE file for this task, consolidating the failure table from\n   the working notes recorded at each close-out. This is what a future run on this task at another seed reads first.\n   Frontmatter EXACTLY in this shape — `regime` is the perturbation axis\n   (task|swap|lan|object), NOT the perception regime, and `cells` is a LIST of\n   cell tags, not a count:\n\n     ---\n     id: task-family_\u003csuite family>_\u003cregime>_t\u003ctask_id>   # e.g. task-family_libero10_swap_t3\n     scope: task-family\n     suite: \u003csuite family, e.g. libero10>\n     regime: \u003ctask|swap|lan|object>\n     task_id: \u003cn>\n     task_language: \u003cverbatim from the initial state>\n     evidence:\n       cells: [10_t0_s1]\n       attempts: \u003cN>\n       solved_seeds: [\u003cseed>]\n       failed_seeds: []\n     confidence: single-shot\n     related: []\n     ---\n\n   Headings VERBATIM — this structure is what has worked in this corpus:\n\n     ## Applicable pattern         \u003cwhat this task is really testing, 1-2 lines>\n     ## Winning technique          \u003cthe sequence + per-step success criteria, no\n                                    absolute xyz. If NOT yet solved, title this\n                                    `## Best known approach (UNVALIDATED)` — a\n                                    recipe that never worked must never read\n                                    like one that did.>\n     ## Magic numbers              \u003cdefaults AND usable ranges: `max_chunks=30\n                                    (band 28-32)`, never a bare number. Each\n                                    NEVER-do-this constraint on its own line.>\n     ## Failure modes              \u003ctable, one row per failed attempt:\n                                    | symptom | root cause (A\u003cN>) | fix |\n                                    Attempt numbers matter: \"A3 died here\" beats\n                                    \"be careful\". Append rows, never rewrite.>\n     ## Re-localization per scene  \u003cper entity: the `segment` phrasing that\n                                    worked + fallbacks, what it LOOKS like, what\n                                    it is confused with, the reject rule, the\n                                    score floor. State that this run's absolutes\n                                    must NOT be cached; list them as\n                                    counter-examples only.>\n     ## Fragility flags            \u003cthe step most likely to break + its fallback>\n     ## Difficulty and reliability \u003cattempts to convergence, expected\n                                    single-shot rate, and an HONEST record of\n                                    whatever stayed unsolved>\n     ## Cross-refs                 \u003c[[id]] links to global memories>\n\nc. GLOBAL LAYER -> `/example/memory/libero/_internal/inbox/10_t0_s1/new_global_\u003ckind>_\u003cslug>.md`, ONE lesson\n   per file. This is the deepest layer: the task-family write-up says what worked for\n   THIS task, global says what it teaches about the ROBOT — a lesson still true\n   on a task with different objects and a different fixture, backed by a\n   mechanism you can state (kinematics, OSC/IK, Pi0's training distribution,\n   SAM3 grounding, simulator behaviour). \"It worked here\" is not a mechanism;\n   anything narrower belongs in (b) as a line, not as its own file.\n\n   Write these from the SOLVED trajectory, not from the failures. The useful\n   form is usually \"X appeared impossible until Y\" — the walls the winning run\n   went through, and what actually moved them. A note in `wip/` that the winning\n   run contradicted must NOT be promoted; if it is genuinely still true under\n   stated conditions, promote it WITH those conditions in `applies_when`.\n   `\u003ckind>` is one of primitive|perception|strategy|failure. `\u003cslug>` is 2-5\n   kebab-case words naming the LESSON — not the task, not the objects.\n   Frontmatter: `id`, `scope: global`, `kind`, `title` (one imperative\n   sentence), `applies_when` (the trigger — when should a future agent bother\n   opening this?), `symptom: [...]` (words a stuck agent would search for),\n   `evidence`, `confidence: single-shot`, `related`. Body:\n\n     \u003cone-sentence claim>\n\n     **Why:**          \u003cthe mechanism. If you do not know it, write \"observed,\n                       cause unknown\" — an honest unknown is useful, an invented\n                       cause is harmful.>\n     **How to apply:** \u003cexecutable: ranges, signs, ordering, thresholds>\n     **Falsify:**      \u003cthe observation that would disprove this>\n     **Related:**      \u003c[[id]] links>\n\nd. DEDUPE — before writing any new global file, search: `list_dir` the memory\n   directory and `read_text_file` the plausible hits, comparing against the file\n   BODY, not the index line.\n     - ALREADY COVERED and consistent -> do NOT write a new file. Append one\n       line to `/example/memory/libero/_internal/inbox/10_t0_s1/corroborations.jsonl`:\n         {\"id\":\"\u003cexisting-id>\",\"cell\":\"10_t0_s1\",\"effect\":\"confirmed\",\n          \"note\":\"\u003cwhat you observed, 1 sentence>\"}\n       Corroboration is how a memory earns higher confidence — prefer it over a\n       near-duplicate file.\n     - COVERED BUT CONTRADICTED -> do NOT edit or overwrite it. Write\n       `/example/memory/libero/_internal/inbox/10_t0_s1/conflict_\u003cid>.md` with the existing claim, your\n       contradicting observation, the evidence (attempt numbers + measurements),\n       and the conditions under which each version might hold.\n\ne. REPORT in the final `finish` summary: how many lessons you considered, how they split\n   across the three layers, how many corroborations you logged, how many\n   conflicts you raised.","origin":"robot","zh":"你的目标:生产顶级`terminated == true`,然后将你学到的东西分解到记忆中。\n记忆有三层,你写给所有人:`task-specific`审计`/example/runs/10_t0_s1/10_t0_s1.json`加上可重播的`10_t0_s1_recipe.jsonl`运行导出——一对匹配的描述 ONE 序列有效。\n只有溶胶壳。\n`task-family`(a) 一份由设计完成的任务书写合并技术、参数范围、实体识别和尝试说明的失败表。\n`global`跨任务课,每个md文件一个。\n记忆在两个STAGES中产生,区别问题在于:\n在探索过程中,每次尝试结束,你都会写工作说明`/example/memory/libero/_internal/inbox/10_t0_s1/wip/`.\n趁新时抓住机制——你推迟的细节是你们将粗略总结的细节。\n电池被溶解后,你把这些音符加胜球跑进决赛`task-family`和`global`文档。\n只有合并版是打算合并到共享的书目中.\n为什么第二个阶段的人。\n仅仅从失败中吸取的教训往往是错误的。\n从这本书中一个真正的例子:在两次失败的尝试之后,一次跑步宣布\"抽屉不能关闭,姿势动静无法到达\"——而另一次跑步在同一间牢房上已经关闭了那个抽屉.\n失败告诉你SEEM的墙在哪里, 只有一个方法;成功告诉你哪些是真实的。\n所以,记录失败,但让 生物级声明 等待,直到你知道答案。\n当你说出来的时候,不要发明这个机制。\n同一跑步知道胜出的尝试用到哪些参数,但不知道为什么他们帮助了——诚实的记忆说\"用它关闭了\"step_clip0.03和max_steps150\",不是关于武力的故事.\n`**Why:** observed, cause unknown`是一个合法和有用的条目。\n如果单元格从未解开,工作笔记就留在里面`wip/`没有什么是升迁的。\n这是正确的结果,不是浪费 运行:下一个代理读`wip/`和你的尝试档案,从你停下来的地方开始。\n当最新状态达到顶级时`terminated == true`,或者当会话交接规则允许未解决的退出时。\n独断解脱未解.\n如果两件事都站不住脚,那就别来这里:结束尝试,`reset`换成是A\n如果将审计写成“MATCHES”,则其出口的食谱——关于函证规则和自我检查,见DISTL步骤(a)。\n如果关闭: 写`/example/runs/10_t0_s1/10_t0_s1.json`录音套间,task_id种子,政权,`libero_terminated:false`全部尝试,final_state,为什么本届会议结束,以及每次尝试都停滞不前。\n声称没有轨迹——没有配对的食谱。\n运行下方的DISTIL通过. c.\nCall `finish`.\nDITL——将这个单元格合并为记忆.\n预算25工具调用。\n仅写在下面`/example/memory/libero/_internal/inbox/10_t0_s1/`(通过)`write_text_file`).\n永远不要创建、编辑、重命名或删除其它任何内容`/example/memory/libero/`——它是经过审查的,共同的委托书,其他的细胞可能与之对立.\n人类稍后会合并收件箱.\n命名全局md文件:`id`是 BARE 弹片——文件名`new_`/`task-family_`前缀、 类型和任何`_draft`后缀剥离。\n`new_global_strategy_diagonal-face-perpendicular-push.md`->`id: diagonal-face-perpendicular-push`✅ ->`id: new-global-diagonal-face-perpendicular-push`❌`new_`标记“等待检讨”和范围/类型已经具有前题字段;在 id 中重复,一旦一个人类将文件以最终名称合并,则会打破每条交叉引用。\n前线必须作为YAML。\n除非引用WHOLE值,否则永远不要以引号进行START值——`applies_when: \"put X away\" after X was dropped`是一个解析错误。\n引用包含的任何值`: `.\n在前题`related:`一份普通的赤裸的身份证清单;`[[...]]`仅是机构语法。\n只有当棺材溶解后,这个垃圾桶才会被拆掉。\n如果不是,请写未解决的审计(见尝试结束),请离开`wip/notes.md`并停止尝试的档案。\n没有从什么升职`wip/`.\n仅仅从失败中得出一个结论,是那种积极误导下一个代理人的记忆——.`wip/`它属于何处,直到成功证实或反驳它。\n当单元格 IS 解析后, 合并到一个通道中: 重读`wip/notes.md`和每个`attempts/*.json`,然后写下三层。\n你注意到的每堵墙现在都是可以破解的——说胜出的墙是经过的(它们是方法的工艺品),\na.\nTASK LAYER——**如果解决了的话。** 审计JSON和食谱JSONL必须是描述相同轨迹的精细平面。\n从成功部分写入审计内容`states.json`.\n你打电话后`finish`,Python 跑车会从地面追踪中输出配方;`reset`它只保留了在LAST重置后发布的命令——正是有效的序列.\n自动定稿器仅在两个文件都存在且录制的插曲达到顶级时才公布配对`terminated:true`.\n-`strategy_notes`逐步表示获胜顺序,顺序与成功状态跟踪相同,并实际使用参数。\n如何本地化属于一个开头句;失败的历史属于任务家庭的写作和尝试档案,而不是这里.\n-`pick_result`键名 RECIPE Steps他们来自(例如)\n`bowl_pi0_pick_step3`),非裸体名称。\n- 录音套房,task_id,种子,政权:\".strict_perception\",final_state,`libero_terminated:true`和多少次尝试。\n- SELF-CHECK:重读成功状态追踪和你的笔记并肩.\n每个操纵命令都必须说明,注释不得发明一个没有痕迹的步骤.\nb.\nTASK-FAMILY LAYER ->`/example/memory/libero/_internal/inbox/10_t0_s1/task-family_10_t0_s1_draft.md`.\n用于此任务的 1文件,从每次收尾记录的工作笔记中合并失败表 。\n这是未来在另一个种子上的任务 首先是这个。\n直截了当地说,这个形状的前题...`regime`是扰动轴(任务 ⁇ swap ⁇ lan ⁇ object),而不是感知机制,以及`cells`是一个单元格标记列表,而非一个计数 :\n---\nid: task-family_\u003csuite family>_\u003cregime>_t\u003ctask_id> # e.g. task-family_libero10_swap_t3\nscope: task-family\nsuite: \u003csuite family, e.g. libero10>\nregime: \u003ctask|swap|lan|object>\ntask_id: \u003cn>\ntask_language: \u003cverbatim from the initial state>\nevidence:\ncells: [10_t0_s1]\nattempts: \u003cN>\nsolved_seeds: [\u003cseed>]\nfailed_seeds: []\nconfidence: single-shot\nrelated: []\n---\n标题VERBATIM——这个结构在这个机构里是起作用的:\n□ 适用模式\u003c此任务的真正测试,1-2线条> □ 胜利技术\u003c 序列 +每步成功标准,无绝对 xyz。\n如果尚未解决, 标题为`## Best known approach (UNVALIDATED)`——一个从未起作用的食谱绝不能像读过一样读。> □ 魔法数字\u003c 默认和可用范围:`max_chunks=30 (band 28-32)`从来没有一个赤裸的号码。\n每一个自线上从未这样做过的限制。> □ 失败模式\u003ctable,每一次失败尝试一行: QQ症状 QQ根因(A\u003cN>) QQ 修正 QQ 尝试数很重要 : \"A3死在这里\" 胜过\"小心\"。\n附加行, 绝不重写.> □每个场景重新本地化\u003c per 实体: the`segment`使用有效+倒计时的词句,它是什么样子,它与什么混淆,拒绝规则,分数底.\n声明此运行的绝对值不得缓存; 仅将其列为反例.> □ 脆弱旗帜\u003c最有可能打破的一步+其倒计时> □ 困难和可靠性\u003c 试图趋同,预期的单发率,以及HONEST记录中任何未解之处> □ 交叉反射\u003c [id] 链接到全球记忆。\nc.\n全球话语权 ->`/example/memory/libero/_internal/inbox/10_t0_s1/new_global_\u003ckind>_\u003cslug>.md`每个文件一个课。\n这是最深层:任务家庭的写作说明了这个任务的工作效果,全球说它教给ROBOT的东西——对于一个有不同对象和不同固定线的任务来说,这段课仍然是真实的,并辅以一个可以说明的机制(kinematics, OSC/)IK,Pi0培训分布,SAM3着陆,模拟行为。 \"它在这里工作\"\n不是一个机制;任何狭义的字段都属于(b)项,而不是它自己的文件。\n从SOLVED的轨迹来写,而不是从失败。\n有用的形式通常是\"X在Y之前都不可能出现——获胜者所经历的墙壁,以及实际移动它们的东西.\n说明`wip/`如果在所述条件下确实仍然如此,那么就以这些条件促进选举。`applies_when`.\n`\u003ckind>`是原始的观念之一 战略的失败。\n`\u003cslug>`谓2-5kebab-case单词命名LESSON——不是任务,也不是对象.\n前题 :`id`,`scope: global`,`kind`,`title`(一个必须的句子),`applies_when`(触发器——未来特工何时开始打开这个? ),`symptom: [...]`(一个卡住的特工会寻找的词),`evidence`,`confidence: single-shot`,`related`.\nBody:\n\u003cone-sentence claim>\n**为什么:**\u003c 机制。\n如果你不知道,请写“观察,导致未知”——一个诚实的未知是有用的,一个被发明的事业是有害的。** 如何应用:**\u003c可执行性:范围、标志、命令、阈值>** 校正:**\u003c会否定这一点的观察>** 相关:**\u003c[id]链接>\nd.\nDEDUPE—在写入任何新的全局文件之前, 搜索 :`list_dir`记忆目录和`read_text_file`比较文件机构,而不是索引线\n- 已经覆盖并一致 ->不要写新文件。\n将一行添加到`/example/memory/libero/_internal/inbox/10_t0_s1/corroborations.jsonl`:{\"id\":\"\u003c存在-id>,\"细胞\":\"10_t0_s1\"\"效果\":\"确认\",\"注\":\"‘你们所观察到的,......1句子>'} 校验是记忆如何获得更高的信心——更喜欢它而不是一个接近复制的文件.\n- 盖过但封闭的 ->不编辑或覆盖它。\n写入`/example/memory/libero/_internal/inbox/10_t0_s1/conflict_\u003cid>.md`包括现有索赔、你自相矛盾的观察、证据(尝试数字+测量)以及每个版本可能持有的条件。\ne.\n最后报告`finish`总结:你所考虑的教训有多少,它们如何分成三层,你记录了多少证据,你提出了多少冲突。"},{"en":"1. READ THE GUIDES once each:\n   - `robots/libero/guides/strict_hybrid_guide.md`\n   - `robots/libero/guides/pro_hybrid_guide.md`\n   - `robots/libero/guides/env_calibration.md`\n\n2. INSPECT INITIAL STATE: call `view_env_state({\"step\": 0})`; inspect\n     `task_language`, object_names, eef pose, `agentview_high.png`,\n     `wrist_high.png` if useful, and call `view_camera_meta` if needed. Identify ALL target\n   objects, destination surfaces, and relation landmarks named by task_language.\n\n3. READ MEMORY for the observed `task_language` and scene. Memory is layered by\n   how widely a lesson holds; read it in order of specificity, because the most\n   specific layer is also the cheapest to retrieve.\n   \n   a. **THIS TASK** — `read_text_file` the `task-family` write-up for this cell if one\n      exists (look for `task-family_*` under `/example/memory/libero/task-family/`). It is the single\n      highest-value file you will read: the technique, per-entity `segment`\n      phrasings, the failure table with attempt numbers, and the fragility flags\n      for exactly this task. Its numbers are RANGES and its coordinates are\n      deliberately absent — re-derive every xyz from THIS scene. If it does not\n      exist, say so and continue; you will be creating it.\n   \n   b. **GLOBAL** — `/example/memory/libero/MEMORY.md` indexes the cross-task\n      library. Each line states *when* that memory applies, so use the index to\n      rule entries OUT fast, then read the few leaves that match your scene.\n      `list_dir` `/example/memory/libero/global/` to see everything available; a keyword\n      often matches several near-identical files, so open the top candidates and\n      choose from the file BODY, not the index line.\n   \n   ⭐ Do this even when a seed-0 reference exists: the reference gives commands,\n   memory gives the reasoning and failure modes needed to adapt them. In your\n   audit, RECORD the memory files you read (or state that none matched), so memory\n   consultation is auditable.\n\n4. READ SEED-0 STRATEGY REFERENCES IF PRESENT, then solve from scratch.\n   Strategy references live under:\n   - `/example/memory/libero/task-specific/` (solved seed-0 audit + recipe pairs:\n     `\u003ctag>.json` + `\u003ctag>_recipe.jsonl`)\n   Use these for strategy_notes, prompt ladders, primitive ordering, gotchas, and\n   qualitative target zones. They were built on different scenes and sometimes\n   with older/oracle assumptions; do NOT copy coordinates and do NOT replay stale\n   command lists. Re-derive every coordinate from THIS scene.\n\n5. RUN THE MANDATORY PRE-TASK PERCEPTION PASS (FIRST-STEP ALGORITHM above) —\n   localize EVERYTHING first, THEN act. Before any pick/place build the\n   localization table: agentview hi-res for semantic identity, `back_project` for\n   median xyz, wrist geometry refinement for non-basket rows (only if spatially\n   consistent), wrist confirmation for basket/cavity. This perception pass is the\n   first stage of EVERY task, even ones that look simple — a wrong-target first\n   grab is unrecoverable in single-attempt mode, so the cheap insurance is to\n   identify all entities up front. Do the FINAL READY CHECK, then plan.\n\n6. EXECUTE one primitive at a time by calling its structured tool:\n   \n       move_to({\"xyz\": [x, y, z], \"gripper\": -1, ...})\n       pi0_pick({\"prompt\": \"...\", \"max_chunks\": 20, ...})\n       release({})\n   \n   Each primitive tool blocks until the next state record is dumped and returns\n   the new state view, log, and embedded images. Inspect `agentview_high.png` and\n   `wrist_high.png` as needed, call `back_project` for geometry, decide, and repeat.\n\n7. ALLOWED PRIMITIVES (physics-only; full schemas in the tool list/guides):\n   `move_to`, `pi0_pick`, `pi0_doubled`, `release`, `set_gripper`, `rotate_wrist`, `rotate_pitch`, `move_pose`, `execute_action`.\n   Also allowed: `reset` (🔁 allowed here —\n   close out the attempt first, see below).\n   FORBIDDEN: `exit`, `set_object_pose`, `articulate_to`, `js_move_to`,\n   `carry_object`.\n\n8. RECOVERY (in-place FIRST, then reset): re-localize (objects may have moved);\n   re-pre-position and re-`pi0_pick` on the next prompt-ladder rung; split long\n   traversals into \u003c0.30 xy waypoints; for a door/drawer/knob use a SHORT capped\n   OSC push or `pi0_doubled`, never one long push — it NaNs MuJoCo. If the episode\n   is unrecoverable, close out the attempt, `reset`, and try a changed plan.\n   Never warp.\n\n9. CLOSE OUT EVERY FAILED ATTEMPT — the moment an attempt ends, whether you are\n   about to `reset` or about to stop. Two steps, in order:\n   \n   a. ARCHIVE IT. Write `/example/runs/10_t0_s1/attempts/attempt_\u003cN>_failed.json` (N starts\n      at 1 and CONTINUES across attempts — never overwrite an existing file) with:\n      suite, task, seed, `libero_terminated:false`, your final state, the command\n      sequence you issued, `changed_lever_vs_attempt\u003cN-1>` naming the one thing you\n      varied (omit on attempt 1), and `strategy_notes` saying exactly what you tried\n      and WHY it failed. Write it as if a stranger had to reconstruct your reasoning —\n      this is what the final task-family write-up is mined from, and what the NEXT agent\n      on this cell reads before acting.\n   \n   b. NOTE WHAT YOU LEARNED, NOW — as WORKING NOTES, not as corpus entries. Append\n      to `/example/memory/libero/_internal/inbox/10_t0_s1/wip/notes.md`: what this attempt established, the\n      measurements behind it, and which walls you hit. One short section per\n      attempt, headed `## Attempt \u003cN>`. Write it here rather than at the end\n      because this is when the mechanism is clearest in your mind.\n   \n      ⚠ These are NOTES, not conclusions. Phrase walls as observations bounded by\n      what you actually varied — \"scripted -y pushes with step_clip 0.025 stall at\n      eef y≈-0.118\", never \"the drawer is kinematically unreachable\". Name the\n      method the wall was measured under; you do not yet know which walls are\n      properties of the task and which are properties of your approach.\n   \n      ⚠ Nothing goes into the final `task-family`/`global` files or the `task-specific` layer at\n      this point. Those are written once, after the cell is solved.\n   \n   Then `reset` and try again with a plan that differs in a NAMED lever.\n\n10. WHEN state.libero_terminated == True — or one of the Rule 4 (a)/(b)/(c)\n    conditions permits you to stop. If none holds and the episode is stuck, do NOT\n    come here: close out the attempt and `reset` instead.\n    a. If SOLVED: write the audit so it MATCHES the exported recipe — see DISTIL\n       step (a) for the correspondence rules and the self-check.\n       If UNSOLVED: write `/example/runs/10_t0_s1/10_t0_s1.json` recording suite,\n       task_id, seed, regime, `libero_terminated:false`, total attempts,\n       final_state, which Rule 4 condition permits you to stop, and where each\n       attempt stalled. Claim NO trajectory — there is no recipe to match.\n    b. Run the DISTIL pass below.\n    c. Call `finish`.\n\n11. DISTIL — consolidate this cell into memory. Budget ~25 tool calls.\n    \n    ⚠ Write ONLY under `/example/memory/libero/_internal/inbox/10_t0_s1/` (via `write_text_file`). NEVER create,\n    edit, rename or delete anything else under `/example/memory/libero/` — it is a reviewed,\n    shared corpus and other cells may be running against it. A human merges the\n    inbox later.\n    \n    ⚠ NAMING for every md file: the `id` is the BARE slug — the filename with the\n    `new_`/`task-family_` prefix, the kind, and any `_draft` suffix stripped.\n      `new_global_strategy_diagonal-face-perpendicular-push.md`\n        -> `id: diagonal-face-perpendicular-push`                      ✅\n        -> `id: new-global-diagonal-face-perpendicular-push`           ❌\n    `new_` marks \"awaiting review\" and scope/kind already have frontmatter fields;\n    repeating them inside the id breaks every cross-reference once a human merges\n    the file under its final name.\n    \n    ⚠ FRONTMATTER MUST PARSE AS YAML. Never START a value with a quote unless the\n    WHOLE value is quoted — `applies_when: \"put X away\" after X was dropped` is a\n    parse error. Quote any value containing `: `. In frontmatter `related:` is a\n    plain list of bare ids; `[[...]]` is BODY-only syntax.\n    \n    ⚠ THIS PASS RUNS ONLY WHEN THE CELL IS SOLVED. If it is not, you write the\n    unsolved audit (WORKFLOW), leave `wip/notes.md` and the attempt archives as they\n    are, and stop. Nothing is promoted from `wip/`. A conclusion drawn only from\n    failures is the one kind of memory that actively misleads the next agent —\n    `wip/` is where it belongs until a success confirms or refutes it.\n    \n    When the cell IS solved, consolidate in one pass: re-read `wip/notes.md` and\n    every `attempts/*.json`, then write the three layers below. Each wall you noted\n    along the way is now decidable — say which ones the winning run went THROUGH\n    (they were artefacts of the method) and which it went AROUND (they were real).\n    \n    a. TASK LAYER — **ONLY IF SOLVED.** The audit JSON and the recipe JSONL must be\n       a MATCHED PAIR describing the SAME trajectory. Write the audit from the\n       successful portion of `states.json`. After you call `finish`, the Python\n       runner exports the recipe from that ground-truth trace; after a `reset` it\n       keeps only commands issued after the LAST reset — exactly the sequence that\n       worked. The automatic finalizer publishes the pair only when both files\n       exist and the environment reported `libero_terminated:true`.\n         - `strategy_notes` states the winning sequence step by step, in the same\n           order as the successful state trace, with the parameters actually used. How you\n           localized belongs in one opening sentence; the failure history belongs in\n           the task-family write-up and the attempt archives, not here.\n         - `pick_result` keys name the RECIPE STEPS they came from (e.g.\n           `bowl_pi0_pick_step3`), not bare object names.\n         - Record suite, task_id, seed, regime:\"strict_perception\", final_state,\n           `libero_terminated:true`, and how many attempts it took.\n         - SELF-CHECK: re-read the successful state trace and your notes side by\n           side. Every manipulation command must be accounted for, and the notes\n           must not invent a step absent from the trace.\n    \n    b. TASK-FAMILY LAYER -> `/example/memory/libero/_internal/inbox/10_t0_s1/task-family_10_t0_s1_draft.md`. ONE file for\n       this task, updated at every close-out so the failure table grows across\n       attempts. This is what a future run on this task at another seed reads first.\n       Frontmatter EXACTLY in this shape — `regime` is the perturbation axis\n       (task|swap|lan|object), NOT the perception regime, and `cells` is a LIST of\n       cell tags, not a count:\n    \n         ---\n         id: task-family_\u003csuite family>_\u003cregime>_t\u003ctask_id>   # e.g. task-family_libero10_swap_t3\n         scope: task-family\n         suite: \u003csuite family, e.g. libero10>\n         regime: \u003ctask|swap|lan|object>\n         task_id: \u003cn>\n         task_language: \u003cverbatim from the initial state>\n         evidence:\n           cells: [10_t0_s1]\n           attempts: \u003cN>\n           solved_seeds: [\u003cseed>]\n           failed_seeds: []\n         confidence: single-shot\n         related: []\n         ---\n    \n       Headings VERBATIM — this structure is what has worked in this corpus:\n    \n         ## Applicable pattern         \u003cwhat this task is really testing, 1-2 lines>\n         ## Winning technique          \u003cthe sequence + per-step success criteria, no\n                                        absolute xyz. If NOT yet solved, title this\n                                        `## Best known approach (UNVALIDATED)` — a\n                                        recipe that never worked must never read\n                                        like one that did.>\n         ## Magic numbers              \u003cdefaults AND usable ranges: `max_chunks=30\n                                        (band 28-32)`, never a bare number. Each\n                                        NEVER-do-this constraint on its own line.>\n         ## Failure modes              \u003ctable, one row per failed attempt:\n                                        | symptom | root cause (A\u003cN>) | fix |\n                                        Attempt numbers matter: \"A3 died here\" beats\n                                        \"be careful\". Append rows, never rewrite.>\n         ## Re-localization per scene  \u003cper entity: the `segment` phrasing that\n                                        worked + fallbacks, what it LOOKS like, what\n                                        it is confused with, the reject rule, the\n                                        score floor. State that this run's absolutes\n                                        must NOT be cached; list them as\n                                        counter-examples only.>\n         ## Fragility flags            \u003cthe step most likely to break + its fallback>\n         ## Difficulty and reliability \u003cattempts to convergence, expected\n                                        single-shot rate, and an HONEST record of\n                                        whatever stayed unsolved>\n         ## Cross-refs                 \u003c[[id]] links to global memories>\n    \n    c. GLOBAL LAYER -> `/example/memory/libero/_internal/inbox/10_t0_s1/new_global_\u003ckind>_\u003cslug>.md`, ONE lesson\n       per file. This is the deepest layer: the task-family write-up says what worked for\n       THIS task, global says what it teaches about the ROBOT — a lesson still true\n       on a task with different objects and a different fixture, backed by a\n       mechanism you can state (kinematics, OSC/IK, Pi0's training distribution,\n       SAM3 grounding, simulator behaviour). \"It worked here\" is not a mechanism;\n       anything narrower belongs in (b) as a line, not as its own file.\n    \n       Write these from the SOLVED trajectory, not from the failures. The useful\n       form is usually \"X appeared impossible until Y\" — the walls the winning run\n       went through, and what actually moved them. A note in `wip/` that the winning\n       run contradicted must NOT be promoted; if it is genuinely still true under\n       stated conditions, promote it WITH those conditions in `applies_when`.\n       `\u003ckind>` is one of primitive|perception|strategy|failure. `\u003cslug>` is 2-5\n       kebab-case words naming the LESSON — not the task, not the objects.\n       Frontmatter: `id`, `scope: global`, `kind`, `title` (one imperative\n       sentence), `applies_when` (the trigger — when should a future agent bother\n       opening this?), `symptom: [...]` (words a stuck agent would search for),\n       `evidence`, `confidence: single-shot`, `related`. Body:\n    \n         \u003cone-sentence claim>\n    \n         **Why:**          \u003cthe mechanism. If you do not know it, write \"observed,\n                           cause unknown\" — an honest unknown is useful, an invented\n                           cause is harmful.>\n         **How to apply:** \u003cexecutable: ranges, signs, ordering, thresholds>\n         **Falsify:**      \u003cthe observation that would disprove this>\n         **Related:**      \u003c[[id]] links>\n    \n    d. DEDUPE — before writing any new global file, search: `list_dir` the memory\n       directory and `read_text_file` the plausible hits, comparing against the file\n       BODY, not the index line.\n         - ALREADY COVERED and consistent -> do NOT write a new file. Append one\n           line to `/example/memory/libero/_internal/inbox/10_t0_s1/corroborations.jsonl`:\n             {\"id\":\"\u003cexisting-id>\",\"cell\":\"10_t0_s1\",\"effect\":\"confirmed\",\n              \"note\":\"\u003cwhat you observed, 1 sentence>\"}\n           Corroboration is how a memory earns higher confidence — prefer it over a\n           near-duplicate file.\n         - COVERED BUT CONTRADICTED -> do NOT edit or overwrite it. Write\n           `/example/memory/libero/_internal/inbox/10_t0_s1/conflict_\u003cid>.md` with the existing claim, your\n           contradicting observation, the evidence (attempt numbers + measurements),\n           and the conditions under which each version might hold.\n    \n    e. REPORT in your final message: how many lessons you considered, how they split\n       across the three layers, how many corroborations you logged, how many\n       conflicts you raised.","origin":"old","zh":"1.\n各读一次指南:\n- `robots/libero/guides/strict_hybrid_guide.md`\n- `robots/libero/guides/pro_hybrid_guide.md`\n- `robots/libero/guides/env_calibration.md`\n2.\n初步状态:呼叫`view_env_state({\"step\": 0})`; 检查`task_language`,object_names摆出姿势`agentview_high.png`,`wrist_high.png`如果有用,请打电话`view_camera_meta`如果需要的话。\n识别所有目标物体、目的地表面以及由下列单位命名的关联地标:task_language.\n3.\n读取所观测到的记忆`task_language`和现场。\n记忆被分层分层分层,根据课内容的涵括程度;按照具体程度的顺序读取,因为最具体的层层也是最便宜的检索.\na.**TASK** -`read_text_file`编号`task-family`如果存在此单元格, 则写入( 查找)`task-family_*`下级`/example/memory/libero/task-family/`).\n这是您将读取的单个最高值文件: 技术, 实体`segment`表达式,带有尝试数字的失败表,以及完全用于此任务的脆弱标记.\n它的编号是RANGES,它的坐标是故意缺失的——将这个场景的每个xyz重新划分.\n如果它不存在,请说,并继续下去;你将创造它。\nb.** GLOBAL** -`/example/memory/libero/MEMORY.md`索引跨任务库 。\n每行都写着*当*该记忆适用时,所以使用索引来快速规则条目出局,然后读出与您的场景匹配的几条叶子 。\n`list_dir``/example/memory/libero/global/`以查看所有可用的文件;一个关键字往往匹配数个近似相同的文件,所以打开顶端候选人并从文件机构而不是索引行中选择。\n即使种子出现 也要这样做-0引用存在:引用给出命令,记忆给出适应这些命令所需的推理和失败模式.\n在您的审计中, 记录您读到的记忆文件( 或声明没有匹配),因此记忆咨询是可审计的 。\n4.\n读取种子-0战略参考如果有的话,然后从头解决.\n战略参考资料载于:\n-`/example/memory/libero/task-specific/`(已解决种子)-0审计+食谱配对:`\u003ctag>.json`+`\u003ctag>_recipe.jsonl`用于strategy_notes,迅速的梯子,原始订购, 获得恰克,以及质量目标区。\n它们建立在不同的场景上,有时还带有旧的/甲骨文的假设;不复制坐标,不重放stale 命令列表.\n从这个场景中重新找出每个坐标\n5.\n运行任务前测试通道(第一步骤Algorighm以上)——首先将每件事都本地化,然后行动.\n在任何选择/位置建立本地化表之前: 语义特征的代理视 re-localize this scene.\n\nCRITICAL MECHANICS (cost many wasted attempts before they were nailed):\n- **GRIPPER SIGN**: in `move_to` / `set_gripper`, `gripper:+1` = CLOSE/hold,\n  `gripper:-1` = OPEN. To CARRY a grasped object, hold `gripper:+1` the whole way\n  (carrying with `-1` silently OPENS and drops it — the #1 early bug). `set_gripper +1`\n  (steps 8-12) firms the grip after a pick; for a laterally-weak CAN use steps\u003c=5.\n- **`move_pose` defaults gripper to OPEN (-1) if you omit it** — always pass\n  `\"gripper\":1` in `move_pose` while holding an object.\n- **`move_pose` threads the OSC IK singularity that `move_to` walls at** — for\n  cabinet-front / microwave-cavity / deep reaches, when `move_to` stalls\n  (final_dist stays high, eef retreats), switch to `move_pose` (co-vary\n  xyz+pitch+yaw). It reaches several cm deeper.\n\nGRASPING:\n- **MUGS / BOWLS / CUPS grasp at the RIM, not the center**: SAM3/back-projection\n  give the object CENTER; closing the gripper there grabs air. Aim\n  `eef_y = object_y + 0.045` so Pi0 rim-hooks. (Mugs do NOT hang 4.5cm in -y like\n  bowls — you can wrist-segment the grasped object to measure the true held offset.)\n- Some objects grasp best with `pi0_pick` from the **DEFAULT HOME pose** (no\n  pre-position) — Pi0 has its own approach trajectory; pre-positioning can hurt.\n- **`pi0_pick` is reusable and repurposable**:\n  a HIGH `lift_thresh` (e.g. 999) + `gripper_closed_thresh:0` turns it into a\n  generic closed-loop CONTACT skill (used to turn the stove knob).\n- **`pi0_doubled`** = Pi0 closed-loop CONTACT skill (success :=\n  `terminated`). Use it for drawer/door open-close AND insertions; call it\n  repeatedly.\n\nDISAMBIGUATION / TARGETING:\n- **SWAP-PERTURBED scenes (suite `*_swap`)**: the seed-0 reference's COORDINATES\n  are STALE (swap re-randomizes object positions per seed), and some s0 swap\n  recipes contain a literal reset — that was the old multi-attempt era UNDOING A\n  WRONG-OBJECT FIRST GRAB. For swap cells the following restriction supersedes ordinary recipe transfer. Use the s0 ref ONLY for: WHAT the\n  targets are (task_language nouns), what they LOOK like, and which Pi0 prompt\n  finally worked — never for positions, never replay its command list.\n  IDENTIFY-then-GRASP: before ANY pick, identify the target SEMANTICALLY in the\n  global agentview, then use the wrist only for geometry. The wrist camera is a\n  near-vertical close-up: it is excellent for precise depth/xy refinement, but\n  weak at reading side labels or distinguishing similar grocery items\n  (ketchup/BBQ/tomato sauce, soup cans, cream cheese/butter). Do NOT let the\n  wrist freely re-identify a non-basket target; it often locks onto a look-alike.\n  Instead: choose the target from `agentview_high.png`, compute its agentview\n  xyz, move over that candidate, project/track that SAME candidate in wrist, and\n  refine only its surface/center coordinates. SAM3 scores ~0.02-0.06 on brand\n  nouns (\"alphabet soup\", \"tomato sauce\") — prompt by colour+shape (\"the short\n  red-label can\") or pick pixels manually in the agentview hi-res. Pi0's own\n  prompt grounding is ALSO unreliable on brand nouns (s0's first grab took a milk\n  carton instead), so pre-position the eef directly OVER the agentview-identified\n  + wrist-refined target before pi0_pick. A wrong first grab usually\n  tips/displaces the grabbed object AND the target zone — identification errors\n  are unrecoverable; spend commands on agentview ID, not on recovery.\n- **\"left\"/\"right\" in libero_10 is EGOCENTRIC (robot frame): +y = robot-LEFT =\n  image-RIGHT.** A geometrically-perfect placement of the WRONG target never fires\n  the predicate — when a clean placement won't terminate, SUSPECT WRONG-TARGET\n  before wrong-physics (this turned a \"physically impossible\" verdict into a solve).\n- Containers can be MOVABLE (e.g. a basket slides when bumped) — descend into the\n  interior CENTER from straight above, not against the
