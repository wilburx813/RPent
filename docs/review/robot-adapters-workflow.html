ent tools for contact-rich motion: vla_right_grasp, vla_handoff, and vla_left_place.","2. vla_right_grasp ends after right gripper closure plus lift; vla_handoff ends after right gripper opening plus a configured release delay; vla_left_place ends after left gripper opening plus lift.","These boundaries only mean a segment ended; verify physical success from images, gripper widths/open flags, and projection geometry before continuing.","After a grasp VLA, do not decide lifted/held status from 2D appearance alone.","Check right gripper state and the latest inline image.","If held status is unclear, project the best visible held-object surface when possible and compare right_base z primarily with the source/table height or pre-grasp source projection.","If a verified projection of the intended object or held-object surface is higher than source/table height, treat the grasp as successful and proceed to vla_handoff.","Mark failure only when verified projection shows the same object still at table height and gripper/image evidence shows the right gripper is empty or not supporting it.","After a confirmed right-hand grasp, call vla_handoff directly.","Do not use move_delta, rotate_delta, open_gripper, close_gripper, or any other rule-based primitive to prepare or reposition either arm for handoff; the VLA owns the bimanual approach, relative pose adjustment, left-hand grasp, right-hand release, and collision-aware transfer.","Before vla_left_place, first verify that vla_handoff has ended and the left gripper holds the intended object.","If the left hand is not clearly holding the object, do not stage for placement.","For placement staging, project a clearly valid target pixel inside the required destination, then use projected x/y only.","Keep the current left TCP z with delta_z=0 by default; do not move to the projected z coordinate or add large vertical clearance.","Let vla_left_place handle descent, release, and post-release lift.","Call describe_dual_franka_setup, then inspect the initial synchronized state.","Build a conservative localization table for the current category from the latest inline image and keep it updated after each primitive.","After each motion, inspect the returned result before choosing the next action.","Use the task's VLA segment tools for contact-rich motion.","Start with describe_dual_franka_setup.","Read the runtime conventions, available primitives, camera aliases, VLA conditioning text and semantic stop rules.","Before motion in every session, call request_scene_reset and wait for the operator to restore the scene, secure held objects and confirm the reset path is clear.","Motion requires a successful posture reset and fresh synchronized observations.","Routine snapshots inline the configured primary views.","Check auxiliary camera artifacts only for a specific question.","Read available_camera_views from describe_dual_franka_setup or view_env_state.","Registered localization cameras may differ from the VLA inputs.","Use back_project on visible material in the named image; never project into air above the object.","When SAM3 is available, use segment before manual projection.","Check the mask overlay and median marker.","For low scores, try a shorter color/object/relation phrase or a point prompt.","Keep min_score unchanged.","Inspect the annotated image after every projection: selection_valid=true alone does not verify the target.","Retry a central interior pixel if the marker misses.","Use verified right_base xyz and TCP-to-point deltas for metric distances.","Never move an arm or a held object solely to improve visibility.","Mark uncertain observations or stop for operator feedback.","Build a conservative localization table for the current category from the latest inline image.","Update it after each primitive.","Each rule-based motion selects one arm, left or right.","The other arm remains uncommanded.","Express move_delta and rotate_delta in the fixed world frame (right_base).","Inspect the synchronized snapshot returned by each mutation.","Call view_env_state after a primitive only if it failed, returned no snapshot, an operator changed the scene, or a particular historical step is needed.","Use purposeful corrections with the configured inline views.","Check the requested and effective prompts in the tool result: the checkpoint deployment can override the planner-facing prompt.","vla_right_grasp ends after right gripper closure plus lift; vla_handoff ends after right gripper opening plus a configured release delay; vla_left_place ends after left gripper opening plus lift.","Check joint_health after every mutation.","If either arm reports warning or critical, use recover_joint_posture before continuing.","Stop when state, cameras or motion results are inconsistent.","When the visual evidence and state indicate an outcome, call request_operator_verdict.","With continue, keep working.","Finish only with a current operator success or failure verdict.","- task_name: clean_desk_dirty_clean_sorting_agent_vla","- instruction: Complete a dual-arm collaborative tabletop object-storage task in this object category order: bowls, plates, cup, chopsticks, then spoon.","Finish the entire current category before targeting anything from the next category.","Within any category that has multiple colored source objects, use this color order: process green before blue.","Do not let dirty/clean status change the grasp order.","The only added logic is placement-time dirty/clean sorting for bowls and plates: before grasping each bowl or plate, classify whether it is dirty or clean.","Dirty bowls and dirty plates go into the metal wire basket/frame; clean bowls and clean plates go into the black-outside, white-inside cardboard box.","The cup still goes into the cardboard box, and the chopsticks and spoon still go inside the cup after the cup is stable in the cardboard box.","After the right hand successfully grasps an object, call vla_handoff directly from the confirmed post-grasp state.","Before calling vla_left_place, localize the required target container and horizontally align the left-held object above that target.","- initial_setup: This is a dirty/clean sorting variant of the clean-desk task, using category order bowls, plates, cup, chopsticks, spoon and green-before-blue order within each category.","The base camera and fourth-view D455 are RealSense RGBD cameras, but this dirty/clean sorting task exposes D455 metric localization tools.","D455 aligned depth can be back-projected into the right_base frame using the calibrated extrinsics.","The D455 is a fixed external camera; moving either arm or a held object does not move the camera viewpoint and must not be used as an active-vision strategy. right_base is the shared world coordinate frame exposed to the agent: camera points, left/right TCP positions, and rule-based base-frame deltas are all represented in right_base.","The black-outside, white-inside cardboard box is on the +y side of the adjacent metal wire basket/frame.","Both containers are valid in this task: the metal wire basket/frame is the required destination for dirty bowls and dirty plates, while the cardboard box is the required destination for clean bowls and clean plates.","A dirty bowl or plate is marked by a visible egg tart or egg-tart foil cup/tray inside or on the concave eating surface; a clean bowl or plate has no egg tart or egg-tart foil cup/tray marker.","Use the contrast between the black exterior and white interior as the cardboard-box inside/outside boundary, and use the metal wires/rim as the metal basket boundary.","The VLA checkpoint is the deployment-aligned dual-arm tcp-rot6d clean-desk policy; named VLA tools keep using its fixed training instruction, while the planner decides the dirty/clean destination.","- success_criteria: All target objects have been processed in the required category order.","All dirty bowls and dirty plates are inside the metal wire basket/frame.","All clean bowls, clean plates, and the cup are inside the black-outside, white-inside cardboard box.","The chopsticks and spoon are inside the cup after the cup is stable inside the cardboard box.","Stop for operator feedback if a dirty/clean label is uncertain, if an object was placed in the wrong container, or if visual evidence does not support safe continuation.","Call describe_dual_franka_setup before acting.","Call view_env_state before the first action only if no fresh primitive snapshot is already available.","After any primitive that returns a snapshot, inspect that returned snapshot directly; never call view_env_state immediately afterward unless the primitive failed, returned no snapshot, an operator changed the scene, or a specific historical step is needed.","Enforce this grasp order without exception: first category order bowls -> plates -> cup -> chopsticks -> spoon, then within any category that has multiple colored source objects, green before blue.","Always act on the earliest unfinished category.","While any object from that category remains in the source workspace, do not localize, approach, grasp, or call a VLA grasp skill for any later category.","Within the current category, do not localize, approach, grasp, or call a VLA grasp skill for a blue object while a green object from the same category remains in the source workspace.","Dirty/clean status must not reorder grasping.","For bowls and plates, first choose the next object by the category/color order, then classify that chosen object as dirty or clean, and only use the dirty/clean label to choose the placement destination before vla_left_place.","Classify dirty vs clean before each bowl or plate attempt.","A dirty bowl or plate has a visible egg tart or egg-tart foil cup/tray inside or on the concave eating surface; a clean bowl or plate has no egg tart or egg-tart foil cup/tray marker.","If the egg-tart marker is occluded, ambiguous, outside the dish, or cannot be judged in the latest D455 image, do not move the robot; request operator feedback.","An egg tart or egg-tart foil cup/tray counts as a dirty marker only if it is visibly inside or on the concave eating surface of that specific bowl or plate.","A nearby egg tart or foil tray on the table, in another object, or outside the dish must not make the dish dirty.","Build a brief D455 localization and sorting table before moving in each category.","For each visible candidate in the current category, list object type, color if visible, dirty_clean_label for bowls/plates, egg_tart_evidence for bowls/plates, required_destination, D455 evidence, projected point if used, and status.","When SAM3 is available, use segment with camera='d455' on the D455 image to segment the current object or required placement target before falling back to a manual pixel.","Use short phrases, inspect the returned mask overlay yourself, and retry with a point prompt, more specific text prompt, or manual D455 pixel whenever the mask or median marker is not visibly on the intended target.","Use back_project only on a pixel well inside the visible material of the intended object or placement container.","Do not select the table, background, rim edge, air above the object, another object, a container wall, metal wire, or a shared container boundary.","Inspect the returned annotated image; if the marker is not on the intended target, retry or stop.","When exact spatial relation is uncertain, use segment or back_project again instead of judging metric x/y/z offsets by 2D RGB appearance.","After a segmentation/projection is verified, trust the returned right_base xyz and TCP-to-point deltas as the main metric evidence for rule-based correction moves.","For both left and right arms, move_delta and rotate_delta use right_base/world deltas; do not convert left-arm coordinates yourself.","For bowls, do not use rule-based move_delta to pre-align or move above the bowl before vla_right_grasp.","This avoids pushing the learned VLA policy out of distribution.","After D455 confirms the intended bowl identity and dirty/clean label, call vla_right_grasp directly from the current robot state.","For plates, the cup, chopsticks, and the spoon, rule-based pre-grasp staging is allowed only when clearly needed: move the right TCP to a safe pre-grasp pose about 10cm above the projected target surface point in right_base/world coordinates, without touching the object.","14.","Call vla_right_grasp directly after bowl identity and dirty/clean classification are confirmed.","For non-bowl objects, call vla_right_grasp only after the latest right-arm move_delta reports a reached/effective target near the intended object, unless the object is already safely staged.","Leave max_chunks unset unless running a cautious diagnostic.","15.","Use VLA segment tools for contact-rich motion: vla_right_grasp for the right-arm grasp segment, vla_handoff for bimanual transfer, and vla_left_place for left-arm placement.","16.","After a grasp VLA, inspect the returned snapshot.","Continue only if the right gripper appears to hold the intended object.","Do not judge lifted/held status from 2D image appearance alone.","If it is unclear whether the object has lifted or remains on the table, call back_project with camera='d455' on the best visible held-object surface when possible.","If only a source/table candidate is visible, treat that projection as a source-candidate check, not proof of failure.","Compare returned right_base z primarily with the source/table height or pre-grasp source projection.","For wide objects such as plates, projected center/rim x/y can be far from the right TCP while still held; do not mark failure from TCP x/y distance alone.","If a verified projection of the intended object or held-object surface is higher than the source/table height or pre-grasp source projection, treat the grasp as successful and proceed to vla_handoff.","Mark failure only when a verified projection shows the same intended object still at source/table height and gripper/image evidence shows the right gripper is empty or not supporting it.","If the object is occluded or identity/source is ambiguous, mark the grasp status uncertain and request operator feedback instead of opening or retrying.","If the wrong object is grasped or identity is uncertain, stop for operator feedback.","17.","Do not call move_delta, rotate_delta, open_gripper, close_gripper, or any other rule-based primitive to prepare or reposition either arm before handoff; vla_handoff owns the complete bimanual approach and transfer from the post-grasp state.","18.","Before vla_left_place, confirm vla_handoff has ended and the left gripper holds the intended object.","If the held bowl or plate was classified dirty, localize an interior placement point inside the open metal wire basket/frame.","If it was classified clean, localize a white interior floor/cavity placement point at the cardboard-box center, still clearly inside the box.","For the cup, localize the same cardboard-box placement area.","For chopsticks or the spoon, localize the target cup after the cup is stable inside the cardboard box.","Stage the left-held object with safe left-arm horizontal x/y move_delta only when staging is needed: use the projected target x/y, keep the current left TCP z with delta_z=0 by default, do not move to the projected z coordinate, and do not add a large vertical clearance.","Call vla_left_place only if the latest staging move succeeded and reports a reached/effective target.","If the staging move fails, is uncertain, or does not reach the target, do not call vla_left_place.","19.","The metal wire basket/frame is the target only for dirty bowls and dirty plates.","The black-outside, white-inside cardboard box is the target only for clean bowls and clean plates.","Do not count dirty objects in the cardboard box or clean objects in the metal basket as success.","20.","Advance to the next category only after the latest inline D455 image confirms that every object in the current category has reached its required destination, or that no such object remains available in the source workspace after a careful visual check.","21.","The D455 is a fixed external camera.","Do not move either arm or held object merely to improve camera visibility.","Arm motion is allowed only for task execution or safety: free-space approach/staging, VLA handoff/placement/grasp execution, or joint recovery.","22.","After every VLA or rule-based action, inspect joint_health in the returned snapshot.","If either arm is warning or critical, especially right-arm q1 positive / q3 negative accumulation, call recover_joint_posture before continuing more VLA chunks; it records each gripper's open/closed state, re-commands that state before and after joint reset so closed grippers stay clamped, resets both arms' joints, then returns both TCPs near their pre-recovery right_base poses.","23.","The agent must not finish the episode by itself.","Call finish only after an operator_verdict.status of success or failure is observed.","24.","If depth is missing, projection is uncertain, the intended object is occluded, dirty/clean status is uncertain, or success is ambiguous, do not infer metric deltas from RGB alone; stop for operator feedback instead of opening a gripper or blindly retrying.","Call describe_dual_franka_setup, then request_scene_reset before acting.","After operator confirmation and a successful reset, inspect the fresh visual evidence together with both arms' TCP/gripper/joint-health state, and execute the task conservatively with the exposed bounded tools.","Auxiliary camera views are artifact views for targeted follow-up inspection only.","- task constraints: 1.","〔EXPLORATION MODE〕","MULTI-ATTEMPT REAL-ROBOT EXPLORATION.","You are session 1 of 3 on dual_franka_clean_desk_dirty_clean_sorting_agent_vla.","Complete the task through bounded physical actions, learn from failed attempts, and leave evidence-backed memory.","The TASK block is the preset; follow ex bias depends on direction, posture and load; measure it rather than assuming a fixed gain or overshooting.","If available clearance is smaller than observed uncertainty, change route, orientation or supported VLA strategy; do not simply enlarge the target toward an obstacle.","Never deepen a target blindly to overcome resistance.","Other servo failures require stop.","A rejected IK candidate with executed_steps=0 and stop_requested=false permits re-observation and a different reachable target; it does not require discarding partial progress or resetting the episode.","Never bypass a guard to execute a rejected path.","Runtime feedback faults and latched stops require stop.","Alternate observed single-arm actions for two-arm tasks; simultaneous coordinated Cartesian motion is not exposed.","Never claim primitive success as task success.","〔POLICY AVAILABILITY〕","This session has no VLA.","Solve and explore using the geometric primitives and current observations; pi05_act is not available.","If the task needs unavailable coordinated motion or contact feedback, explain that limitation instead of requesting an untrained policy.","〔SUCCESS〕","Only fresh env eval_success=true confirms success.","On the real YAM rig this may be an operator-confirmed flag until a perception success checker is installed. finish(success) returns pending when an operator verdict is needed.","A pending or finish-refused response does not end the session.","In exploration, re-observe and write the technique after confirmed success before finishing.","Evaluation memory is read-only.","Never invent an operator verdict.","Re-observe after every motion.","Pause uncertain motion and gather evidence.","Hold for onsite assistance when current evidence cannot establish a safe next action.","Use the current three views to validate any prior recipe.","Each geometric primitive selects arm=left or arm=right; the other arm's commanded joints and gripper are held unchanged during that action.","After a recoverable residual, render again and select a different point within that region; at most three executed candidates per region, then change approach or use a supported VLA when available.","Use the geometric primitives and current observations; pi05_act is not available.","Only fresh env eval_success=true confirms success on this episode.","If finish returns pending, ask the operator and wait for a current-episode verdict.","A finish-refused response keeps the session active.","Never invent a verdict or create a readiness or success receipt.","On operator abort, stop motion and call finish(status=\"failure\") immediately.","- seed label: 1","- instruction: Inspect the current state, then exercise one small translation, one small wrist rotation, and the gripper controls for each arm in turn.","Move only one arm per call.","Keep translations at or below 0.02 metres and wrist rotations at or below 5 degrees per call.","Use basic primitives only, without VLA actions.","Stop if observations or feedback indicate unsafe motion.","Finish only after the onsite operator confirms the result.","Follow the required read order, bind the current target and relation from fresh YAM observations, then execute the first unmet phase.","Use the complete task language as the overall goal.","Verify env eval_success before finish.","Verify env eval_success before claiming success.","A trained YAM qpos14 VLA is connected and pi05_act is available.","Treat VLA as a primitive alongside geometric tools.","Use its learned approach and pick behavior where suitable, then use observed geometric moves for task-specific placement when destination choice is unreliable.","Choose the number of chunks from the task, current clearance and any explicit operator preference.","Each chunk predicts from a fresh observation, but there is no Agent semantic review between chunks.","Assess both arms and the possible release region before dispatch.","Reobserve and measure progress after each call.","Each prediction has 30 steps, but only the first five execute.","Do not preassign a fixed number of chunks to every grasp or let the policy continue into an unverified release.","Record the observed switching point and chunk count as evidence, not a universal rule.","Omit prompt to use the full trained task instruction; arbitrary subgoal prompts have not been validated. pi05_act can command both arms together.","- task: 1","- instruction: Tidy up the table.","Left and right refer to the top camera view.","Sort all three bottles by brand.","Place all Pepsi bottles in the bag on the left and all Coca-Cola bottles in the bag on the right.","Move the bowls to uncover the spoons, place the white spoon in the white bowl and the pink spoon in the pink bowl, and return both bowls to their original marked positions: white bowl on the left and pink bowl on the right.","〔REAL-ROBOT EXPLORE〕","Exploration is operator-supervised real-robot work.","Prefer in-place recovery when it is safe, reset only after the failed attempt is archived and the next plan changes a named lever.","Keep attempts concise, preserve useful partial progress, and write observations as bounded evidence rather than global claims.","After every action classify its actual result, not the tool transport status:","- Completed: inspect fresh views and actual pose, then advance the task.","- Plan rejected with zero executed steps and no stop: retain progress, change the target within a task-valid region, orientation, or segment length.","Do not repeat the identical rejected plan or reset merely because IK failed.","- Explicitly recoverable residual without a stop: observe and plan from measured pose.","Do not treat the requested target as reached or infer free space.","- Visual uncertainty: pause release/forward motion, not reasoning.","Render fresh top and both wrist views; compare before/after views, grip retention, payload footprint, handle/rim geometry and actual feedback.","Bag deformation alone proves neither a snag nor clearance.","State the missing evidence and select an observation or recovery that can resolve it.","If its entire arm/payload path is supported by current views and planning, use one small retreat or lift, then reobserve.","Never assume a retreat is safe merely because it reverses an earlier path; a tether may now be caught.","Do not push through unknown contact.","- Feedback fault, latched stop, operator abort, or nonrecoverable servo failure: stop motion and follow the existing supported recovery protocol.","Never clear a latch or create readiness/success receipts yourself.","For the same local obstacle, try at most three distinct evidence-driven observation/recovery cycles.","Each cycle names the hypothesis, missing evidence, changed approach and observed result in existing working notes.","New local cycles are not new episodes and do not consume reset attempts.","If resolved, continue without routine operator confirmation.","If no supported recovery exists, evidence still cannot establish a safe next action, or the local budget is exhausted, request the specific missing onsite assistance and hold; do not repeat blind moves to meet a budget.","Preserve partial progress and do not claim task failure merely because an observation is ambiguous.","Do not use VLA to bypass uncertain","contact: it may move both arms and release; use it when the intended short segment and both arms' workspace are supported by current evidence.","Release only after fresh views support destination footprint and clearance.","Full task success still requires the current episode's authoritative verdict.","At startup, if ready_for_motion is false, call reset and wait for operator ready before any action.","An operator abort requires finish(status=\"failure\") immediately.","Your cell is yam_t0_s1_0123456789ab, session 1 of 3.","Use the common file tools to save working notes under /example/memory/yam/_internal/inbox/yam_t0_s1_0123456789ab/wip/.","Before a retry or session handoff, write an atte <script>
const data=JSON.parse(document.querySelector('#data').textContent);
const $=id=>document.getElementById(id), E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const robots={libero:'LIBERO',robocasa:'RoboCasa',robodojo:'RoboDojo',franka:'Franka',dual_franka:'Dual Franka',yam:'YAM'};
const titles=['角色与任务','运行与安全','初始化与记忆','感知与定位','动作与验证','恢复与预算','成功与报告'];
const views={sections:'分段对照',full:'原序全文',diff:'英文逐句 Diff',common:'公共流程'};
const origin={workflow:['共享正文','shared'],common:['共享正文与模式','shared'],evaluate:['Evaluate 规则','mode'],explore:['Explore 规则','mode'],robot:['本地补充','robot'],old:['原版','oldtag']};
const notes={
libero:['任务语言来自当前环境。WAM 使用完整任务启动；Pi0 路径保留自己的感知与记忆流程。','只能使用本轮获准的观测和工具；Pi0 的直接动作工具按配置开放。','Pi0 先看当前场景，再按 HF 或本地记忆配置读取资料。swap 场景只借用目标、外观和有效的策略提示词。','Pi0 用全局相机识别对象，再用腕部相机细化几何。盘缘轮廓可用于估算盘心。','Pi0 负责接触，已核实的持握可转为脚本搬运。高瓶保留在 z=0.30 直接释放的局部例外。WAM 则以有限动作块执行。','评估仅有一轮。Pi0 探索在尝试间记录失败证据；预算为零表示不限尝试次数。','以顶层 terminated 判断任务成功。探索只从最后一次成功尝试整理获胜轨迹。'],
robocasa:['PandaOmron 在厨房场景执行现场 task_language。','运动和成功判定来自本轮工具与观测，评估记忆访问受文件白名单约束。','评估按当前任务选取可读文件，探索从已发布记忆和当前 inbox 读取笔记。','全局相机用于识别，腕部相机细化近处几何，导航视角检查通路。','RLDX 每次传完整指令，省略 max_chunks 和 settle_patience。移动底盘后重新定位；有效接触期间保留策略历史。','区分调用达到上限与无接触停滞。只有连续两次无接触、无进展后才重新定位并调整起点。','查看环境 success，先保存审计再 finish。探索另有失败归档、工作笔记和记忆草稿。'],
robodojo:['ARX-X5 双臂执行原生任务指令。策略后端决定当前可用的控制方式。','原生动作计数与观测索引含义不同。运动后要同时查看状态、预算和安全反馈。','旧有启动顺序值得复核：system 要求先读指南，user 的 BEGIN 写的是先调用 view_env_state。','头部和双腕相机用于检查目标、抓取和终态；采样须配对同一步、同一视角的图像。','VPP2 与 Awomo05 的提示词和动作分块约定不同，可切换配置查看完整指令。','比较实际消耗和待完成阶段。探索在重置前保存失败证据和下一次准备改变的变量。','以原生成功信号为准。物品到位后仍需核对适用于本任务的双臂终态。'],
franka:['该集成只支持 Evaluate。任务 0 检查基础动作，任务 1 包含 VLA 抓取。','单臂真机由 runner 管理，机器人状态和同步相机反馈共同约束下一步动作。','先读 step 0 的状态与相机信息，结合腕部、外部视角和 TCP 状态制定计划。','两路同步图像应与测得的 TCP 状态一致。','move_delta 和 rotate_delta 使用固定基座坐标系。VLA 抓取前先安全接近并打开夹爪。','真机动作未到位、标定存疑或反馈不一致时立即停止。本地停止条件优先于一般性的残差重规划。','任务证据须在双视角中可见，并与测量状态一致。'],
dual_franka:['评估和探索均使用物理双臂，探索保留人工任务修订和交接记录。','首动前由现场人员恢复场景。禁止仅为改善视野而移动机械臂或所持物体。','先获取双臂配置与相机信息，在指定时点请求人工复位并检查新观测。','使用 right_base 解释投影；核对标记是否落在目标材质内部，以及夹爪和高度证据。','确认右手持物后直接调用 vla_handoff，再验证左手持物才进入放置。','检查关节健康；恢复与重试遵守人工中止和物理状态约束。','从当前人工判定取得结果。后续物理动作会使先前判定失效。'],
yam:['双臂 YAM 的任务及策略可用性按当前配置确定。','服务器的碰撞检查范围有限；路径不确定时暂停并请求现场协助。','先读指南、看三路相机，再查记忆。探索开始与复位都要遵守现场 ready 协议。','俯视图确认身份和任务关系，同侧腕部图核对接触；坐标基准为左臂基座。','基础动作每次选择一条机械臂。启用 Pi0.5 后，双臂策略每次预测 30 步、执行前 5 步。','区分未执行的 IK 拒绝、可恢复残差和锁止故障。探索对同一障碍最多做三轮有证据的局部恢复。','以当前回合 eval_success 为准。finish 返回 pending 时须等待现场人员判定。']};
let robot='libero',view='sections',section=0,onlyChanges=false;
function btn(key,title,on,attr){return '<button type="button" '+attr+'="'+E(key)+'" class="'+(on?'on selected':'')+'" aria-pressed="'+on+'">'+E(title)+'</button>'}
function options(id,values,last){$(id).replaceChildren(...values.map(([v,t])=>new Option(t,v)));if(values.some(([v])=>v===last))$(id).value=last}
function cases(){return data.cases.filter(c=>c.robot===robot)}
function config(resetMode=false){const cs=cases(),m=resetMode?'eval':$('mode').value,p=$('profile').value;
options('mode',[...new Set(cs.map(x=>x.mode))].map(x=>[x,x==='eval'?'Evaluate':'Explore']),m);
options('profile',cs.filter(x=>x.mode===$('mode').value).map(x=>[x.label,x.label]),p)}
function renderBlocks(rows){return rows.map(([title,ids])=>'<div class="section-block"><h3 class="sectionHead">'+E(title)+'</h3>'+ids.map(id=>{
 const b=data.blocks[id],[name,style]=origin[b.origin],lang=$('lang').value;
 return '<div class="fragment"><span class="badge '+style+'">'+name+'</span>'+(lang==='en'?'':'<pre class="zhtext" lang="zh-CN">'+E(b.zh)+'</pre>')+(lang==='zh'?'':'<pre lang="en">'+E(b.en)+'</pre>')+'</div>'
 }).join('')+'</div>').join('')}
function panel(which,rows){return '<article class="panel"><div class="panelhead '+(which?'after':'')+'"><span>'+['迁移前','迁移后'][which]+'</span><code>'+['e39f4bcf5','79cb70ee6'][which]+'</code></div>'+(rows.length?renderBlocks(rows):'<p class="placeholder">原版没有独立归入此主题的章节。可在「原序全文」查看跨主题段落。</p>')+'</article>'}
function draw(){
 const c=cases().find(x=>x.mode===$('mode').value&&x.label===$('profile').value),kind=$('kind').value,labels=kind==='system'?titles:['任务与约束','启动指令'], [a,b]=c[kind];
 if(section>=labels.length)section=0;
 $('robots').innerHTML=Object.keys(robots).map(k=>btn(k,robots[k],k===robot,'data-robot')).join('');
 $('views').innerHTML=Object.entries(views).filter(([k])=>k!=='common'||kind==='system').map(([k,t])=>btn(k,t,k===view,'data-view')).join('');
 const segmented=view==='sections'||view==='common';
 $('nav').hidden=!segmented;$('nav').parentElement.style.gridTemplateColumns=segmented?'':'minmax(0,1fr)';
 $('nav').innerHTML='<h2>'+kind.toUpperCase()+'</h2>'+labels.map((s,i)=>btn(i,s,i===section,'data-page')).join('');
 $('params').textContent=JSON.stringify(c.vars,null,2);$('langfield').hidden=view==='diff';
 let html='<div class="heading"><h2>'+(segmented?labels[section]:views[view])+'</h2></div>';
 if(view!=='diff'&&$('lang').value!=='en')html+='<p class="langhint">共享段落沿用 RoboTwin 对照页中的中文译文。平台专属译文含离线机器翻译，请用英文原文核对工具参数、数值与判定条件。</p>';
 if(view==='sections'){
  const note=kind==='system'?notes[robot][section]:(section===0?'对照两版传入的任务和运行约束。':'对照 planner 的第一步以及观察、读记忆和执行的顺序。');
  html+='<p class="guide">'+E(note)+'</p><p class="note">左侧按旧章节的主要主题归类，右侧按新 workflow 的实际章节展示。</p><div class="columns">'+panel(0,a.filter(r=>r[2]===section))+panel(1,[b[section]])+'</div>';
 }else if(view==='full'){
  html+='<p class="note">两侧按各自消息的原始章节顺序展示。色签标出共享正文、模式规则与 robot 本地补充。</p><div class="columns">'+panel(0,a)+panel(1,b)+'</div>';
 }else if(view==='common'){
  const [title,ids]=b[section];html+='<p class="note">当前模式下，所有 robot 继承的章节正文。</p>'+renderBlocks([[title,ids.filter(i=>data.blocks[i].origin!=='robot')]]);
 }else{
  const lines=data.diffs[c[kind+'Diff']],n=s=>lines.filter(x=>x[0]===s).length;
  html+='<p class="note">按原顺序比较英文句子、列表项与标题，忽略换行空白。移动的内容可能分别出现在移出和加入中。</p><div class="legend"><span class="minus">− 移出 '+n('-')+'</span><span class="plus">+ 加入 '+n('+')+'</span><span class="same">= 保留 '+n('=')+'</span><label><input type="checkbox" id="only" '+(onlyChanges?'checked':'')+'> 只看变化</label></div><div class="literal">'+lines.filter(([op])=>!onlyChanges||op!=='=').map(([op,id])=>'<div class="line '+({'+':'plus','-':'minus','=':'same'})[op]+'"><b>'+op+'</b><span>'+E(data.lines[id])+'</span></div>').join('')+'</div>'
 }
 $('content').innerHTML=html;
}
$('robots').onclick=e=>{if(e.target.dataset.robot){robot=e.target.dataset.robot;section=0;config(true);draw()}};
$('views').onclick=e=>{if(e.target.dataset.view){view=e.target.dataset.view;draw()}};
$('nav').onclick=e=>{if(e.target.dataset.page!==undefined){section=Number(e.target.dataset.page);draw()}};
$('mode').onchange=()=>{config();draw()};$('profile').onchange=draw;$('lang').onchange=draw;
$('kind').onchange=()=>{section=0;if(view==='common'&&$('kind').value==='user')view='sections';draw()};
$('content').onchange=e=>{if(e.target.id==='only'){onlyChanges=e.target.checked;draw()}};
config(true);draw();
</script></body></html>
