n.","recipe_tag":"franka_t0","output_dir":"/example/runs/franka_t0","memory_inbox":"/example/memory/franka/_internal/inbox/franka_t0"},"system":[[["ROLE",[142],0],["RUNTIME",[143],1],["SAFETY RULES",[144],1],["WORKFLOW",[145],4]],[["ROLE AND TASK",[10,11,146],0],["RUNTIME AND SAFETY",[13,147],1],["INITIALIZATION AND MEMORY",[15,148],2],["PERCEPTION AND LOCALIZATION",[17],3],["ACTION AND VERIFICATION",[19,149],4],["RECOVERY AND BUDGET",[21,22,150],4],["SUCCESS AND REPORTING",[24,151],6]]],"user":[[["TASK",[152],0],["TASK CONSTRAINTS",[153],0],["BEGIN",[154],1]],[["TASK",[155],0],["BEGIN",[156],1]]],"systemDiff":19,"userDiff":20},{"robot":"franka","mode":"eval","label":"VLA 抓取 · 任务 1","vars":{"mode":"eval","seed":1,"session_number":1,"session_max":3,"explore_attempts_per_session":5,"attempts_per_session":5,"task_id":1,"memory_dir":"/example/memory/franka","task_name":"vla_grasp","instruction":"Use bounded analytic motion to stage near the named object, ensure the gripper is open, then use vla_grasp for the contact-rich grasp attempt.","success_criteria":"The target object visibly follows the gripper upward and remains stable between the fingers in both camera views.","setup":"","constraints":"1. Inspect both wrist and external camera views after every action.\n2. Use VLA only after a safe near-object staging pose is reached.\n3. Do not infer success from gripper position alone.","recipe_tag":"franka_t1","output_dir":"/example/runs/franka_t1","memory_inbox":"/example/memory/franka/_internal/inbox/franka_t1"},"system":[[["ROLE",[142],0],["RUNTIME",[143],1],["SAFETY RULES",[144],1],["WORKFLOW",[145],4]],[["ROLE AND TASK",[10,11,146],0],["RUNTIME AND SAFETY",[13,147],1],["INITIALIZATION AND MEMORY",[15,148],2],["PERCEPTION AND LOCALIZATION",[17],3],["ACTION AND VERIFICATION",[19,149],4],["RECOVERY AND BUDGET",[21,22,150],4],["SUCCESS AND REPORTING",[24,151],6]]],"user":[[["TASK",[157],0],["TASK CONSTRAINTS",[158],0],["BEGIN",[154],1]],[["TASK",[159],0],["BEGIN",[156],1]]],"systemDiff":19,"userDiff":21},{"robot":"dual_franka","mode":"eval","label":"双臂交接 · 任务 1","vars":{"mode":"eval","seed":1,"session_number":1,"session_max":3,"explore_attempts_per_session":5,"attempts_per_session":5,"task_id":1,"memory_dir":"/example/memory/dual_franka","task_name":"clean_desk_dirty_clean_sorting_agent_vla","instruction":"Complete a dual-arm collaborative tabletop object-storage task in this object category order: bowls, plates, cup, chopsticks, then spoon. Finish the entire current category before targeting anything from the next category. Within any category that has multiple colored source objects, use this color order: process green before blue. Do not let dirty/clean status change the grasp order. The only added logic is placement-time dirty/clean sorting for bowls and plates: before grasping each bowl or plate, classify whether it is dirty or clean. Dirty bowls and dirty plates go into the metal wire basket/frame; clean bowls and clean plates go into the black-outside, white-inside cardboard box. The cup still goes into the cardboard box, and the chopsticks and spoon still go inside the cup after the cup is stable in the cardboard box. After the right hand successfully grasps an object, call vla_handoff directly from the confirmed post-grasp state. Before calling vla_left_place, localize the required target container and horizontally align the left-held object above that target.","success_criteria":"All target objects have been processed in the required category order. All dirty bowls and dirty plates are inside the metal wire basket/frame. All clean bowls, clean plates, and the cup are inside the black-outside, white-inside cardboard box. The chopsticks and spoon are inside the cup after the cup is stable inside the cardboard box. Stop for operator feedback if a dirty/clean label is uncertain, if an object was placed in the wrong container, or if visual evidence does not support safe continuation.","setup":"This is a dirty/clean sorting variant of the clean-desk task, using category order bowls, plates, cup, chopsticks, spoon and green-before-blue order within each category. The base camera and fourth-view D455 are RealSense RGBD cameras, but this dirty/clean sorting task exposes D455 metric localization tools. D455 aligned depth can be back-projected into the right_base frame using the calibrated extrinsics. The D455 is a fixed external camera; moving either arm or a held object does not move the camera viewpoint and must not be used as an active-vision strategy. right_base is the shared world coordinate frame exposed to the agent: camera points, left/right TCP positions, and rule-based base-frame deltas are all represented in right_base. The black-outside, white-inside cardboard box is on the +y side of the adjacent metal wire basket/frame. Both containers are valid in this task: the metal wire basket/frame is the required destination for dirty bowls and dirty plates, while the cardboard box is the required destination for clean bowls and clean plates. A dirty bowl or plate is marked by a visible egg tart or egg-tart foil cup/tray inside or on the concave eating surface; a clean bowl or plate has no egg tart or egg-tart foil cup/tray marker. Use the contrast between the black exterior and white interior as the cardboard-box inside/outside boundary, and use the metal wires/rim as the metal basket boundary. The VLA checkpoint is the deployment-aligned dual-arm tcp-rot6d clean-desk policy; named VLA tools keep using its fixed training instruction, while the planner decides the dirty/clean destination.","constraints":"1. Call describe_dual_franka_setup before acting.\n2. Call view_env_state before the first action only if no fresh primitive snapshot is already available. After any primitive that returns a snapshot, inspect that returned snapshot directly; never call view_env_state immediately afterward unless the primitive failed, returned no snapshot, an operator changed the scene, or a specific historical step is needed.\n3. Enforce this grasp order without exception: first category order bowls -> plates -> cup -> chopsticks -> spoon, then within any category that has multiple colored source objects, green before blue. Always act on the earliest unfinished category. While any object from that category remains in the source workspace, do not localize, approach, grasp, or call a VLA grasp skill for any later category. Within the current category, do not localize, approach, grasp, or call a VLA grasp skill for a blue object while a green object from the same category remains in the source workspace.\n4. Dirty/clean status must not reorder grasping. For bowls and plates, first choose the next object by the category/color order, then classify that chosen object as dirty or clean, and only use the dirty/clean label to choose the placement destination before vla_left_place.\n5. Classify dirty vs clean before each bowl or plate attempt. A dirty bowl or plate has a visible egg tart or egg-tart foil cup/tray inside or on the concave eating surface; a clean bowl or plate has no egg tart or egg-tart foil cup/tray marker. If the egg-tart marker is occluded, ambiguous, outside the dish, or cannot be judged in the latest D455 image, do not move the robot; request operator feedback.\n6. An egg tart or egg-tart foil cup/tray counts as a dirty marker only if it is visibly inside or on the concave eating surface of that specific bowl or plate. A nearby egg tart or foil tray on the table, in another object, or outside the dish must not make the dish dirty.\n7. Build a brief D455 localization and sorting table before moving in each category. For each visible candidate in the current category, list object type, color if visible, dirty_clean_label for bowls/plates, egg_tart_evidence for bowls/plates, required_destination, D455 evidence, projected point if used, and status.\n8. When SAM3 is available, use segment with camera='d455' on the D455 image to segment the current object or required placement target before falling back to a manual pixel. Use short phrases, inspect the returned mask overlay yourself, and retry with a point prompt, more specific text prompt, or manual D455 pixel whenever the mask or median marker is not visibly on the intended target.\n9. Use back_project only on a pixel well inside the visible material of the intended object or placement container. Do not select the table, background, rim edge, air above the object, another object, a container wall, metal wire, or a shared container boundary. Inspect the returned annotated image; if the marker is not on the intended target, retry or stop.\n10. When exact spatial relation is uncertain, use segment or back_project again instead of judging metric x/y/z offsets by 2D RGB appearance. After a segmentation/projection is verified, trust the returned right_base xyz and TCP-to-point deltas as the main metric evidence for rule-based correction moves.\n11. Treat right_base as the only world coordinate frame for agent reasoning. For both left and right arms, move_delta and rotate_delta use right_base/world deltas; do not convert left-arm coordinates yourself.\n12. For bowls, do not use rule-based move_delta to pre-align or move above the bowl before vla_right_grasp. This avoids pushing the learned VLA policy out of distribution. After D455 confirms the intended bowl identity and dirty/clean label, call vla_right_grasp directly from the current robot state.\n13. For plates, the cup, chopsticks, and the spoon, rule-based pre-grasp staging is allowed only when clearly needed: move the right TCP to a safe pre-grasp pose about 10cm above the projected target surface point in right_base/world coordinates, without touching the object.\n14. Call vla_right_grasp directly after bowl identity and dirty/clean classification are confirmed. For non-bowl objects, call vla_right_grasp only after the latest right-arm move_delta reports a reached/effective target near the intended object, unless the object is already safely staged. Leave max_chunks unset unless running a cautious diagnostic.\n15. Use VLA segment tools for contact-rich motion: vla_right_grasp for the right-arm grasp segment, vla_handoff for bimanual transfer, and vla_left_place for left-arm placement.\n16. After a grasp VLA, inspect the returned snapshot. Continue only if the right gripper appears to hold the intended object. Do not judge lifted/held status from 2D image appearance alone. If it is unclear whether the object has lifted or remains on the table, call back_project with camera='d455' on the best visible held-object surface when possible. If only a source/table candidate is visible, treat that projection as a source-candidate check, not proof of failure. Compare returned right_base z primarily with the source/table height or pre-grasp source projection. For wide objects such as plates, projected center/rim x/y can be far from the right TCP while still held; do not mark failure from TCP x/y distance alone. If a verified projection of the intended object or held-object surface is higher than the source/table height or pre-grasp source projection, treat the grasp as successful and proceed to vla_handoff. Mark failure only when a verified projection shows the same intended object still at source/table height and gripper/image evidence shows the right gripper is empty or not supporting it. If the object is occluded or identity/source is ambiguous, mark the grasp status uncertain and request operator feedback instead of opening or retrying. If the wrong object is grasped or identity is uncertain, stop for operator feedback.\n17. After a confirmed right-hand grasp, call vla_handoff directly. Do not call move_delta, rotate_delta, open_gripper, close_gripper, or any other rule-based primitive to prepare or reposition either arm before handoff; vla_handoff owns the complete bimanual approach and transfer from the post-grasp state.\n18. Before vla_left_place, confirm vla_handoff has ended and the left 作序列>`terminated == true`.>你可能在这集内恢复(重新定位,重新定位)`pi0_pick`a> 丢失抓取,行走Pi0迅速的梯子,`rotate_pitch`/`move_pose`)——即>所有连续尝试——但您想要重设/启动的瞬间,>**STOP\n而不是写审计**(成功或诚实)`terminated:false`).\n不调用`reset`.\n使用下面的 PROVEN LEVERS> 第一次将单试对准."},{"en":"These are battle-tested on seed 0 of THIS suite. You are now running a DIFFERENT\nseed — object/fixture positions differ, so RE-LOCALIZE everything per scene\n(never hard-code an xyz). But the TECHNIQUES and the per-task target zones\ntransfer directly. After inspecting the initial `task_language`, read the solved\nseed-0 reference (if present): `/example/memory/libero/task-specific/10_t0_s0.json` (+\n`/example/memory/libero/task-specific/10_t0_s0_recipe.jsonl`)\n— it has the winning strategy_notes and command sequence from seed 0.\nReuse its approach; re-derive every coordinate from THIS scene.\nThe recipe is ONLY the command sequence. You must ALSO read the matching task\nmemory — it carries the WHY, the parameter ranges, and the\nfailure modes you need to adapt the recipe to this seed. A recipe read without\nits memory is half the picture; consult BOTH before planning.\n\nCRITICAL MECHANICS (cost many wasted attempts before they were nailed):\n- **GRIPPER SIGN**: in `move_to` / `set_gripper`, `gripper:+1` = CLOSE/hold,\n  `gripper:-1` = OPEN. To CARRY a grasped object, hold `gripper:+1` the whole way\n  (carrying with `-1` silently OPENS and drops it — the #1 early bug). `set_gripper +1`\n  (steps 8-12) firms the grip after a pick; for a laterally-weak CAN use steps\u003c=5.\n- **`move_pose` defaults gripper to OPEN (-1) if you omit it** — always pass\n  `\"gripper\":1` in `move_pose` while holding an object.\n- **`move_pose` threads the OSC IK singularity that `move_to` walls at** — for\n  cabinet-front / microwave-cavity / deep reaches, when `move_to` stalls\n  (final_dist stays high, eef retreats), switch to `move_pose` (co-vary\n  xyz+pitch+yaw). It reaches several cm deeper.\n\nGRASPING:\n- **MUGS / BOWLS / CUPS grasp at the RIM, not the center**: SAM3/back-projection\n  give the object CENTER; closing the gripper there grabs air. Aim\n  `eef_y = object_y + 0.045` so Pi0 rim-hooks. (Mugs do NOT hang 4.5cm in -y like\n  bowls — you can wrist-segment the grasped object to measure the true held offset.)\n- Some objects grasp best with `pi0_pick` from the **DEFAULT HOME pose** (no\n  pre-position) — Pi0 has its own approach trajectory; pre-positioning can hurt.\n- **`pi0_pick` is reusable and repurposable**:\n  a HIGH `lift_thresh` (e.g. 999) + `gripper_closed_thresh:0` turns it into a\n  generic closed-loop CONTACT skill (used to turn the stove knob).\n- **`pi0_doubled`** = Pi0 closed-loop CONTACT skill (success :=\n  `terminated`). Use it for drawer/door open-close AND insertions; call it\n  repeatedly.\n\nDISAMBIGUATION / TARGETING:\n- **SWAP-PERTURBED scenes (suite `*_swap`)**: the seed-0 reference's COORDINATES\n  are STALE (swap re-randomizes object positions per seed), and some s0 swap\n  recipes contain a literal reset — that was the old multi-attempt era UNDOING A\n  WRONG-OBJECT FIRST GRAB. You cannot reset. Use the s0 ref ONLY for: WHAT the\n  targets are (task_language nouns), what they LOOK like, and which Pi0 prompt\n  finally worked — never for positions, never replay its command list.\n  IDENTIFY-then-GRASP: before ANY pick, identify the target SEMANTICALLY in the\n  global agentview, then use the wrist only for geometry. The wrist camera is a\n  near-vertical close-up: it is excellent for precise depth/xy refinement, but\n  weak at reading side labels or distinguishing similar grocery items\n  (ketchup/BBQ/tomato sauce, soup cans, cream cheese/butter). Do NOT let the\n  wrist freely re-identify a non-basket target; it often locks onto a look-alike.\n  Instead: choose the target from `agentview_high.png`, compute its agentview\n  xyz, move over that candidate, project/track that SAME candidate in wrist, and\n  refine only its surface/center coordinates. SAM3 scores ~0.02-0.06 on brand\n  nouns (\"alphabet soup\", \"tomato sauce\") — prompt by colour+shape (\"the short\n  red-label can\") or pick pixels manually in the agentview hi-res. Pi0's own\n  prompt grounding is ALSO unreliable on brand nouns (s0's first grab took a milk\n  carton instead), so pre-position the eef directly OVER the agentview-identified\n  + wrist-refined target before pi0_pick. A wrong first grab usually\n  tips/displaces the grabbed object AND the target zone — identification errors\n  are unrecoverable; spend commands on agentview ID, not on recovery.\n- **\"left\"/\"right\" in libero_10 is EGOCENTRIC (robot frame): +y = robot-LEFT =\n  image-RIGHT.** A geometrically-perfect placement of the WRONG target never fires\n  the predicate — when a clean placement won't terminate, SUSPECT WRONG-TARGET\n  before wrong-physics (this turned a \"physically impossible\" verdict into a solve).\n- Containers can be MOVABLE (e.g. a basket slides when bumped) — descend into the\n  interior CENTER from straight above, not against the rim; SAM3's centroid of a\n  frame-clipped/reflective container is rim-biased, so derive the true cavity\n  center from the woven-rim pixels.\n\nPER-TASK RECIPES THAT WORKED AT SEED 0 (adapt coords to your seed):\n- 2-items→basket (t0,t1,t7): place the BOX first into the EMPTY basket interior\n  (descend deep, release), then drop/`pi0_pick`-lift the CAN in beside it; a\n  rim-perched item can be seated with a closed-gripper downward push.\n- mugs→plates (t4) / mug→plate (t6): rim-grasp, +1-hold carry, descend until the\n  mug rests on the plate before release (high release → topples off).\n  ⚠ t4 SINGLE-ATTEMPT LEVERS (READ — the seed-0 \"win\" quietly used 2 resets; you\n  have NONE. 8/9 multiseed cells died to the SAME chain: Pi0 rogue-place →\n  tipped mug → unrecoverable cascade. Prevent it up front):\n    1. GRASP-ONLY pi0_pick: short prompt (\"grasp the yellow mug\" — NEVER the full\n       task_language) AND `max_chunks\u003c=8`. With 20-25 chunks Pi0 keeps driving its\n       trained pick-AND-PLACE and dumps the held mug at its own trained \"left\"\n       (+y) or at the workspace IK edge (|y|>0.27 walls z>=0.56 — unreachable\n       forever). Stop Pi0 at lift; if lift isn't reached within 8 chunks,\n       RE-ISSUE pi0_pick rather than raising max_chunks.\n    2. The instant lift is detected: `set_gripper +1` (steps 8-12) to lock the\n       grip, then YOU script the entire carry + place (Rule 1 — Pi0 never places).\n    3. Measure the held-mug offset PER PICK by wrist-segmenting the HELD mug\n       (offsets differ pick-to-pick: dy=-0.055 on one grasp, -0.013 on the next —\n       measure each, never reuse). Place eef = plate_center − offset; descend to\n       z~0.46 until the mug RESTS on the plate (OSC stalls ~0.51), then release\n       and retreat STRAIGHT UP (step_clip 0.012).\n    4. ORDER/PATH: after placing mug #1, plan mug #2's pick pre-position AND\n       carry path so they NEVER pass over the placed mug (a graze re-tips it). A\n       tipped mug is UNRECOVERABLE (no side-grasp primitive; Pi0 won't engage\n       side-lying cylinders) — prevention is everything.\n    5. Plates MOVE per seed (y=±0.21 at s0, ±0.30 at s8): re-localize each plate\n       rim with the wrist cam and use the x_range/y_range MIDPOINTS as the true\n       center (the visible-fragment median is edge-biased).\n- stove (t2): turn the knob with `pi0_pick \"turn on the stove\", lift_thresh:999,\n  gripper_closed_thresh:0`; then grasp the pan by its HANDLE, re-segment mid-carry\n  to converge on the burner.\n- moka→stove (t8): grasp body, carry LOW (~4cm lift) in tiny hops (step_clip\n  0.006-0.01), re-clamp `set_gripper +1` between hops; \"LEFT\" = +y pot.\n- bottle→bottom drawer + close (t3): the drawer In-region is SHALLOW\n  (y≈0.075-0.227) — place at the MOUTH (y≈0.13), NOT the deep recess; `pi0_pick`\n  the bottle from home pose, `rotate_pitch` it flat ALONG X (the wide footprint),\n  release at the mouth, ONE short +y push nmetadata and world maps without opening artifacts directly. Step `0` is the\ninitial state; step `-1` selects the latest state.","origin":"old","zh":"服务器进程( A)`env_server.py`) 已经运行中。\n它已经Pi0.5装入和单元LIBERO辛姆,你觉得呢? Sim.\n运行者管理服务器并曝光结构化工具.\n不启动、停止、重新启动或以其他方式管理`env_server.py`.\n-不发布基于文件的协议命令 。\n-不要发出纯文本伪工具呼叫或JSON动作命令。\n- 调用运行时间曝光的真正结构化工具。\n-在此提示中使用裸体工具名 :`move_to`,`pi0_pick`,`release`,`set_gripper`,`rotate_wrist`,`rotate_pitch`,`move_pose`,`pi0_doubled`,`view_env_state`,`view_camera_meta`,`back_project`,`segment`,`read_text_file`,`write_text_file`,`list_dir`,\n`finish`.\n- 在一些运行时间下,这些相同的工具可能会出现命名空间;调用您工具列表中显示的实际工具名称,保留相同的参数和语义.\n每一个州的记录都暴露`step`顶级`task_language`,`terminated`,`truncated`,无编码`state`,一个`artifacts`逻辑基名列表,以及 a`log`.\n存储路径是内部的;不构建或剖析它们.\nCanonical 观测键包括`agentview_policy.png`,`agentview.png`,`agentview_high.png`,`agentview_depth.npz`,`agentview_world.npz`,`agentview_world_high.npz`,`agentview_metadata.json`,`wrist.png`,`wrist_high.png`,`wrist_depth.npz`,`wrist_world.npz`,\n`wrist_world_high.npz`,以及`wrist_metadata.json`.\n使用`view_env_state`以获取记录。\n它嵌入了策略图像以及最佳可用的代理视图和手腕图像,更喜欢匹配`*_high.png`工艺品。\n使用`view_camera_meta`,`back_project`,以及`segment`在不直接打开文物的情况下消耗元数据和世界地图。\n步骤`0`是初始状态; 步骤`-1`选择最新状态。"},{"en":"YOUR GOAL: produce top-level `terminated == true` in ONE episode. ⛔ NO\n`reset`, NO retry (SINGLE-ATTEMPT MODE — see the override at the very top; it\nsupersedes any reset/retry wording in the Rules below).","origin":"old","zh":"你的目标:生产顶级`terminated == true`一集中,没有。`reset`,不重试(SINGLE-ATTEmpT MODE——见顶部的覆写;它取代了下文规则中的任何重设/重试措词)。"},{"en":"Rule 0 — USE IMAGES. After every primitive tool call, inspect the returned state\n  and embedded images. If you need a state again, call `view_env_state`. Inspect\n  `agentview_high.png` (the calibration-frame image used for pixel selection)\n  and, when close to a target, `wrist_high.png`. The image is\n    your spatial-reasoning input; the returned `state` field only gives\n    proprioception + object names.\n\nRule 1 — Pi0 is ONLY for the grasp. Use:\n     pi0_pick({\n       \"prompt\": \"\u003ccarefully chosen prompt>\",\n       \"max_chunks\": 20,\n       \"lift_thresh\": 0.05,\n       \"gripper_closed_thresh\": 0.06\n     })\n   YOU do every `move_to` and the `release`. NEVER let Pi0 finish the place.\n   ⚠ Do NOT pass object pose / tracking oracles unless explicitly running a\n   debug/oracle ablation. The GT object-lift oracle leaks privileged coords and\n   can mis-fire when two objects share a name. You judge the grasp YOURSELF — see\n   Rule 1b.\n\nRule 1b — JUDGE THE GRASP from perception, NOT from a name. After a pick, decide\n   \"did I grab the target?\" from two coord-free signals:\n     • GRIPPER (proprioception): `state.robot0_gripper_qpos` from the latest\n      state record — fingers closed but NOT fully shut (~0.01–0.05 gap)\n       ⇒ holding an object; fully closed (~0.0) ⇒ grasped air.\n    • WRIST CAM: inspect the embedded `wrist_high.png` image after lifting. The target should\n       now be raised into the gripper, and the spot it came from should be EMPTY.\n       Compare before/after wrist or agentview evidence; if needed, use\n       `back_project` on wrist pixels to confirm the target surface z jumped up.\n   `pi0_pick.success` (eef-lift + gripper-closure heuristic) is a HINT, not\n   proof — always confirm with the wrist cam before carrying.\n\nRule 2 — Inspect THEN act. Call `view_env_state({\"step\": 0})`, inspect\n  `agentview_high.png` and the relevant memory/guides BEFORE your first\n  primitive. **Your task is the returned `task_language`; read it and obey it\n  verbatim.** This is the authoritative instruction (the BDDL\n   `:language` tag). Do NOT infer the task from object names, from sibling\n   recipes, or by guessing a task_map index — those caused wrong-task runs in the\n   past.\n\nRule 2b — NEVER read the BDDL files / import the benchmark / query env object\n   poses. The BDDL is FORBIDDEN: it carries the `:init` ground-truth coordinates\n   that perception-isolated mode exists to withhold — reading it (even just for\n   the language) breaks the experiment. You already have the task from\n   `task_language`; you get object positions ONLY by camera images, depth, and\n   `back_project` below.\n\nRule 2c — GROUND THE TARGET BY ITS SPATIAL RELATION, not by its name. When the\n   task names a relation (\"the bowl ON THE COOKIES BOX\", \"the mug LEFT OF the\n   plate\"), the target is whichever object SATISFIES that relation in the scene —\n   find it by perception, not by guessing which `_1`/`_2` name it is. Identical\n   objects (two `akita_black_bowl_*`) carry NO perceptual difference in their\n   names, so the name is useless for choosing; the RELATION is what disambiguates:\n     • \"on the cookies box\" ⇒ the bowl that is ELEVATED (sits ~0.03–0.06m above\n       the table, on top of the box) — distinguish it from the table-level bowl by\n       its higher world-z from `back_project`.\n     • \"left/right/front/back of X\" ⇒ compare back-projected world xy to X's xy.\n   Pick the target purely from where things ARE. Object NAMES are only needed if a\n   primitive asks for one (and in this mode none do — Rule 1).\n\nRule 2d — CLASSIFY THE DESTINATION SURFACE SEMANTICALLY (RGB) BEFORE PLACING.\n   Depth/world-maps can locate a flat disc but CANNOT tell you WHAT it is — a\n   plate, a stove burner/cook-region, a wooden-cabinet top, and a pot lid all read\n   as \"flat disc at table height\" in back-projected coordinates. They are only\n   separable in the RGB. So before you carry-and-release onto a surface, look at\n  `agentview_high.png` (and `wrist_high.png` once close) and\n   NAME each candidate surface:\n     • PLATE ⇒ ceramic disc, usually white, with a clean raised rim (often colored\n       concentric rings). This is the place target for \"place it on the plate\".\n     • STOVE BURNER / cook-region ⇒ darker gray metal disc with coil/grate rings,\n       sits on the stove fixture; looks ring-patterned like a plate but is NOT one.\n       Only the place target when the task says \"on the stove / cook region\".\n     • CABINET top / drawer slot / basket ⇒ match to the noun in `task_language`.\n   In kitchen scenes there are frequently TWO ring-discs (a burner AND a plate) at\n   nearly identical height — do NOT pick the first flat disc your z-scan finds.\n   Decide which noun the `task_language` names, classify each disc in RGB, and only\n   then localize the matching one. If a `release` onto your chosen surface does not\n   fire the predicate, RE-CLASSIFY (you likely placed on the look-alike) before\n   assuming the grasp or the bowl was wrong — a non-firing predicate is as often a\n   wrong-SURFACE error as a wrong-object one.\n\nRule 3 — Pi0 IS the delivery service; walk the prompt ladder before scripting:\n     1. \"pick up the {object}\"  2. the `task_language` verbatim  3. spatial qualifier\n     4. re-position pre-pos (lower z, offset xy 5cm) and retry Pi0.\n\nRule 4 — ⛔ SINGLE ATTEMPT, NO RESET (overrides any reset/retry text). This is a\n   one-shot eval: you get ONE episode. Do NOT call `reset`. Within this single\n   episode you MAY recover in place (re-localize, re-pre-position, re-`pi0_pick` a\n   missed grasp, climb the Pi0 prompt ladder, re-firm the grip,\n   `rotate_pitch`/`move_pose`) — that is still one continuous attempt — but you\n   may NOT restart the episode. When the task terminates, OR when your single best\n   sequence is exhausted (you'd otherwise want to reset), STOP and write the audit\n   (success or honest `terminated:false`), then call `finish`.\n   NO teleport primitives (set_object_pose / articulate_to / js_move_to /\n   carry_object — deleted/forbidden; a goal past OSC reach is approached\n   physically or honestly reported, never warped). NO object world coords are\n   provided — you MUST localize via perception (below).","origin":"old","zh":"规 则0- 使用图像。\n每次原始工具呼叫后,检查返回状态和嵌入式图像.\n如果你需要再次状态,打电话`view_env_state`.\n检查`agentview_high.png`(用于像素选择的校准框图像),并在接近目标时,`wrist_high.png`.\n图像是您的空间推理输入; 返回`state`字段只给出自控 + 对象名称。\n规 则1—Pi0惟有他们能掌握。\n使用 :pi0_pick({\"即时\":\"小心选择的即时\",\"max_chunks\":20, \"lift_thresh\":0.05, \"gripper_closed_thresh\":0.06?你做每一个?`move_to`页:1`release`.\n永远不要让Pi0完成此位置。除非明确运行调试/ 甲骨文衰竭,否则不要通过对象 / 跟踪 oracles 。\nGT 对象提升甲骨文会泄露特权coords,当两个对象共享一个名称时可能会误燃.\n你来判断自己,看规则1(b) 减少或取消对《公约》的保留;\n规 则1b) 将巨猿从知觉中、而不是名字中挑选出来。\n经过一次挑选,决定\"我抓住目标了吗?\"从两个无腐蚀信号:\n• GRIPER(自主):`state.robot0_gripper_qpos`从最新状态记录中——手指闭合但并非完全闭合(~0.01–0.05空格 QQ 持有对象; 完全关闭(~0.0~ 抓住空气。 ~\n• WRIST CAM:检查嵌入式`wrist_high.png`升起后图像。\n目标现在应该提升到钳子上,它来自的点应该是EMPTY.\n比较手腕前后或代理视图证据;如果需要,使用`back_project`在手腕像素上确认目标表面 z跳了起来。\n`pi0_pick.success`(eef-lift + gripper-close Heuristic)是一种HINT,而不是证据——在携带前总是用手腕摄像头确认.\n规 则2- 检查然后行动。\n调用`view_env_state({\"step\": 0})`检查`agentview_high.png`和相关的记忆/ 指南在您的第一个原始文件之前 。**您的任务就是返回`task_language`. 阅读它,然后逐字服从它。**这是权威的指令。`:language`标记).\n不要从对象名称、兄弟配方或猜测中推断任务task_map指数——过去造成错误的任务运行。\n规 则2b ——从未读取 BDDL文件 / 导入基准 / 查询 env 对象 。\nBDDL是FORBIDDEN:它携带着...`:init`地面-真理协调,知觉-同位化模式存在以阻断——读取它(甚至仅仅为语言)打破实验.\n你的任务已经来自`task_language`;只通过相机图像、深度和`back_project`现列于下。\n规 则2c) 以其草根关系而不是其名称包围目标。\n当任务命名一个关系(\"碗上COOKIES BOX\",\"盘子的杯子\")时,目标就是任何与现场相关的物体——通过感知,而不是猜测哪一个.`_1`/`_2`名称是。\n相同物体(两个)`akita_black_bowl_*`)携带着他们名字中的无感知差异,所以这个名字对于选择是无用的;而RELATION则是使人分不清的:\n· \"在饼干盒上\"* 即将到来的碗(它~0.03–0.06m在桌子上方,在盒子上方)——用其更高的世界z与表级碗区分它与表级碗之间.`back_project`.\n• \"左转\"/right/front/back将X的xy和X的xy作比较。\n选择目标 纯粹从事物所在的地方。\n对象 NAMES 只有在原始人要求时才需要(而在这个模式下,没有人会这样做——规则)1).\n规 则2d- 定位前的短期稳定(RGB)分类。\n深度/世界地图可以找到一个平面盘,但CANNOT告诉你是什么——一个盘子,一个炉灶燃烧器/烹饪区,一个木制笼盖顶部,以及一个锅盖在背面投影的坐标上都读作\"平面盘\".\n它们只在RGB中可以分离.\n所以,在你携带和释放到表面之前,看看`agentview_high.png`(并)`wrist_high.png`(一经关闭),并给每个候选人的表面命名:\n• PLATE QQ陶瓷盘,通常为白色,带有干净的抬起的圆环(常为彩色同心环).\n这是\"把它放在盘子上\"的目标\n• STOVE BURNER/烹饪区 带有线圈/栅栏环的较深灰色金属圆盘,坐在炉灶固定处;外观似盘子,但并非盘子。\n只有任务说\"在炉子/烹饪区\"时的选址目标.\n• CABINET 顶部/抽屉插槽/篮子QQ与名词相匹配`task_language`.\n在厨房的场景中,经常有两个圆盘(一个燃烧器和一个盘子),高度几乎相同——不要选择你发现的第一张平板盘。\n决定哪一个名词`task_language`名称,在 RGB 中对每个盘片进行分类,然后将匹配的盘片本地化。\n如果有的话`release`在您选择的表面上不会在假设抓取或碗状错误之前发射上游、RE-CLASSIFY(你可能放在外观上)——非火线的上游和错误的对象一样,往往是错误的SURFACE错误。\n规 则3—Pi0是发送服务;在脚本前走提示阶梯 :\n1。“捡起{对象}”2. 数据`task_language`逐字记录3空间限定符\n4. 重新定位预置设备(低于z,冲抵xy)5cm)和重试Pi0.\n规 则4—— Single ATTEMPT, No RESET(覆盖任何重置/重置文本).\n这是一次尝试一弹:你得到一集。\n不调用`reset`.\n在这个单一的剧集中,你可能恢复到原位(重新定位,重新定位,重新定位).`pi0_pick`错失了抓住,爬上Pi0迅速的梯子, 重新确认握力,`rotate_pitch`/`move_pose`)——这仍然是一次连续的尝试——但你可能不会重启剧集.\n当任务终止时, 或当您的单个最佳序列已用尽(否则您会想要重置) , 停止并写入审计( 成功或诚实) 。`terminated:false`),然后调用`finish`.\n无远程传送原生生物( Q)set_object_pose/articulate_to/js_move_to/carry_object——删除/禁止;超过OCS范围的目标被实际或诚实地报告,从未扭曲过。\n没有提供对象世界coords——您通过感知(下方)实现MUST本地化."},{"en":"This is the core of perception-isolated mode. To find where an object is:\n\n1. Look at `agentview_high.png` (1024x1024 — PREFER THIS; fall back to\n  `agentview.png` only if the high-resolution artifact is absent) and find the target\n   object's pixel (row, col). (row = vertical/y from top, col = horizontal/x\n   from left.)\n2. Call `back_project` on that pixel:\n\n       back_project({\"row\": ROW, \"col\": COL, \"step\": NN})\n\n   It uses the high-resolution world map by default. Pass `\"resolution\":\"low\"`\n   only if the pixel came from a 256x256 image. The geometry (K⁻¹ back-projection\n   + extrinsic) is already done for you. Just use the returned `world_xyz`; do\n   NOT write back-projection math yourself unless debugging a tool failure. NEVER\n   mix hi-res pixels with low-res world maps or vice versa.\n\n   The returned value is the object's SURFACE point under that pixel. For a\n   grasp/place target use its x,y; for z use the object's resting height (sample a\n   pixel on the bare table next to it, or use table z ~0.9 kitchen / ~0.42\n   table-top).\n3. Sample a few pixels on the object and median the world xy — robust to a single\n   mis-picked pixel. (Tip: avoid pixels on the object's thin rim/edge or the gap\n   to the table — those index a background/edge depth and give a world point\n   metres away. Pick pixels firmly on the object's top surface.)\n\nALWAYS apply the manipulation offsets from memory to the PERCEIVED position\n(e.g. BOWL: eef_y = plate_y + 0.045). Verify visually in `agentview_high.png`\nafter moving.","origin":"old","zh":"这是感知-孤立模式的核心.\n查找对象位置:\n1.\n看着`agentview_high.png`(1024ưμ㼯A1024- 喜欢这个; 倒回去`agentview.png`只有在高分辨率的文物不存在的情况下),并找到目标对象的像素(row, col). (row=从顶端垂直/y, col=从左侧水平/x.\n2.\n调用`back_project`在像素上显示 :\nback_project({'row':ROW,\"col\":COL,\"step\":NN}).\n它默认使用高清世界地图.\n过`\"resolution\":\"low\"`只有像素来自一个256ưμ㼯A256图像。\n几何学( K− 1 back- projection + externsic) 已经为您完成 。\n只要用回话`world_xyz`;除非调试一个工具失败,否则不要自己写回投影数学 。\n永远不要将Hi-res像素与低RES世界地图混合,反之亦然.\n返回的值是该像素下对象的SURFACE点.\n对于抓取/放置目标,使用其x,y;对于z,则使用物体的休息高度(在它的旁边的赤桌子上用一个像素,或者使用表z~).0.9厨房 /~0.42表格顶部).\n3.\n在物体和中位数世界 xy 上取样一些像素——强到一个单一的误选像素(Tip:避免在物体的细边/尖端或与表的间隙上的像素)——这些索引是背景/尖端深度,并给出一个世界点远处.\n在物体的顶部表面牢固地选择像素. )\n总是将记忆中的操纵抵消应用到PERCEIVED位置(例如.\n鲍尔:eef_y=plate_y+0.045).\n视窗校验`agentview_high.png`移动后。"},{"en":"This is the default perception algorithm for EVERY cell (from the 80-task\nlocalization sweep: `agentview_identity_wrist_geometry_except_basket`).\nAgentview chooses WHAT the target is; wrist refines WHERE that already-chosen\ncandidate is. Do NOT invert those roles.\n\nCORE RULE:\n  • Non-basket objects/surfaces: agentview hi-res is the semantic AUTHORITY.\n    The wrist is ONLY a geometry/depth refinement camera for the SAME agentview\n    candidate. NEVER let the wrist freely re-identify a non-basket target — in\n    failed probes the wrist locked onto a look-alike hundreds of pixels away\n    while agentview had the right one.\n  • Basket / basket_cavity: wrist MAY also confirm/refine, because a basket is a\n    geometric container and the close view finds the true interior center (not\n    the rim). Basket failures are rim/edge bias, not semantic confusion.\n\nALGORITHM (run this BEFORE manipulating):\n\n1. From the initial `task_language` + `agentview_high.png` +\n   object_names, infer the task-relevant TARGETS and DESTINATIONS (language only;\n   never BDDL/poses).\n\n2. GLOBAL SEMANTIC PASS (agentview hi-res): in `agentview_high.png` choose each\n   target/destination candidate by RGB, label/shape, and global spatial relation.\n   For duplicates (two bowls/plates/mugs) pick by RELATION (on stove, on cookie\n   box, left/right/front/back), not `_1/_2`. For sauce/can/box groceries use the\n   front/side label + package shape + colour + layout — top-down wrist label\n   reading is NOT trustworthy. Classify destination surfaces (plate vs stove\n   burner vs cabinet/drawer vs basket) semantically in RGB here.\n\n3. COARSE XYZ (agentview): pick 3-8 pixels firmly on the chosen candidate in\n  `agentview_high.png`, call `back_project` on the SAME pixels, take the median.\n   Avoid edges/holes/shadows/table-gaps. This median is the IDENTITY ANCHOR for\n   that entity.\n\n4. WRIST GEOMETRY REFINE (non-basket): `move_to` ~15-20cm above the agentview\n   anchor xy, then refine the SAME candidate's surface/center from the wrist:\n     - accept a wrist xy ONLY if it is within ~3-5cm of the agentview anchor;\n     - if the wrist xy jumps >5cm, REJECT it (it hit a look-alike/background) and\n       keep the agentview xyz, or nudge and re-observe;\n     - the wrist may NOT override the agentview semantic choice — it only sharpens\n       coordinates when geometry is consistent.\n\n5. BASKET SPECIAL CASE: for `basket`/cavity, agentview finds it globally, then the\n   wrist confirms/refines the true INTERIOR center (place objects at the open\n   interior, not the rim/outer wall). Re-localize the cavity if the basket moved.\n\n6. MANDATORY PRE-TASK PERCEPTION PASS — DO NOT START MANIPULATION UNTIL THIS\n   TABLE EXISTS in your reasoning. One row per task-relevant entity (every movable\n   target, every destination/support/fixture, every relation landmark), each with:\n     - name_or_role (e.g. target_1, basket_cavity, plate_surface, stove_region)\n     - agentview_evidence (why this is the right semantic candidate/relation)\n     - agentview_pixels_rc (3-8 hi-res pixels) + agentview_xyz (median back_project)\n     - wrist_refine: accepted | rejected | basket_confirmed (+ wrist_xyz if kept)\n     - final_xyz (what you will plan with)\n     - uncertainty (indistinguishable can, duplicate class, basket rim bias, …)\n   If an entity is too ambiguous to identify, SAY SO before acting — do not let\n   Pi0 or the wrist make a free semantic choice for you.\n\n7. FINAL READY CHECK before the first pick/place: every target+destination has a\n   final_xyz; non-basket wrist refinements are spatially consistent with\n   agentview; basket/cavity points are interior-centered; manipulation offsets are\n   planned from the perceived final_xyz. If this fails, keep perceiving — only\n   then start the manipulation plan. Re-verify with the newest image after every\n   command and update the table if anything moves.\n\n(xyz from agentview and wrist `back_project` are in the SAME world frame,\ndirectly comparable. Do NOT blindly average them — accept wrist coords only when\nconsistent with the agentview anchor, or for basket/cavity geometry.)","origin":"old","zh":"这是 EveryY 单元格的默认感知算法(来自80-任务本地化扫描 :`agentview_identity_wrist_geometry_except_basket`).\nAgentview 选择目标是什么; 手腕精炼 在哪里已经选择的候选人。\n不要颠倒那些角色。\nCORE RULE:\n·非篮子物体/表面:代理视图高音是语义上的AUTHORITY。\n手腕仅是用于SAME代理视图候选人的几何/深度改进相机.\n永远不要让手腕自由重新识别一个非篮子目标——在失败的探测中,手腕被锁在一个像素上,就像数百像素的消失,而代理view拥有正确的一个像素.\n• 篮子/basket_cavity:手腕May也确认/恢复,因为一个篮子是几何容器,而近视则找到真正的内部中心(而不是环形).\n篮子故障是边缘/边缘偏差,不是语义上的混淆.\nALGORITHM(运行前操纵):\n1.\n从开始`task_language`+`agentview_high.png`+object_names中,推断与任务相关的TARGETS和DESTINATIONS(仅使用语言;从未使用BDDL/poss).\n2.\n全球空间站(特工站):在`agentview_high.png`按 RGB 、 标签/ 形状以及全球空间关系选择每个目标/ 目的地候选 。\n重复(两碗)/plates/mugs由RELATION(在炉子上,在饼干盒上,左边)选择/right/front/back),没有`_1/_2`.\n酱汁/can/box杂物使用前/侧标签+包形+彩色+布局——自上而下腕标签读取不可信.\n将目的地表面分类(牌子对炉灶燃烧器对柜/德拉沃对篮子),在RGB这里进行精选.\n3.\nCOARSEXYZ (代理视图): 选择3-8在选中的候选人上牢固显示像素`agentview_high.png`,拨打`back_project`在同一像素上,取中位数。\nAvoid edges/holes/shadows/table-gaps.\n这个中位数是该实体的识别值。\n4.\n(非篮子)`move_to`~15-20cm在代理视图主播xy上方,然后从手腕上精炼出SAME候选人的表面/中心:\n- 接受一个手腕xy,只要它在~~3-5cm代理视图主播;\n-如果手腕Xy跳动>5cm,重击(击中外观/背面),并保持代理视图xyz,或晃动和重新观察;\n- 手腕可能不会超过代理视图语义选择——它只在几何学一致时会磨亮坐标.\n5.\n基本特别案:`basket`/cavity,代理视图在全球发现它,然后手腕确认/改进真实的INTIOR中心(将物体放置在开阔的内部,而不是环形/外墙).\n如果篮子移动,则重新定位腔.\n6.\n任务前测试方法——不要开始操纵,直到你推理时的这个表态。\n每个任务相关实体一行(每个可移动目标,每个目的地)/support/fixture,每个关系地标),每个标志有:\n-name_or_role(例如:target_1,basket_cavity,plate_surface,stove_region)\n-agentview_evidence(为什么这是正确的语义学候选人/关系).\n-agentview_pixels_rc(3-8his-res像素) +agentview_xyz(中间数)back_project)\n-wrist_refine: 接受 QQ拒绝 QQbasket_confirmed(+wrist_xyz如果保留)\n-final_xyz(你要计划什么)\n- 不确定性(不可忽略的可重复等级、篮子轮轴偏差,......)如果一个实体过于含糊不清,无法识别,在采取行动之前说SO——不要让Pi0或者手腕为你做一个自由语义的选择.\n7.\n在第一个选址前最后准备检查:每个目标+目的地有一个final_xyz;非篮子手腕精炼在空间上与代理视图一致;篮子/洞点以内置为中心;从所感知到的操纵抵消计划final_xyz.\n如果失败,就继续观察——然后开始操纵计划。\n重新验证每个命令后的最新图像,如果有任何动静, 则更新表格 。\n(来自代理视图和手腕的xyz)`back_project`处于完全相同的世界范围,可直接比较。\n不要盲目地平均它们——只有在与代理视图主锚一致时才接受手腕圈,或者对于篮子/笼盖几何. )"},{"en":"1. READ THE GUIDES once each:\n   - `robots/libero/guides/strict_hybrid_guide.md`\n   - `robots/libero/guides/pro_hybrid_guide.md`\n   - `robots/libero/guides/env_calibration.md`\n\n2. INSPECT INITIAL STATE: call `view_env_state({\"step\": 0})`; inspect\n     `task_language`, object_names, eef pose, `agentview_high.png`,\n     `wrist_high.png` if useful, and call `view_camera_meta` if needed. Identify ALL target\n   objects, destination surfaces, and relation landmarks named by task_language.\n\n3. READ MEMORY for the observed `task_language` and scene. The library contains\n   operating wisdom, magic numbers, gotchas, and reusable manipulation patterns,\n   indexed by:\n     `/example/memory/libero/MEMORY.md`\n   Scan the index, then `read_text_file` the few leaf memories most relevant to\n   your cell. They are not all named `feedback_*`, and the index lines do not spell\n   out every scene a memory covers — so SEARCH the library yourself rather than\n   reading the index alone: `list_dir` `/example/memory/libero/global/` and\n   `/example/memory/libero/task-family/` to see every memory file, and pick candidates by the\n   objects, container, fixture or motion your scene involves (wording taken from\n   your task description works as a search key too). If a shell / grep tool is\n   available to you, `grep -rl \"\u003ckeyword>\" /example/memory/libero/global/\n   /example/memory/libero/task-family/` jumps straight to the files that mention your objects\n   — use it when you can; otherwise fall back to `list_dir` + `read_text_file`.\n   A given theme often has several near-identical skill files (e.g. multiple\n   stove / basket / mug patterns that differ only in WHICH objects or step\n   order). When it does, do NOT pick from the one-line index or stop at the first\n   name — `read_text_file` the top candidates and choose the one whose objects,\n   spatial relation and step order actually match YOUR scene, deciding from the\n   file body (not its index blurb). Entries are written as reusable patterns: take\n   the technique and the parameter ranges as general know-how, and re-derive every\n   coordinate by perception in YOUR scene.\n   ⭐ MANDATORY — do this even when a seed-0 recipe exists: the recipe gives the\n   commands, this memory gives the reasoning and failure-modes needed to adapt them,\n   so you must consult the memory too, not skip straight to replaying the recipe. In\n   your final `strategy_notes`, RECORD the exact memory file name(s) you read (or\n   state \"no matching task memory found\") so memory consultation is auditable.\n\n4. READ SEED-0 STRATEGY REFERENCES IF PRESENT, then solve from scratch.\n   Strategy references live under:\n   - `/example/memory/libero/task-specific/` (solved seed-0 audit + recipe pairs:\n     `\u003ctag>.json` + `\u003ctag>_recipe.jsonl`)\n   Use these for strategy_notes, prompt ladders, primitive ordering, gotchas, and\n   qualitative target zones. They were built on different scenes and sometimes\n   with older/oracle assumptions; do NOT copy coordinates and do NOT replay stale\n   command lists. Re-derive every coordinate from THIS scene.\n\n5. RUN THE MANDATORY PRE-TASK PERCEPTION PASS (FIRST-STEP ALGORITHM above) —\n   localize EVERYTHING first, THEN act. Before any pick/place build the\n   localization table: agentview hi-res for semantic identity, `back_project` for\n   median xyz, wrist geometry refinement for non-basket rows (only if spatially\n   consistent), wrist confirmation for basket/cavity. This perception pass is the\n   first stage of EVERY task, even ones that look simple — a wrong-target first\n   grab is unrecoverable in single-attempt mode, so the cheap insurance is to\n   identify all entities up front. Do the FINAL READY CHECK, then plan.\n\n6. EXECUTE one primitive at a time by calling its structured tool:\n   \n       move_to({\"xyz\": [x, y, z], \"gripper\": -1, ...})\n       pi0_pick({\"prompt\": \"...\", \"max_chunks\": 20, ...})\n       release({})\n   \n   Each primitive tool blocks until the next state record is dumped and returns\n   the new state view, log, and embedded images. Inspect `agentview_high.png` and\n   `wrist_high.png` as needed, call `back_project` for geometry, decide, and repeat.\n\n7. ALLOWED PRIMITIVES (physics-only; full schemas in the tool list/guides):\n   `move_to`, `pi0_pick`, `pi0_doubled`, `release`, `set_gripper`, `rotate_wrist`, `rotate_pitch`, `move_pose`.\n   ⛔ `reset` is FORBIDDEN here\n   (SINGLE-ATTEMPT MODE). FORBIDDEN: `exit`, `set_object_pose`, `articulate_to`,\n   `js_move_to`, `carry_object`.\n   \n   ⚠ INFRA NOTE: `pi0_doubled` IS implemented and callable in this runtime —\n   verified. It runs the Pi0 VLA on a CONTACT skill (drawer/door open-close, knob\n   turn) with success := `terminated` (no lift / no gripper-close\n   assumption — unlike `pi0_pick`). If ANY prior note or reference for this cell\n   concluded that `pi0_doubled` is \"unknown action\" / missing / that\n   drawer-or-door articulation is an unsolvable \"structural dead-end\" BECAUSE no\n   contact primitive existed — DISREGARD that specific conclusion and actually\n   USE `pi0_doubled` for the drawer/door step, alternating with short capped OSC\n   pushes/aligns as needed. Re-prove the cell from scratch; do not inherit the\n   dead-end verdict.\n   \n   SAM3 localization aid — `segment` (no robot motion): instead of eyeballing\n   a pixel, call `segment({\"prompt\":\"the black bowl on the cookies box\",\n   \"camera\":\"agentview\"})`. It runs SAM3 on the current image, back-projects the\n   mask via the matching world map, and returns a robust median `world_xyz` plus\n   logical `segment_artifact` and `overlay_artifact` names. Inspect the embedded\n   overlay image to confirm the right object. Use `camera\":\"wrist\"` (after parking the eef ~15–20 cm over the\n   target) for ±1–2 cm refinement, or `\"point\":[row,col]` for a point prompt.\n   Text `prompt` and `point` are mutually exclusive; provide exactly one.\n   ⚠ PROMPT PHRASING (SAM3 is sensitive): use a plain colour+shape+RELATION phrase,\n   NEVER the internal/brand name from `object_names`/BDDL. `\"the akita black bowl\"`\n   scores ~0.03 (SAM3 can't ground \"akita\") whereas `\"the black bowl on the stove\"`\n   scores ~0.76. Strip proper nouns (akita, glazed_rim_porcelain_…) — say what it\n   LOOKS LIKE + where it is. Always inspect the returned overlay image to confirm\n   the mask landed on the right object before moving.\n   This is a CONVENIENCE alternative to manual back-projection — if it returns\n   `{\"error\":..., \"fallback\":...}` (server down / low score / no detection), walk\n   the prompt (drop the brand word, add the relation) or just pick a pixel in the\n   high-resolution image and call `back_project` yourself. It does NOT replace the\n   two-camera relation protocol for disambiguating identical objects.\n\n8. RECOVERY (in-place ONLY — no reset): re-localize (objects may have moved),\n   re-pre-position + re-pi0_pick on the next prompt-ladder rung; split long\n   traversals into \u003c0.30 xy waypoints; for a door/drawer/knob use a SHORT capped\n   OSC push or `pi0_doubled`, never one long push — it NaNs MuJoCo. If the task is\n   unrecoverable within this one episode, do NOT reset — write an honest\n   stuck-audit (`terminated:false`) and call `finish`. Never warp.\n\n9. WHEN top-level `terminated == true` in the latest tool result:\n   a. Write audit `/example/runs/10_t0_s1/10_t0_s1.json` with:\n      suite, task_id, seed, regime:\"strict_perception\", strategy_notes (incl. how\n      you localized), pick_result, final_state (latest state's `state`),\n      terminated:true.\n   b. Call `finish`.\n   If your single attempt does not solve it, write `/example/runs/10_t0_s1/10_t0_s1.json` with\n   terminated:false + strategy_notes describing what you tried in this one\n   episode and where it stalled. Then call `finish`. (NO reset, NO second attempt.)","origin":"old","zh":"1.\n各读一次指南:\n- `robots/libero/guides/strict_hybrid_guide.md`\n- `robots/libero/guides/pro_hybrid_guide.md`\n- `robots/libero/guides/env_calibration.md`\n2.\n初步状态:呼叫`view_env_state({\"step\": 0})`; 检查`task_language`,object_names摆出姿势`agentview_high.png`,`wrist_high.png`如果有用,请打电话`view_camera_meta`如果需要的话。\n识别所有目标物体、目的地表面以及由下列单位命名的关联地标:task_language.\n3.\n读取所观测到的记忆`task_language`和现场。\n库中包含操作智慧,魔法数,Gotchas,以及可重复使用的操纵模式,由以下索引组成: .`/example/memory/libero/MEMORY.md`扫描索引吧`read_text_file`与你的细胞最相关的几根叶子记忆\n他们不都是名字`feedback_*`,索引行并不逐一列出一个记忆封面的每一个场景——所以SEARCH这个库自己而不是单独阅读索引:`list_dir``/example/memory/libero/global/`和`/example/memory/libero/task-family/`查看每个记忆文件,并用您所参与的物体、容器、固定或移动的场景来挑选候选人(从下列文字中取自:\n您的任务描述也起到搜索键的作用。\n如果一个贝壳/grep工具可供您使用,`grep -rl \"\u003ckeyword>\" /example/memory/libero/global/ /example/memory/libero/task-family/`跳转到提及对象的文件——在可以时使用;否则返回到`list_dir`+`read_text_file`.\n给定的主题往往有几种近似相同的技能文件(如多灶/篮子/杯状图案,只有Which对象或步令不同).\n当它发生时,不要从单行索引中选择,或者在第一行名称时停下来——`read_text_file`选择对象、空间关系和步骤顺序与您实际相匹配的,从文件正文中决定(而不是其索引模糊)。\n条目被写成可重复使用的图案:将技术和参数范围作为一般的诀窍,并重新通过你场景中的每个感知来定义每个坐标。 QQ MANDATORY—即使种子时也会这样做 。-0配方存在: 配方给出命令,此记忆给出适应这些命令所需的推理和失败模式,所以您必须咨询\n记忆也一样,不要直接跳过来重放食谱.\n在你的决赛中`strategy_notes`,记录您读取的精确记忆文件名(或声明“找不到匹配的任务记忆”),所以记忆咨询是可审计的.\n4.\n读取种子-0战略参考如果有的话,然后从头解决.\n战略参考资料载于:\n-`/example/memory/libero/task-specific/`(已解决种子)-0审计+食谱配对:`\u003ctag>.json`+`\u003ctag>_recipe.jsonl`用于strategy_notes,迅速的梯子,原始订购, 获得恰克,以及质量目标区。\n它们建立在不同的场景上,有时还带有旧的/甲骨文的假设;不复制坐标,不重放stale 命令列表.\n从这个场景中重新找出每个坐标\n5.\n运行任务前测试通道(第一步骤Algorighm以上)——首先将每件事都本地化,然后行动.\n在任何选择/位置建立本地化表之前: 语义特征的代理视图hi-res,`back_project`对于中位数xyz,手腕几何修饰,用于非篮子行(仅在空间一致的情况下),手腕确认为篮子/笼盖.\n这个感官传球是EveryY任务的第一阶段,甚至看起来很简单的——一个错误的目标第一抓拍在单试模式下是无法恢复的,所以廉价的保险就是识别前面的所有实体.\n做最后准备检查,然后计划。\n6.\nEXECUTE一个原始的一次,称其结构化的工具:\nmove_to({\"xyz\":[x,y,z],\"gripper\":-1, ...})pi0_pick({\"即时\":‘......,......max_chunks\":20,...}) 释( ⁇ ).\n每个原始工具块直到下一个状态记录被丢弃,并返回新的状态视图,日志和嵌入式图像.\n检查`agentview_high.png`和`wrist_high.png`视需要拨打电话`back_project`用于几何,决定和重复。\n7.\n允许优先(仅限物理学;工具列表/指南中的完整计划):`move_to`,`pi0_pick`,`pi0_doubled`,`release`,`set_gripper`,`rotate_wrist`,`rotate_pitch`,`move_pose`. ⛔`reset`是福布登在这里(Single-ATTEMPT MODE).\n福尔布登:`exit`,`set_object_pose`,`articulate_to`,`js_move_to`,`carry_object`.\n注:`pi0_doubled`IS在这一运行时间中已经实施和可调用——已核实。\n它运行Pi0VLA成功 =`terminated`(没有升降机/没有握手-关闭的假设——与`pi0_pick`).\n如果本单元有任何先前的注释或参考结论:`pi0_doubled`是\"未知的动作\" / 缺少 / 抽屉或门的表达是无法解决的 \"结构式死端\"因为没有任何接触原始存在—— 解析这个具体的结论和实际上的USE`pi0_doubled`抽屉/门阶,必要时与短封顶的OCS推/对齐。\n从头重新证明细胞;不要继承死板的判决.\nSAM3地方化援助——`segment`(没有机器人运动): 与其看一个像素,请打电话`segment({\"prompt\":\"the black bowl on the cookies box\", \"camera\":\"agentview\"})`.\n运行中SAM3在当前图像上,通过匹配的世界映射面罩并返回坚固的中位数`world_xyz`加逻辑`segment_artifact`和`overlay_artifact`名称。\n检查嵌入式覆盖图像以确认正确的对象.\n使用`camera\":\"wrist\"`(在停车后)15–20 cm+ 超过目标)1–2 cm完善,或`\"point\":[row,col]`为点提示。\n文本`prompt`和`point`相互排斥;提供准确的一。SAM3敏感度 : 使用纯色+形状+RELATION 短语,绝不使用内部/品牌名称`object_names`/BDDL. (中文(简体) ).\n`\"the akita black bowl\"`分数~0.03(SAM3无法打开\"Kikita\",而`\"the black bowl on the stove\"`分数~0.76.\n脱去适当的名词(Kita,glazed_rim_porcelain_...)——说它看起来像什么 +它在哪里。\n总是检查返回的覆盖图像,以确认面具在移动前降落在正确的物体上.\n这是一个Convenence替代手动反投射的选项——如果它返回`{\"error\":..., \"fallback\":...}`(server down / 低分数 /没有检测),走时速(丢掉品牌单词,添加关系)或者在高分辨率图像中只选择一个像素并呼叫`back_project`你自己来。\n它不取代两相机关系协议来混淆相同的对象.\n8.\nRECOVERY(仅在位置上——没有重置):重新定位(对象可能已经移动),重新预置+re-pi0_pick下个快速拉杆; 将长横线分割为\u003c0.30xy 路口;为一扇门/drawer/knob使用加盖 OSC 推力的SHORT 或`pi0_doubled`从来没有一个长时间的推力——是NaNs MujoCo.\n如果任务在这个剧集内无法恢复,请不要重置——写一个诚实的卡-审计(英语:`terminated:false`)和打电话`finish`.\nNever warp.\n9.\n当顶级时`terminated == true`在最新工具结果中:a。\n写入审计`/example/runs/10_t0_s1/10_t0_s1.json`与: 套间,task_id,种子,政权:\".strict_perception\",strategy_notes(包括你如何本地化),pick_result,final_state(最新状态)`state`),终止:真伪b.\nCall `finish`.\n如果你的单项尝试没有解决,请写`/example/runs/10_t0_s1/10_t0_s1.json`已终止的:虚假 +strategy_notes描述你在这集里尝试过什么 以及它停滞的地方\n那就打个电话`finish`(没有重置,没有第二次尝试。)"},{"en":"- Single-step xy within ±0.30 or OSC flips IK; split long traversals.\n- lift_thresh 0.05 (flat) / 0.08 (slippery tall bottles).\n- step_clip 0.025 (empty/box) / 0.015 (cans) / 0.012 (tall bottles).\n- Frame: state.robot0_eef_pos[2] ≈ 0.68 LIVING_ROOM / 1.17 KITCHEN / 0.26 object.\n- BOWL: eef_y = plate_y + 0.045. TALL BOTTLES: carry z=0.30, drop without descending.\n- Approach high-then-vertical; recover by re-pick, not hover.","origin":"old","zh":"- ±内单步Xy0.30或 OSC 翻转IK;分长径.\n-lift_thresh0.05(平面)/(平面)0.08(滑动的高瓶子).\n-step_clip0.025(空/框) / (中文(简体) ).0.015(罐头) /0.012(所有的瓶子) (Tall bottles).\n- 框架 :state.robot0_eef_pos[2] ≈0.68LIVING_ROOM/1.17基切恩岛/0.26对象。\n- 鲍尔:eef_y=plate_y+0.045.\n托盘瓶:携带z=0.30,下降而不下降。\n——接近高时垂直;通过重新选取恢复,而不是徘徊."},{"en":"- Brief reasoning before each tool call (1-2 sentences): observation → decision.\n- Don't re-read files already in this session.\n- Don't call `view_env_state` immediately after a primitive tool already\n  returned the new state.\n- Save the audit BEFORE calling `finish`.\n- Stop immediately after writing the audit and calling `finish`. Do not chat further.","origin":"old","zh":"- 在每个工具调用之前作简短的推理(1-2意见_决定。\n-不要重读已在此会话中的文件 。\n-别打电话`view_env_state`在原始工具返回新状态后,\n-在呼叫前保存审计`finish`.\n- 写审计和打电话后立即停止`finish`.\n别再聊了"},{"en":"Solve the current task in one episode without restarting. Follow a focused\nsequence grounded in current evidence, avoid broad exploration, and protect\neach achieved subgoal. Do not ask for clarification or defer a determined\naction. Complete any confirmation explicitly required by the environment.","origin":"evaluate","zh":"在一次 episode 内完成本任务，开始后不重启。根据当前证据执行有针对性的动作序列，避免大范围探索，保护每个已达成的子目标。不要询问澄清，也不要推迟已确定的下一步动作。完成环境明确要求的确认。"},{"en":"Control the robot through registered RPent tools. Identify the required change\nand the observable conditions for completion from the current instruction.\nWhen the next action is determined, call the tool in the current response.","origin":"workflow","zh":"通过已注册的 RPent 工具控制机器人。根据当前指令确定需要实现的变化，以及能观察到的完成条件。下一步动作已经确定时，在当前回复中直接调用工具。"},{"en":"Control LIBERO in perception-isolated mode. The authoritative instruction is the\ninitial state's `task_language`; object names contain no world coordinates.","origin":"robot","zh":"在感知隔离模式下控制 LIBERO。以初始状态中的 task_language 为准。对象名称不提供世界坐标。"},{"en":"Control the environment only through its registered Toolkit. Never drive the\nrobot through shell, Python, network clients or legacy command files. Use only\nobservations and references authorized for this run. Do not inspect task source,\nevaluator internals, hidden rewards, ground-truth object poses, raw expert\ntrajectories or unapproved historical geometry. Use measured robot state and\ncamera-derived geometry exposed by the registered tools.","origin":"workflow","zh":"只通过已注册的 Toolkit 控制环境。不得通过 shell、Python、网络客户端或旧版命令文件驱动机器人。仅使用本次运行获准访问的观测和参考资料。不得查看任务源码、评测器内部实现、隐藏奖励、物体真值位姿、原始专家轨迹或未经批准的历史几何信息。使用注册工具提供的机器人实测状态和基于相机得到的几何信息。"},{"en":"Briefly state the observation and next decision before a tool call. A primitive\nreturns the new state; inspect it before requesting another view.\n\nEach state record exposes `step`, top-level `task_language`,\n`terminated`, `truncated`, coord-free `state`, an `artifacts`\nlist of logical base names, and a `log`. Storage paths are internal; do not\nconstruct or parse them.\n\nCanonical observation keys include `agentview_policy.png`, `agentview.png`,\n`agentview_high.png`, `agentview_depth.npz`, `agentview_world.npz`,\n`agentview_world_high.npz`, `agentview_metadata.json`, `wrist.png`,\n`wrist_high.png`, `wrist_depth.npz`, `wrist_world.npz`,\n`wrist_world_high.npz`, and `wrist_metadata.json`.\n\nUse `view_env_state` to retrieve a record. It embeds the policy image and the\nbest available agentview and wrist images, preferring the matching `*_high.png`\nartifact. Use `view_camera_meta`, `back_project`, and `segment` to consume\nmetadata and world maps without opening artifacts directly. Step `0` is the\ninitial state; step `-1` selects the latest state.\nThe runner owns all servers. Call the structured tools even if the planner\nnamespaces them. Never read BDDL, import the benchmark or query environment\nposes. Never use teleport primitives or ground-truth object-lift oracles.","origin":"robot","zh":"在工具呼叫前简要陈述观察和下个决定.\n一个原始返回新状态;在请求另一个视图之前检查它.\n每一个州的记录都暴露`step`顶级`task_language`,`terminated`,`truncated`,无编码`state`,一个`artifacts`逻辑基名列表,以及 a`log`.\n存储路径是内部的;不构建或剖析它们.\nCanonical 观测键包括`agentview_policy.png`,`agentview.png`,`agentview_high.png`,`agentview_depth.npz`,`agentview_world.npz`,`agentview_world_high.npz`,`agentview_metadata.json`,`wrist.png`,`wrist_high.png`,`wrist_depth.npz`,`wrist_world.npz`,\n`wrist_world_high.npz`,以及`wrist_metadata.json`.\n使用`view_env_state`以获取记录。\n它嵌入了策略图像以及最佳可用的代理视图和手腕图像,更喜欢匹配`*_high.png`工艺品。\n使用`view_camera_meta`,`back_project`,以及`segment`在不直接打开文物的情况下消耗元数据和世界地图。\n步骤`0`是初始状态; 步骤`-1`选择最新状态。\n跑者拥有所有的服务器.\n调用结构化工具,即使计划员给它们取名 。\n从未读取 BDDL, 导入基准或查询环境 。\n永远不要使用远程传送原始的 或地面真实的物体提升甲骨文。"},{"en":"Take the goal from the current task instruction and the scene from fresh\nobservations. Use approved memory only when it fits both. When a semantic\nsummary and an action log are available (for example, JSON and JSONL), use\nthe summary to plan phases and the log to check which actions actually ran,\nin what order, and for how long.\n\nWhen current evidence supports a recipe, use its phase order, observable\ncompletion conditions, division of roles between arms or tools, choice of\npolicy or primitive, and final action. Account for known failure modes.\nTreat an experimental recipe as a hypothesis. Identify the actual objects,\ndestinations and relations in this attempt. Confirm which arm or tool can\nreach each target and remeasure relevant pixels, poses, surface heights,\nclearances and grasp, contact or release points. Use recorded chunk timing\nas a starting point only for a compatible controller and adjust to progress.","origin":"workflow","zh":"从当前指令确定目标，用最新观测确认场景，只在已授权记忆与两者吻合时采用它。如果同时有语义摘要和动作日志（例如 JSON 和 JSONL），用摘要规划阶段，用日志核对实际执行了哪些动作、先后顺序和持续时间。\n\n当前证据支持某份 recipe 时，可沿用其阶段顺序、可观察的完成条件、手臂或工具分工、策略或基础动作的选择，以及收尾动作，并考虑已知失败情形。将实验性 recipe 视作待验证的假设。在本轮现场辨认实际物体、目的地及其关系，确认哪只手臂或哪个工具能触及目标，重新测量相关像素、位姿、表面高度、间隙以及抓取、接触或释放点。只有控制器兼容时，才将历史 chunk 节奏作为起点，并按实际进展调整。"},{"en":"READ THE GUIDES once each:\n- `robots/libero/guides/strict_hybrid_guide.md`\n- `robots/libero/guides/pro_hybrid_guide.md`\n- `robots/libero/guides/env_calibration.md`\n\nINSPECT INITIAL STATE: call `view_env_state({\"step\": 0})`; inspect\n  `task_language`, object_names, eef pose, `agentview_high.png`,\n  `wrist_high.png` if useful, and call `view_camera_meta` if needed. Identify ALL target\nobjects, destination surfaces, and relation landmarks named by task_language.\n\nREAD MEMORY for the observed `task_language` and scene. The library contains\noperating wisdom, magic numbers, gotchas, and reusable manipulation patterns,\nindexed by:\n  `/example/memory/libero/MEMORY.md`\nScan the index, then `read_text_file` the few leaf memories most relevant to\nyour cell. They are not all named `feedback_*`, and the index lines do not spell\nout every scene a memory covers — so SEARCH the library yourself rather than\nreading the index alone: `list_dir` `/example/memory/libero/global/` and\n`/example/memory/libero/task-family/` to see every memory file, and pick candidates by the\nobjects, container, fixture or motion your scene involves (wording taken from\nyour task description works as a search key too). If a shell / grep tool is\navailable to you, `grep -rl \"\u003ckeyword>\" /example/memory/libero/global/\n/example/memory/libero/task-family/` jumps straight to the files that mention your objects\n— use it when you can; otherwise fall back to `list_dir` + `read_text_file`.\nA given theme often has several near-identical skill files (e.g. multiple\nstove / basket / mug patterns that differ only in WHICH objects or step\norder). When it does, do NOT pick from the one-line index or stop at the first\nname — `read_text_file` the top candidates and choose the one whose objects,\nspatial relation and step order actually match YOUR scene, deciding from the\nfile body (not its index blurb). Entries are written as reusable patterns: take\nthe technique and the parameter ranges as general know-how, and re-derive every\ncoordinate by perception in YOUR scene.\n⭐ MANDATORY — do this even when a seed-0 recipe exists: the recipe gives the\ncommands, this memory gives the reasoning and failure-modes needed to adapt them,\nso you must consult the memory too, not skip straight to replaying the recipe. In\nyour final `strategy_notes`, RECORD the exact memory file name(s) you read (or\nstate \"no matching task memory found\") so memory consultation is auditable.\n\nREAD SEED-0 STRATEGY REFERENCES IF PRESENT. Look for the matched\n`10_t0_s0.json` and `10_t0_s0_recipe.jsonl` pair.\nStrategy references live under:\n- `/example/memory/libero/task-specific/` (solved seed-0 audit + recipe pairs:\n  `\u003ctag>.json` + `\u003ctag>_recipe.jsonl`)\nUse these for strategy_notes, prompt ladders, primitive ordering, gotchas, and\nqualitative target zones. They were built on different scenes and sometimes\nwith older/oracle assumptions; do NOT copy coordinates and do NOT replay stale\ncommand lists. Re-derive every coordinate from THIS scene.","origin":"robot","zh":"各读一次指南:\n- `robots/libero/guides/strict_hybrid_guide.md`\n- `robots/libero/guides/pro_hybrid_guide.md`\n- `robots/libero/guides/env_calibration.md`\n初步状态:呼叫`view_env_state({\"step\": 0})`; 检查`task_language`,object_names摆出姿势`agentview_high.png`,`wrist_high.png`如果有用,请打电话`view_camera_meta`如果需要的话。\n识别所有目标物体、目的地表面以及由下列单位命名的关联地标:task_language.\n读取所观测到的记忆`task_language`和现场。\n库中包含操作智慧,魔法数,Gotchas,以及可重复使用的操纵模式,由以下索引组成: .`/example/memory/libero/MEMORY.md`扫描索引吧`read_text_file`与你的细胞最相关的几根叶子记忆\n他们不都是名字`feedback_*`,索引行并不逐一列出一个记忆封面的每一个场景——所以SEARCH这个库自己而不是单独阅读索引:`list_dir``/example/memory/libero/global/`和`/example/memory/libero/task-family/`查看每个记忆文件,并用您所参与的物体、容器、固定或移动的场景来挑选候选人(从下列文字中取自:\n您的任务描述也起到搜索键的作用。\n如果一个贝壳/grep工具可供您使用,`grep -rl \"\u003ckeyword>\" /example/memory/libero/global/ /example/memory/libero/task-family/`跳转到提及对象的文件——在可以时使用;否则返回到`list_dir`+`read_text_file`.\n给定的主题往往有几种近似相同的技能文件(如多灶/篮子/杯状图案,只有Which对象或步令不同).\n当它发生时,不要从单行索引中选择,或者在第一行名称时停下来——`read_text_file`选择对象、空间关系和步骤顺序与您实际相匹配的,从文件正文中决定(而不是其索引模糊)。\n条目被写成可重复使用的图案:将技术和参数范围作为一般的诀窍,并重新通过你场景中的每个感知来定义每个坐标。 QQ MANDATORY—即使种子时也会这样做 。-0配方存在: 配方给出命令,此记忆给出适应这些命令所需的推理和失败模式,所以您必须咨询\n记忆也一样,不要直接跳过来重放食谱.\n在你的决赛中`strategy_notes`,记录您读取的精确记忆文件名(或声明“找不到匹配的任务记忆”),所以记忆咨询是可审计的.\n读取种子-0战略参考(如果有的话)。\n寻找匹配的`10_t0_s0.json`和`10_t0_s0_recipe.jsonl`双胞胎\n战略参考资料载于:\n-`/example/memory/libero/task-specific/`(已解决种子)-0审计+食谱配对:`\u003ctag>.json`+`\u003ctag>_recipe.jsonl`用于strategy_notes,迅速的梯子,原始订购, 获得恰克,以及质量目标区。\n它们建立在不同的场景上,有时还带有旧的/甲骨文的假设;不复制坐标,不重放stale 命令列表.\n从这个场景中重新找出每个坐标"},{"en":"Before manipulating, locate the target, its reference object or destination,\nand the relation the instruction asks to change. Disambiguate look-alikes\nusing visible features and relative position. For metric targets, select\ninterior pixels on the intended surface in a current image and use the matching\nview, step and coordinate frame. When looking up geometry by image pixel,\npair observations from the same step and view. For direct indexing, use\naligned maps at the same resolution; otherwise use the documented pixel\nmapping. Discard non-finite or otherwise invalid samples.\nInspect the mask or projected point when\navailable. Reject background, rim or occluder samples and check another view\nwhen identity or depth is ambiguous. Re-localize after contact or motion that\ncould have displaced the target. For a robot-state task, compare measured\npose or gripper state before and after the command.","origin":"workflow","zh":"操作前定位目标、参照物或目的地，明确指令要求改变的关系。用可见特征和相对位置区分相似物。需要度量坐标时，在当前图像中选择目标表面内部的像素，核对视角、观测步和坐标系。按图像像素查询几何信息时，配对同一步、同视角的观测。直接使用像素下标时，两张图须对齐且分辨率相同；其他情况按工具说明映射像素。丢弃非有限值及其他无效采样。若有掩码或投影点，检查其是否落在目标上。排除背景、边缘或遮挡物上的采样，身份或深度有歧义时换视角确认。接触或运动可能使目标移位时重新定位。若任务针对机器人自身状态，比较指令前后的实测位姿或夹爪状态。"},{"en":"This is the core of perception-isolated mode. To find where an object is:\n\n1. Look at `agentview_high.png` (1024x1024 — PREFER THIS; fall back to\n  `agentview.png` only if the high-resolution artifact is absent) and find the target\n   object's pixel (row, col). (row = vertical/y from top, col = horizontal/x\n   from left.)\n2. Call `back_project` on that pixel:\n\n       back_project({\"row\": ROW, \"col\": COL, \"step\": NN})\n\n   It uses the high-resolution world map by default. Pass `\"resolution\":\"low\"`\n   only if the pixel came from a 256x256 image. The geometry (K⁻¹ back-projection\n   + extrinsic) is already done for you. Just use the returned `world_xyz`; do\n   NOT write back-projection math yourself unless debugging a tool failure. NEVER\n   mix hi-res pixels with low-res world maps or vice versa.\n\n   The returned value is the object's SURFACE point under that pixel. For a\n   grasp/place target use its x,y; for z use the object's resting height (sample a\n   pixel on the bare table next to it, or use table z ~0.9 kitchen / ~0.42\n   table-top).\n3. Sample a few pixels on the object and median the world xy — robust to a single\n   mis-picked pixel. (Tip: avoid pixels on the object's thin rim/edge or the gap\n   to the table — those index a background/edge depth and give a world point\n   metres away. Pick pixels firmly on the object's top surface.)\n\nALWAYS apply the manipulation offsets from memory to the PERCEIVED position\n(e.g. BOWL: eef_y = plate_y + 0.045). Verify visually in `agentview_high.png`\nafter moving.\n\nThis is the default perception algorithm for EVERY cell (from the 80-task\nlocalization sweep: `agentview_identity_wrist_geometry_except_basket`).\nAgentview chooses WHAT the target is; wrist refines WHERE that already-chosen\ncandidate is. Do NOT invert those roles.\n\nCORE RULE:\n  • Non-basket objects/surfaces: agentview hi-res is the semantic AUTHORITY.\n    The wrist is ONLY a geometry/depth refinement camera for the SAME agentview\n    candidate. NEVER let the wrist freely re-identify a non-basket target — in\n    failed probes the wrist locked onto a look-alike hundreds of pixels away\n    while agentview had the right one.\n  • Basket / basket_cavity: wrist MAY also confirm/refine, because a basket is a\n    geometric container and the close view finds the true interior center (not\n    the rim). Basket failures are rim/edge bias, not semantic confusion.\n\nALGORITHM (run this BEFORE manipulating):\n\n1. From the initial `task_language` + `agentview_high.png` +\n   object_names, infer the task-relevant TARGETS and DESTINATIONS (language only;\n   never BDDL/poses).\n\n2. GLOBAL SEMANTIC PASS (agentview hi-res): in `agentview_high.png` choose each\n   target/destination candidate by RGB, label/shape, and global spatial relation.\n   For duplicates (two bowls/plates/mugs) pick by RELATION (on stove, on cookie\n   box, left/right/front/back), not `_1/_2`. For sauce/can/box groceries use the\n   front/side label + package shape + colour + layout — top-down wrist label\n   reading is NOT trustworthy. Classify destination surfaces (plate vs stove\n   burner vs cabinet/drawer vs basket) semantically in RGB here.\n\n3. COARSE XYZ (agentview): pick 3-8 pixels firmly on the chosen candidate in\n  `agentview_high.png`, call `back_project` on the SAME pixels, take the median.\n   Avoid edges/holes/shadows/table-gaps. This median is the IDENTITY ANCHOR for\n   that entity.\n\n4. WRIST GEOMETRY REFINE (non-basket): `move_to` ~15-20cm above the agentview\n   anchor xy, then refine the SAME candidate's surface/center from the wrist:\n     - accept a wrist xy ONLY if it is within ~3-5cm of the agentview anchor;\n     - if the wrist xy jumps >5cm, REJECT it (it hit a look-alike/background) and\n       keep the agentview xyz, or nudge and re-observe;\n     - the wrist may NOT override the agentview semantic choice — it only sharpens\n       coordinates when geometry is consistent.\n\n5. BASKET SPECIAL CASE: for `basket`/cavity, agentview finds it globally, then the\n   wrist confirms/refines the true INTERIOR center (place objects at the open\n   interior, not the rim/outer wall). Re-localize the cavity if the basket moved.\n\n6. MANDATORY PRE-TASK PERCEPTION PASS — DO NOT START MANIPULATION UNTIL THIS\n   TABLE EXISTS in your reasoning. One row per task-relevant entity (every movable\n   target, every destination/support/fixture, every relation landmark), each with:\n     - name_or_role (e.g. target_1, basket_cavity, plate_surface, stove_region)\n     - agentview_evidence (why this is the right semantic candidate/relation)\n     - agentview_pixels_rc (3-8 hi-res pixels) + agentview_xyz (median back_project)\n     - wrist_refine: accepted | rejected | basket_confirmed (+ wrist_xyz if kept)\n     - final_xyz (what you will plan with)\n     - uncertainty (indistinguishable can, duplicate class, basket rim bias, …)\n   If an entity is too ambiguous to identify, SAY SO before acting — do not let\n   Pi0 or the wrist make a free semantic choice for you.\n\n7. FINAL READY CHECK before the first pick/place: every target+destination has a\n   final_xyz; non-basket wrist refinements are spatially consistent with\n   agentview; basket/cavity points are interior-centered; manipulation offsets are\n   planned from the perceived final_xyz. If this fails, keep perceiving — only\n   then start the manipulation plan. Re-verify with the newest image after every\n   command and update the table if anything moves.\n\n(xyz from agentview and wrist `back_project` are in the SAME world frame,\ndirectly comparable. Do NOT blindly average them — accept wrist coords only when\nconsistent with the agentview anchor, or for basket/cavity geometry.)\n\nSAM3 localization aid — `segment` (no robot motion): instead of eyeballing\na pixel, call `segment({\"prompt\":\"the black bowl on the cookies box\",\n\"camera\":\"agentview\"})`. It runs SAM3 on the current image, back-projects the\nmask via the matching world map, and returns a robust median `world_xyz` plus\nlogical `segment_artifact` and `overlay_artifact` names. Inspect the embedded\noverlay image to confirm the right object. Use `camera\":\"wrist\"` (after parking the eef ~15–20 cm over the\ntarget) for ±1–2 cm refinement, or `\"point\":[row,col]` for a point prompt.\nText `prompt` and `point` are mutually exclusive; provide exactly one.\n⚠ PROMPT PHRASING (SAM3 is sensitive): use a plain colour+shape+RELATION phrase,\nNEVER the internal/brand name from `object_names`/BDDL. `\"the akita black bowl\"`\nscores ~0.03 (SAM3 can't ground \"akita\") whereas `\"the black bowl on the stove\"`\nscores ~0.76. Strip proper nouns (akita, glazed_rim_porcelain_…) — say what it\nLOOKS LIKE + where it is. Always inspect the returned overlay image to confirm\nthe mask landed on the right object before moving.\nThis is a CONVENIENCE alternative to manual back-projection — if it returns\n`{\"error\":..., \"fallback\":...}` (server down / low score / no detection), walk\nthe prompt (drop the brand word, add the relation) or just pick a pixel in the\nhigh-resolution image and call `back_project` yourself. It does NOT replace the\ntwo-camera relation protocol for disambiguating identical objects.\n\nFor duplicate bowls, elevation about 0.03–0.06 m above the table distinguishes\na bowl sitting on a box. Compare back-projected world xy for lateral relations.\nClassify destination surfaces in RGB: plates have ceramic rims; stove burners\nhave metal coil/grate rings on a fixture. If clean placement does not terminate,\ncheck whether the object or surface was a look-alike before changing the motion.","origin":"robot","zh":"这是感知-孤立模式的核心.\n查找对象位置:\n1.\n看着`agentview_high.png`(1024ưμ㼯A1024- 喜欢这个; 倒回去`agentview.png`只有在高分辨率的文物不存在的情况下),并找到目标对象的像素(row, col). (row=从顶端垂直/y, col=从左侧水平/x.\n2.\n调用`back_project`在像素上显示 :\nback_project({'row':ROW,\"col\":COL,\"step\":NN}).\n它默认使用高清世界地图.\n过`\"resolution\":\"low\"`只有像素来自一个256ưμ㼯A256图像。\n几何学( K− 1 back- projection + externsic) 已经为您完成 。\n只要用回话`world_xyz`;除非调试一个工具失败,否则不要自己写回投影数学 。\n永远不要将Hi-res像素与低RES世界地图混合,反之亦然.\n返回的值是该像素下对象的SURFACE点.\n对于抓取/放置目标,使用其x,y;对于z,则使用物体的休息高度(在它的旁边的赤桌子上用一个像素,或者使用表z~).0.9厨房 /~0.42表格顶部).\n3.\n在物体和中位数世界 xy 上取样一些像素——强到一个单一的误选像素(Tip:避免在物体的细边/尖端或与表的间隙上的像素)——这些索引是背景/尖端深度,并给出一个世界点远处.\n在物体的顶部表面牢固地选择像素. )\n总是将记忆中的操纵抵消应用到PERCEIVED位置(例如.\n鲍尔:eef_y=plate_y+0.045).\n视窗校验`agentview_high.png`移动后。\n这是 EveryY 单元格的默认感知算法(来自80-任务本地化扫描 :`agentview_identity_wrist_geometry_except_basket`).\nAgentview 选择目标是什么; 手腕精炼 在哪里已经选择的候选人。\n不要颠倒那些角色。\nCORE RULE:\n·非篮子物体/表面:代理视图高音是语义上的AUTHORITY。\n手腕仅是用于SAME代理视图候选人的几何/深度改进相机.\n永远不要让手腕自由重新识别一个非篮子目标——在失败的探测中,手腕被锁在一个像素上,就像数百像素的消失,而代理view拥有正确的一个像素.\n• 篮子/basket_cavity:手腕May也确认/恢复,因为一个篮子是几何容器,而近视则找到真正的内部中心(而不是环形).\n篮子故障是边缘/边缘偏差,不是语义上的混淆.\nALGORITHM(运行前操纵):\n1.\n从开始`task_language`+`agentview_high.png`+object_names中,推断与任务相关的TARGETS和DESTINATIONS(仅使用语言;从未使用BDDL/poss).\n2.\n全球空间站(特工站):在`agentview_high.png`按 RGB 、 标签/ 形状以及全球空间关系选择每个目标/ 目的地候选 。\n重复(两碗)/plates/mugs由RELATION(在炉子上,在饼干盒上,左边)选择/right/front/back),没有`_1/_2`.\n酱汁/can/box杂物使用前/侧标签+包形+彩色+布局——自上而下腕标签读取不可信.\n将目的地表面分类(牌子对炉灶燃烧器对柜/德拉沃对篮子),在RGB这里进行精选.\n3.\nCOARSEXYZ (代理视图): 选择3-8在选中的候选人上牢固显示像素`agentview_high.png`,拨打`back_project`在同一像素上,取中位数。\nAvoid edges/holes/shadows/table-gaps.\n这个中位数是该实体的识别值。\n4.\n(非篮子)`move_to`~15-20cm在代理视图主播xy上方,然后从手腕上精炼出SAME候选人的表面/中心:\n- 接受一个手腕xy,只要它在~~3-5cm代理视图主播;\n-如果手腕Xy跳动>5cm,重击(击中外观/背面),并保持代理视图xyz,或晃动和重新观察;\n- 手腕可能不会超过代理视图语义选择——它只在几何学一致时会磨亮坐标.\n5.\n基本特别案:`basket`/cavity,代理视图在全球发现它,然后手腕确认/改进真实的INTIOR中心(将物体放置在开阔的内部,而不是环形/外墙).\n如果篮子移动,则重新定位腔.\n6.\n任务前测试方法——不要开始操纵,直到你推理时的这个表态。\n每个任务相关实体一行(每个可移动目标,每个目的地)/support/fixture,每个关系地标),每个标志有:\n-name_or_role(例如:target_1,basket_cavity,plate_surface,stove_region)\n-agentview_evidence(为什么这是正确的语义学候选人/关系).\n-agentview_pixels_rc(3-8his-res像素) +agentview_xyz(中间数)back_project)\n-wrist_refine: 接受 QQ拒绝 QQbasket_confirmed(+wrist_xyz如果保留)\n-final_xyz(你要计划什么)\n- 不确定性(不可忽略的可重复等级、篮子轮轴偏差,......)如果一个实体过于含糊不清,无法识别,在采取行动之前说SO——不要让Pi0或者手腕为你做一个自由语义的选择.\n7.\n在第一个选址前最后准备检查:每个目标+目的地有一个final_xyz;非篮子手腕精炼在空间上与代理视图一致;篮子/洞点以内置为中心;从所感知到的操纵抵消计划final_xyz.\n如果失败,就继续观察——然后开始操纵计划。\n重新验证每个命令后的最新图像,如果有任何动静, 则更新表格 。\n(来自代理视图和手腕的xyz)`back_project`处于完全相同的世界范围,可直接比较。\n不要盲目地平均它们——只有在与代理视图主锚一致时才接受手腕圈,或者对于篮子/笼盖几何. )\nSAM3地方化援助——`segment`(没有机器人运动): 与其看一个像素,请打电话`segment({\"prompt\":\"the black bowl on the cookies box\", \"camera\":\"agentview\"})`.\n运行中SAM3在当前图像上,通过匹配的世界映射面罩并返回坚固的中位数`world_xyz`加逻辑`segment_artifact`和`overlay_artifact`名称。\n检查嵌入式覆盖图像以确认正确的对象.\n使用`camera\":\"wrist\"`(在停车后)15–20 cm+ 超过目标)1–2 cm完善,或`\"point\":[row,col]`为点提示。\n文本`prompt`和`point`相互排斥;提供准确的一。SAM3敏感度 : 使用纯色+形状+RELATION 短语,绝不使用内部/品牌名称`object_names`/BDDL. (中文(简体) ).\n`\"the akita black bowl\"`分数~0.03(SAM3无法打开\"Kikita\",而`\"the black bowl on the stove\"`分数~0.76.\n脱去适当的名词(Kita,glazed_rim_porcelain_...)——说它看起来像什么 +它在哪里。\n总是检查返回的覆盖图像,以确认面具在移动前降落在正确的物体上.\n这是一个Convenence替代手动反投射的选项——如果它返回`{\"error\":..., \"fallback\":...}`(server down / 低分数 /没有检测),走时速(丢掉品牌单词,添加关系)或者在高分辨率图像中只选择一个像素并呼叫`back_project`你自己来。\n它不取代两相机关系协议来混淆相同的对象.\n对于重复的碗, 高约0.03–0.06 m上方的表格区分了坐在盒子上的碗。\n比较后期预测的世界 xy 的横向关系.\n在RGB中分类目的地表面:板块有陶瓷轮圈;炉灶燃烧器在固定器上有金属圈/栅圈环.\n如果清洁放置不终止,请在改变运动前检查物体或表面是否类似外观."},{"en":"Choose the first unmet phase condition and the physical change that would\nestablish it. Issue one registered action using the selected controller's\ninstruction and execution-length contract. Compare fresh before/after evidence:\nwhat moved, what is held or supported, which relations already hold, and what\nstill blocks the next phase? Advance only when its prerequisite is observed.\nIf an action makes progress but ends mid-phase, continue to the next observable\ndecision point. Preserve productive contact; near success, repair only the\nremaining blocker and keep completed subgoals intact.\n\nWhen a trained policy supports the current contact skill, prefer it for\ngrasping, re-grasping, insertion, hanging or sustained tool contact.\nUse a geometric primitive for a measured free-space move, staging, retreat,\nrelease or a small correction after confirming the starting state. Choose a\nprimitive only when you can name the intended change and how to verify it.\nPreserve productive policy history when switching would interrupt contact.\n\nApply only the checks relevant to the instruction:\n- Pick/place: a closed-looking gripper alone is insufficient. Before transport,\n  verify that the intended object follows the gripper or is visibly lifted;\n  check the vacated source where visible to corroborate the hold.\n  Release when supported at the required destination; verify separation and stability.\n- Button or brief contact: identify the physical control, make a guarded contact,\n  and check the intended change immediately.\n- Articulation or tool use: establish contact at the functional part and verify\n  the requested mechanism or material change before withdrawing.\n- Ordering or stacking: follow the specified order and protect completed relations\n  from subsequent paths. Order alone does not imply vertical stacking.\n- Orientation or hold: verify the requested pose while maintaining control;\n  keep holding when the task asks for a lift, shake or sustained hold.\n- Containment: verify that the object crosses the opening and is supported inside.\n  For placement on a surface, check support and the requested relation instead.","origin":"workflow","zh":"找到第一个未满足的阶段条件，明确哪种物理变化能使它成立。遵循所选控制器的指令和执行长度约定，调用一次注册动作。对照动作前后的新证据：什么发生了移动？什么仍被夹持或支撑？哪些关系已经成立？什么仍阻碍下一阶段？观察到前置条件成立后再推进。动作取得进展但停在阶段中途时，继续到下一个能观察并作出判断的位置。保持有效接触；接近成功时只修正剩余阻碍，保护已经完成的子目标。\n\n若已接入的策略具备当前任务所需的接触技能，抓取、重新抓取、插入、悬挂和持续的工具接触优先使用该策略。确认起始状态后，用几何 primitive 完成可度量的自由空间移动、准备位调整、撤退、释放或小幅修正。只有能说明要改变什么以及如何验证时，才调用 primitive。切换控制器会打断有效接触时，保持策略执行的连续性。\n\n只采用与当前指令相关的检查：\n- 抓放：不能只凭夹爪看起来闭合就搬运。先确认目标随夹爪移动或确实已被抬高；原位置可见时，检查是否已空出，作为持稳的佐证。在目的地获得支撑后释放，检查物体与夹爪分离且放置稳定。\n- 按钮或短接触：辨认实际控制件，受控接触一次并立即核验预期变化。\n- 铰接或工具操作：接触能起作用的部位，撤离前确认机构或材料发生了要求的变化。\n- 排序或堆叠：遵循指定顺序，避免后续路径破坏已经成立的关系。排序本身不意味着垂直堆叠。\n- 朝向或持握：保持控制并核验姿态；要求提起、摇动或持续持握时保持夹持。\n- 容纳：检查物体穿过开口并在内部得到支撑。若要求放在表面上，则检查支撑和指定的空间关系。"},{"en":"ALLOWED PRIMITIVES (physics-only; full schemas in the tool list/guides):\n`move_to`, `pi0_pick`, `pi0_doubled`, `release`, `set_gripper`, `rotate_wrist`, `rotate_pitch`, `move_pose`.\n\nEXECUTE one primitive at a time by calling its structured tool:\n\n    move_to({\"xyz\": [x, y, z], \"gripper\": -1, ...})\n    pi0_pick({\"prompt\": \"...\", \"max_chunks\": 20, ...})\n    release({})\n\nEach primitive tool blocks until the next state record is dumped and returns\nthe new state view, log, and embedded images. Inspect `agentview_high.png` and\n`wrist_high.png` as needed, call `back_project` for geometry, decide, and repeat.\n\nFor pick/place, use pi0_pick for the grasp, then script the carry and release.\nStart with max_chunks=20, lift_thresh=0.05, gripper_closed_thresh=0.06 unless\nthe matched task technique specifies otherwise. pi0_pick.success is an eef-lift\nand closure heuristic. Check robot0_gripper_qpos (roughly 0.01–0.05 gap when\nholding, ~0 when empty), wrist_high.png after lift and the vacated source.\nIf needed, back_project the target's surface to check the increase in z.\nFor a missed grasp, try “pick up the {object}”, verbatim task_language, then\na spatial qualifier, then re-position (lower z or offset xy by 5 cm) and retry.\nFor drawer/door articulation, knob turns and insertion, use pi0_doubled for\ncontact and alternate with short capped OSC pushes/alignment as needed.\npi0_doubled checks terminated, independently of gripper closure or lift;\ndisregard historical claims that this contact tool is unavailable.\n\nSeed-0 libero_10 techniques for matching tasks; re-localize this scene.\n\nCRITICAL MECHANICS (cost many wasted attempts before they were nailed):\n- **GRIPPER SIGN**: in `move_to` / `set_gripper`, `gripper:+1` = CLOSE/hold,\n  `gripper:-1` = OPEN. To CARRY a grasped object, hold `gripper:+1` the whole way\n  (carrying with `-1` silently OPENS and drops it — the #1 early bug). `set_gripper +1`\n  (steps 8-12) firms the grip after a pick; for a laterally-weak CAN use steps\u003c=5.\n- **`move_pose` defaults gripper to OPEN (-1) if you omit it** — always pass\n  `\"gripper\":1` in `move_pose` while holding an object.\n- **`move_pose` threads the OSC IK singularity that `move_to` walls at** — for\n  cabinet-front / microwave-cavity / deep reaches, when `move_to` stalls\n  (final_dist stays high, eef retreats), switch to `move_pose` (co-vary\n  xyz+pitch+yaw). It reaches several cm deeper.\n\nGRASPING:\n- **MUGS / BOWLS / CUPS grasp at the RIM, not the center**: SAM3/back-projection\n  give the object CENTER; closing the gripper there grabs air. Aim\n  `eef_y = object_y + 0.045` so Pi0 rim-hooks. (Mugs do NOT hang 4.5cm in -y like\n  bowls — you can wrist-segment the grasped object to measure the true held offset.)\n- Some objects grasp best with `pi0_pick` from the **DEFAULT HOME pose** (no\n  pre-position) — Pi0 has its own approach trajectory; pre-positioning can hurt.\n- **`pi0_pick` is reusable and repurposable**:\n  a HIGH `
