lift_thresh` (e.g. 999) + `gripper_closed_thresh:0` turns it into a\n  generic closed-loop CONTACT skill (used to turn the stove knob).\n- **`pi0_doubled`** = Pi0 closed-loop CONTACT skill (success :=\n  `terminated`). Use it for drawer/door open-close AND insertions; call it\n  repeatedly.\n\nDISAMBIGUATION / TARGETING:\n- **SWAP-PERTURBED scenes (suite `*_swap`)**: the seed-0 reference's COORDINATES\n  are STALE (swap re-randomizes object positions per seed), and some s0 swap\n  recipes contain a literal reset — that was the old multi-attempt era UNDOING A\n  WRONG-OBJECT FIRST GRAB. For swap cells the following restriction supersedes ordinary recipe transfer. Use the s0 ref ONLY for: WHAT the\n  targets are (task_language nouns), what they LOOK like, and which Pi0 prompt\n  finally worked — never for positions, never replay its command list.\n  IDENTIFY-then-GRASP: before ANY pick, identify the target SEMANTICALLY in the\n  global agentview, then use the wrist only for geometry. The wrist camera is a\n  near-vertical close-up: it is excellent for precise depth/xy refinement, but\n  weak at reading side labels or distinguishing similar grocery items\n  (ketchup/BBQ/tomato sauce, soup cans, cream cheese/butter). Do NOT let the\n  wrist freely re-identify a non-basket target; it often locks onto a look-alike.\n  Instead: choose the target from `agentview_high.png`, compute its agentview\n  xyz, move over that candidate, project/track that SAME candidate in wrist, and\n  refine only its surface/center coordinates. SAM3 scores ~0.02-0.06 on brand\n  nouns (\"alphabet soup\", \"tomato sauce\") — prompt by colour+shape (\"the short\n  red-label can\") or pick pixels manually in the agentview hi-res. Pi0's own\n  prompt grounding is ALSO unreliable on brand nouns (s0's first grab took a milk\n  carton instead), so pre-position the eef directly OVER the agentview-identified\n  + wrist-refined target before pi0_pick. A wrong first grab usually\n  tips/displaces the grabbed object AND the target zone — identification errors\n  are unrecoverable; spend commands on agentview ID, not on recovery.\n- **\"left\"/\"right\" in libero_10 is EGOCENTRIC (robot frame): +y = robot-LEFT =\n  image-RIGHT.** A geometrically-perfect placement of the WRONG target never fires\n  the predicate — when a clean placement won't terminate, SUSPECT WRONG-TARGET\n  before wrong-physics (this turned a \"physically impossible\" verdict into a solve).\n- Containers can be MOVABLE (e.g. a basket slides when bumped) — descend into the\n  interior CENTER from straight above, not against the rim; SAM3's centroid of a\n  frame-clipped/reflective container is rim-biased, so derive the true cavity\n  center from the woven-rim pixels.\n\nPER-TASK RECIPES THAT WORKED AT SEED 0 (adapt coords to your seed):\n- 2-items→basket (t0,t1,t7): place the BOX first into the EMPTY basket interior\n  (descend deep, release), then drop/`pi0_pick`-lift the CAN in beside it; a\n  rim-perched item can be seated with a closed-gripper downward push.\n- mugs→plates (t4) / mug→plate (t6): rim-grasp, +1-hold carry, descend until the\n  mug rests on the plate before release (high release → topples off).\n  ⚠ t4 grasp safeguards (the seed-0 \"win\" used 2 resets. 8/9 multiseed cells died to the SAME chain: Pi0 rogue-place →\n  tipped mug → unrecoverable cascade. Prevent it up front):\n    1. GRASP-ONLY pi0_pick: short prompt (\"grasp the yellow mug\" — NEVER the full\n       task_language) AND `max_chunks\u003c=8`. With 20-25 chunks Pi0 keeps driving its\n       trained pick-AND-PLACE and dumps the held mug at its own trained \"left\"\n       (+y) or at the workspace IK edge (|y|>0.27 walls z>=0.56 — unreachable\n       forever). Stop Pi0 at lift; if lift isn't reached within 8 chunks,\n       RE-ISSUE pi0_pick rather than raising max_chunks.\n    2. The instant lift is detected: `set_gripper +1` (steps 8-12) to lock the\n       grip, then YOU script the entire carry + place.\n    3. Measure the held-mug offset PER PICK by wrist-segmenting the HELD mug\n       (offsets differ pick-to-pick: dy=-0.055 on one grasp, -0.013 on the next —\n       measure each, never reuse). Place eef = plate_center − offset; descend to\n       z~0.46 until the mug RESTS on the plate (OSC stalls ~0.51), then release\n       and retreat STRAIGHT UP (step_clip 0.012).\n    4. ORDER/PATH: after placing mug #1, plan mug #2's pick pre-position AND\n       carry path so they NEVER pass over the placed mug (a graze re-tips it). A\n       tipped mug is UNRECOVERABLE (no side-grasp primitive; Pi0 won't engage\n       side-lying cylinders) — prevention is everything.\n    5. Plates MOVE per seed (y=±0.21 at s0, ±0.30 at s8). For this\n       plate-center estimate, measure the rim outline in the wrist view. Use\n       x_range/y_range MIDPOINTS as the center; an individual rim depth or the\n       median of the visible fragment gives an edge-biased placement target.\n- stove (t2): turn the knob with `pi0_pick \"turn on the stove\", lift_thresh:999,\n  gripper_closed_thresh:0`; then grasp the pan by its HANDLE, re-segment mid-carry\n  to converge on the burner.\n- moka→stove (t8): grasp body, carry LOW (~4cm lift) in tiny hops (step_clip\n  0.006-0.01), re-clamp `set_gripper +1` between hops; \"LEFT\" = +y pot.\n- bottle→bottom drawer + close (t3): the drawer In-region is SHALLOW\n  (y≈0.075-0.227) — place at the MOUTH (y≈0.13), NOT the deep recess; `pi0_pick`\n  the bottle from home pose, `rotate_pitch` it flat ALONG X (the wide footprint),\n  release at the mouth, ONE short +y push seats it AND closes the drawer.\n- mug→microwave + close (t9): the only UNSOLVED seed-0 cell — the round mug-in-hand\n  walls ~3cm short of the In() threshold (deep narrow cavity). Try every lever\n  (`pi0_doubled`, `move_pose`, push) and if it still walls, write an honest\n  `terminated:false` with the max eef-y reached.\n\n- Single-step xy within ±0.30 or OSC flips IK; split long traversals.\n- lift_thresh 0.05 (flat) / 0.08 (slippery tall bottles).\n- step_clip 0.025 (empty/box) / 0.015 (cans) / 0.012 (tall bottles).\n- Frame: state.robot0_eef_pos[2] ≈ 0.68 LIVING_ROOM / 1.17 KITCHEN / 0.26 object.\n- BOWL: eef_y = plate_y + 0.045. The LIBERO tall-bottle drop is an exception to the supported-release rule:\n  carry z=0.30, drop without descending.\n- Approach high-then-vertical; recover by re-pick, not hover.","origin":"robot","zh":"允许优先(仅限物理学;工具列表/指南中的完整计划):`move_to`,`pi0_pick`,`pi0_doubled`,`release`,`set_gripper`,`rotate_wrist`,`rotate_pitch`,`move_pose`.\nEXECUTE一个原始的一次,称其结构化的工具:\nmove_to({\"xyz\":[x,y,z],\"gripper\":-1, ...})pi0_pick({\"即时\":‘......,......max_chunks\":20,...}) 释( ⁇ ).\n每个原始工具块直到下一个状态记录被丢弃,并返回新的状态视图,日志和嵌入式图像.\n检查`agentview_high.png`和`wrist_high.png`视需要拨打电话`back_project`用于几何,决定和重复。\n选用/地点,使用pi0_pick然后写下载体并放出\n开始max_chunks=20,lift_thresh=0.05,gripper_closed_thresh=0.06除非匹配的任务技术另有规定。pi0_pick.success是一种升降和关闭的热力。\n检查robot0_gripper_qpos(略数)0.01–0.05持有时的空格,~0当是空的,wrist_high.png在升起和空出的来源之后。\n如果需要的话,back_project目标表面检查Z的增量。\n如果抓错,请尝试“拾起{对象}”,逐字记录task_language,然后是空间修饰符,然后重新定位(低于z或抵消xy5 cm)并重试.\n抽屉/门线显示,把手转动并插入、使用pi0_doubled根据需要,通过短封顶的OCS推/调整进行接触和交替。pi0_doubled已终止的检查, 独立于抓取器关闭或升起; 忽略了历史上关于无法使用这种联系工具的说法 。\n种子-0libero_10匹配任务的技巧; 重新定位此场景。\n临界元件(在被钉死前浪费了许多成本):\n-** 乔治·西贡**:`move_to`/`set_gripper`,`gripper:+1`= 关闭/持有,`gripper:-1`=打开。\n抓取到的物体,抓好`gripper:+1`整个过程(随身携带)`-1`悄悄地打开并放下它——The#1早期错误).\n`set_gripper +1`(步骤)8-12紧紧握住后,为横向微弱的可使用阶梯。5.\n- **`move_pose`默认抓取到 OPEN (S)-1)如果你省略了它**——总是通过`\"gripper\":1`输入`move_pose`在持有对象时。\n- **`move_pose`线程 OCSIK单数,`move_to`墙壁**——用于柜前/微波洞/深处,何时`move_to`摊位( E)final_dist保持高度,eef撤退),切换到`move_pose`(co-vary xyz+pitch+yaw). 维基共享资源中相关的原始文献: 维基语录链接:名人名言 - 文学作品 - 谚语 - 电影对白 - 主题 - 分类\n它的深度达几厘米。\nGRASPING:\n-** MUGS / BOWLS / CUPS 抓住RIM,而不是中央**:SAM3/后投射给物体CENTER;关闭那里抓取空气的抓取器.\n目标`eef_y = object_y + 0.045`这么说Pi0枪声响起4.5cm在-y 和碗一样,你可以手腕分割被抓住的物体来测量真实被持有的偏移.).\n-一些物体最能抓住`pi0_pick`从**Default家姿**(没有预设位置) -Pi0拥有自己的接近轨迹;预置位置会受伤.\n- **`pi0_pick`可重用和可重用**:高`lift_thresh`(例如:999) +`gripper_closed_thresh:0`将其变成通用的闭锁式CONTACT技能(用于转动炉子把手).\n- **`pi0_doubled`** =Pi0闭路交流技巧(成功:=`terminated`).\n用于抽屉/门开闭和插入;多次调用.\n失踪/目标:\n-** SWAP - 体验的场景(套间)`*_swap`**:种子-0参考文献的COORDINATES是STALE(每个种子重命名对象位置),一些S0互换食谱包含一个字面重置——即旧的多尝试时代UNDOING A WORONG-OBJECT FIRST GRAB.\n对于互换单元格,以下限制取代普通的食谱传输。\n使用 s 键0目标是什么:task_language名词,他们长什么样,什么样?Pi0elect终于起作用了——从不为位置,从不重放其命令列表.\n在任何选择之前,在全球代理视图中确定目标,然后只用手腕进行几何。\n手腕相机是近垂直的特写:它对于精确的深度/xy精细化来说是极好的,但在读取侧面标签或区分类似杂货品(ketchup)时却很弱./BBQ/tomato酱汁,汤罐,奶油奶酪/奶油.\n不要让手腕自由重新识别一个非篮子目标;它经常锁在外观上。\n取而代之:从`agentview_high.png`,计算它的代理view xyz,移动到该候选人之上,在手腕中投射/跟踪该SAME候选人,并只精炼其表面/中心坐标。\nSAM3分数~0.02-0.06在品牌名词上(\"alphabet sound\",\"tomato s酱\")——通过颜色+形状(\"红色标签的短片\")提示,或手动在代理视图hi-res中选择像素.\nPi0品牌名词本身的即时定位也是不可靠的(s)0第一次抓取的是一盒牛奶所以先把eef直接定位在 代理视图识别的 + 手腕精炼的目标上pi0_pick.\n错误的第一次抓取通常会提示/丢弃被抓取的对象和目标区——识别错误是无法恢复的;在代理视图ID上花费命令,而不是用于恢复.\n-**\"左\"/\"右\"在libero_10EGOCENTRIC(机器人框架):+y = 机器人-LEFT = 图像-RIGHT.**对错误目标进行几何精确的放置从不发射上游——当一个干净的放置不会终止时,SUSPECT WORG-TARGET在错误的物理学前(这把一个\"物理上不可能\"的判决变成了一个解决方案).\n- 集装箱可以移动(例如,在撞到时用篮子滑动)——从直上而下地进入内部中央中心,而不是对着环形;SAM3'一个帧-剪合/反射容器的中间体具有环形偏差,因此从编织的环形像素中衍生出真正的腔中心.\n在Seed工作过的Per-TASK回收器0(适应圈子的种子):\n-2- 包件(吨)0,t (帮助)1,t (帮助)7:先将BOX放入EMPTY篮子内部(descend deep, release),然后滴/`pi0_pick`-把罐子抬进去,用压紧的向下推就能坐好\n- 杯子-牌子(t)4(t) /杯子-牌子(t)6: Rim-grasp,(英语:Rim-grasp,+1- 手持,下到杯子在释放前放在盘子上(高释放)-顶部脱落。4抓住保障(种子)-0\"赢\"用2复发.8/9多种子细胞死亡到 SAME 链 :Pi0无赖的地方 泄露的杯子 无法回收的级联\n防止在前面:\n1.\n巨猿龙pi0_pick: 短促 (\"擦黄杯子\")— 从来没有满task_language和`max_chunks\u003c=8`.\n与20-25块Pi0继续驾驶训练有素的选手AND-PLACE,并将被扣的杯子丢在自己的训练有素的\"左\"(+y)或工作空间.IK边线(XQY)0.27墙############################################################################################################################################################################################0.56——永远无法到达).\n停下来Pi0升降机;如果升降机没有在内部到达8块,RE-ISSUEpi0_pick而不是抚养max_chunks.\n2.\n检测到瞬间升降:`set_gripper +1`(步骤)8-12)锁上握手,然后你写整个承载+位置.\n3.\n以手腕隔开HELD杯来测量PER PICK的持有-mug抵消(不同抽取:dy=)-0.055在一个拐杖上,-0.013在下一个目标上——测量每个目标,永远不要重复使用。\n地点 eef =plate_center− 乘;降为z~0.46直到盘子里的杯子 RESTS(OSC摊位~0.51),然后释放并撤退STRAIGHT UP(英语:step_clip0.012).\n4.\n命令/PATH:在放置杯子后#1# 计划杯#2选择预置位置并携带路径这样他们就永远不要通过所放置的杯子(一种涂料重新贴上它).\n悬浮的杯子是无覆盖的(没有侧纹原始的;Pi0- 预防就是一切。\n5.\n标牌移动每个种子(y ⁇ )0.21编号0, ±0.30编号8).\n对于这个板心估计,测量腕视图中的轮廓轮廓.\n使用x_range/y_rangeMIDPOINTS作为中心;可见碎片的单个环深或中位数给出了边缘偏差的放置目标.\n- 炉子(吨)2: 转动把手`pi0_pick \"turn on the stove\", lift_thresh:999, gripper_closed_thresh:0`然后用手抓住锅, 将中间的容器重新组合到燃烧器上。\n- 摩卡岛(t)8:抓住身体,携带LOW(~4cm电梯),在微小的跳动(step_clip\n0.006-0.01),重新惊痫`set_gripper +1`hops之间;\"LEFT\"=+y pot.\n- 瓶子-底抽屉+近处(吨)3:抽屉内是SHALLOW(y ⁇ ).0.075-0.227)——位于月球座(y ⁇ .0.13(b)不进行深沉休庭;`pi0_pick`瓶子从家姿,`rotate_pitch`它把X(宽脚印)平了,放入嘴边,一个短的+y推座,然后关闭抽屉。\n- 微波+接近(吨)9:唯一的灭种种子.-0单元格——圆形手边墙壁3cm短于 In() 阈值( 深窄的腔) 。\n尝试每个杠杆( E)`pi0_doubled`,`move_pose`继续推),如果它仍然墙壁,写一个诚实的`terminated:false`和达到的最大ef -y。\n- ±内单步Xy0.30或 OSC 翻转IK;分长径.\n-lift_thresh0.05(平面)/(平面)0.08(滑动的高瓶子).\n-step_clip0.025(空/框) / (中文(简体) ).0.015(罐头) /0.012(所有的瓶子) (Tall bottles).\n- 框架 :state.robot0_eef_pos[2] ≈0.68LIVING_ROOM/1.17基切恩岛/0.26对象。\n- 鲍尔:eef_y=plate_y+0.045.\n那个...LIBERO高瓶滴是支持释放规则的一个例外: carry z=0.30,下降而不下降。\n——接近高时垂直;通过重新选取恢复,而不是徘徊."},{"en":"At a stalled phase, compare the last command with the measured result.\nIf the observation is stale or occluded, inspect again before moving. If the\ntarget moved, re-localize it. If the grasp slipped, re-establish the hold\nbefore transport. If a planned move stopped short, measure the residual and\ncheck clearance before choosing another waypoint. Preserve correct relations.\nChange one variable at a time and name the observation that would show the\nchange worked. Continue a productive but incomplete motion only while the\nnext segment is safe and useful.\n\nEstimate the remaining cost from executed steps and observed progress. Allow\nfor all unfinished phases, release or withdrawal if required, verification and\nreporting. If a required phase no longer fits, follow the mode's retry or exit\nrule. On a stop condition, stop motion and record the last observed state.","origin":"workflow","zh":"阶段停滞时，对照上一次指令和实测结果。观测过时或被遮挡，先重新观察再移动；目标移位，重新定位；持握打滑，先恢复持握再搬运；规划运动提前停下，测量剩余偏差并检查余量，再选新的途经点。保护已经成立的关系。一次只改一个因素，并说明什么观测能证明调整有效。动作有效但阶段尚未完成时，只有下一段安全且有用才继续。\n\n根据已执行步数和实际进展估算剩余成本，计入未完成的阶段、必要的释放或撤离、核验和报告。若预算已不足以完成必要阶段，按当前模式的重试或退出规则处理。触发停止条件时停止运动，记录最后观测到的状态。"},{"en":"After the attempt starts, recover within it. If it ends unsolved, report that result without starting another evaluation attempt.","origin":"evaluate","zh":"尝试开始后，在本次尝试内恢复。如果本次尝试结束时仍未解出任务，如实报告结果，不再启动另一次评测尝试。"},{"en":"SINGLE-ATTEMPT MODE. Recover in-place ONLY — no reset: re-localize (objects may have moved),\nre-pre-position + re-pi0_pick on the next prompt-ladder rung; split long\ntraversals into \u003c0.30 xy waypoints; for a door/drawer/knob use a SHORT capped\nOSC push or `pi0_doubled`, never one long push — it NaNs MuJoCo. If the task is\nunrecoverable within this one episode, do NOT reset — write an honest\nstuck-audit (`terminated:false`) and call `finish`. Never warp.","origin":"robot","zh":"SINGLE-ATTEMPT MODE.\n仅在原地恢复——无重置:重新定位(对象可能已经移动),重新预置+re-pi0_pick下个快速拉杆; 将长横线分割为\u003c0.30xy 路口;为一扇门/drawer/knob使用加盖 OSC 推力的SHORT 或`pi0_doubled`从来没有一个长时间的推力——是NaNs MujoCo.\n如果任务在这个剧集内无法恢复,请不要重置——写一个诚实的卡-审计(英语:`terminated:false`)和打电话`finish`.\nNever warp."},{"en":"At close-out, compare the latest state with each requirement in the full\ninstruction: correct target, requested relation or mechanism change, and any\nrequired release, hold or final posture. Check the environment's designated\nsuccess signal or verdict when one is required. A completed tool call or\npolicy segment is not that verdict. Stop issuing motion on confirmed success\nor terminal exhaustion.\n\nReport the outcome with its supporting observation or verdict. For an\nunsolved attempt, identify the first unmet condition, the last action and its\nobserved effect, and why the attempt ended. For a pending or unavailable\nverdict, report that status without claiming success. Save the required\nartifacts and follow the environment's finish protocol.","origin":"workflow","zh":"收尾时用最新状态逐项核验完整指令：目标是否正确，指定关系或机构变化是否成立，是否满足要求的释放、持握或最终姿态。环境要求成功信号或判定时，检查该信号或判定。工具调用或策略片段结束并不等于任务成功。确认成功或预算耗尽并达到终止条件时，停止发出运动指令。\n\n报告结果并附上支持它的观测或判定。若未解出，指出首个未满足的条件、最后一次动作及其实际效果，以及尝试结束的原因。判定待定或不可获取时，如实报告该状态，不宣称成功。保存要求的产物，遵循本环境的 finish 流程。"},{"en":"WHEN top-level `terminated == true` in the latest tool result:\na. Write audit `/example/runs/10_t0_s1/10_t0_s1.json` with:\n   suite, task_id, seed, regime:\"strict_perception\", strategy_notes (incl. how\n   you localized), pick_result, final_state (latest state's `state`),\n   terminated:true.\nb. Call `finish`.\nIf your single attempt does not solve it, write `/example/runs/10_t0_s1/10_t0_s1.json` with\nterminated:false + strategy_notes describing what you tried in this one\nepisode and where it stalled. Then call `finish`. (NO reset, NO second attempt.)\n\n- Read each guide or memory file once this session.\n- Save the audit BEFORE calling `finish`.\n- Stop immediately after writing the audit and calling `finish`. Do not chat further.","origin":"robot","zh":"当顶级时`terminated == true`在最新工具结果中:a。\n写入审计`/example/runs/10_t0_s1/10_t0_s1.json`与: 套间,task_id,种子,政权:\".strict_perception\",strategy_notes(包括你如何本地化),pick_result,final_state(最新状态)`state`),终止:真伪b.\nCall `finish`.\n如果你的单项尝试没有解决,请写`/example/runs/10_t0_s1/10_t0_s1.json`已终止的:虚假 +strategy_notes描述你在这集里尝试过什么 以及它停滞的地方\n那就打个电话`finish`(没有重置,没有第二次尝试。)\n-在本会话中读取每个向导或记忆文件一次 。\n-在呼叫前保存审计`finish`.\n- 写审计和打电话后立即停止`finish`.\n别再聊了"},{"en":"- suite:      libero_10\n- task:       0\n- seed:       1\n- output_dir: /example/runs/10_t0_s1\n- audit:      /example/runs/10_t0_s1/10_t0_s1.json\n- recipe:     /example/runs/10_t0_s1/10_t0_s1_recipe.jsonl","origin":"old","zh":"- suite: libero_10\n- task: 0\n- seed: 1\n- output_dir: /example/runs/10_t0_s1\n- audit: /example/runs/10_t0_s1/10_t0_s1.json\n- recipe: /example/runs/10_t0_s1/10_t0_s1_recipe.jsonl"},{"en":"Inspect `agentview_high.png` returned by `view_env_state`, then use\n`back_project` or `segment` to localize objects before motion.","origin":"old","zh":"检查`agentview_high.png`返回日期为`view_env_state`,然后使用`back_project`或`segment`在运动前将对象定位。"},{"en":"Read the guides, then call `view_env_state({\"step\": 0})` and inspect\n`task_language` and `agentview_high.png`. Read matching memory and available\nseed-0 references for the current task and scene, then localize, plan, and execute.","origin":"old","zh":"阅读指南,然后呼叫`view_env_state({\"step\": 0})`检查`task_language`和`agentview_high.png`.\n读取匹配的记忆和可用的种子-0引用当前任务和场景,然后本地化、规划和执行。"},{"en":"- suite:      libero_10\n- task:       0\n- seed:       1\n- output_dir: /example/runs/10_t0_s1\n- audit:      /example/runs/10_t0_s1/10_t0_s1.json\n- recipe:     /example/runs/10_t0_s1/10_t0_s1_recipe.jsonl","origin":"robot","zh":"- suite: libero_10\n- task: 0\n- seed: 1\n- output_dir: /example/runs/10_t0_s1\n- audit: /example/runs/10_t0_s1/10_t0_s1.json\n- recipe: /example/runs/10_t0_s1/10_t0_s1_recipe.jsonl"},{"en":"Read the guides, then call `view_env_state({\"step\": 0})` and inspect\n`task_language` and `agentview_high.png`. Read matching memory and available\nseed-0 references for the current task and scene, then localize, plan, and execute.\nInspect `agentview_high.png` returned by `view_env_state`, then use\n`back_project` or `segment` to localize objects before motion.","origin":"robot","zh":"先读指南，调用 view_env_state({\"step\": 0})，检查 task_language 和 agentview_high.png。读取与当前任务和场景相符的记忆以及可用的 seed-0 参考，再定位、规划并执行。运动前，检查 view_env_state 返回的 agentview_high.png，用 back_project 或 segment 定位对象。"},{"en":"1. READ THE GUIDES once each:\n   - `robots/libero/guides/strict_hybrid_guide.md`\n   - `robots/libero/guides/pro_hybrid_guide.md`\n   - `robots/libero/guides/env_calibration.md`\n\n2. INSPECT INITIAL STATE: call `view_env_state({\"step\": 0})`; inspect\n     `task_language`, object_names, eef pose, `agentview_high.png`,\n     `wrist_high.png` if useful, and call `view_camera_meta` if needed. Identify ALL target\n   objects, destination surfaces, and relation landmarks named by task_language.\n\n3. READ MEMORY for the observed `task_language` and scene. The library contains\n   operating wisdom, magic numbers, gotchas, and reusable manipulation patterns,\n   indexed by:\n     `/example/memory/libero/MEMORY.md`\n   Scan the index, then `read_text_file` the few leaf memories most relevant to\n   your cell. They are not all named `feedback_*`, and the index lines do not spell\n   out every scene a memory covers — so SEARCH the library yourself rather than\n   reading the index alone: `list_dir` `/example/memory/libero/global/` and\n   `/example/memory/libero/task-family/` to see every memory file, and pick candidates by the\n   objects, container, fixture or motion your scene involves (wording taken from\n   your task description works as a search key too). If a shell / grep tool is\n   available to you, `grep -rl \"\u003ckeyword>\" /example/memory/libero/global/\n   /example/memory/libero/task-family/` jumps straight to the files that mention your objects\n   — use it when you can; otherwise fall back to `list_dir` + `read_text_file`.\n   A given theme often has several near-identical skill files (e.g. multiple\n   stove / basket / mug patterns that differ only in WHICH objects or step\n   order). When it does, do NOT pick from the one-line index or stop at the first\n   name — `read_text_file` the top candidates and choose the one whose objects,\n   spatial relation and step order actually match YOUR scene, deciding from the\n   file body (not its index blurb). Entries are written as reusable patterns: take\n   the technique and the parameter ranges as general know-how, and re-derive every\n   coordinate by perception in YOUR scene.\n   ⭐ MANDATORY — do this even when a seed-0 recipe exists: the recipe gives the\n   commands, this memory gives the reasoning and failure-modes needed to adapt them,\n   so you must consult the memory too, not skip straight to replaying the recipe. In\n   your final `strategy_notes`, RECORD the exact memory file name(s) you read (or\n   state \"no matching task memory found\") so memory consultation is auditable.\n\n4. READ SEED-0 STRATEGY REFERENCES IF PRESENT, then solve from scratch.\n   Strategy references live under:\n   - `/example/memory/libero/task-specific/` (solved seed-0 audit + recipe pairs:\n     `\u003ctag>.json` + `\u003ctag>_recipe.jsonl`)\n   Use these for strategy_notes, prompt ladders, primitive ordering, gotchas, and\n   qualitative target zones. They were built on different scenes and sometimes\n   with older/oracle assumptions; do NOT copy coordinates and do NOT replay stale\n   command lists. Re-derive every coordinate from THIS scene.\n\n5. RUN THE MANDATORY PRE-TASK PERCEPTION PASS (FIRST-STEP ALGORITHM above) —\n   localize EVERYTHING first, THEN act. Before any pick/place build the\n   localization table: agentview hi-res for semantic identity, `back_project` for\n   median xyz, wrist geometry refinement for non-basket rows (only if spatially\n   consistent), wrist confirmation for basket/cavity. This perception pass is the\n   first stage of EVERY task, even ones that look simple — a wrong-target first\n   grab is unrecoverable in single-attempt mode, so the cheap insurance is to\n   identify all entities up front. Do the FINAL READY CHECK, then plan.\n\n6. EXECUTE one primitive at a time by calling its structured tool:\n   \n       move_to({\"xyz\": [x, y, z], \"gripper\": -1, ...})\n       pi0_pick({\"prompt\": \"...\", \"max_chunks\": 20, ...})\n       release({})\n   \n   Each primitive tool blocks until the next state record is dumped and returns\n   the new state view, log, and embedded images. Inspect `agentview_high.png` and\n   `wrist_high.png` as needed, call `back_project` for geometry, decide, and repeat.\n\n7. ALLOWED PRIMITIVES (physics-only; full schemas in the tool list/guides):\n   `move_to`, `pi0_pick`, `pi0_doubled`, `release`, `set_gripper`, `rotate_wrist`, `rotate_pitch`, `move_pose`, `execute_action`.\n   ⛔ `reset` is FORBIDDEN here\n   (SINGLE-ATTEMPT MODE). FORBIDDEN: `exit`, `set_object_pose`, `articulate_to`,\n   `js_move_to`, `carry_object`.\n   \n   ⚠ INFRA NOTE: `pi0_doubled` IS implemented and callable in this runtime —\n   verified. It runs the Pi0 VLA on a CONTACT skill (drawer/door open-close, knob\n   turn) with success := `terminated` (no lift / no gripper-close\n   assumption — unlike `pi0_pick`). If ANY prior note or reference for this cell\n   concluded that `pi0_doubled` is \"unknown action\" / missing / that\n   drawer-or-door articulation is an unsolvable \"structural dead-end\" BECAUSE no\n   contact primitive existed — DISREGARD that specific conclusion and actually\n   USE `pi0_doubled` for the drawer/door step, alternating with short capped OSC\n   pushes/aligns as needed. Re-prove the cell from scratch; do not inherit the\n   dead-end verdict.\n   \n   SAM3 localization aid — `segment` (no robot motion): instead of eyeballing\n   a pixel, call `segment({\"prompt\":\"the black bowl on the cookies box\",\n   \"camera\":\"agentview\"})`. It runs SAM3 on the current image, back-projects the\n   mask via the matching world map, and returns a robust median `world_xyz` plus\n   logical `segment_artifact` and `overlay_artifact` names. Inspect the embedded\n   overlay image to confirm the right object. Use `camera\":\"wrist\"` (after parking the eef ~15–20 cm over the\n   target) for ±1–2 cm refinement, or `\"point\":[row,col]` for a point prompt.\n   Text `prompt` and `point` are mutually exclusive; provide exactly one.\n   ⚠ PROMPT PHRASING (SAM3 is sensitive): use a plain colour+shape+RELATION phrase,\n   NEVER the internal/brand name from `object_names`/BDDL. `\"the akita black bowl\"`\n   scores ~0.03 (SAM3 can't ground \"akita\") whereas `\"the black bowl on the stove\"`\n   scores ~0.76. Strip proper nouns (akita, glazed_rim_porcelain_…) — say what it\n   LOOKS LIKE + where it is. Always inspect the returned overlay image to confirm\n   the mask landed on the right object before moving.\n   This is a CONVENIENCE alternative to manual back-projection — if it returns\n   `{\"error\":..., \"fallback\":...}` (server down / low score / no detection), walk\n   the prompt (drop the brand word, add the relation) or just pick a pixel in the\n   high-resolution image and call `back_project` yourself. It does NOT replace the\n   two-camera relation protocol for disambiguating identical objects.\n\n8. RECOVERY (in-place ONLY — no reset): re-localize (objects may have moved),\n   re-pre-position + re-pi0_pick on the next prompt-ladder rung; split long\n   traversals into \u003c0.30 xy waypoints; for a door/drawer/knob use a SHORT capped\n   OSC push or `pi0_doubled`, never one long push — it NaNs MuJoCo. If the task is\n   unrecoverable within this one episode, do NOT reset — write an honest\n   stuck-audit (`terminated:false`) and call `finish`. Never warp.\n\n9. WHEN top-level `terminated == true` in the latest tool result:\n   a. Write audit `/example/runs/10_t0_s1/10_t0_s1.json` with:\n      suite, task_id, seed, regime:\"strict_perception\", strategy_notes (incl. how\n      you localized), pick_result, final_state (latest state's `state`),\n      terminated:true.\n   b. Call `finish`.\n   If your single attempt does not solve it, write `/example/runs/10_t0_s1/10_t0_s1.json` with\n   terminated:false + strategy_notes describing what you tried in this one\n   episode and where it stalled. Then call `finish`. (NO reset, NO second attempt.)","origin":"old","zh":"1.\n各读一次指南:\n- `robots/libero/guides/strict_hybrid_guide.md`\n- `robots/libero/guides/pro_hybrid_guide.md`\n- `robots/libero/guides/env_calibration.md`\n2.\n初步状态:呼叫`view_env_state({\"step\": 0})`; 检查`task_language`,object_names摆出姿势`agentview_high.png`,`wrist_high.png`如果有用,请打电话`view_camera_meta`如果需要的话。\n识别所有目标物体、目的地表面以及由下列单位命名的关联地标:task_language.\n3.\n读取所观测到的记忆`task_language`和现场。\n库中包含操作智慧,魔法数,Gotchas,以及可重复使用的操纵模式,由以下索引组成: .`/example/memory/libero/MEMORY.md`扫描索引吧`read_text_file`与你的细胞最相关的几根叶子记忆\n他们不都是名字`feedback_*`,索引行并不逐一列出一个记忆封面的每一个场景——所以SEARCH这个库自己而不是单独阅读索引:`list_dir``/example/memory/libero/global/`和`/example/memory/libero/task-family/`查看每个记忆文件,并用您所参与的物体、容器、固定或移动的场景来挑选候选人(从下列文字中取自:\n您的任务描述也起到搜索键的作用。\n如果一个贝壳/grep工具可供您使用,`grep -rl \"\u003ckeyword>\" /example/memory/libero/global/ /example/memory/libero/task-family/`跳转到提及对象的文件——在可以时使用;否则返回到`list_dir`+`read_text_file`.\n给定的主题往往有几种近似相同的技能文件(如多灶/篮子/杯状图案,只有Which对象或步令不同).\n当它发生时,不要从单行索引中选择,或者在第一行名称时停下来——`read_text_file`选择对象、空间关系和步骤顺序与您实际相匹配的,从文件正文中决定(而不是其索引模糊)。\n条目被写成可重复使用的图案:将技术和参数范围作为一般的诀窍,并重新通过你场景中的每个感知来定义每个坐标。 QQ MANDATORY—即使种子时也会这样做 。-0配方存在: 配方给出命令,此记忆给出适应这些命令所需的推理和失败模式,所以您必须咨询\n记忆也一样,不要直接跳过来重放食谱.\n在你的决赛中`strategy_notes`,记录您读取的精确记忆文件名(或声明“找不到匹配的任务记忆”),所以记忆咨询是可审计的.\n4.\n读取种子-0战略参考如果有的话,然后从头解决.\n战略参考资料载于:\n-`/example/memory/libero/task-specific/`(已解决种子)-0审计+食谱配对:`\u003ctag>.json`+`\u003ctag>_recipe.jsonl`用于strategy_notes,迅速的梯子,原始订购, 获得恰克,以及质量目标区。\n它们建立在不同的场景上,有时还带有旧的/甲骨文的假设;不复制坐标,不重放stale 命令列表.\n从这个场景中重新找出每个坐标\n5.\n运行任务前测试通道(第一步骤Algorighm以上)——首先将每件事都本地化,然后行动.\n在任何选择/位置建立本地化表之前: 语义特征的代理视图hi-res,`back_project`对于中位数xyz,手腕几何修饰,用于非篮子行(仅在空间一致的情况下),手腕确认为篮子/笼盖.\n这个感官传球是EveryY任务的第一阶段,甚至看起来很简单的——一个错误的目标第一抓拍在单试模式下是无法恢复的,所以廉价的保险就是识别前面的所有实体.\n做最后准备检查,然后计划。\n6.\nEXECUTE一个原始的一次,称其结构化的工具:\nmove_to({\"xyz\":[x,y,z],\"gripper\":-1, ...})pi0_pick({\"即时\":‘......,......max_chunks\":20,...}) 释( ⁇ ).\n每个原始工具块直到下一个状态记录被丢弃,并返回新的状态视图,日志和嵌入式图像.\n检查`agentview_high.png`和`wrist_high.png`视需要拨打电话`back_project`用于几何,决定和重复。\n7.\n允许优先(仅限物理学;工具列表/指南中的完整计划):`move_to`,`pi0_pick`,`pi0_doubled`,`release`,`set_gripper`,`rotate_wrist`,`rotate_pitch`,`move_pose`,`execute_action`. ⛔`reset`是福布登在这里(Single-ATTEMPT MODE).\n福尔布登:`exit`,`set_object_pose`,`articulate_to`,`js_move_to`,`carry_object`.\n注:`pi0_doubled`IS在这一运行时间中已经实施和可调用——已核实。\n它运行Pi0VLA成功 =`terminated`(没有升降机/没有握手-关闭的假设——与`pi0_pick`).\n如果本单元有任何先前的注释或参考结论:`pi0_doubled`是\"未知的动作\" / 缺少 / 抽屉或门的表达是无法解决的 \"结构式死端\"因为没有任何接触原始存在—— 解析这个具体的结论和实际上的USE`pi0_doubled`抽屉/门阶,必要时与短封顶的OCS推/对齐。\n从头重新证明细胞;不要继承死板的判决.\nSAM3地方化援助——`segment`(没有机器人运动): 与其看一个像素,请打电话`segment({\"prompt\":\"the black bowl on the cookies box\", \"camera\":\"agentview\"})`.\n运行中SAM3在当前图像上,通过匹配的世界映射面罩并返回坚固的中位数`world_xyz`加逻辑`segment_artifact`和`overlay_artifact`名称。\n检查嵌入式覆盖图像以确认正确的对象.\n使用`camera\":\"wrist\"`(在停车后)15–20 cm+ 超过目标)1–2 cm完善,或`\"point\":[row,col]`为点提示。\n文本`prompt`和`point`相互排斥;提供准确的一。SAM3敏感度 : 使用纯色+形状+RELATION 短语,绝不使用内部/品牌名称`object_names`/BDDL. (中文(简体) ).\n`\"the akita black bowl\"`分数~0.03(SAM3无法打开\"Kikita\",而`\"the black bowl on the stove\"`分数~0.76.\n脱去适当的名词(Kita,glazed_rim_porcelain_...)——说它看起来像什么 +它在哪里。\n总是检查返回的覆盖图像,以确认面具在移动前降落在正确的物体上.\n这是一个Convenence替代手动反投射的选项——如果它返回`{\"error\":..., \"fallback\":...}`(server down / 低分数 /没有检测),走时速(丢掉品牌单词,添加关系)或者在高分辨率图像中只选择一个像素并呼叫`back_project`你自己来。\n它不取代两相机关系协议来混淆相同的对象.\n8.\nRECOVERY(仅在位置上——没有重置):重新定位(对象可能已经移动),重新预置+re-pi0_pick下个快速拉杆; 将长横线分割为\u003c0.30xy 路口;为一扇门/drawer/knob使用加盖 OSC 推力的SHORT 或`pi0_doubled`从来没有一个长时间的推力——是NaNs MujoCo.\n如果任务在这个剧集内无法恢复,请不要重置——写一个诚实的卡-审计(英语:`terminated:false`)和打电话`finish`.\nNever warp.\n9.\n当顶级时`terminated == true`在最新工具结果中:a。\n写入审计`/example/runs/10_t0_s1/10_t0_s1.json`与: 套间,task_id,种子,政权:\".strict_perception\",strategy_notes(包括你如何本地化),pick_result,final_state(最新状态)`state`),终止:真伪b.\nCall `finish`.\n如果你的单项尝试没有解决,请写`/example/runs/10_t0_s1/10_t0_s1.json`已终止的:虚假 +strategy_notes描述你在这集里尝试过什么 以及它停滞的地方\n那就打个电话`finish`(没有重置,没有第二次尝试。)"},{"en":"ALLOWED PRIMITIVES (physics-only; full schemas in the tool list/guides):\n`move_to`, `pi0_pick`, `pi0_doubled`, `release`, `set_gripper`, `rotate_wrist`, `rotate_pitch`, `move_pose`, `execute_action`.\n\nEXECUTE one primitive at a time by calling its structured tool:\n\n    move_to({\"xyz\": [x, y, z], \"gripper\": -1, ...})\n    pi0_pick({\"prompt\": \"...\", \"max_chunks\": 20, ...})\n    release({})\n\nEach primitive tool blocks until the next state record is dumped and returns\nthe new state view, log, and embedded images. Inspect `agentview_high.png` and\n`wrist_high.png` as needed, call `back_project` for geometry, decide, and repeat.\n\nFor pick/place, use pi0_pick for the grasp, then script the carry and release.\nStart with max_chunks=20, lift_thresh=0.05, gripper_closed_thresh=0.06 unless\nthe matched task technique specifies otherwise. pi0_pick.success is an eef-lift\nand closure heuristic. Check robot0_gripper_qpos (roughly 0.01–0.05 gap when\nholding, ~0 when empty), wrist_high.png after lift and the vacated source.\nIf needed, back_project the target's surface to check the increase in z.\nFor a missed grasp, try “pick up the {object}”, verbatim task_language, then\na spatial qualifier, then re-position (lower z or offset xy by 5 cm) and retry.\nFor drawer/door articulation, knob turns and insertion, use pi0_doubled for\ncontact and alternate with short capped OSC pushes/alignment as needed.\npi0_doubled checks terminated, independently of gripper closure or lift;\ndisregard historical claims that this contact tool is unavailable.\n\nSeed-0 libero_10 techniques for matching tasks; re-localize this scene.\n\nCRITICAL MECHANICS (cost many wasted attempts before they were nailed):\n- **GRIPPER SIGN**: in `move_to` / `set_gripper`, `gripper:+1` = CLOSE/hold,\n  `gripper:-1` = OPEN. To CARRY a grasped object, hold `gripper:+1` the whole way\n  (carrying with `-1` silently OPENS and drops it — the #1 early bug). `set_gripper +1`\n  (steps 8-12) firms the grip after a pick; for a laterally-weak CAN use steps\u003c=5.\n- **`move_pose` defaults gripper to OPEN (-1) if you omit it** — always pass\n  `\"gripper\":1` in `move_pose` while holding an object.\n- **`move_pose` threads the OSC IK singularity that `move_to` walls at** — for\n  cabinet-front / microwave-cavity / deep reaches, when `move_to` stalls\n  (final_dist stays high, eef retreats), switch to `move_pose` (co-vary\n  xyz+pitch+yaw). It reaches several cm deeper.\n\nGRASPING:\n- **MUGS / BOWLS / CUPS grasp at the RIM, not the center**: SAM3/back-projection\n  give the object CENTER; closing the gripper there grabs air. Aim\n  `eef_y = object_y + 0.045` so Pi0 rim-hooks. (Mugs do NOT hang 4.5cm in -y like\n  bowls — you can wrist-segment the grasped object to measure the true held offset.)\n- Some objects grasp best with `pi0_pick` from the **DEFAULT HOME pose** (no\n  pre-position) — Pi0 has its own approach trajectory; pre-positioning can hurt.\n- **`pi0_pick` is reusable and repurposable**:\n  a HIGH `lift_thresh` (e.g. 999) + `gripper_closed_thresh:0` turns it into a\n  generic closed-loop CONTACT skill (used to turn the stove knob).\n- **`pi0_doubled`** = Pi0 closed-loop CONTACT skill (success :=\n  `terminated`). Use it for drawer/door open-close AND insertions; call it\n  repeatedly.\n\nDISAMBIGUATION / TARGETING:\n- **SWAP-PERTURBED scenes (suite `*_swap`)**: the seed-0 reference's COORDINATES\n  are STALE (swap re-randomizes object positions per seed), and some s0 swap\n  recipes contain a literal reset — that was the old multi-attempt era UNDOING A\n  WRONG-OBJECT FIRST GRAB. For swap cells the following restriction supersedes ordinary recipe transfer. Use the s0 ref ONLY for: WHAT the\n  targets are (task_language nouns), what they LOOK like, and which Pi0 prompt\n  finally worked — never for positions, never replay its command list.\n  IDENTIFY-then-GRASP: before ANY pick, identify the target SEMANTICALLY in the\n  global agentview, then use the wrist only for geometry. The wrist camera is a\n  near-vertical close-up: it is excellent for precise depth/xy refinement, but\n  weak at reading side labels or distinguishing similar grocery items\n  (ketchup/BBQ/tomato sauce, soup cans, cream cheese/butter). Do NOT let the\n  wrist freely re-identify a non-basket target; it often locks onto a look-alike.\n  Instead: choose the target from `agentview_high.png`, compute its agentview\n  xyz, move over that candidate, project/track that SAME candidate in wrist, and\n  refine only its surface/center coordinates. SAM3 scores ~0.02-0.06 on brand\n  nouns (\"alphabet soup\", \"tomato sauce\") — prompt by colour+shape (\"the short\n  red-label can\") or pick pixels manually in the agentview hi-res. Pi0's own\n  prompt grounding is ALSO unreliable on brand nouns (s0's first grab took a milk\n  carton instead), so pre-position the eef directly OVER the agentview-identified\n  + wrist-refined target before pi0_pick. A wrong first grab usually\n  tips/displaces the grabbed object AND the target zone — identification errors\n  are unrecoverable; spend commands on agentview ID, not on recovery.\n- **\"left\"/\"right\" in libero_10 is EGOCENTRIC (robot frame): +y = robot-LEFT =\n  image-RIGHT.** A geometrically-perfect placement of the WRONG target never fires\n  the predicate — when a clean placement won't terminate, SUSPECT WRONG-TARGET\n  before wrong-physics (this turned a \"physically impossible\" verdict into a solve).\n- Containers can be MOVABLE (e.g. a basket slides when bumped) — descend into the\n  interior CENTER from straight above, not against the rim; SAM3's centroid of a\n  frame-clipped/reflective container is rim-biased, so derive the true cavity\n  center from the woven-rim pixels.\n\nPER-TASK RECIPES THAT WORKED AT SEED 0 (adapt coords to your seed):\n- 2-items→basket (t0,t1,t7): place the BOX first into the EMPTY basket interior\n  (descend deep, release), then drop/`pi0_pick`-lift the CAN in beside it; a\n  rim-perched item can be seated with a closed-gripper downward push.\n- mugs→plates (t4) / mug→plate (t6): rim-grasp, +1-hold carry, descend until the\n  mug rests on the plate before release (high release → topples off).\n  ⚠ t4 grasp safeguards (the seed-0 \"win\" used 2 resets. 8/9 multiseed cells died to the SAME chain: Pi0 rogue-place →\n  tipped mug → unrecoverable cascade. Prevent it up front):\n    1. GRASP-ONLY pi0_pick: short prompt (\"grasp the yellow mug\" — NEVER the full\n       task_language) AND `max_chunks\u003c=8`. With 20-25 chunks Pi0 keeps driving its\n       trained pick-AND-PLACE and dumps the held mug at its own trained \"left\"\n       (+y) or at the workspace IK edge (|y|>0.27 walls z>=0.56 — unreachable\n       forever). Stop Pi0 at lift; if lift isn't reached within 8 chunks,\n       RE-ISSUE pi0_pick rather than raising max_chunks.\n    2. The instant lift is detected: `set_gripper +1` (steps 8-12) to lock the\n       grip, then YOU script the entire carry + place.\n    3. Measure the held-mug offset PER PICK by wrist-segmenting the HELD mug\n       (offsets differ pick-to-pick: dy=-0.055 on one grasp, -0.013 on the next —\n       measure each, never reuse). Place eef = plate_center − offset; descend to\n       z~0.46 until the mug RESTS on the plate (OSC stalls ~0.51), then release\n       and retreat STRAIGHT UP (step_clip 0.012).\n    4. ORDER/PATH: after placing mug #1, plan mug #2's pick pre-position AND\n       carry path so they NEVER pass over the placed mug (a graze re-tips it). A\n       tipped mug is UNRECOVERABLE (no side-grasp primitive; Pi0 won't engage\n       side-lying cylinders) — prevention is everything.\n    5. Plates MOVE per seed (y=±0.21 at s0, ±0.30 at s8). For this\n       plate-center estimate, measure the rim outline in the wrist view. Use\n       x_range/y_range MIDPOINTS as the center; an individual rim depth or the\n       median of the visible fragment gives an edge-biased placement target.\n- stove (t2): turn the knob with `pi0_pick \"turn on the stove\", lift_thresh:999,\n  gripper_closed_thresh:0`; then grasp the pan by its HANDLE, re-segment mid-carry\n  to converge on the burner.\n- moka→stove (t8): grasp body, carry LOW (~4cm lift) in tiny hops (step_clip\n  0.006-0.01), re-clamp `set_gripper +1` between hops; \"LEFT\" = +y pot.\n- bottle→bottom drawer + close (t3): the drawer In-region is SHALLOW\n  (y≈0.075-0.227) — place at the MOUTH (y≈0.13), NOT the deep recess; `pi0_pick`\n  the bottle from home pose, `rotate_pitch` it flat ALONG X (the wide footprint),\n  release at the mouth, ONE short +y push seats it AND closes the drawer.\n- mug→microwave + close (t9): the only UNSOLVED seed-0 cell — the round mug-in-hand\n  walls ~3cm short of the In() threshold (deep narrow cavity). Try every lever\n  (`pi0_doubled`, `move_pose`, push) and if it still walls, write an honest\n  `terminated:false` with the max eef-y reached.\n\n- Single-step xy within ±0.30 or OSC flips IK; split long traversals.\n- lift_thresh 0.05 (flat) / 0.08 (slippery tall bottles).\n- step_clip 0.025 (empty/box) / 0.015 (cans) / 0.012 (tall bottles).\n- Frame: state.robot0_eef_pos[2] ≈ 0.68 LIVING_ROOM / 1.17 KITCHEN / 0.26 object.\n- BOWL: eef_y = plate_y + 0.045. The LIBERO tall-bottle drop is an exception to the supported-release rule:\n  carry z=0.30, drop without descending.\n- Approach high-then-vertical; recover by re-pick, not hover.","origin":"robot","zh":"允许优先(仅限物理学;工具列表/指南中的完整计划):`move_to`,`pi0_pick`,`pi0_doubled`,`release`,`set_gripper`,`rotate_wrist`,`rotate_pitch`,`move_pose`,`execute_action`.\nEXECUTE一个原始的一次,称其结构化的工具:\nmove_to({\"xyz\":[x,y,z],\"gripper\":-1, ...})pi0_pick({\"即时\":‘......,......max_chunks\":20,...}) 释( ⁇ ).\n每个原始工具块直到下一个状态记录被丢弃,并返回新的状态视图,日志和嵌入式图像.\n检查`agentview_high.png`和`wrist_high.png`视需要拨打电话`back_project`用于几何,决定和重复。\n选用/地点,使用pi0_pick然后写下载体并放出\n开始max_chunks=20,lift_thresh=0.05,gripper_closed_thresh=0.06除非匹配的任务技术另有规定。pi0_pick.success是一种升降和关闭的热力。\n检查robot0_gripper_qpos(略数)0.01–0.05持有时的空格,~0当是空的,wrist_high.png在升起和空出的来源之后。\n如果需要的话,back_project目标表面检查Z的增量。\n如果抓错,请尝试“拾起{对象}”,逐字记录task_language,然后是空间修饰符,然后重新定位(低于z或抵消xy5 cm)并重试.\n抽屉/门线显示,把手转动并插入、使用pi0_doubled根据需要,通过短封顶的OCS推/调整进行接触和交替。pi0_doubled已终止的检查, 独立于抓取器关闭或升起; 忽略了历史上关于无法使用这种联系工具的说法 。\n种子-0libero_10匹配任务的技巧; 重新定位此场景。\n临界元件(在被钉死前浪费了许多成本):\n-** 乔治·西贡**:`move_to`/`set_gripper`,`gripper:+1`= 关闭/持有,`gripper:-1`=打开。\n抓取到的物体,抓好`gripper:+1`整个过程(随身携带)`-1`悄悄地打开并放下它——The#1早期错误).\n`set_gripper +1`(步骤)8-12紧紧握住后,为横向微弱的可使用阶梯。5.\n- **`move_pose`默认抓取到 OPEN (S)-1)如果你省略了它**——总是通过`\"gripper\":1`输入`move_pose`在持有对象时。\n- **`move_pose`线程 OCSIK单数,`move_to`墙壁**——用于柜前/微波洞/深处,何时`move_to`摊位( E)final_dist保持高度,eef撤退),切换到`move_pose`(co-vary xyz+pitch+yaw). 维基共享资源中相关的原始文献: 维基语录链接:名人名言 - 文学作品 - 谚语 - 电影对白 - 主题 - 分类\n它的深度达几厘米。\nGRASPING:\n-** MUGS / BOWLS / CUPS 抓住RIM,而不是中央**:SAM3/后投射给物体CENTER;关闭那里抓取空气的抓取器.\n目标`eef_y = object_y + 0.045`这么说Pi0枪声响起4.5cm在-y 和碗一样,你可以手腕分割被抓住的物体来测量真实被持有的偏移.).\n-一些物体最能抓住`pi0_pick`从**Default家姿**(没有预设位置) -Pi0拥有自己的接近轨迹;预置位置会受伤.\n- **`pi0_pick`可重用和可重用**:高`lift_thresh`(例如:999) +`gripper_closed_thresh:0`将其变成通用的闭锁式CONTACT技能(用于转动炉子把手).\n- **`pi0_doubled`** =Pi0闭路交流技巧(成功:=`terminated`).\n用于抽屉/门开闭和插入;多次调用.\n失踪/目标:\n-** SWAP - 体验的场景(套间)`*_swap`**:种子-0参考文献的COORDINATES是STALE(每个种子重命名对象位置),一些S0互换食谱包含一个字面重置——即旧的多尝试时代UNDOING A WORONG-OBJECT FIRST GRAB.\n对于互换单元格,以下限制取代普通的食谱传输。\n使用 s 键0目标是什么:task_language名词,他们长什么样,什么样?Pi0elect终于起作用了——从不为位置,从不重放其命令列表.\n在任何选择之前,在全球代理视图中确定目标,然后只用手腕进行几何。\n手腕相机是近垂直的特写:它对于精确的深度/xy精细化来说是极好的,但在读取侧面标签或区分类似杂货品(ketchup)时却很弱./BBQ/tomato酱汁,汤罐,奶油奶酪/奶油.\n不要让手腕自由重新识别一个非篮子目标;它经常锁在外观上。\n取而代之:从`agentview_high.png`,计算它的代理view xyz,移动到该候选人之上,在手腕中投射/跟踪该SAME候选人,并只精炼其表面/中心坐标。\nSAM3分数~0.02-0.06在品牌名词上(\"alphabet sound\",\"tomato s酱\")——通过颜色+形状(\"红色标签的短片\")提示,或手动在代理视图hi-res中选择像素.\nPi0品牌名词本身的即时定位也是不可靠的(s)0第一次抓取的是一盒牛奶所以先把eef直接定位在 代理视图识别的 + 手腕精炼的目标上pi0_pick.\n错误的第一次抓取通常会提示/丢弃被抓取的对象和目标区——识别错误是无法恢复的;在代理视图ID上花费命令,而不是用于恢复.\n-**\"左\"/\"右\"在libero_10EGOCENTRIC(机器人框架):+y = 机器人-LEFT = 图像-RIGHT.**对错误目标进行几何精确的放置从不发射上游——当一个干净的放置不会终止时,SUSPECT WORG-TARGET在错误的物理学前(这把一个\"物理上不可能\"的判决变成了一个解决方案).\n- 集装箱可以移动(例如,在撞到时用篮子滑动)——从直上而下地进入内部中央中心,而不是对着环形;SAM3'一个帧-剪合/反射容器的中间体具有环形偏差,因此从编织的环形像素中衍生出真正的腔中心.\n在Seed工作过的Per-TASK回收器0(适应圈子的种子):\n-2- 包件(吨)0,t (帮助)1,t (帮助)7:先将BOX放入EMPTY篮子内部(descend deep, release),然后滴/`pi0_pick`-把罐子抬进去,用压紧的向下推就能坐好\n- 杯子-牌子(t)4(t) /杯子-牌子(t)6: Rim-grasp,(英语:Rim-grasp,+1- 手持,下到杯子在释放前放在盘子上(高释放)-顶部脱落。4抓住保障(种子)-0\"赢\"用2复发.8/9多种子细胞死亡到 SAME 链 :Pi0无赖的地方 泄露的杯子 无法回收的级联\n防止在前面:\n1.\n巨猿龙pi0_pick: 短促 (\"擦黄杯子\")— 从来没有满task_language和`max_chunks\u003c=8`.\n与20-25块Pi0继续驾驶训练  TASK: `/example/memory/libero/task-specific/10_t0_s0.json` plus\n   `/example/memory/libero/task-specific/10_t0_s0_recipe.jsonl` — the matched successful\n   audit and command order from seed 0.\n\nAfter inspecting the initial `task_language`, read the matching task pair and\ntask-family leaf when present, then select only the relevant global leaves through\n`MEMORY.md`. Recipes are technique references,\nnot coordinates: re-localize every entity in the current image. Never read\n`_internal/` during evaluation.","origin":"old","zh":"使用LOCAL的勘探仪器进行这次评估.\n它的三层工作不同;使用每一个可用的层:\n1.\n全球:`/example/memory/libero/global/`——可重复使用的机器人./perception/primitive教训\n2.\n塔斯克 -费米利:`/example/memory/libero/task-family/task-family_libero10_\u003cregime>_t0.md`任务/制度战略、验证范围和失败表。\n3.\n塔萨克:`/example/memory/libero/task-specific/10_t0_s0.json`加号`/example/memory/libero/task-specific/10_t0_s0_recipe.jsonl`——匹配的种子成功审计和命令令.0.\n检查了初始数据后`task_language`时,读取匹配的任务对和任务家族叶,然后通过`MEMORY.md`.\n食谱是技术参考文献,而不是坐标:将当前图像中的每个实体重新定位.\n永远不读`_internal/`在评价期间。"},{"en":"1. READ THE GUIDES once each:\n   - `robots/libero/guides/strict_hybrid_guide.md`\n   - `robots/libero/guides/pro_hybrid_guide.md`\n   - `robots/libero/guides/env_calibration.md`\n\n2. INSPECT INITIAL STATE: call `view_env_state({\"step\": 0})`; inspect\n     `task_language`, object_names, eef pose, `agentview_high.png`,\n     `wrist_high.png` if useful, and call `view_camera_meta` if needed. Identify ALL target\n   objects, destination surfaces, and relation landmarks named by task_language.\n\n3. READ EACH AVAILABLE LOCAL MEMORY LAYER for the observed `task_language`:\n   - task audit: `/example/memory/libero/task-specific/10_t0_s0.json`\n   - task recipe: `/example/memory/libero/task-specific/10_t0_s0_recipe.jsonl`\n   - task-family leaf: find the matching task/regime leaf under `/example/memory/libero/task-family/`\n   - global index: `/example/memory/libero/MEMORY.md`, then only relevant leaves under\n     `/example/memory/libero/global/`\n   \n   If a layer is absent, state that explicitly and continue with the available\n   validated layers. Record the exact files used in final `strategy_notes`. Treat\n   absolute coordinates as stale and re-derive them from this scene.\n\n4. RUN THE MANDATORY PRE-TASK PERCEPTION PASS (FIRST-STEP ALGORITHM above) —\n   localize EVERYTHING first, THEN act. Before any pick/place build the\n   localization table: agentview hi-res for semantic identity, `back_project` for\n   median xyz, wrist geometry refinement for non-basket rows (only if spatially\n   consistent), wrist confirmation for basket/cavity. This perception pass is the\n   first stage of EVERY task, even ones that look simple — a wrong-target first\n   grab is unrecoverable in single-attempt mode, so the cheap insurance is to\n   identify all entities up front. Do the FINAL READY CHECK, then plan.\n\n5. EXECUTE one primitive at a time by calling its structured tool:\n   \n       move_to({\"xyz\": [x, y, z], \"gripper\": -1, ...})\n       pi0_pick({\"prompt\": \"...\", \"max_chunks\": 20, ...})\n       release({})\n   \n   Each primitive tool blocks until the next state record is dumped and returns\n   the new state view, log, and embedded images. Inspect `agentview_high.png` and\n   `wrist_high.png` as needed, call `back_project` for geometry, decide, and repeat.\n\n6. ALLOWED PRIMITIVES (physics-only; full schemas in the tool list/guides):\n   `move_to`, `pi0_pick`, `pi0_doubled`, `release`, `set_gripper`, `rotate_wrist`, `rotate_pitch`, `move_pose`.\n   ⛔ `reset` is FORBIDDEN here\n   (SINGLE-ATTEMPT MODE). FORBIDDEN: `exit`, `set_object_pose`, `articulate_to`,\n   `js_move_to`, `carry_object`.\n   \n   ⚠ INFRA NOTE: `pi0_doubled` IS implemented and callable in this runtime —\n   verified. It runs the Pi0 VLA on a CONTACT skill (drawer/door open-close, knob\n   turn) with success := `terminated` (no lift / no gripper-close\n   assumption — unlike `pi0_pick`). If ANY prior note or reference for this cell\n   concluded that `pi0_doubled` is \"unknown action\" / missing / that\n   drawer-or-door articulation is an unsolvable \"structural dead-end\" BECAUSE no\n   contact primitive existed — DISREGARD that specific conclusion and actually\n   USE `pi0_doubled` for the drawer/door step, alternating with short capped OSC\n   pushes/aligns as needed. Re-prove the cell from scratch; do not inherit the\n   dead-end verdict.\n   \n   SAM3 localization aid — `segment` (no robot motion): instead of eyeballing\n   a pixel, call `segment({\"prompt\":\"the black bowl on the cookies box\",\n   \"camera\":\"agentview\"})`. It runs SAM3 on the current image, back-projects the\n   mask via the matching world map, and returns a robust median `world_xyz` plus\n   logical `segment_artifact` and `overlay_artifact` names. Inspect the embedded\n   overlay image to confirm the right object. Use `camera\":\"wrist\"` (after parking the eef ~15–20 cm over the\n   target) for ±1–2 cm refinement, or `\"point\":[row,col]` for a point prompt.\n   Text `prompt` and `point` are mutually exclusive; provide exactly one.\n   ⚠ PROMPT PHRASING (SAM3 is sensitive): use a plain colour+shape+RELATION phrase,\n   NEVER the internal/brand name from `object_names`/BDDL. `\"the akita black bowl\"`\n   scores ~0.03 (SAM3 can't ground \"akita\") whereas `\"the black bowl on the stove\"`\n   scores ~0.76. Strip proper nouns (akita, glazed_rim_porcelain_…) — say what it\n   LOOKS LIKE + where it is. Always inspect the returned overlay image to confirm\n   the mask landed on the right object before moving.\n   This is a CONVENIENCE alternative to manual back-projection — if it returns\n   `{\"error\":..., \"fallback\":...}` (server down / low score / no detection), walk\n   the prompt (drop the brand word, add the relation) or just pick a pixel in the\n   high-resolution image and call `back_project` yourself. It does NOT replace the\n   two-camera relation protocol for disambiguating identical objects.\n\n7. RECOVERY (in-place ONLY — no reset): re-localize (objects may have moved),\n   re-pre-position + re-pi0_pick on the next prompt-ladder rung; split long\n   traversals into \u003c0.30 xy waypoints; for a door/drawer/knob use a SHORT capped\n   OSC push or `pi0_doubled`, never one long push — it NaNs MuJoCo. If the task is\n   unrecoverable within this one episode, do NOT reset — write an honest\n   stuck-audit (`terminated:false`) and call `finish`. Never warp.\n\n8. WHEN top-level `terminated == true` in the latest tool result:\n   a. Write audit `/example/runs/10_t0_s1/10_t0_s1.json` with:\n      suite, task_id, seed, regime:\"strict_perception\", strategy_notes (incl. how\n      you localized), pick_result, final_state (latest state's `state`),\n      terminated:true.\n   b. Call `finish`.\n   If your single attempt does not solve it, write `/example/runs/10_t0_s1/10_t0_s1.json` with\n   terminated:false + strategy_notes describing what you tried in this one\n   episode and where it stalled. Then call `finish`. (NO reset, NO second attempt.)","origin":"old","zh":"1.\n各读一次指南:\n- `robots/libero/guides/strict_hybrid_guide.md`\n- `robots/libero/guides/pro_hybrid_guide.md`\n- `robots/libero/guides/env_calibration.md`\n2.\n初步状态:呼叫`view_env_state({\"step\": 0})`; 检查`task_language`,object_names摆出姿势`agentview_high.png`,`wrist_high.png`如果有用,请打电话`view_camera_meta`如果需要的话。\n识别所有目标物体、目的地表面以及由下列单位命名的关联地标:task_language.\n3.\n为观测到的每个可读取的地方记忆器读取`task_language`:\n- 任务审计:`/example/memory/libero/task-specific/10_t0_s0.json`\n- 任务配方:`/example/memory/libero/task-specific/10_t0_s0_recipe.jsonl`\n- 任务-家族叶子:在下面找到匹配的任务/制度叶子`/example/memory/libero/task-family/`\n-全球指数:`/example/memory/libero/MEMORY.md`,则仅将相关叶片置于下方`/example/memory/libero/global/`\n如果缺少一层,请说明该层并用可用的验证层继续使用。\n记录最终使用的确切文件`strategy_notes`.\n将绝对坐标视为僵硬,并重新从这里找到它们.\n4.\n运行任务前测试通道(第一步骤Algorighm以上)——首先将每件事都本地化,然后行动.\n在任何选择/位置建立本地化表之前: 语义特征的代理视图hi-res,`back_project`对于中位数xyz,手腕几何修饰,用于非篮子行(仅在空间一致的情况下),手腕确认为篮子/笼盖.\n这个感官传球是EveryY任务的第一阶段,甚至看起来很简单的——一个错误
