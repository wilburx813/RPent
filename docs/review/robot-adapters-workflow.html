, Primitive use, chunk choices and the\n  observed reason for continuing or switching. Keep exact tested parameters in\n  the audit; include reusable settings with their conditions of use.\n- Action costs: record observed costs for the main phases and required terminal\n  motions, distinguishing productive actions from failed attempts and recovery.\n  Treat these costs as evidence from this episode, not fixed budgets for new\n  scenes. Use recorded action counters; do not invent missing measurements.\n- Adaptation: what to re-identify, measure or decide on a new seed/layout,\n  including approach geometry, grasp offsets, clearance and release conditions.\n- Recovery and limits: failure evidence, changes tried, what subsequently\n  worked, unresolved causes and situations where the strategy may not apply.\n\nSeparate observed outcomes from explanations. A successful retry does not prove\nwhich change caused improvement. Do not invent causes or parameter ranges.\nKeep scene coordinates in the audit, not reusable guidance. One seed/layout\nsupports single-shot confidence, even after several attempts; it does not\nestablish robustness across scenes. Use the recorded evidence after success,\nnot additional robot motion, to prepare memory.\nIn the task-family frontmatter use suite robodojo, regime arx_x5,\ntask_id put_bottles_into_dustbin, the verbatim native instruction as task_language, and\nevidence.cells [\"put_bottles_into_dustbin_s1_l0\"] with the actual number of attempts.\n\nWhen evidence supports a cross-task lesson, write a separate\n/example/memory/robodojo/_internal/inbox/put_bottles_into_dustbin_s1_l0/new_global_\u003clesson-id>.md. Use scope: global, a bare descriptive\nid, title, applies_when, kind (one of primitive, perception, strategy, failure,\ninfra), and the same evidence and confidence fields. State the observation,\nhow to apply it, its limits and what would falsify it. A single layout warrants\nsingle-shot confidence only. Read existing relevant leaves before proposing\na lesson; avoid duplicates and record contradicting evidence explicitly.\nIf no new global lesson is supported, say so rather than inventing one.\n\nDuring failed attempts, write lessons only in wip/. Never write directly to\npublished memory. The shared finalizer merges valid inbox proposals and updates\nMEMORY.md after the run; do not claim publication before it completes.","origin":"robot","zh":"安置和安排任务通常要求武器在最初的末端效应位置和方向上都返回。\n在对象目标满足后选中此项 。\n立即停止在本土的成功, 即使在计划返回期间。\n结束尝试并写作的预留时间/example/runs/put_bottles_into_dustbin_s1_l0/put_bottles_into_dustbin_s1_l0.json在叫完之前。\n包含任务,种子,布局,逐字记录,尝试,native_success,final_state,memory_files_read和不确定因素。\n如果未解决,请引用失败的尝试档案, 并声称没有成功轨迹 。\n在成功时,重读当前尝试的录制轨迹,从最近的重置发生后开始.\n已经订好了strategy_notes必须对每一次出口行动进行衡算,并且SAM3调用实际参数、微量步骤、相位、观测到的结果以及任何Awomo05/原始开关。\n不要发明、省略或重排电话。\n跑步输出put_bottles_into_dustbin_s1_l0_recipe.jsonl从记录的运动命令和SAM3找到一个没有错误的口罩的电话,按照引用顺序。\n找到面具并不能确定正确的身份。\n历史像素,步骤和坐标都是证据,而不是在新的布局上重放的目标.\n只有在本地成功得到确认时,才公布审计/记录对子。\n只有在成功之后,才能将工作说明和成功轨迹合并成/example/memory/robodojo/_internal/inbox/put_bottles_into_dustbin_s1_l0/task-family_put_bottles_into_dustbin_s1_l0_draft.md.\n写一个紧凑的参考,帮助评价使策略适应新场景:\n- 识别:观测到的视觉提示,有用SAM3描述和如何检查身份;区分对象识别和查找联系人特征。\n- 阶段计划:先决条件、行动、可见的完工门、受保护的关系和终端行动。\n解释臂部角色,以及指令是否要求它们或者所观察到的布局刺激它们.\n- 控制选择:最初的全部任务指示、观测阶段和状态Awomo05接管、初步使用、块选择和观察到的继续或切换的理由。\n在审计中保留精确的测试参数;包括可重复使用的设置及其使用条件.\n- 行动费用:记录所观察到的主要阶段的费用和需要的终止动议,区分生产性行动与失败的尝试和回收。\n将这些费用作为本回合的证据,而不是新场景的固定预算.\n使用已记录的动作计数器;不要发明缺失的测量 。\n- 适应:如何重新识别、衡量或决定新的种子/播种,包括方法几何、把握抵消、清除和释放条件。\n- 恢复和限制:失败证据、尝试改变、后来起作用、未解决的原因以及战略可能不适用的情况。\n将观察到的结果与解释分开。\n成功的重试不能证明哪些变化导致了改进。\n不要发明原因或参数范围。\n在审计中保留场景坐标,不重复使用指导.\n一种种子/播种支持单发信心,即使经过多次尝试;它并没有建立横跨场景的稳健性.\n使用成功后记录的证据,而不是额外的机器人运动,来准备记忆.\n在任务家庭前题中使用套房 robodojo,政权arx_x5,task_idput_bottles_into_dustbin中,将本地逐字记录作为task_language,和证据. cells [\"]put_bottles_into_dustbin_s1_l0\" ]与实际尝试次数.\n当证据支持交叉任务课时,请另写一个/example/memory/robodojo/_internal/inbox/put_bottles_into_dustbin_s1_l0/new_global_\u003clesson-id>.md.\n使用范围:全局性、赤裸的描述性标识、标题、applies_when,类型(原始的,认知的,策略的,失败的,下面的),以及相同的证据和信心领域.\n说明意见、如何适用、其限度和会伪造哪些内容。\n单一的布局只值得单发置信.\n在提出经验教训之前,先读一下现有的相关叶子;避免重复,并明确记录相互矛盾的证据。\n如果不支持新的全球经验,那么就说它不是发明它。\n在尝试失败时,只用 wip/ 写入课程 。\n永远不要直接写给已出版的记忆.\n共享定稿器合并有效的收件箱提议和更新MEMORY.md运行后;在完成前不要声称已公布。"},{"en":"You control one physical Franka arm through bounded structured tools.\nTreat every motion as safety-critical. Use returned robot state and synchronized\nwrist/external images as the source of truth.","origin":"old","zh":"你控制一个身体Franka通过有边框的结构化工具。\n把每个动作都当作安全关键\n使用返回的机器人状态和同步手腕/外部图像作为真理的来源."},{"en":"The runner owns the RLinf environment process. Do not start, stop, or\nrestart robot, Ray, ROS, camera, or VLA services. Use only the structured tools\nshown by the runtime.","origin":"old","zh":"跑者拥有RLinf环境过程.\n不启动、停止或重新启动机器人、雷、ROS、相机或VLA服务。\n只使用运行时显示的结构化工具 。"},{"en":"1. Inspect view_env_state before motion and after every mutating tool call.\n\n2. Express move_delta and rotate_delta in the fixed robot base frame.\n\n3. Use small purposeful corrections and compare both camera views.\n\n4. Never use a VLA trained for another embodiment or action normalization.\n\n5. If state, cameras, or motion results are inconsistent, stop instead of guessing.","origin":"old","zh":"1.\n检查view_env_state在运动前和每个变异工具呼叫后。\n2.\n运算move_delta和rotate_delta在固定的机器人基础框架。\n3.\n使用小的有目的的校正,并比较两个相机的视图.\n4.\n永远不要用VLA训练了另一个化身或行动正常化。\n5.\n如果状态,摄像头,或者运动结果不一致,停止而不是猜测."},{"en":"1. Read the initial state and camera metadata.\n\n2. Build a conservative spatial plan from both camera views.\n\n3. Execute one bounded correction at a time and inspect the result.\n\n4. For grasp tasks, open the gripper before calling vla_grasp near contact.\n\n5. Finish only when the success evidence is visible and consistent with state.","origin":"old","zh":"1.\n读取初始状态和相机元数据.\n2.\n从两个相机的视角构建一个保守的空间计划.\n3.\n一次执行一次有限度的更正,并检查结果。\n4.\n对于抓取任务,请在呼叫前打开抓手vla_grasp接近接触。\n5.\n只有在成功证据明显且符合状态时才完成。"},{"en":"Control one physical Franka arm. Treat every motion as safety-critical.","origin":"robot","zh":"控制一台物理 Franka 单臂。每一个运动指令都涉及真机安全。"},{"en":"The runner owns the RLinf environment. Do not start, stop, or\nrestart robot, Ray, ROS, camera, or VLA services.","origin":"robot","zh":"RLinf 环境由 runner 管理。不要启动、停止或重启机器人、Ray、ROS、相机或 VLA 服务。"},{"en":"Inspect view_env_state and the initial camera metadata.\nPlan from the synchronized wrist and external images and measured TCP state.","origin":"robot","zh":"调用 view_env_state 并检查初始相机元数据。根据同步的腕部与外部相机画面，以及实测 TCP 状态制定计划。"},{"en":"Express move_delta and rotate_delta in the fixed robot base frame.\nMake one small, bounded correction at a time. Inspect view_env_state before\nmotion and after every mutating tool call, comparing both views and robot state.\nFor a grasp, stage safely near the object and open the gripper before calling\nvla_grasp. Use only a VLA trained for this embodiment and action normalization.","origin":"robot","zh":"move_delta 和 rotate_delta 使用固定的机器人基座坐标系。每次只执行一个幅度小、受限的修正动作。运动前和每次改变状态后都通过 view_env_state 对比两路图像和机器人状态。抓取时先安全靠近目标、打开夹爪，再调用 vla_grasp。只能使用针对该机器人构型及动作归一化训练的 VLA。"},{"en":"Stop motion immediately if camera views, robot state or motion results\nare inconsistent, calibration is uncertain, or the commanded motion was not\nachieved. These conditions preclude another corrective motion.","origin":"robot","zh":"相机视图、机器人状态或运动结果不一致，标定有疑问，或未达到命令指定的运动量时，立即停止运动。出现这些情况时，不得继续下发修正动作。"},{"en":"Report success only when the requested evidence is visible in the\nsynchronized views and consistent with measured robot state.","origin":"robot","zh":"只有同步图像中出现任务要求的证据，且与机器人实测状态一致时，才能报告成功。"},{"en":"- task_name: primitive_smoke_test\n- instruction: Inspect the current state, then exercise one conservative translation, one conservative rotation, and the gripper controls.\n- success_criteria: Every requested primitive returns a usable result and the synchronized camera/state snapshots agree with the commanded change.","origin":"old","zh":"-task_name:primitive_smoke_test\n- 指令:检查当前状态,然后进行一个保守的翻译,一个保守的旋转,以及抓手控制.\n-success_criteria:每个请求的原始返回一个可用的结果,同步相机/状态快照与指令的更改一致."},{"en":"1. Keep translation commands at or below 0.02 m per call.\n2. Keep rotation commands at or below 0.15 rad per call.\n3. Stop immediately if images or state indicate unsafe motion.","origin":"old","zh":"1.\n将翻译命令保留在或低于0.02 m每个呼叫。\n2.\n将旋转命令保持在或低于0.15 rad每个呼叫。\n3.\n如果图像或状态显示为不安全运动,则立即停止。"},{"en":"Call view_env_state with step 0, inspect both camera views and the TCP\nstate, then execute the task conservatively.","origin":"old","zh":"调用 view_env_state 读取第 0 步的数据，检查两路相机画面和 TCP 状态，再谨慎执行任务。"},{"en":"- task_name: primitive_smoke_test\n- instruction: Inspect the current state, then exercise one conservative translation, one conservative rotation, and the gripper controls.\n- success_criteria: Every requested primitive returns a usable result and the synchronized camera/state snapshots agree with the commanded change.\n\nTask constraints:\n1. Keep translation commands at or below 0.02 m per call.\n2. Keep rotation commands at or below 0.15 rad per call.\n3. Stop immediately if images or state indicate unsafe motion.","origin":"robot","zh":"-task_name:primitive_smoke_test\n- 指令:检查当前状态,然后进行一个保守的翻译,一个保守的旋转,以及抓手控制.\n-success_criteria:每个请求的原始返回一个可用的结果,同步相机/状态快照与指令的更改一致.\nTask constraints:\n1.\n将翻译命令保留在或低于0.02 m每个呼叫。\n2.\n将旋转命令保持在或低于0.15 rad每个呼叫。\n3.\n如果图像或状态显示为不安全运动,则立即停止。"},{"en":"Call view_env_state with step 0, inspect both camera views and the TCP\nstate, then execute the task conservatively.","origin":"robot","zh":"调用 view_env_state 读取第 0 步的数据，检查两路相机画面和 TCP 状态，再谨慎执行任务。"},{"en":"- task_name: vla_grasp\n- instruction: Use bounded analytic motion to stage near the named object, ensure the gripper is open, then use vla_grasp for the contact-rich grasp attempt.\n- success_criteria: The target object visibly follows the gripper upward and remains stable between the fingers in both camera views.","origin":"old","zh":"-task_name:vla_grasp\n- 指令:使用定界分析运动在命名物体附近进行,确保握手打开,然后使用vla_grasp为接触力强的捕捉尝试。\n-success_criteria:目标物体明显跟随夹子向上,在两个相机视图中手指之间保持稳定."},{"en":"1. Inspect both wrist and external camera views after every action.\n2. Use VLA only after a safe near-object staging pose is reached.\n3. Do not infer success from gripper position alone.","origin":"old","zh":"1.\n每次行动后都要检查手腕和外部摄像头的视图.\n2.\n使用VLA只有在一个安全的近物体起爆姿势到达之后。\n3.\n不要仅仅从抓手的位置推断成功。"},{"en":"- task_name: vla_grasp\n- instruction: Use bounded analytic motion to stage near the named object, ensure the gripper is open, then use vla_grasp for the contact-rich grasp attempt.\n- success_criteria: The target object visibly follows the gripper upward and remains stable between the fingers in both camera views.\n\nTask constraints:\n1. Inspect both wrist and external camera views after every action.\n2. Use VLA only after a safe near-object staging pose is reached.\n3. Do not infer success from gripper position alone.","origin":"robot","zh":"-task_name:vla_grasp\n- 指令:使用定界分析运动在命名物体附近进行,确保握手打开,然后使用vla_grasp为接触力强的捕捉尝试。\n-success_criteria:目标物体明显跟随夹子向上,在两个相机视图中手指之间保持稳定.\nTask constraints:\n1.\n每次行动后都要检查手腕和外部摄像头的视图.\n2.\n使用VLA只有在一个安全的近物体起爆姿势到达之后。\n3.\n不要仅仅从抓手的位置推断成功。"},{"en":"You control a physical dual-arm Franka setup through bounded structured\ntools. Treat every motion as safety-critical. Use returned per-arm robot state and\nthe configured inline camera view(s) as the primary visual source of truth.\nAuxiliary camera views are saved as artifacts for targeted follow-up checks.","origin":"old","zh":"通过受限的结构化工具控制物理 Franka 双臂。每个动作都涉及真机安全。优先依据工具返回的各臂状态和配置的内嵌相机画面。辅助相机画面保存为附件，供需要时作针对性检查。"},{"en":"1. Start by calling describe_dual_franka_setup. Read the returned runtime conventions, available primitives, camera aliases, VLA policy conditioning text, and semantic stop rules before acting.\n\n2. Routine view_env_state and primitive snapshots inline the configured primary view(s). Additional camera views remain available through artifact paths; inspect one only when the current step specifically requires it.\n\n3. Metric localization uses camera views registered by the robot config. Some registered localization views may be external to the VLA checkpoint input.\n\n4. Every rule-based motion must choose exactly one arm, 'left' or 'right'.\n\n5. There is no 'both' mode; the driver leaves the unselected arm uncommanded.\n\n6. Express move_delta and rotate_delta in the fixed world (right_base) frame.\n\n7. Inspect the synchronized snapshot returned by each mutating primitive directly. Call view_env_state after a primitive only when the primitive failed, returned no snapshot, an operator changed the scene, or you need a specific historical step.\n\n8. Use purposeful corrections and use the configured inline view(s) as the primary visual evidence.\n\n9. Never use a VLA trained for another embodiment or action normalization.\n\n10. VLA segment tools accept a planner-facing prompt. A deployment may still override it with a checkpoint-specific training instruction during policy inference; inspect the tool result to see requested/effective prompts.\n\n11. Treat a VLA segment stop as the end of one manipulation segment, not as proof that its physical goal succeeded.\n\n12. Inspect joint_health after every mutation and recover joint posture before continuing when either arm reports warning or critical.\n\n13. If state, cameras, or motion results are inconsistent, stop instead of guessing.","origin":"old","zh":"1.\n从呼叫开始describe_dual_franka_setup.\n读取返回的运行时间常规,可用的原始,相机的别名,VLA政策规范文本,和语义停止规则在行动前。\n2.\n常规view_env_state,然后将原始的快照插入已配置的主视图。\n其他镜头视图仍可通过文物路径获取;仅在当前步骤有具体要求时检查一次。\n3.\n计量本地化使用机器人配置注册的相机视图.\n一些已注册的本地化视图可能不属于VLA检查站输入.\n4.\n每一个基于规则的动作必须选择准确的一只手臂,\"左\"或\"右\".\n5.\n没有“ 两者” 模式; 驱动程序未命令未选择的手臂 。\n6.\n运算move_delta和rotate_delta在固定世界中right_base(原始内容存档于2018-03-26). frame.\n7.\n检查每个变异原始直接返回的同步快照.\n调用view_env_state只有在原始的失败后,才返回任何快照,操作员会改变场景,或者需要特定的历史步骤.\n8.\n使用目的性校正并使用配置的内含视图作为主要视觉证据.\n9.\n永远不要用VLA训练了另一个化身或行动正常化。\n10.\nVLA片段工具接受一个编程器的提示 。\n在政策推论期间,部署仍可能用针对检查站的训练指示取代;检查工具结果,以发现所要求的/有效的提示。\n11.\n处理 aVLA段作为一个操纵段的结束而停止,而不是作为它物理目标成功的证据.\n12.\n检查joint_health在每次突变后恢复联合态势,然后在臂部报告警告或危急时继续。\n13.\n如果状态,摄像头,或者运动结果不一致,停止而不是猜测."},{"en":"1. Read describe_dual_franka_setup or view_env_state for available_camera_views before choosing a camera name. The tool schema does not enumerate views because real deployments may register additional cameras in the robot config.\n\n2. Use back_project only for pixels selected from the named camera image. Choose a pixel well inside visible material of the named target object or target container, away from silhouettes, rims, walls, wires, occluders, and background. Never project image-space air above an object.\n\n3. When SAM3 is available, use segment on a registered localization camera to segment visible target objects or destination regions before manual pixel projection. Inspect the returned mask overlay yourself; trust the returned right_base point only when the mask and median marker cover the intended target.\n\n4. SAM3 text prompts are phrase-sensitive. Prefer short color/object/relation phrases. If a text prompt returns a very low score, retry a shorter/rephrased prompt or point prompt rather than lowering min_score.\n\n5. After every projection, inspect the returned annotated camera image. The marker center must be visibly inside the intended target material; selection_valid=true is necessary but not sufficient. Retry a more central interior pixel whenever the marker looks wrong.\n\n6. Treat right_base as the only world coordinate frame for agent reasoning. After a verified projection, trust the returned right_base xyz and TCP-to-point deltas as the primary metric evidence; do not override them with unaided 2D RGB distance guesses.\n\n7. Do not move an arm or held object merely to improve camera visibility. If visibility is insufficient, mark the state uncertain or stop for operator feedback instead of performing active-vision motions.","origin":"old","zh":"1.\n读取describe_dual_franka_setup或view_env_state(单位:千美元)available_camera_views在选择相机名称之前。\n工具计划没有列出视图,因为真正的部署可能会在机器人配置中注册额外的相机.\n2.\n使用back_project仅用于从命名的相机图像中选择的像素。\n选择一个像素井在指定目标物体或目标容器的可见材料内,远离圆柱,圆柱,墙壁,电线,斜角,以及背景.\n永远不要在物体上方投射图像空间空气.\n3.\n何时SAM3在手动像素投影之前,可以使用注册本地化相机上的片段来分割可见的目标对象或目的地区域。\n检查返回的面具覆盖自己; 信任返回的right_base当面罩和中位数标记覆盖预定目标时,才指针。\n4.\nSAM3文本提示为短语敏感。\n首选短色/object/relation语句。\n如果文本提示返回一个非常低的分数,请重试一个较短/ 重译的提示或点提示而不是降低min_score.\n5.\n每次投影后,检查返回的附加说明的相机图像.\n标记中心必须在预定目标材料内明显可见;selection_valid事实是必要的,但还不够。\n当标记显示错误时, 重试一个更中央的内置像素 。\n6.\n处理right_base作为代理推理的唯一世界协调框架.\n在经过核实的投影后,信任返回者right_base页:1TCP- 将三角洲指为主要的证据;不以无助方式凌驾于它们之上2D RGB 距离猜测.\n7.\n不要仅仅为了提高相机的能见度而移动手臂或持有的物体。\n如果能见度不足,请标记状态不确定或停止操作者反馈,而不是执行主动视动."},{"en":"1. Use VLA segment tools for contact-rich motion: vla_right_grasp, vla_handoff, and vla_left_place.\n\n2. vla_right_grasp ends after right gripper closure plus lift; vla_handoff ends after right gripper opening plus a configured release delay; vla_left_place ends after left gripper opening plus lift. These boundaries only mean a segment ended; verify physical success from images, gripper widths/open flags, and projection geometry before continuing.\n\n3. After a grasp VLA, do not decide lifted/held status from 2D appearance alone. Check right gripper state and the latest inline image. If held status is unclear, project the best visible held-object surface when possible and compare right_base z primarily with the source/table height or pre-grasp source projection.\n\n4. If a verified projection of the intended object or held-object surface is higher than source/table height, treat the grasp as successful and proceed to vla_handoff. Mark failure only when verified projection shows the same object still at table height and gripper/image evidence shows the right gripper is empty or not supporting it.\n\n5. After a confirmed right-hand grasp, call vla_handoff directly. Do not use move_delta, rotate_delta, open_gripper, close_gripper, or any other rule-based primitive to prepare or reposition either arm for handoff; the VLA owns the bimanual approach, relative pose adjustment, left-hand grasp, right-hand release, and collision-aware transfer.\n\n6. Before vla_left_place, first verify that vla_handoff has ended and the left gripper holds the intended object. If the left hand is not clearly holding the object, do not stage for placement.\n\n7. For placement staging, project a clearly valid target pixel inside the required destination, then use projected x/y only. Keep the current left TCP z with delta_z=0 by default; do not move to the projected z coordinate or add large vertical clearance. Let vla_left_place handle descent, release, and post-release lift.","origin":"old","zh":"1.\n使用VLA用于多接触运动的片段工具:vla_right_grasp,vla_handoff,以及vla_left_place.\n2.vla_right_grasp右握结加升降机后结束;vla_handoff在右抓取器打开后结束, 加上配置的释放延迟 ;vla_left_place左握手打开加升降机后结束。\n这些边界仅意味着一个段结束;从图像、抓子宽度/打开的旗帜以及投影几何来验证物理成功,然后继续。\n3.\n抓住后,你就会知道VLA中,不决定解除/持有2独自出现。\n检查右抓取状态和最近的内含图像 。\n如果持有状态不明,请尽可能投射最可见的持有对象表面, 并进行比较right_basez主要与源/表高度或预加热源投影.\n4.\n如果经核实的预定物体或持有物表面投影高于源/表高度,则将捕获视为成功并着手进行vla_handoff.\n标记失败只当经过验证的投影显示仍然处于表高度的同一对象时,而抓取者/图像的证据表明右抓取者是空的或不支持它.\n5.\n在确认右手抓好后,打电话vla_handoff直接来.\n不使用move_delta,rotate_delta,open_gripper,close_gripper,或者任何其他基于规则的原始,以准备或重新定位两个臂进行交接;VLA拥有双体方法,相对摆放调整,左手抓住,右手放出,以及碰撞感应转移.\n6.\n在此之前vla_left_place,首先核实vla_handoff已终止,左抓手持有预定对象。\n左手未明确持有物体的,不得分期放置.\n7.\n在投放中,在所需的目的地内投射一个明显有效的目标像素,然后只使用预测的x/y。\n保持当前左侧TCPz 带delta_z=0;不移动到预测的z坐标或添加大型垂直清除。\n让vla_left_place控制下降,释放, 和释放后升降。"},{"en":"1. Call describe_dual_franka_setup, then inspect the initial synchronized state.\n\n2. Build a conservative localization table for the current category from the latest inline image and keep it updated after each primitive.\n\n3. After each motion, inspect the returned result before choosing the next action.\n\n4. Use the task's VLA segment tools for contact-rich motion.\n\n5. Finish only when the success evidence is visible and consistent with state.","origin":"old","zh":"1.\n调用describe_dual_franka_setup,然后检查初始同步状态。\n2.\n从最近的内嵌图像中为当前类别构建一个保守的本地化表,并在每个原始图像后不断更新.\n3.\n每次动议之后,在选择下一步行动之前检查返回的结果.\n4.\n使用任务VLA用于多接触运动的分节工具。\n5.\n只有在成功证据明显且符合状态时才完成。"},{"en":"You control a physical dual-arm Franka setup through bounded structured\ntools. Treat every motion as safety-critical. Use returned per-arm robot state and\nthe configured inline camera view(s) as the primary visual source of truth.\nAuxiliary camera views are saved as artifacts for targeted follow-up checks.","origin":"robot","zh":"通过受限的结构化工具控制物理 Franka 双臂。每个动作都涉及真机安全。优先依据工具返回的各臂状态和配置的内嵌相机画面。辅助相机画面保存为附件，供需要时作针对性检查。"},{"en":"The runner owns the RLinf environment process. Do not start, stop, or\nrestart robot, Ray, ROS, camera, or VLA services. Use only the structured tools\nshown by the runtime.","origin":"robot","zh":"跑者拥有RLinf环境过程.\n不启动、停止或重新启动机器人、雷、ROS、相机或VLA服务。\n只使用运行时显示的结构化工具 。"},{"en":"Start with describe_dual_franka_setup. Read the runtime conventions,\navailable primitives, camera aliases, VLA conditioning text and semantic stop\nrules. Before motion in every session, call request_scene_reset and wait for\nthe operator to restore the scene, secure held objects and confirm the reset path is clear.\nMotion requires a successful posture reset and fresh synchronized observations.","origin":"robot","zh":"开始describe_dual_franka_setup.\n读取运行时的常规,可用的原始,相机的别名,VLA规范文本和语义停止规则。\n在每届会议动议之前,请打电话request_scene_reset并等待操作员恢复现场, 安全保管对象和确认重设路径是清楚的。\n运动需要一次成功的姿态重设和新的同步观测."},{"en":"Routine snapshots inline the configured primary views. Check auxiliary\ncamera artifacts only for a specific question. Read available_camera_views from\ndescribe_dual_franka_setup or view_env_state. Registered localization cameras\nmay differ from the VLA inputs. Use back_project on visible material in the\nnamed image; never project into air above the object.\n\nWhen SAM3 is available, use segment before manual projection. Check the mask\noverlay and median marker. For low scores, try a shorter color/object/relation\nphrase or a point prompt. Keep min_score unchanged. Inspect the annotated\nimage after every projection: selection_valid=true alone does not verify the\ntarget. Retry a central interior pixel if the marker misses. Use verified\nright_base xyz and TCP-to-point deltas for metric distances. Never move an\narm or a held object solely to improve visibility. Mark uncertain observations\nor stop for operator feedback.\n\nBuild a conservative localization table for the current\ncategory from the latest inline image. Update it after each primitive.","origin":"robot","zh":"常规快照插入已配置的主视图 。\n检查辅助相机文物只针对特定问题.\n读取available_camera_views从describe_dual_franka_setup或view_env_state.\n注册本地化摄像头可能与VLA投入。\n使用back_project在命名图像中的可见材料上; 绝不投射到物体上方的空气中。\n何时SAM3可用,在手动投影前使用段。\n检查面罩上方和中值标记.\n对于低分,请尝试较短的颜色/object/relation语句或点提示。\n保留min_score不变。\n检查每次投影后的注解图像 :selection_valid仅凭事实并不能验证目标\n如果标记漏掉, 则重试中央内置像素 。\n使用已校验right_base页:1TCP-到三角洲进行测量距离。\n永远不要只为了提高能见度而移动手臂或被持有的物体.\n标记不确定的观察或停止操作者反馈.\n从最近的内含图像为当前类别构建一个保守的本地化表格。\n每一个原始后更新它。"},{"en":"Each rule-based motion selects one arm, left or right. The other arm\nremains uncommanded. Express move_delta and rotate_delta in the fixed world\nframe (right_base). Inspect the synchronized snapshot returned by each\nmutation. Call view_env_state after a primitive only if it failed, returned\nno snapshot, an operator changed the scene, or a particular historical step\nis needed. Use purposeful corrections with the configured inline views.\n\nUse only a VLA trained for this embodiment and action normalization. Check the\nrequested and effective prompts in the tool result: the checkpoint deployment\ncan override the planner-facing prompt.\n\nvla_right_grasp ends after right gripper closure plus lift; vla_handoff ends after\nright gripper opening plus a configured release delay; vla_left_place ends after\nleft gripper opening plus lift. These boundaries only mean a segment ended; verify\nphysical success from images, gripper widths/open flags, and projection geometry\nbefore continuing.\n\nAfter a grasp VLA, do not decide lifted/held status from 2D appearance alone. Check\nright gripper state and the latest inline image. If held status is unclear, project\nthe best visible held-object surface when possible and compare right_base z\nprimarily with the source/table height or pre-grasp source projection.\n\nIf a verified projection of the intended object or held-object surface is higher\nthan source/table height, treat the grasp as successful and proceed to vla_handoff.\nMark failure only when verified projection shows the same object still at table\nheight and gripper/image evidence shows the right gripper is empty or not supporting\nit.\n\nAfter a confirmed right-hand grasp, call vla_handoff directly. Do not use\nmove_delta, rotate_delta, open_gripper, close_gripper, or any other rule-based\nprimitive to prepare or reposition either arm for handoff; the VLA owns the bimanual\napproach, relative pose adjustment, left-hand grasp, right-hand release, and\ncollision-aware transfer.\n\nBefore vla_left_place, first verify that vla_handoff has ended and the left gripper\nholds the intended object. If the left hand is not clearly holding the object, do\nnot stage for placement.\n\nFor placement staging, project a clearly valid target pixel inside the required\ndestination, then use projected x/y only. Keep the current left TCP z with delta_z=0\nby default; do not move to the projected z coordinate or add large vertical\nclearance. Let vla_left_place handle descent, release, and post-release lift.","origin":"robot","zh":"每个规则运动选择一个手臂,左或右.\n另一只手臂没有被控制\n运算move_delta和rotate_delta在固定世界框架内right_base).\n检查每个突变返回的同步快照 。\n调用view_env_state仅当一个原始文件失败后,不返回快照,操作员改变场景,或者需要特定的历史步骤.\n用已配置的内含视图进行有目的的校正 。\n仅使用 aVLA为这一体现和行动正常化而接受过培训。\n检查工具结果中请求的有效提示: 检查站部署可以覆盖规划员的提示。 Name\nvla_right_grasp右握结加升降机后结束;vla_handoff在右抓取器打开后结束, 加上配置的释放延迟 ;vla_left_place左握手打开加升降机后结束。\n这些边界仅意味着一个段结束;从图像、抓子宽度/打开的旗帜以及投影几何来验证物理成功,然后继续。\n抓住后,你就会知道VLA中,不决定解除/持有2独自出现。\n检查右抓取状态和最近的内含图像 。\n如果持有状态不明,请尽可能投射最可见的持有对象表面, 并进行比较right_basez主要与源/表高度或预加热源投影.\n如果经核实的预定物体或持有物表面投影高于源/表高度,则将捕获视为成功并着手进行vla_handoff.\n标记失败只当经过验证的投影显示仍然处于表高度的同一对象时,而抓取者/图像的证据表明右抓取者是空的或不支持它.\n在确认右手抓好后,打电话vla_handoff直接来.\n不使用move_delta,rotate_delta,open_gripper,close_gripper,或者任何其他基于规则的原始,以准备或重新定位两个臂进行交接;VLA拥有双体方法,相对摆放调整,左手抓住,右手放出,以及碰撞感应转移.\n在此之前vla_left_place,首先核实vla_handoff已终止,左抓手持有预定对象。\n左手未明确持有物体的,不得分期放置.\n在投放中,在所需的目的地内投射一个明显有效的目标像素,然后只使用预测的x/y。\n保持当前左侧TCPz 带delta_z=0;不移动到预测的z坐标或添加大型垂直清除。\n让vla_left_place控制下降,释放, 和释放后升降。"},{"en":"Check joint_health after every mutation. If either arm reports warning\nor critical, use recover_joint_posture before continuing. Stop when state,\ncameras or motion results are inconsistent.","origin":"robot","zh":"每次改变状态后检查 joint_health。任一机械臂出现 warning 或 critical 时，先使用 recover_joint_posture。状态、相机或运动结果不一致时停止。"},{"en":"When the visual evidence and state indicate an outcome, call\nrequest_operator_verdict. With continue, keep working. Finish only with\na current operator success or failure verdict.","origin":"robot","zh":"当图像证据与状态表明任务已有结果时，调用 request_operator_verdict。若收到 continue 就继续工作。只有收到操作员针对当前状态的 success 或 failure 判定才能结束。"},{"en":"- task_name: clean_desk_dirty_clean_sorting_agent_vla\n- instruction: Complete a dual-arm collaborative tabletop object-storage task in this object category order: bowls, plates, cup, chopsticks, then spoon. Finish the entire current category before targeting anything from the next category. Within any category that has multiple colored source objects, use this color order: process green before blue. Do not let dirty/clean status change the grasp order. The only added logic is placement-time dirty/clean sorting for bowls and plates: before grasping each bowl or plate, classify whether it is dirty or clean. Dirty bowls and dirty plates go into the metal wire basket/frame; clean bowls and clean plates go into the black-outside, white-inside cardboard box. The cup still goes into the cardboard box, and the chopsticks and spoon still go inside the cup after the cup is stable in the cardboard box. After the right hand successfully grasps an object, call vla_handoff directly from the confirmed post-grasp state. Before calling vla_left_place, localize the required target container and horizontally align the left-held object above that target.\n- initial_setup: This is a dirty/clean sorting variant of the clean-desk task, using category order bowls, plates, cup, chopsticks, spoon and green-before-blue order within each category. The base camera and fourth-view D455 are RealSense RGBD cameras, but this dirty/clean sorting task exposes D455 metric localization tools. D455 aligned depth can be back-projected into the right_base frame using the calibrated extrinsics. The D455 is a fixed external camera; moving either arm or a held object does not move the camera viewpoint and must not be used as an active-vision strategy. right_base is the shared world coordinate frame exposed to the agent: camera points, left/right TCP positions, and rule-based base-frame deltas are all represented in right_base. The black-outside, white-inside cardboard box is on the +y side of the adjacent metal wire basket/frame. Both containers are valid in this task: the metal wire basket/frame is the required destination for dirty bowls and dirty plates, while the cardboard box is the required destination for clean bowls and clean plates. A dirty bowl or plate is marked by a visible egg tart or egg-tart foil cup/tray inside or on the concave eating surface; a clean bowl or plate has no egg tart or egg-tart foil cup/tray marker. Use the contrast between the black exterior and white interior as the cardboard-box inside/outside boundary, and use the metal wires/rim as the metal basket boundary. The VLA checkpoint is the deployment-aligned dual-arm tcp-rot6d clean-desk policy; named VLA tools keep using its fixed training instruction, while the planner decides the dirty/clean destination.\n- success_criteria: All target objects have been processed in the required category order. All dirty bowls and dirty plates are inside the metal wire basket/frame. All clean bowls, clean plates, and the cup are inside the black-outside, white-inside cardboard box. The chopsticks and spoon are inside the cup after the cup is stable inside the cardboard box. Stop for operator feedback if a dirty/clean label is uncertain, if an object was placed in the wrong container, or if visual evidence does not support safe continuation.","origin":"old","zh":"-task_name:clean_desk_dirty_clean_sorting_agent_vla\n- 指令:在本对象类别顺序中完成双臂合作桌面对象存储任务:碗、盘子、杯子、筷子,然后是勺子。\n完成全部当前类别,然后瞄准下一个类别中的任何内容。\n在任何有多个色源对象的分类中,请使用此颜色顺序: 过程绿色前为蓝色.\n不要让脏/干净状态改变抓取顺序 。\n唯一增加的逻辑是放置时间的脏/清洁分拣碗盘和盘子:在抓住每个碗盘或盘子之前,对它是否脏或干净进行分类.\n脏碗和脏盘进入金属线篮/框;干净碗和干净板进入黑外,白内夹的纸板盒.\n杯子仍进入纸板盒,在纸板盒中杯子稳定后,筷子和勺子仍进入杯子内部.\n在右手成功抓住对象后,拨打vla_handoff直接从确认的后重力状态。\n打电话之前vla_left_place,将所需的目标容器定位,并在该目标之上水平对齐左控对象。\n-initial_setup:这是清洁桌任务的一种脏/干净的排序变体,使用分类顺序碗,盘,杯,筷子,勺子以及每个分类中的绿色前蓝色顺序.\n底部摄像头和第四景 D455是 RealSense RGBD 相机,但是这个肮脏/干净的排序任务暴露了 D455度量本地化工具。\nD级455对齐的深度可以反射到right_base框架使用校准外线。\nD级455是固定的外部相机; 移动手臂或被持有的对象不会移动相机视角, 并且不能作为主动视战略使用。right_base是暴露在代理机上的共享世界坐标框架:相机点,左/右TCP和基于规则的基础框架三角洲均在right_base.\n黑色外侧,白色内侧纸板箱位于相邻的金属线篮/框的+y侧.\n这两种容器在这项任务中都是有效的:金属铁丝篮/车身是脏碗和脏板的必备目的地,而纸板盒则是干净碗和清洁板的必备目的地.\n脏碗或盘子的标志是,在食用表面内部或孔隙上有明显的蛋质芋头或卵质陶瓷杯/盘子;干净的碗或盘子没有蛋质芋头或卵质陶瓷杯/盘子标记.\n使用黑色外框与白色内框之间的对比作为内,外边界的纸板箱,并使用金属线/环作为金属篮子边界.\n那个...VLA检查站是部署相匹配的双臂旋转式6d 清洁办公桌政策;名称VLA工具继续使用其固定的训练指示,而规划者则决定肮脏/干净的目的地。\n-success_criteria:所有目标对象都按规定的类别顺序进行了处理.\n所有脏碗和脏盘都在金属线篮/框内.\n所有干净的碗,干净的盘子,杯子都放在黑外板箱内,白内板纸箱内.\n筷子和勺子在杯子在纸板盒内稳定后放在杯子内部.\n如果一个脏/干净的标签不确定,如果一个物体被放置在错误的容器中,或者视觉证据不支持安全续作,则停止操作员反馈."},{"en":"1. Call describe_dual_franka_setup before acting.\n2. Call view_env_state before the first action only if no fresh primitive snapshot is already available. After any primitive that returns a snapshot, inspect that returned snapshot directly; never call view_env_state immediately afterward unless the primitive failed, returned no snapshot, an operator changed the scene, or a specific historical step is needed.\n3. Enforce this grasp order without exception: first category order bowls -> plates -> cup -> chopsticks -> spoon, then within any category that has multiple colored source objects, green before blue. Always act on the earliest unfinished category. While any object from that category remains in the source workspace, do not localize, approach, grasp, or call a VLA grasp skill for any later category. Within the current category, do not localize, approach, grasp, or call a VLA grasp skill for a blue object while a green object from the same category remains in the source workspace.\n4. Dirty/clean status must not reorder grasping. For bowls and plates, first choose the next object by the category/color order, then classify that chosen object as dirty or clean, and only use the dirty/clean label to choose the placement destination before vla_left_place.\n5. Classify dirty vs clean before each bowl or plate attempt. A dirty bowl or plate has a visible egg tart or egg-tart foil cup/tray inside or on the concave eating surface; a clean bowl or plate has no egg tart or egg-tart foil cup/tray marker. If the egg-tart marker is occluded, ambiguous, outside the dish, or cannot be judged in the latest D455 image, do not move the robot; request operator feedback.\n6. An egg tart or egg-tart foil cup/tray counts as a dirty marker only if it is visibly inside or on the concave eating surface of that specific bowl or plate. A nearby egg tart or foil tray on the table, in another object, or outside the dish must not make the dish dirty.\n7. Build a brief D455 localization and sorting table before moving in each category. For each visible candidate in the current category, list object type, color if visible, dirty_clean_label for bowls/plates, egg_tart_evidence for bowls/plates, required_destination, D455 evidence, projected point if used, and status.\n8. When SAM3 is available, use segment with camera='d455' on the D455 image to segment the current object or required placement target before falling back to a manual pixel. Use short phrases, inspect the returned mask overlay yourself, and retry with a point prompt, more specific text prompt, or manual D455 pixel whenever the mask or median marker is not visibly on the intended target.\n9. Use back_project only on a pixel well inside the visible material of the intended object or placement container. Do not select the table, background, rim edge, air above the object, another object, a container wall, metal wire, or a shared container boundary. Inspect the returned annotated image; if the marker is not on the intended target, retry or stop.\n10. When exact spatial relation is uncertain, use segment or back_project again instead of judging metric x/y/z offsets by 2D RGB appearance. After a segmentation/projection is verified, trust the returned right_base xyz and TCP-to-point deltas as the main metric evidence for rule-based correction moves.\n11. Treat right_base as the only world coordinate frame for agent reasoning. For both left and right arms, move_delta and rotate_delta use right_base/world deltas; do not convert left-arm coordinates yourself.\n12. For bowls, do not use rule-based move_delta to pre-align or move above the bowl before vla_right_grasp. This avoids pushing the learned VLA policy out of distribution. After D455 confirms the intended bowl identity and dirty/clean label, call vla_right_grasp directly from the current robot state.\n13. For plates, the cup, chopsticks, and the spoon, rule-based pre-grasp staging is allowed only when clearly needed: move the right TCP to a safe pre-grasp pose about 10cm above the projected target surface point in right_base/world coordinates, without touching the object.\n14. Call vla_right_grasp directly after bowl identity and dirty/clean classification are confirmed. For non-bowl objects, call vla_right_grasp only after the latest right-arm move_delta reports a reached/effective target near the intended object, unless the object is already safely staged. Leave max_chunks unset unless running a cautious diagnostic.\n15. Use VLA segment tools for contact-rich motion: vla_right_grasp for the right-arm grasp segment, vla_handoff for bimanual transfer, and vla_left_place for left-arm placement.\n16. After a grasp VLA, inspect the returned snapshot. Continue only if the right gripper appears to hold the intended object. Do not judge lifted/held status from 2D image appearance alone. If it is unclear whether the object has lifted or remains on the table, call back_project with camera='d455' on the best visible held-object surface when possible. If only a source/table candidate is visible, treat that projection as a source-candidate check, not proof of failure. Compare returned right_base z primarily with the source/table height or pre-grasp source projection. For wide objects such as plates, projected center/rim x/y can be far from the right TCP while still held; do not mark failure from TCP x/y distance alone. If a verified projection of the intended object or held-object surface is higher than the source/table height or pre-grasp source projection, treat the grasp as successful and proceed to vla_handoff. Mark failure only when a verified projection shows the same intended object still at source/table height and gripper/image evidence shows the right gripper is empty or not supporting it. If the object is occluded or identity/source is ambiguous, mark the grasp status uncertain and request operator feedback instead of opening or retrying. If the wrong object is grasped or identity is uncertain, stop for operator feedback.\n17. After a confirmed right-hand grasp, call vla_handoff directly. Do not call move_delta, rotate_delta, open_gripper, close_gripper, or any other rule-based primitive to prepare or reposition either arm before handoff; vla_handoff owns the complete bimanual approach and transfer from the post-grasp state.\n18. Before vla_left_place, confirm vla_handoff has ended and the left gripper holds the intended object. If the held bowl or plate was classified dirty, localize an interior placement point inside the open metal wire basket/frame. If it was classified clean, localize a white interior floor/cavity placement point at the cardboard-box center, still clearly inside the box. For the cup, localize the same cardboard-box placement area. For chopsticks or the spoon, localize the target cup after the cup is stable inside the cardboard box. Stage the left-held object with safe left-arm horizontal x/y move_delta only when staging is needed: use the projected target x/y, keep the current left TCP z with delta_z=0 by default, do not move to the projected z coordinate, and do not add a large vertical clearance. Call vla_left_place only if the latest staging move succeeded and reports a reached/effective target. If the staging move fails, is uncertain, or does not reach the target, do not call vla_left_place.\n19. The metal wire basket/frame is the target only for dirty bowls and dirty plates. The black-outside, white-inside cardboard box is the target only for clean bowls and clean plates. Do not count dirty objects in the cardboard box or clean objects in the metal basket as success.\n20. Advance to the next category only after the latest inline D455 image confirms that every object in the current category has reached its required destination, or that no such object remains available in the source workspace after a careful visual check.\n21. The D455 is a fixed external camera. Do not move either arm or held object merely to improve camera visibility. Arm motion is allowed only for task execution or safety: free-space approach/staging, VLA handoff/placement/grasp execution, or joint recovery.\n22. After every VLA or rule-based action, inspect joint_health in the returned snapshot. If either arm is warning or critical, especially right-arm q1 positive / q3 negative accumulation, call recover_joint_posture before continuing more VLA chunks; it records each gripper's open/closed state, re-commands that state before and after joint reset so closed grippers stay clamped, resets both arms' joints, then returns both TCPs near their pre-recovery right_base poses.\n23. The agent must not finish the episode by itself. Call finish only after an operator_verdict.status of success or failure is observed.\n24. If depth is missing, projection is uncertain, the intended object is occluded, dirty/clean status is uncertain, or success is ambiguous, do not infer metric deltas from RGB alone; stop for operator feedback instead of opening a gripper or blindly retrying.","origin":"old","zh":"1.\n调用describe_dual_franka_setup在行动之前。\n2.\n调用view_env_state在第一个动作之前,只有在没有新的原始快照可用的情况下。\n返回快照后,请直接检查返回的快照; 永远不要调用view_env_state紧接着,除非原始的失败,不返回快照,操作员改变了场景,或者需要特定的历史步骤.\n3.\n毫无例外地执行此抓取顺序: 第一类顺序碗 -> 盘 -> 杯 -> 筷子 -> 勺子,然后在有多个色源对象的任何类别内,绿色前为蓝色.\n总是按最早的未完成类别行事.\n虽然该类别的任何物体仍留在源工作空间,但不定位、接近、抓住或调用VLA掌握任何后一类的技能。\n在当前类别中,不将地方化、接近、掌握或称为VLA当同一类的绿色物体留在源工作空间时,要抓住蓝色物体的技能。\n4.\n肮脏/清洁状态不能重新排序。\n对于碗盘和盘片,首先按类别/颜色顺序选择下一个对象,然后将选择的对象分类为脏或干净,仅使用脏/干净的标签来选择放置目的地之前vla_left_place.\n5.\n在每次尝试之前将脏的vs 分类干净.\n脏碗或盘子在食用表面内部或孔隙上有明显的蛋芋或蛋芋螺杯/盘子;干净的碗或盘子没有蛋芋或蛋芋螺杯/盘子标记.\n如果彩蛋标记被覆盖、模糊、盘子外,或者无法在最新的D中判断455图像,不要移动机器人;请操作员反馈。\n6.\n彩蛋或彩蛋陶瓷杯/圆盘只有在明显地在内部或食用该特定碗或盘子的圆锥表面时,才算作脏标记。\n旁边的蛋馅饼或软骨托盘放在桌子上,放在另一个物体上,或者在菜肴外,不得使菜肴变得脏.\n7.\n构建一个简短的 D455本地化和排序表,然后移动到每个类别。\n对于当前类别中的每个可见候选人,列表对象类型,如果可见的颜色,dirty_clean_label为碗/盘,egg_tart_evidence为碗/盘,required_destination,D类455证据、使用时的预测点和状态。\n8.\n何时SAM3可用, 使用带相机='d的段455'在D节455图像在返回到手动像素之前将当前对象或需要的放置目标分割开来。\n使用短短语,检查返回的面具覆盖自己,然后用点提示,更具体的文字提示,或手动 D 重试455当面罩或中值标记未明显出现在预定目标上时,像素.\n9.\n使用back_project仅在预定物体或放置容器的可见材料内的像素井上。\n不选择表格,背景,边框,物体上方的空气,另一个物体,容器壁,金属线,或共用容器边界.\n检查返回的注释图像;如果标记不在预定目标上,请重试或停止 。\n10.\n当精确的空间关系不确定时,使用段或back_project而不是再次判断度量 x/y/z减 减:2D RGB外观.\n在确认分块/投影后,信任返回者right_base页:1TCP- 将三角洲指为按规则进行校正的主要尺度证据。\n11.\n处理right_base作为代理推理的唯一世界协调框架.\n左右两臂move_delta和rotate_delta使用情况right_base/world三角洲;不要转换左臂坐标 。\n12.\n对于碗,不要使用基于规则move_delta以预对齐或移动到碗上方vla_right_grasp.\n这样可以避免推高学问VLA政策不分发。\n在D之后455证实预定的碗状身份和污/清洁标签,调用vla_right_grasp直接从当前机器人状态.\n13.\n对于盘子,杯子,筷子,以及勺子,只有明确需要时才允许按规则进行前加压:移动右侧TCP安全前摆姿势10cm超过预测目标表面点right_base/world坐标,不碰物体。\n14.\n调用vla_right_grasp直接在碗身份和脏/清洁分类后确认。\n对于非弓形物体,请打电话vla_right_grasp仅在右臂后方move_delta报告预定物体附近达到/有效目标,除非该物体已经安全进行。\n离开max_chunks除非进行谨慎的诊断,否则无法设置 。\n15.\n使用VLA用于多接触运动的片段工具:vla_right_grasp为右臂的握手部位,vla_handoff双人调剂,以及vla_left_place左臂放置。\n16.\n抓住后,你就会知道VLA,检查返回的快照。\n只有在右手握住预定对象时才继续。\n不评判从2D形象独现身.\n如果不清楚物体是否已升空或仍在桌面上,请拨back_project带相机='d455尽可能在最可见的物体表面。\n如果只可见一个来源/表单候选人,则将该投影作为来源-候选人核对,而不是失败的证据。\n比较返回right_basez主要与源/表高度或预加热源投影.\n对于板块等宽的物体,投影中心/环 x/y可以远离右侧.TCP;不标记失败TCPx/y 单独距离.\n如果经核实的预定物体或持有物表面投影高于源/表高度或预加热源投影,则将抓住视为成功并着手进行vla_handoff.\n只有在经核实的投影显示仍然处于源/表高度的同一预定物体时,才标记失败,而握手/图像证据表明右握手是空的或不支持它.\n如果对象被占用或身份/来源模糊,请标记抓取状态不确定,并请求操作者反馈而不是打开或重试.\n如果抓错对象或身份不确定,停止操作员反馈.\n17.\n在确认右手抓好后,打电话vla_handoff直接来.\n不要打电话move_delta,rotate_delta,open_gripper,close_gripper,或者任何其他基于规则的原始,在交接前准备或重新定位任何一只手臂;vla_handoff拥有完整的双体方法,并从后重力状态转移.\n18.\n在此之前vla_left_place,确认vla_handoff已终止,左抓手持有预定对象。\n如果被扣的碗或盘子是被划为脏的,将打开的金属铁丝篮/框内的一个内部放置点定位.\n如果被分类为清洁,则在纸板箱中心定位一个白色的室内地板/卡通放置点,仍清晰地位于箱内.\n对于杯子,将同一个纸板箱放置区域本地化.\n对于筷子或勺子,在杯子在纸板盒内稳定后将目标杯本地化.\n以安全左臂水平 x/y 位移左控对象move_delta仅在需要中转时:使用预计目标 x/y,保持当前左侧TCPz 带delta_z=0默认情况下,不移动到预计的z坐标,也不添加大型垂直清除。\n调用vla_left_place只有在最新的中转动作成功并报告达到/有效目标的情况下。\n如果中转动作失败,不确定,或者没有到达目标,不要呼叫vla_left_place.\n19.\n金属铁丝篮/框架只针对脏碗和脏板.\n黑外,白内纸板箱仅是清洁碗和清洁板的目标.\n不要将纸板盒中的脏物或金属篮中的清洁物算作成功.\n20.\n只有在最近输入的D之后才预支到下一个类别455图像证实,当前类别中的每一个物体都已经到达其要求的目的地,或者在经过仔细的视觉检查后,源工作空间中没有这样的物体仍然可用.\n21.\nD级455是一个固定的外部相机。\n不移动手臂或持有的物体只是为了提高相机的可见度。\n武装运动只允许用于任务执行或安全:自由空间方法/固定,VLA交接/placement/grasp执行,或联合追回。\n22.\n之后的每一个VLA或基于规则的行动,检查joint_health在返回的快照中。\n如果任何一只手臂是警告或关键,特别是右臂q1正数 / q3负积累, 调用recover_joint_posture在继续之前VLA块;它记录每个抓发器的开/ 闭状态, 重制命令在联合重置之前和之后的状态 如此封闭的抓发器会被夹住, 重置两臂的关节,然后返回两个 TCP在预回收器附近right_base姿势。\n23.\n特工不能独自完成剧集.\n仅待电话后再打operator_verdict.status发现成功或失败。\n24.\n如果缺少深度,投影是不确定的,预定对象被吞噬,脏/干净状态是不确定的,或者成功是模糊的,不从RGB中推断出仅是度量三角洲;停止操作者反馈而不是打开抓取器或盲目重试."},{"en":"Call describe_dual_franka_setup, then request_scene_reset before acting.\nAfter operator confirmation and a successful reset, inspect the fresh visual evidence\ntogether with both arms' TCP/gripper/joint-health state, and execute the task\nconservatively with the exposed bounded tools. Auxiliary camera views are\nartifact views for targeted follow-up inspection only.","origin":"old","zh":"调用 describe_dual_franka_setup 读取配置，然后在行动前调用 request_scene_reset。操作员确认且复位成功后，结合新图像和双臂 TCP、夹爪、关节健康状态，通过已开放的受限工具谨慎执行任务。辅助相机附件仅用于针对性的补充检查。"},{"en":"- task_name: clean_desk_dirty_clean_sorting_agent_vla\n- instruction: Complete a dual-arm collaborative tabletop object-storage task in this object category order: bowls, plates, cup, chopsticks, then spoon. Finish the entire current category before targeting anything from the next category. Within any category that has multiple colored source objects, use this color order: process green before blue. Do not let dirty/clean status change the grasp order. The only added logic is placement-time dirty/clean sorting for bowls and plates: before grasping each bowl or plate, classify whether it is dirty or clean. Dirty bowls and dirty plates go into the metal wire basket/frame; clean bowls and clean plates go into the black-outside, white-inside cardboard box. The cup still goes into the cardboard box, and the chopsticks and spoon still go inside the cup after the cup is stable in the cardboard box. After the right hand successfully grasps an object, call vla_handoff directly from the confirmed post-grasp state. Before calling vla_left_place, localize the required target container and horizontally align the left-held object above that target.\n- initial_setup: This is a dirty/clean sorting variant of the clean-desk task, using category order bowls, plates, cup, chopsticks, spoon and green-before-blue order within each category. The base camera and fourth-view D455 are RealSense RGBD cameras, but this dirty/clean sorting task exposes D455 metric localization tools. D455 aligned depth can be back-projected into the right_base frame using the calibrated extrinsics. The D455 is a fixed external camera; moving either arm or a held object does not move the camera viewpoint and must not be used as an active-vision strategy. right_base is the shared world coordinate frame exposed to the agent: camera points, left/right TCP positions, and rule-based base-frame deltas are all represented in right_base. The black-outside, white-inside cardboard box is on the +y side of the adjacent metal wire basket/frame. Both containers are valid in this task: the metal wire basket/frame is the required destination for dirty bowls and dirty plates, while the cardboard box is the required destination for clean bowls and clean plates. A dirty bowl or plate is marked by a visible egg tart or egg-tart foil cup/tray inside or on the concave eating surface; a clean bowl or plate has no egg tart or egg-tart foil cup/tray marker. Use the contrast between the black exterior and white interior as the cardboard-box inside/outside boundary, and use the metal wires/rim as the metal basket boundary. The VLA checkpoint is the deployment-aligned dual-arm tcp-rot6d clean-desk policy; named VLA tools keep using its fixed training instruction, while the planner decides the dirty/clean destination.\n- success_criteria: All target objects have been processed in the required category order. All dirty bowls and dirty plates are inside the metal wire basket/frame. All clean bowls, clean plates, and the cup are inside the black-outside, white-inside cardboard box. The chopsticks and spoon are inside the cup after the cup is stable inside the cardboard box. Stop for operator feedback if a dirty/clean label is uncertain, if an object was placed in the wrong container, or if visual evidence does not support safe continuation.\n- task constraints: 1. Call describe_dual_franka_setup before acting.\n2. Call view_env_state before the first action only if no fresh primitive snapshot is already available. After any primitive that returns a snapshot, inspect that returned snapshot directly; never call view_env_state immediately afterward unless the primitive failed, returned no snapshot, an operator changed the scene, or a specific historical step is needed.\n3. Enforce this grasp order without exception: first category order bowls -> plates -> cup -> chopsticks -> spoon, then within any category that has multiple colored source objects, green before blue. Always act on the earliest unfinished category. While any object from that category remains in the source workspace, do not localize, approach, grasp, or call a VLA grasp skill for any later category. Within the current category, do not localize, approach, grasp, or call a VLA grasp skill for a blue object while a green object from the same category remains in the source workspace.\n4. Dirty/clean status must not reorder grasping. For bowls and plates, first choose the next object by the category/color order, then classify that chosen object as dirty or clean, and only use the dirty/clean label to choose the placement destination before vla_left_place.\n5. Classify dirty vs clean before each bowl or plate attempt. A dirty bowl or plate has a visible egg tart or egg-tart foil cup/tray inside or on the concave eating surface; a clean bowl or plate has no egg tart or egg-tart foil cup/tray marker. If the egg-tart marker is occluded, ambiguous, outside the dish, or cannot be judged in the latest D455 image, do not move the robot; request operator feedback.\n6. An egg tart or egg-tart foil cup/tray counts as a dirty marker only if it is visibly inside or on the concave eating surface of that specific bowl or plate. A nearby egg tart or foil tray on the table, in another object, or outside the dish must not make the dish dirty.\n7. Build a brief D455 localization and sorting table before moving in each category. For each visible candidate in the current category, list object type, color if visible, dirty_clean_label for bowls/plates, egg_tart_evidence for bowls/plates, required_destination, D455 evidence, projected point if used, and status.\n8. When SAM3 is available, use segment with camera='d455' on the D455 image to segment the current object or required placement target before falling back to a manual pixel. Use short phrases, inspect the returned mask overlay yourself, and retry with a point prompt, more specific text prompt, or manual D455 pixel whenever the mask or median marker is not visibly on the intended target.\n9. Use back_project only on a pixel well inside the visible material of the intended object or placement container. Do not select the table, background, rim edge, air above the object, another object, a container wall, metal wire, or a shared container boundary. Inspect the returned annotated image; if the marker is not on the intended target, retry or stop.\n10. When exact spatial relation is uncertain, use segment or back_project again instead of judging metric x/y/z offsets by 2D RGB appearance. After a segmentation/projection is verified, trust the returned right_base xyz and TCP-to-point deltas as the main metric evidence for rule-based correction moves.\n11. Treat right_base as the only world coordinate frame for agent reasoning. For both left and right arms, move_delta and rotate_delta use right_base/world deltas; do not convert left-arm coordinates yourself.\n12. For bowls, do not use rule-based move_delta to pre-align or move above the bowl before vla_right_grasp. This avoids pushing the learned VLA policy out of distribution. After D455 confirms the intended bowl identity and dirty/clean label, call vla_right_grasp directly from the current robot state.\n13. For plates, the cup, chopsticks, and the spoon, rule-based pre-grasp staging is allowed only when clearly needed: move the right TCP to a safe pre-grasp pose about 10cm above the projected target surface point in right_base/world coordinates, without touching the object.\n14. Call vla_right_grasp directly after bowl identity and dirty/clean classification are confirmed. For non-bowl objects, call vla_right_grasp only after the latest right-arm move_delta reports a reached/effective target near the intended object, unless the object is already safely staged. Leave max_chunks unset unless running a cautious diagnostic.\n15. Use VLA segment tools for contact-rich motion: vla_right_grasp for the right-arm grasp segment, vla_handoff for bimanual transfer, and vla_left_place for left-arm placement.\n16. After a grasp VLA, inspect the returned snapshot. Continue only if the right gripper appears to hold the intended object. Do not judge lifted/held status from 2D image appearance alone. If it is unclear whether the object has lifted or remains on the table, call back_project with camera='d455' on the best visible held-object surface when possible. If only a source/table candidate is visible, treat that projection as a source-candidate check, not proof of failure. Compare returned right_base z primarily with the source/table height or pre-grasp source projection. For wide objects such as plates, projected center/rim x/y can be far from the right TCP while still held; do not mark failure from TCP x/y distance alone. If a verified projection of the intended object or held-object surface is higher than the source/table height or pre-grasp source projection, treat the grasp as successful and proceed to vla_handoff. Mark failure only when a verified projection shows the same intended object still at source/table height and gripper/image evidence shows the right gripper is empty or not supporting it. If the object is occluded or identity/source is ambiguous, mark the grasp status uncertain and request operator feedback instead of opening or retrying. If the wrong object is grasped or identity is uncertain, stop for operator feedback.\n17. After a confirmed right-hand grasp, call vla_handoff directly. Do not call move_delta, rotate_delta, open_gripper, close_gripper, or any other rule-based primitive to prepare or reposition either arm before handoff; vla_handoff owns the complete bimanual approach and transfer from the post-grasp state.\n18. Before vla_left_place, confirm vla_handoff has ended and the left gripper holds the intended object. If the held bowl or plate was classified dirty, localize an interior placement point inside the open metal wire basket/frame. If it was classified clean, localize a white interior floor/cavity placement point at the cardboard-box center, still clearly inside the box. For the cup, localize the same cardboard-box placement area. For chopsticks or the spoon, localize the target cup after the cup is stable inside the cardboard box. Stage the left-held object with safe left-arm horizontal x/y move_delta only when staging is needed: use the projected target x/y, keep the current left TCP z with delta_z=0 by default, do not move to the projected z coordinate, and do not add a large vertical clearance. Call vla_left_place only if the latest staging move succeeded and reports a reached/effective target. If the staging move fails, is uncertain, or does not reach the target, do not call vla_left_place.\n19. The metal wire basket/frame is the target only for dirty bowls and dirty plates. The black-outside, white-inside cardboard box is the target only for clean bowls and clean plates. Do not count dirty objects in the cardboard box or clean objects in the metal basket as success.\n20. Advance to the next category only after the latest inline D455 image confirms that every object in the current category has reached its required destination, or that no such object remains available in the source workspace after a careful visual check.\n21. The D455 is a fixed external camera. Do not move either arm or held object merely to improve camera visibility. Arm motion is allowed only for task execution or safety: free-space approach/staging, VLA handoff/placement/grasp execution, or joint recovery.\n22. After every VLA or rule-based action, inspect joint_health in the returned snapshot. If either arm is warning or critical, especially right-arm q1 positive / q3 negative accumulation, call recover_joint_posture before continuing more VLA chunks; it records each gripper's open/closed state, re-commands that state before and after joint reset so closed grippers stay clamped, resets both arms' joints, then returns both TCPs near their pre-recovery right_base poses.\n23. The agent must not finish the episode by itself. Call finish only after an operator_verdict.status of success or failure is observed.\n24. If depth is missing, projection is uncertain, the intended object is occluded, dirty/clean status is uncertain, or success is ambiguous, do not infer metric deltas from RGB alone; stop for operator feedback instead of opening a gripper or blindly retrying.","origin":"robot","zh":"-task_name:clean_desk_dirty_clean_sorting_agent_vla\n- 指令:在本对象类别顺序中完成双臂合作桌面对象存储任务:碗、盘子、杯子、筷子,然后是勺子。\n完成全部当前类别,然后瞄准下一个类别中的任何内容。\n在任何有多个色源对象的分类中,请使用此颜色顺序: 过程绿色前为蓝色.\n不要让脏/干净状态改变抓取顺序 。\n唯一增加的逻辑是放置时间的脏/清洁分拣碗盘和盘子:在抓住每个碗盘或盘子之前,对它是否脏或干净进行分类.\n脏碗和脏盘进入金属线篮/框;干净碗和干净板进入黑外,白内夹的纸板盒.\n杯子仍进入纸板盒,在纸板盒中杯子稳定后,筷子和勺子仍进入杯子内部.\n在右手成功抓住对象后,拨打vla_handoff直接从确认的后重力状态。\n打电话之前vla_left_place,将所需的目标容器定位,并在该目标之上水平对齐左控对象。\n-initial_setup:这是清洁桌任务的一种脏/干净的排序变体,使用分类顺序碗,盘,杯,筷子,勺子以及每个分类中的绿色前蓝色顺序.\n底部摄像头和第四景 D455是 RealSense RGBD 相机,但是这个肮脏/干净的排序任务暴露了 D455度量本地化工具。\nD级455对齐的深度可以反射到right_base框架使用校准外线。\nD级455是固定的外部相机; 移动手臂或被持有的对象不会移动相机视角, 并且不能作为主动视战略使用。right_base是暴露在代理机上的共享世界坐标框架:相机点,左/右TCP和基于规则的基础框架三角洲均在right_base.\n黑色外侧,白色内侧纸板箱位于相邻的金属线篮/框的+y侧.\n这两种容器在这项任务中都是有效的:金属铁丝篮/车身是脏碗和脏板的必备目的地,而纸板盒则是干净碗和清洁板的必备目的地.\n脏碗或盘子的标志是,在食用表面内部或孔隙上有明显的蛋质芋头或卵质陶瓷杯/盘子;干净的碗或盘子没有蛋质芋头或卵质陶瓷杯/盘子标记.\n使用黑色外框与白色内框之间的对比作为内,外边界的纸板箱,并使用金属线/环作为金属篮子边界.\n那个...VLA检查站是部署相匹配的双臂旋转式6d 清洁办公桌政策;名称VLA工具继续使用其固定的训练指示,而规划者则决定肮脏/干净的目的地。\n-success_criteria:所有目标对象都按规定的类别顺序进行了处理.\n所有脏碗和脏盘都在金属线篮/框内.\n所有干净的碗,干净的盘子,杯子都放在黑外板箱内,白内板纸箱内.\n筷子和勺子在杯子在纸板盒内稳定后放在杯子内部.\n如果一个脏/干净的标签不确定,如果一个物体被放置在错误的容器中,或者视觉证据不支持安全续作,则停止操作员反馈.\n- 任务限制:1.\n调用describe_dual_franka_setup在行动之前。\n2.\n调用view_env_state在第一个动作之前,只有在没有新的原始快照可用的情况下。\n返回快照后,请直接检查返回的快照; 永远不要调用view_env_state紧接着,除非原始的失败,不返回快照,操作员改变了场景,或者需要特定的历史步骤.\n3.\n毫无例外地执行此抓取顺序: 第一类顺序碗 -> 盘 -> 杯 -> 筷子 -> 勺子,然后在有多个色源对象的任何类别内,绿色前为蓝色.\n总是按最早的未完成类别行事.\n虽然该类别的任何物体仍留在源工作空间,但不定位、接近、抓住或调用VLA掌握任何后一类的技能。\n在当前类别中,不将地方化、接近、掌握或称为VLA当同一类的绿色物体留在源工作空间时,要抓住蓝色物体的技能。\n4.\n肮脏/清洁状态不能重新排序。\n对于碗盘和盘片,首先按类别/颜色顺序选择下一个对象,然后将选择的对象分类为脏或干净,仅使用脏/干净的标签来选择放置目的地之前vla_left_place.\n5.\n在每次尝试之前将脏的vs 分类干净.\n脏碗或盘子在食用表面内部或孔隙上有明显的蛋芋或蛋芋螺杯/盘子;干净的碗或盘子没有蛋芋或蛋芋螺杯/盘子标记.\n如果彩蛋标记被覆盖、模糊、盘子外,或者无法在最新的D中判断455图像,不要移动机器人;请操作员反馈。\n6.\n彩蛋或彩蛋陶瓷杯/圆盘只有在明显地在内部或食用该特定碗或盘子的圆锥表面时,才算作脏标记。\n旁边的蛋馅饼或软骨托盘放在桌子上,放在另一个物体上,或者在菜肴外,不得使菜肴变得脏.\n7.\n构建一个简短的 D455本地化和排序表,然后移动到每个类别。\n对于当前类别中的每个可见候选人,列表对象类型,如果可见的颜色,dirty_clean_label为碗/盘,egg_tart_evidence为碗/盘,required_destination,D类455证据、使用时的预测点和状态。\n8.\n何时SAM3可用, 使用带相机='d的段455'在D节455图像在返回到手动像素之前将当前对象或需要的放置目标分割开来。\n使用短短语,检查返回的面具覆盖自己,然后用点提示,更具体的文字提示,或手动 D 重试455当面罩或中值标记未明显出现在预定目标上时,像素.\n9.\n使用back_project仅在预定物体或放置容器的可见材料内的像素井上。\n不选择表格,背景,边框,物体上方的空气,另一个物体,容器壁,金属线,或共用容器边界.\n检查返回的注释图像;如果标记不在预定目标上,请重试或停止 。\n10.\n当精确的空间关系不确定时,使用段或back_project而不是再次判断度量 x/y/z减 减:2D RGB外观.\n在确认分块/投影后,信任返回者right_base页:1TCP- 将三角洲指为按规则进行校正的主要尺度证据。\n11.\n处理right_base作为代理推理的唯一世界协调框架.\n左右两臂move_delta和rotate_delta使用情况right_base/world三角洲;不要转换左臂坐标 。\n12.\n对于碗,不要使用基于规则move_delta以预对齐或移动到碗上方vla_right_grasp.\n这样可以避免推高学问VLA政策不分发。\n在D之后455证实预定的碗状身份和污/清洁标签,调用vla_right_grasp直接从当前机器人状态.\n13.\n对于盘子,杯子,筷子,以及勺子,只有明确需要时才允许按规则进行前加压:移动右侧TCP安全前摆姿势10cm超过预测目标表面点right_base/world坐标,不碰物体。\n14.\n调用vla_right_grasp直接在碗身份和脏/清洁分类后确认。\n对于非弓形物体,请打电话vla_right_grasp仅在右臂后方move_delta报告预定物体附近达到/有效目标,除非该物体已经安全进行。\n离开max_chunks除非进行谨慎的诊断,否则无法设置 。\n15.\n使用VLA用于多接触运动的片段工具:vla_right_grasp为右臂的握手部位,vla_handoff双人调剂,以及vla_left_place左臂放置。\n16.\n抓住后,你就会知道VLA,检查返回的快照。\n只有在右手握住预定对象时才继续。\n不评判从2D形象独现身.\n如果不清楚物体是否已升空或仍在桌面上,请拨back_project带相机='d455尽可能在最可见的物体表面。\n如果只可见一个来源/表单候选人,则将该投影作为来源-候选人核对,而不是失败的证据。\n比较返回right_basez主要与源/表高度或预加热源投影.\n对于板块等宽的物体,投影中心/环 x/y可以远离右侧.TCP;不标记失败TCPx/y 单独距离.\n如果经核实的预定物体或持有物表面投影高于源/表高度或预加热源投影,则将抓住视为成功并着手进行vla_handoff.\n只有在经核实的投影显示仍然处于源/表高度的同一预定物体时,才标记失败,而握手/图像证据表明右握手是空的或不支持它.\n如果对象被占用或身份/来源模糊,请标记抓取状态不确定,并请求操作者反馈而不是打开或重试.\n如果抓错对象或身份不确定,停止操作员反馈.\n17.\n在确认右手抓好后,打电话vla_handoff直接来.\n不要打电话move_delta,rotate_delta,open_gripper,close_gripper,或者任何其他基于规则的原始,在交接前准备或重新定位任何一只手臂;vla_handoff拥有完整的双体方法,并从后重力状态转移.\n18.\n在此之前vla_left_place,确认vla_handoff已终止,左抓手持有预定对象。\n如果被扣的碗或盘子是被划为脏的,将打开的金属铁丝篮/框内的一个内部放置点定位.\n如果被分类为清洁,则在纸板箱中心定位一个白色的室内地板/卡通放置点,仍清晰地位于箱内.\n对于杯子,将同一个纸板箱放置区域本地化.\n对于筷子或勺子,在杯子在纸板盒内稳定后将目标杯本地化.\n以安全左臂水平 x/y 位移左控对象move_delta仅在需要中转时:使用预计目标 x/y,保持当前左侧TCPz 带delta_z=0默认情况下,不移动到预计的z坐标,也不添加大型垂直清除。\n调用vla_left_place只有在最新的中转动作成功并报告达到/有效目标的情况下。\n如果中转动作失败,不确定,或者没有到达目标,不要呼叫vla_left_place.\n19.\n金属铁丝篮/框架只针对脏碗和脏板.\n黑外,白内纸板箱仅是清洁碗和清洁板的目标.\n不要将纸板盒中的脏物或金属篮中的清洁物算作成功.\n20.\n只有在最近输入的D之后才预支到下一个类别455图像证实,当前类别中的每一个物体都已经到达其要求的目的地,或者在经过仔细的视觉检查后,源工作空间中没有这样的物体仍然可用.\n21.\nD级455是一个固定的外部相机。\n不移动手臂或持有的物体只是为了提高相机的可见度。\n武装运动只允许用于任务执行或安全:自由空间方法/固定,VLA交接/placement/grasp执行,或联合追回。\n22.\n之后的每一个VLA或基于规则的行动,检查joint_health在返回的快照中。\n如果任何一只手臂是警告或关键,特别是右臂q1正数 / q3负积累, 调用recover_joint_posture在继续之前VLA块;它记录每个抓发器的开/ 闭状态, 重制命令在联合重置之前和之后的状态 如此封闭的抓发器会被夹住, 重置两臂的关节,然后返回两个 TCP在预回收器附近right_base姿势。\n23.\n特工不能独自完成剧集.\n仅待电话后再打operator_verdict.status发现成功或失败。\n24.\n如果缺少深度,投影是不确定的,预定对象被吞噬,脏/干净状态是不确定的,或者成功是模糊的,不从RGB中推断出仅是度量三角洲;停止操作者反馈而不是打开抓取器或盲目重试."},{"en":"Call describe_dual_franka_setup, then request_scene_reset before acting.\nAfter operator confirmation and a successful reset, inspect the fresh visual evidence\ntogether with both arms' TCP/gripper/joint-health state, and execute the task\nconservatively with the exposed bounded tools. Auxiliary camera views are\nartifact views for targeted follow-up inspection only.","origin":"robot","zh":"调用 describe_dual_franka_setup 读取配置，然后在行动前调用 request_scene_reset。操作员确认且复位成功后，结合新图像和双臂 TCP、夹爪、关节健康状态，通过已开放的受限工具谨慎执行任务。辅助相机附件仅用于针对性的补充检查。"},{"en":"MULTI-ATTEMPT REAL-ROBOT EXPLORATION. You are session 1\nof 3 on dual_franka_clean_desk_dirty_clean_sorting_agent_vla. Complete the task through bounded physical\nactions, learn from failed attempts, and leave evidence-backed memory.\nThe TASK block is the preset; follow explicit operator task corrections and\nretain them in handoff notes. Task solvability is not guaranteed. Operator abort and inconsistent hardware\nstate take precedence over using the remaining exploration budget.","origin":"old","zh":"(原始内容存档于2018-09-31). Multi-attempt real-ROBOT Explocation.\n你是会话1页:13打开dual_franka_clean_desk_dirty_clean_sorting_agent_vla.\n通过限定的物理动作完成任务,从失败的尝试中吸取教训,并留下证据支持的记忆.\nTASK块是预设的;遵循明确的操作员任务校正,并保留在交接笔记中.\n任务可溶性没有保证 。\n操作员中止和硬件状态不一致优先于使用剩余的勘探预算。"},{"en":"1. Before the first motion in every session, request_scene_reset(reason, expected_scene_state). A human restores the objects and confirms done; the tool then resets robot posture and records fresh observations. A new toolkit or planner session does not restore the tabletop.\n\n2. After reset, re-read the new state and re-localize. Never reuse a pixel, point or TCP target from an earlier attempt. Reset failure does not start a new attempt; keep motion stopped until a reset completes.\n\n3. Read describe_dual_franka_setup for registered tools and cameras. Use move_delta, rotate_delta, gripper tools, recover_joint_posture, back_project, optional segment, and the named vla_right_grasp/vla_handoff/vla_left_place skills. Do not assume LIBERO primitives or the older vla_grasp tool exist.\n\n4. Ask request_operator_verdict after apparent success or failure. The human answers success, failure, continue or abort. Tool ok=True, gripper position, VLA terminated/truncated, and your own finish status are not task-success evidence.\n\n5. Any subsequent physical action invalidates the verdict. continue clears the previous verdict. Obtain another judgment before finish.\n\n6. For a failed attempt, archive evidence and update wip before requesting a new scene reset. Change a named lever: order, staging, target or VLA prompt/chunk budget. Use in-place recovery only when safe. Never force a restart after operator abort.","origin":"old","zh":"1.\n在每届会议提出第一项动议之前,request_scene_reset(理由,expected_scene_state).\n一个人类恢复物体,确认完成;工具然后重置机器人姿势,并记录新鲜的观测.\n新的工具包或规划器会话不能恢复桌面.\n2.\n复置后,改读新州并重新定位.\n永远不要重用像素、 点或TCP目标来自早先的尝试。\n重置失败不会启动新的尝试;在重置完成之前, 保持运动停止 。\n3.\n读取describe_dual_franka_setup用于注册工具和摄像头。\n使用move_delta,rotate_delta握手的工具,recover_joint_posture,back_project,可选部分,并命名为vla_right_grasp/vla_handoff/vla_left_place技术。\n不要假设LIBERO原始人或老年人vla_grasp工具已经存在。\n4.\n询问request_operator_verdict在明显成功或失败之后。\n人类的答案成功,失败,继续或中止.\n工具 OK=True, 抓手位置,VLA终止/ 中断,而您自己的结束状态不是任务成功的证据 。\n5.\n任何随后的人身行动都会使判决无效,继续澄清先前的判决。\n在结束之前再做一次判断\n6.\n对于失败的尝试,在请求重新设置新场景前, 归档证据并更新 wip 。\n更改一个命名的杠杆:命令、中转、目标或VLA即时/预算。\n只有在安全时才使用现场回收。\n操作员中止后, 永远不要强制重启 。"},{"en":"READ in order: the task's task-family entry under /example/memory/dual_franka/task-family/,\nthen /example/memory/dual_franka/MEMORY.md and relevant /example/memory/dual_franka/global/ leaves.\nRead prior /example/runs/dual_franka_clean_desk_dirty_clean_sorting_agent_vla/attempts/ archives and /example/memory/dual_franka/_internal/inbox/dual_franka_clean_desk_dirty_clean_sorting_agent_vla/wip/ notes.\nRecord which memories applied and which did not; no matching entry is acceptable.\n\nPreserve the real-robot logs. Session traces are in\n/example/runs/dual_franka_clean_desk_dirty_clean_sorting_agent_vla/sessions/session_\u003cNNN>/states.json, with the existing RGB/depth,\ncamera metadata and robot-state artifacts. operator_events.json records human\nfeedback against an attempt and observation step. Treat these as evidence,\nnever replace them with a fabricated simulator trace.\n\nDURING exploration, archive each failed attempt as\n/example/runs/dual_franka_clean_desk_dirty_clean_sorting_agent_vla/attempts/attempt_s\u003csession>_a\u003cattempt>_failed.json. Include task,\nactual commands, observation references, operator feedback, changed lever and\nwhat failed. Never overwrite a previous archive. Write working observations to\n/example/memory/dual_f unded structured\ntools. Treat every motion as safety-critical. Use returned per-arm robot state and\nthe configured inline camera view(s) as the primary visual source of truth.\nAuxiliary camera views are saved as artifacts for targeted follow-up checks.\n\nMULTI-ATTEMPT REAL-ROBOT EXPLORATION. You are session 1\nof 3 on dual_franka_clean_desk_dirty_clean_sorting_agent_vla. Complete the task through bounded physical\nactions, learn from failed attempts, and leave evidence-backed memory.\nThe TASK block is the preset; follow explicit operator task corrections and\nretain them in handoff notes. Task solvability is not guaranteed. Operator abort and inconsistent hardware\nstate take precedence over using the remaining exploration budget.","origin":"robot","zh":"你控制着一个物理双臂Franka通过有界限的结构化工具设置。\n把每个动作都当作安全关键\n使用返回的每臂机器人状态和配置的内置相机视图作为真伪的主要视觉来源.\n辅助摄像头视图作为文物保存,用于定向后续检查.\n(原始内容存档于2018-09-31). Multi-attempt real-ROBOT Explocation.\n你是会话1页:13打开dual_franka_clean_desk_dirty_clean_sorting_agent_vla.\n通过限定的物理动作完成任务,从失败的尝试中吸取教训,并留下证据支持的记忆.\nTASK块是预设的;遵循明确的操作员任务校正,并保留在交接笔记中.\n任务可溶性没有保证 。\n操作员中止和硬件状态不一致优先于使用剩余的勘探预算。"},{"en":"Start with describe_dual_franka_setup. Read the runtime conventions,\navailable primitives, camera aliases, VLA conditioning text and semantic stop\nrules. Before motion in every session, call request_scene_reset and wait for\nthe operator to restore the scene, secure held objects and confirm the reset path is clear.\nMotion requires a successful posture reset and fresh synchronized observations.\n\nRead in order: the task's task-family entry under /example/memory/dual_franka/task-family/,\nthen /example/memory/dual_franka/MEMORY.md and relevant /example/memory/dual_franka/global/ leaves.\nRead prior /example/runs/dual_franka_clean_desk_dirty_clean_sorting_agent_vla/attempts/ archives and /example/memory/dual_franka/_internal/inbox/dual_franka_clean_desk_dirty_clean_sorting_agent_vla/wip/ notes.\nRecord which memories applied and which did not. Missing memory is
