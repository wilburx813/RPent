heck the native action budget before planning. Localize relevant targets,\nact through the registered primitives, inspect execution feedback, and record\nthe outcome before finishing.","origin":"robot","zh":"先调用 view_env_state 读取指令、观察场景并检查原生动作预算，再做规划。定位相关目标，通过注册的基础动作执行，检查执行反馈，记录结果后再结束。"},{"en":"move_to(arm, xyz, quat=None, gripper=None, substeps=25) plans a full pose.\nQuaternion order is wxyz; omitted orientation and opening are held.\nrotate_wrist applies relative yaw about world Z, in degrees, with the same\nsubsteps selection rules. Each executed waypoint consumes one native action\nstep (0.04 seconds of simulation). Fewer waypoints give less execution time;\ncompleted means the selected commands ran, not that the target pose was reached.\nset_gripper(arm, val, steps=10) uses 0=closed, 1=open; release defaults to 1.\nIntermediate openings are control targets, not guaranteed physical widths.\nInspect completed, executed_steps and stop_reason. final_dist_m is measured\nposition error, not a task-success verdict. On failure, inspect and decide\nthe next action; do not assume a failed call left the robot unmoved.\n\nawomo05_act(chunks=1) executes the original full task instruction using dual-arm\njoint targets. It has no instruction parameter and cannot accept a rewritten\ninstruction or a phase-specific subtask. Each chunk executes 8 native actions,\nthen replans from real feedback. You inspect the result after the call.\nHistory includes preceding Primitive and Awomo05 actions and persists across\ncalls; switching controllers does not start a new episode. A completed chunk\nmeans commands executed, not task success. If execution is uncertain or model\nhistory synchronization is lost, stop all motion, including Primitive actions,\nand follow the current mode's reset or finish rules. Do not reset model history\nindependently of the environment.","origin":"old","zh":"move_to(arm, xyz, quat=无, gripper=无, 子步数=25计划一个完整的姿势。\nQuaternion命令是wxyz;省略方向和开口被举行.rotate_wrist应用关于世界Z的相对yaw,以度数表示,具有相同的子步骤选择规则.\n每个已执行的方法点都使用一个本地动作步骤(0.04模拟的秒数).\n较少的方式点给出的执行时间更少;完成意味着所选的命令运行,而不是目标姿势已经达到.set_gripper(武装、瓦尔、步数=)10) 用途0=关闭,1=打开;发布默认值至1.\n中间开口为控制目标,不保证物理宽度.\n检查完毕,executed_steps和stop_reason.final_dist_m是测量位置错误,而不是任务胜负的判断。\n失败时,请检查并决定下一个动作;不要假设一个失败的调用让机器人没有移动 。\nawomo05_act(吨数=)1)使用双臂联合目标执行原全任务指令.\n它没有指令参数,无法接受重写指令或相位特定子任务.\n每个块执行8原生行动,然后从真实反馈中重新规划.\n通话后再检查结果\n历史包括以前的主要和Awomo05动作并坚持呼叫; 切换控制器不会启动新插曲 。\n已完成块表示执行的命令,而非任务成功 。\n如果执行不确定或模式历史同步丢失,则停止包括原始动作在内的所有运动,并遵循当前模式的重设或完成规则.\n不要独立于环境重置模型历史 。"},{"en":"After inspecting the current instruction and scene, read these\npublished references before choosing an approach, when present:\n1. /example/memory/robodojo/task-specific/put_bottles_into_dustbin_s0_l0.json\n2. /example/memory/robodojo/task-specific/put_bottles_into_dustbin_s0_l0_recipe.jsonl\n3. /example/memory/robodojo/task-family/task-family_robodojo_arx_x5_tput_bottles_into_dustbin.md\n4. /example/memory/robodojo/MEMORY.md, then the global leaves relevant to this scene's\n   manipulation or failure mode. Usually one to three relevant leaves suffice.\n\nUse read_text_file with max_chars=100000 for the task references. Check the\nreturned size and content for truncation; if truncated, read again with\nmax_chars at least equal to the reported size. Do not treat a partial read as\nthe complete reference.\n\nThe reference is the same exact task variant explored at seed 0, layout 0.\nKeep standard and Random task-specific pairs and task-family notes separate:\ndo not substitute one variant's recipe for the other's. If a reference is\nmissing, record that absence and proceed from the available relevant global\nguidance and current observations. Do not read _internal/ or failed-run drafts.\nMemory is read-only; write the evaluation audit only under /example/runs/put_bottles_into_dustbin_s1_l0.\n\nUse the JSON and task-family notes to understand phase order, observable gates,\ncontroller choices, recovery reasons and applicability limits. Use the JSONL\nas evidence of actual calls, SAM3 descriptions and Awomo05 chunk choices. A\nsuccessful episode can include failed approaches and corrective detours:\nidentify which actions made progress rather than replaying every call.\n\nTransfer strategies and checks, not scene geometry. Re-identify objects and\ndestinations, measure poses, heights, clearances and held-object offsets from\ncurrent images and depth, and choose arms for current reach unless the native\ninstruction requires a particular arm. Revalidate SAM3 identity and contact\ngeometry; historical pixels, coordinates and grasp offsets are not targets.\nAdapt chunk length to the next observation gate using the control rules below.\n\nApply a global lesson only when its stated conditions match; check its limits\nand counterevidence. Distinguish observed success, a proposed explanation and\nuntested applicability. Single-seed evidence, including a probable lesson,\ndoes not establish cross-seed reliability. The current instruction and fresh\nobservations override memory. Protect achieved relations and correct only the\nremaining blocker when a reference strategy no longer fits the scene.","origin":"old","zh":"在检查当前指令和场景后,在选择方法之前阅读这些已公布的参考文献,如果有的话:\n1. /example/memory/robodojo/task-specific/put_bottles_into_dustbin_s0_l0.json\n2. /example/memory/robodojo/task-specific/put_bottles_into_dustbin_s0_l0_recipe.jsonl\n3. /example/memory/robodojo/task-family/task-family_robodojo_arx_x5_tput_bottles_into_dustbin.md\n4./example/memory/robodojo/MEMORY.md,然后与本场景的操纵或失败模式相关的全局叶片.\n通常一到三条相关叶子就足够了。\n使用read_text_file与max_chars=100000用于任务参考。\n检查返回的大小和内容是否切换;如果切换, 重新读取max_chars至少等于报告的大小。\n不将部分读取作为完整的参考。\n参考的是种子时探索的相同精确的任务变体0,布局0.\n保持标准与随机任务特定配对和任务家庭注释的分离:不要以一个变体的配方代替另一个变体的配方.\n如果缺少参考文献,请记录这一缺漏,并从现有相关全球指南和当前意见中着手。\n不读取_ 内部/ 或运行失败的草稿 。\n记忆只读; 仅将评价审计写在下面/example/runs/put_bottles_into_dustbin_s1_l0.\n使用JSON和任务-家族注释来理解相位顺序,可观察到的门,控制器的选择,恢复原因和适用性限制.\n使用该JSONL作为实际通话的证据,SAM3说明和说明Awomo05断块的选择。\n一个成功的插曲可以包括失败的方法和纠正的绕道:确定哪些行动取得了进步,而不是重复每一个呼吁.\n传输策略和检查,不是场景几何.\n重新识别物体和目的地、测量姿势、高度、清除和当前图像和深度的持有物体抵消,并选择用于当前接触的武器,除非本地指示需要特定的臂。\n修订SAM3身份和联系几何;历史像素、坐标和抓取偏移不是目标。\n使用下面的控制规则,将块长度调整到下一个观察门。\n只有当所声明的条件相符时,才应用全球经验教训;检查其限度和反证。\n所观察到的杰出成功、拟议的解释和未经测试的适用性。\n单一种子证据,包括可能的经验教训,不能确定交叉种子的可靠性。\n当前指令和新观察覆盖记忆 。\n保护已实现的关系,在参考策略不再适合现场时,只纠正剩余的阻断器."},{"en":"Choose a controller for the next observable phase goal:\n- Awomo05: continue the original full-task policy when current observations\n  support useful progress toward the task. A phase plan helps you choose when\n  to call, inspect or interrupt the policy; it cannot be sent as a subtask.\n- move_to: measured approach staging, verified free-space transport, withdrawal,\n  return, or a specific geometric correction with understood contact geometry.\n- rotate_wrist: an intentional world-Z orientation adjustment with clearance\n  for the fingers and held object; it is not a general tilting command.\n- set_gripper: deliberate opening adjustment or closure after alignment. Keep\n  the current hold unless the phase requires changing it.\n- release: transfer support to the intended surface, fixture or receiving hand\n  once observations support that transfer; verify the result afterward.\n\nPrimitive staging can precede Awomo05; a failed Awomo05 call is not a prerequisite.\nBefore switching, check target identity, each hand's contents, contact and\nprotected relations. After a primitive, inspect the actual state before\ncontinuing. For uncertain contact geometry, consider continuing the original\nfull-task policy when observations support it; do not invent contact poses or\nassume Awomo05 can be instructed to perform only the next phase.\nDo not interrupt correct contact and useful progress with speculative\nprimitives. An unfinished phase alone does not require switching controllers.\nAfter an unproductive chunk, inspect whether to continue, change the\nchunk count, improve visibility or correct the physical state.\n\nFor move_to and rotate_wrist, choose substeps from 1, 5, 10 or 25:\n- 25 (default): ordinary transport, larger position or orientation changes,\n  or uncertainty about the execution time needed.\n- 10: short free-space moves or small orientation adjustments with clear space.\n- 5: very small geometric corrections.\n- 1: tiny corrections or holding a target; never jump to a distant pose.\nDo not use 0 or values above 25. Preserve necessary detours when choosing\ntargets and sampling; fewer steps do not make a large target change gentle.\nAfter execution, inspect the achieved position, orientation and held object\nbefore deciding whether to continue or change the approach. Minimize the total\nsteps needed for the phase, not just the steps in an individual call.\n\nChoose chunks by how soon the next decision needs fresh evidence:\n- 1: a new approach, uncertain progress, instability, near contact or completion,\n  after a corrective primitive, or before a release/handover decision.\n- 2: ordinary stable progress within a phase whose target and arm roles are clear.\n- 3: a successful recipe supports a continuous phase already progressing\n  correctly, with no intervening decision requiring your inspection.\nShorten the next call when those conditions change. These are selection bands,\nnot guarantees that a phase finishes within a fixed number of chunks.\nAlso account for the remaining action budget: 1, 2 and 3 chunks normally\nexecute 8, 16 and 24 actions, respectively. Choose a call length that leaves\nroom for subsequent required actions. Near completion or with little budget\nmargin, prefer one chunk and inspect the result before continuing. Use the\nreturned action count and remaining_steps to assess actual consumption.","origin":"old","zh":"为下一个可观察到的相控目标选择控制器 :\n-Awomo05:当目前的意见有助于在完成任务方面取得有益进展时,继续实行最初的全任务政策。\n阶段计划帮助您选择何时拨打、检查或中断保险单;它不能作为子任务发送。\n-move_to:经测量的接近中转、经核实的自由空间运输、退出、返回或具体几何校正,并理解接触几何。\n-rotate_wrist:有意的世界-Z方向调整,对手指和被扣物体进行清除;这不是一般的倾斜指令.\n-set_gripper:在对齐后故意开启调整或关闭.\n除非阶段需要更改,否则保留当前控件.\n- 释放:一旦观测结果支持转移,就向预定的表面、固定或接收手转移支持;核实之后的结果。\n初级中继器可以先于Awomo05; 失败Awomo05电话不是一个先决条件。\n切换前,检查目标身份,每只手的内容,接触和保护关系.\n经过原始的,在继续前先检查实际状态.\n对于不确定的接触几何,在观测支持时考虑继续原全任务政策;不要发明联系形式或假设Awomo05可以指示只进行下一阶段。\n不要打断与投机原始人的正确接触和有益的进展.\n仅一个未完成的阶段就不需要切换控制器.\n在非生产性块之后,检查是否继续,改变块数,提高能见度或纠正物理状态.\n为:move_to和rotate_wrist,选择从1,5,10或25:\n-25(默认):普通运输,较大位置或方向变化,或需要执行时间的不确定性.\n-10:短空空间移动或小方向调整,且空间清晰.\n-5:非常小的几何校正.\n-1:微小的校正或持有目标;从不跳到遥远的位置.\n不使用0或以上数值25.\n在选择目标和采样时要注意必要的绕行;较少的步骤不会使大的目标变化变得温和.\n执行后,先检查已实现的位置,方向并持有异议,然后决定是否继续或改变方法.\n尽量减少阶段所需的全部步骤,而不仅仅是个别呼叫中的步骤.\n选择块按下个决定需要多久 :\n-1:一种新的方法,不确定的进展,不稳定,接近接触或完成,经过纠正的原始,或者在释放/移交决定之前.\n-2:在目标和臂力作用明确的一个阶段内,平稳平稳地取得进展。\n-3:成功的食谱支持一个已经进展得正确的持续阶段,不需要你检查的干预决定.\n条件改变时,接通下一个电话。\n这些是选择带,不能保证一个相位在固定的块数内完成.\n并计入其余行动预算:1,2和3块通常执行8,16和24行动。\n选择一个为以后所需的动作留有空间的呼叫长度.\n接近完成或预算差幅很小,在继续进行之前选择一个块并检查结果。\n使用返回的动作计数和remaining_steps评估实际消费。"},{"en":"Before the first robot action, read\nrobots/robodojo/guides/GUIDE_RPENT.md completely. Inspect view_env_state and the\nhead and wrist images, read the native instruction, and note both arms' initial\nend-effector positions and orientations. Bind objects, destinations and arm\nroles from current observations.\n\nAfter inspecting the current instruction and scene, read these\npublished references before choosing an approach, when present:\n1. /example/memory/robodojo/task-specific/put_bottles_into_dustbin_s0_l0.json\n2. /example/memory/robodojo/task-specific/put_bottles_into_dustbin_s0_l0_recipe.jsonl\n3. /example/memory/robodojo/task-family/task-family_robodojo_arx_x5_tput_bottles_into_dustbin.md\n4. /example/memory/robodojo/MEMORY.md, then the global leaves relevant to this scene's\n   manipulation or failure mode. Usually one to three relevant leaves suffice.\n\nUse read_text_file with max_chars=100000 for the task references. Check the\nreturned size and content for truncation; if truncated, read again with\nmax_chars at least equal to the reported size. Do not treat a partial read as\nthe complete reference.\n\nThe reference is the same exact task variant explored at seed 0, layout 0.\nKeep standard and Random task-specific pairs and task-family notes separate:\ndo not substitute one variant's recipe for the other's. If a reference is\nmissing, record that absence and proceed from the available relevant global\nguidance and current observations. Do not read _internal/ or failed-run drafts.\nMemory is read-only; write the evaluation audit only under /example/runs/put_bottles_into_dustbin_s1_l0.\n\nCheck the JSONL for SAM3 descriptions and Awomo05 chunk choices. Identify\nfailed detours in a successful recipe. Choose arms for current reach unless\nthe native instruction fixes an arm. Revalidate SAM3 identity, contact geometry\nand held-object offsets. Check each global lesson's limits and counterevidence;\nsingle-seed evidence does not establish cross-seed reliability.\n\nBefore moving, state a brief plan with arm roles, observable subgoals and\nthe required final robot posture. Check episode_status.step_limit and remaining_steps.","origin":"robot","zh":"在第一个机器人动作之前,请读robots/robodojo/guides/GUIDE_RPENT.md完全没有。\n检查view_env_state以及头部和手腕图像,读取原生指示,同时注意双臂的初始末端效应姿势和方向.\n从当前观测中绑定对象、目的地和臂的作用 。\n在检查当前指令和场景后,在选择方法之前阅读这些已公布的参考文献,如果有的话:\n1. /example/memory/robodojo/task-specific/put_bottles_into_dustbin_s0_l0.json\n2. /example/memory/robodojo/task-specific/put_bottles_into_dustbin_s0_l0_recipe.jsonl\n3. /example/memory/robodojo/task-family/task-family_robodojo_arx_x5_tput_bottles_into_dustbin.md\n4./example/memory/robodojo/MEMORY.md,然后与本场景的操纵或失败模式相关的全局叶片.\n通常一到三条相关叶子就足够了。\n使用read_text_file与max_chars=100000用于任务参考。\n检查返回的大小和内容是否切换;如果切换, 重新读取max_chars至少等于报告的大小。\n不将部分读取作为完整的参考。\n参考的是种子时探索的相同精确的任务变体0,布局0.\n保持标准与随机任务特定配对和任务家庭注释的分离:不要以一个变体的配方代替另一个变体的配方.\n如果缺少参考文献,请记录这一缺漏,并从现有相关全球指南和当前意见中着手。\n不读取_ 内部/ 或运行失败的草稿 。\n记忆只读; 仅将评价审计写在下面/example/runs/put_bottles_into_dustbin_s1_l0.\n检查一下JSONL(单位:千美元)SAM3说明和说明Awomo05断块的选择。\n在成功配方中识别失败的绕行 。\n选择当前范围的武器,除非本地指令修复一个手臂 。\n修订SAM3身份、联系几何和控件偏移。\n请检查access-date=中的日期值 (帮助)每个全球课的极限和反证;单种证据不能建立交叉种子的可靠性.\n在移动前,请说明一个简短的计划,其中包含臂部角色,可观察到的子目标和所需的最终机器人姿态.\n检查episode_status.step_limit和remaining_steps."},{"en":"For hanging, check support through withdrawal. For insertion, inspect\norientation and seating. During handover, verify receiver hold before giver\nrelease and again after separation. Preserve a required pushing method. For\nmaterial transfer or deformation, inspect the contents or shape itself. In\nmulti-object work, check counts and protect objects held by the other arm.\n\nmove_to(arm, xyz, quat=None, gripper=None, substeps=25) plans a full pose.\nQuaternion order is wxyz; omitted orientation and opening are held.\nrotate_wrist applies relative yaw about world Z, in degrees, with the same\nsubsteps selection rules. Each executed waypoint consumes one native action\nstep (0.04 seconds of simulation). Fewer waypoints give less execution time;\ncompleted means the selected commands ran, not that the target pose was reached.\nset_gripper(arm, val, steps=10) uses 0=closed, 1=open; release defaults to 1.\nIntermediate openings are control targets, not guaranteed physical widths.\nInspect completed, executed_steps and stop_reason. final_dist_m is measured\nposition error, not a task-success verdict. On failure, inspect and decide\nthe next action; do not assume a failed call left the robot unmoved.\n\nawomo05_act(chunks=1) executes the original full task instruction using dual-arm\njoint targets. It has no instruction parameter and cannot accept a rewritten\ninstruction or a phase-specific subtask. Each chunk executes 8 native actions,\nthen replans from real feedback. You inspect the result after the call.\nHistory includes preceding Primitive and Awomo05 actions and persists across\ncalls; switching controllers does not start a new episode. A completed chunk\nmeans commands executed, not task success. If execution is uncertain or model\nhistory synchronization is lost, stop all motion, including Primitive actions,\nand follow the current mode's reset or finish rules. Do not reset model history\nindependently of the environment.\n\nChoose a controller for the next observable phase goal:\n- Awomo05: continue the original full-task policy when current observations\n  support useful progress toward the task. A phase plan helps you choose when\n  to call, inspect or interrupt the policy; it cannot be sent as a subtask.\n- move_to: measured approach staging, verified free-space transport, withdrawal,\n  return, or a specific geometric correction with understood contact geometry.\n- rotate_wrist: an intentional world-Z orientation adjustment with clearance\n  for the fingers and held object; it is not a general tilting command.\n- set_gripper: deliberate opening adjustment or closure after alignment. Keep\n  the current hold unless the phase requires changing it.\n- release: transfer support to the intended surface, fixture or receiving hand\n  once observations support that transfer; verify the result afterward.\n\nPrimitive staging can precede Awomo05; a failed Awomo05 call is not a prerequisite.\nBefore switching, check target identity, each hand's contents, contact and\nprotected relations. After a primitive, inspect the actual state before\ncontinuing. For uncertain contact geometry, consider continuing the original\nfull-task policy when observations support it; do not invent contact poses or\nassume Awomo05 can be instructed to perform only the next phase.\nDo not interrupt correct contact and useful progress with speculative\nprimitives. An unfinished phase alone does not require switching controllers.\nAfter an unproductive chunk, inspect whether to continue, change the\nchunk count, improve visibility or correct the physical state.\n\nFor move_to and rotate_wrist, choose substeps from 1, 5, 10 or 25:\n- 25 (default): ordinary transport, larger position or orientation changes,\n  or uncertainty about the execution time needed.\n- 10: short free-space moves or small orientation adjustments with clear space.\n- 5: very small geometric corrections.\n- 1: tiny corrections or holding a target; never jump to a distant pose.\nDo not use 0 or values above 25. Preserve necessary detours when choosing\ntargets and sampling; fewer steps do not make a large target change gentle.\nAfter execution, inspect the achieved position, orientation and held object\nbefore deciding whether to continue or change the approach. Minimize the total\nsteps needed for the phase, not just the steps in an individual call.\n\nChoose chunks by how soon the next decision needs fresh evidence:\n- 1: a new approach, uncertain progress, instability, near contact or completion,\n  after a corrective primitive, or before a release/handover decision.\n- 2: ordinary stable progress within a phase whose target and arm roles are clear.\n- 3: a successful recipe supports a continuous phase already progressing\n  correctly, with no intervening decision requiring your inspection.\nShorten the next call when those conditions change. These are selection bands,\nnot guarantees that a phase finishes within a fixed number of chunks.\nAlso account for the remaining action budget: 1, 2 and 3 chunks normally\nexecute 8, 16 and 24 actions, respectively. Choose a call length that leaves\nroom for subsequent required actions. Near completion or with little budget\nmargin, prefer one chunk and inspect the result before continuing. Use the\nreturned action count and remaining_steps to assess actual consumption.","origin":"robot","zh":"对于绞刑,通过退出检查支持.\n用于插入,检查方向和座位.\n在移交期间,在发件人释放之前和分离后再次核实接收器的持有情况。\n保留必要的推力方法.\n对于材料转移或变形,检查内装物或形状本身。\n在多对象工作中,检查计数并保护另一臂所持有的物体.\nmove_to(arm, xyz, quat=无, gripper=无, 子步数=25计划一个完整的姿势。\nQuaternion命令是wxyz;省略方向和开口被举行.rotate_wrist应用关于世界Z的相对yaw,以度数表示,具有相同的子步骤选择规则.\n每个已执行的方法点都使用一个本地动作步骤(0.04模拟的秒数).\n较少的方式点给出的执行时间更少;完成意味着所选的命令运行,而不是目标姿势已经达到.set_gripper(武装、瓦尔、步数=)10) 用途0=关闭,1=打开;发布默认值至1.\n中间开口为控制目标,不保证物理宽度.\n检查完毕,executed_steps和stop_reason.final_dist_m是测量位置错误,而不是任务胜负的判断。\n失败时,请检查并决定下一个动作;不要假设一个失败的调用让机器人没有移动 。\nawomo05_act(吨数=)1)使用双臂联合目标执行原全任务指令.\n它没有指令参数,无法接受重写指令或相位特定子任务.\n每个块执行8原生行动,然后从真实反馈中重新规划.\n通话后再检查结果\n历史包括以前的主要和Awomo05动作并坚持呼叫; 切换控制器不会启动新插曲 。\n已完成块表示执行的命令,而非任务成功 。\n如果执行不确定或模式历史同步丢失,则停止包括原始动作在内的所有运动,并遵循当前模式的重设或完成规则.\n不要独立于环境重置模型历史 。\n为下一个可观察到的相控目标选择控制器 :\n-Awomo05:当目前的意见有助于在完成任务方面取得有益进展时,继续实行最初的全任务政策。\n阶段计划帮助您选择何时拨打、检查或中断保险单;它不能作为子任务发送。\n-move_to:经测量的接近中转、经核实的自由空间运输、退出、返回或具体几何校正,并理解接触几何。\n-rotate_wrist:有意的世界-Z方向调整,对手指和被扣物体进行清除;这不是一般的倾斜指令.\n-set_gripper:在对齐后故意开启调整或关闭.\n除非阶段需要更改,否则保留当前控件.\n- 释放:一旦观测结果支持转移,就向预定的表面、固定或接收手转移支持;核实之后的结果。\n初级中继器可以先于Awomo05; 失败Awomo05电话不是一个先决条件。\n切换前,检查目标身份,每只手的内容,接触和保护关系.\n经过原始的,在继续前先检查实际状态.\n对于不确定的接触几何,在观测支持时考虑继续原全任务政策;不要发明联系形式或假设Awomo05可以指示只进行下一阶段。\n不要打断与投机原始人的正确接触和有益的进展.\n仅一个未完成的阶段就不需要切换控制器.\n在非生产性块之后,检查是否继续,改变块数,提高能见度或纠正物理状态.\n为:move_to和rotate_wrist,选择从1,5,10或25:\n-25(默认):普通运输,较大位置或方向变化,或需要执行时间的不确定性.\n-10:短空空间移动或小方向调整,且空间清晰.\n-5:非常小的几何校正.\n-1:微小的校正或持有目标;从不跳到遥远的位置.\n不使用0或以上数值25.\n在选择目标和采样时要注意必要的绕行;较少的步骤不会使大的目标变化变得温和.\n执行后,先检查已实现的位置,方向并持有异议,然后决定是否继续或改变方法.\n尽量减少阶段所需的全部步骤,而不仅仅是个别呼叫中的步骤.\n选择块按下个决定需要多久 :\n-1:一种新的方法,不确定的进展,不稳定,接近接触或完成,经过纠正的原始,或者在释放/移交决定之前.\n-2:在目标和臂力作用明确的一个阶段内,平稳平稳地取得进展。\n-3:成功的食谱支持一个已经进展得正确的持续阶段,不需要你检查的干预决定.\n条件改变时,接通下一个电话。\n这些是选择带,不能保证一个相位在固定的块数内完成.\n并计入其余行动预算:1,2和3块通常执行8,16和24行动。\n选择一个为以后所需的动作留有空间的呼叫长度.\n接近完成或预算差幅很小,在继续进行之前选择一个块并检查结果。\n使用返回的动作计数和remaining_steps评估实际消费。"},{"en":"- task:   put_bottles_into_dustbin\n- seed group: 1\n- layout: 0\n- env_cfg: arx_x5\n- control: analytic joint targets and Awomo05 native joint targets\n- output_dir: /example/runs/put_bottles_into_dustbin_s1_l0\n- scene (static hint): {}","origin":"old","zh":"- task: put_bottles_into_dustbin\n- 种子组:1\n- 版式:0\n-env_cfg:arx_x5\n- 控制:分析联合目标;Awomo05本地联合目标\n- output_dir: /example/runs/put_bottles_into_dustbin_s1_l0\n- 场景(静态提示):_____________________________________________"},{"en":"- task:   put_bottles_into_dustbin\n- seed group: 1\n- layout: 0\n- env_cfg: arx_x5\n- control: analytic joint targets and Awomo05 native joint targets\n- output_dir: /example/runs/put_bottles_into_dustbin_s1_l0\n- scene ( nal/inbox/put_bottles_into_dustbin_s1_l0/wip/notes.md当于现时.\n目前的指示和观察都覆盖了记忆.\n利用一次成功的JSON审计来进行阶段计划和推理,以及JSONL行动命令、参数和VPP2节奏。\n传输支持的相位命令,可观察到的门,控制器的划分和回收想法.\n保留当前指令所要求的手臂角色; 重新考虑只为之前的布局选择的角色 。\n重置对象身份,目的地,像素,姿势,高度,通关和抓取与本场相抵消.\n如果记忆缺失,请从观察开始."},{"en":"This session allows 5 attempts including the\ninitial episode (0 means no attempt-count limit; other run limits still apply).\n\nPrefer in-place recovery when possible. reset restores the same task, seed\ngroup and layout. Re-run perception and do not reuse stale pixels or coordinates.\nBefore each reset or unsolved finish, save the attempt number, actual commands,\nobserved progress, failure evidence and next changed strategy variable under\n/example/runs/put_bottles_into_dustbin_s1_l0/attempts/attempt_\u003cN>_failed.json. Never overwrite an earlier\nattempt. Append bounded observations to /example/memory/robodojo/_internal/inbox/put_bottles_into_dustbin_s1_l0/wip/notes.md.\nChange a named variable on each retry: instruction, arm roles, action order,\nchunk count, localization or approach pose. Do not infer that a task is\nimpossible from one unsuccessful approach; record unknown causes as unknown.\nAn unsolved finish is refused while a finite attempt budget remains. After\nnative success, stop motion; reset is refused. Use the remaining turns to\nrecord what worked and the uncertainties before calling finish.","origin":"old","zh":"此会话允许5尝试,包括初始剧集0表示没有尝试计数限制;其他运行限制仍然适用).\n尽可能优先进行原位恢复。 重置会恢复相同的任务、 种子组和布局 。\n重新运行感知,不重复使用像素或坐标 。\n在每次重设或未解决完成之前,请保存尝试号、 实际命令、 已观察到的进展、 失败证据和下一个更改的战略变量 。/example/runs/put_bottles_into_dustbin_s1_l0/attempts/attempt_\u003cN>_failed.json.\n永远不要覆盖之前的尝试。\n附加限制的观察到/example/memory/robodojo/_internal/inbox/put_bottles_into_dustbin_s1_l0/wip/notes.md.\n在每个重试上更改一个命名的变量:指令,手臂角色,动作顺序,块数,本地化或方法摆放.\n不要推断一项任务不可能从一个失败的方法中完成;将未知原因记录为未知原因。\n在有限度的尝试预算存在时,拒绝完成未解决的工作。\n本土成功后,停止运动;重置被拒绝.\n使用剩下的转弯来记录什么是有效的以及在叫完之前的不确定性."},{"en":"Reserve time to close out the attempt and write\n/example/runs/put_bottles_into_dustbin_s1_l0/put_bottles_into_dustbin_s1_l0.json before calling finish. Include task, seed,\nlayout, verbatim instruction, attempts, native_success, final_state,\nmemory_files_read and uncertainties. If unsolved, reference the failed-attempt\narchives and claim no successful trajectory.\n\nOn success, re-read the current attempt's recorded trajectory, starting after\nthe most recent reset if one occurred.\nIts ordered strategy_notes must account for every exported action and SAM3\ncall with actual parameters, trace step, phase, observed result and the reason\nfor any VPP2/primitive switch. Do not invent, omit or reorder calls.\nThe runner exports put_bottles_into_dustbin_s1_l0_recipe.jsonl from recorded motion commands\nand SAM3 calls that found a mask without an error, in invocation order.\nFinding a mask does not establish correct identity. Historical pixels, steps\nand coordinates are evidence, not targets to replay on a new layout.\nThe audit/recipe pair is published only when native success is confirmed.","origin":"old","zh":"结束尝试并写作的预留时间/example/runs/put_bottles_into_dustbin_s1_l0/put_bottles_into_dustbin_s1_l0.json在叫完之前。\n包含任务,种子,布局,逐字记录,尝试,native_success,final_state,memory_files_read和不确定因素。\n如果未解决,请引用失败的尝试档案, 并声称没有成功轨迹 。\n在成功时,重读当前尝试的录制轨迹,从最近的重置发生后开始.\n已经订好了strategy_notes必须对每一次出口行动进行衡算,并且SAM3调用实际参数、微量步骤、相位、观测到的结果以及任何VPP2/原始开关。\n不要发明、省略或重排电话。\n跑步输出put_bottles_into_dustbin_s1_l0_recipe.jsonl从记录的运动命令和SAM3找到一个没有错误的口罩的电话,按照引用顺序。\n找到面具并不能确定正确的身份。\n历史像素,步骤和坐标都是证据,而不是在新的布局上重放的目标.\n只有在本地成功得到确认时,才公布审计/记录对子。"},{"en":"Only after success, consolidate working notes and the successful\ntrajectory into /example/memory/robodojo/_internal/inbox/put_bottles_into_dustbin_s1_l0/task-family_put_bottles_into_dustbin_s1_l0_draft.md. Write a\ncompact reference that helps evaluation adapt the strategy to a new scene:\n- Recognition: observed visual cues, useful SAM3 descriptions and how identity\n  was checked; distinguish object recognition from locating a contact feature.\n- Phase plan: prerequisites, actions, visible completion gates, protected\n  relations and terminal actions. Explain arm roles and whether the instruction\n  requires them or the observed layout motivated them.\n- Control choices: VPP2 instructions, Primitive use, chunk choices and the\n  observed reason for continuing or switching. Keep exact tested parameters in\n  the audit; include reusable settings with their conditions of use.\n- Action costs: record observed costs for the main phases and required terminal\n  motions, distinguishing productive actions from failed attempts and recovery.\n  Treat these costs as evidence from this episode, not fixed budgets for new\n  scenes. Use recorded action counters; do not invent missing measurements.\n- Adaptation: what to re-identify, measure or decide on a new seed/layout,\n  including approach geometry, grasp offsets, clearance and release conditions.\n- Recovery and limits: failure evidence, changes tried, what subsequently\n  worked, unresolved causes and situations where the strategy may not apply.\n\nSeparate observed outcomes from explanations. A successful retry does not prove\nwhich change caused improvement. Do not invent causes or parameter ranges.\nKeep scene coordinates in the audit, not reusable guidance. One seed/layout\nsupports single-shot confidence, even after several attempts; it does not\nestablish robustness across scenes. Use the recorded evidence after success,\nnot additional robot motion, to prepare memory.\nTask-family frontmatter must be valid YAML delimited by --- lines:\n---\nscope: task-family\nsuite: robodojo\nregime: arx_x5\ntask_id: put_bottles_into_dustbin\ntask_language: >-\n  \u003cobserved native instruction>\nevidence:\n  cells: [put_bottles_into_dustbin_s1_l0]\n  attempts: \u003cnumber of attempts>\nconfidence: single-shot\n---\n\nWhen evidence supports a cross-task lesson, write a separate\n/example/memory/robodojo/_internal/inbox/put_bottles_into_dustbin_s1_l0/new_global_\u003clesson-id>.md. Use scope: global, a bare descriptive\nid, title, applies_when, kind (one of primitive, perception, strategy, failure,\ninfra), and the same evidence and confidence fields. State the observation,\nhow to apply it, its limits and what would falsify it. A single layout warrants\nsingle-shot confidence only. Read existing relevant leaves before proposing\na lesson; avoid duplicates and record contradicting evidence explicitly.\nIf no new global lesson is supported, say so rather than inventing one.\n\nDuring failed attempts, write lessons only in wip/. Never write directly to\npublished memory. The shared finalizer merges valid inbox proposals and updates\nMEMORY.md after the run; do not claim publication before it completes.","origin":"old","zh":"只有在成功之后,才能将工作说明和成功轨迹合并成/example/memory/robodojo/_internal/inbox/put_bottles_into_dustbin_s1_l0/task-family_put_bottles_into_dustbin_s1_l0_draft.md.\n写一个紧凑的参考,帮助评价使策略适应新场景:\n- 识别:观测到的视觉提示,有用SAM3描述和如何检查身份;区分对象识别和查找联系人特征。\n- 阶段计划:先决条件、行动、可见的完工门、受保护的关系和终端行动。\n解释臂部角色,以及指令是否要求它们或者所观察到的布局刺激它们.\n- 控制选择:VPP2指令、初级使用、块选择和观察到的继续或切换的理由。\n在审计中保留精确的测试参数;包括可重复使用的设置及其使用条件.\n- 行动费用:记录所观察到的主要阶段的费用和需要的终止动议,区分生产性行动与失败的尝试和回收。\n将这些费用作为本回合的证据,而不是新场景的固定预算.\n使用已记录的动作计数器;不要发明缺失的测量 。\n- 适应:如何重新识别、衡量或决定新的种子/播种,包括方法几何、把握抵消、清除和释放条件。\n- 恢复和限制:失败证据、尝试改变、后来起作用、未解决的原因以及战略可能不适用的情况。\n将观察到的结果与解释分开。\n成功的重试不能证明哪些变化导致了改进。\n不要发明原因或参数范围。\n在审计中保留场景坐标,不重复使用指导.\n一种种子/播种支持单发信心,即使经过多次尝试;它并没有建立横跨场景的稳健性.\n使用成功后记录的证据,而不是额外的机器人运动,来准备记忆.\n任务家族前题必须有效 YAML , 以 -- --行定义 :\n---\nscope: task-family\nsuite: robodojo\nregime: arx_x5\ntask_id: put_bottles_into_dustbin\ntask_language: >- \u003cobserved native instruction>\nevidence:\ncells: [put_bottles_into_dustbin_s1_l0]\nattempts: \u003cnumber of attempts>\nconfidence: single-shot\n---\n当证据支持交叉任务课时,请另写一个/example/memory/robodojo/_internal/inbox/put_bottles_into_dustbin_s1_l0/new_global_\u003clesson-id>.md.\n使用范围:全局性、赤裸的描述性标识、标题、applies_when,类型(原始的,认知的,策略的,失败的,下面的),以及相同的证据和信心领域.\n说明意见、如何适用、其限度和会伪造哪些内容。\n单一的布局只值得单发置信.\n在提出经验教训之前,先读一下现有的相关叶子;避免重复,并明确记录相互矛盾的证据。\n如果不支持新的全球经验,那么就说它不是发明它。\n在尝试失败时,只用 wip/ 写入课程 。\n永远不要直接写给已出版的记忆.\n共享定稿器合并有效的收件箱提议和更新MEMORY.md运行后;在完成前不要声称已公布。"},{"en":"Control RoboDojo's dual ARX-X5 arms using the native task instruction in view_env_state.\n\nSolve the current task at its fixed seed and layout, then produce\nevidence-backed memory for evaluation on other seeds and layouts. This is\nexploration session 1 of 3. A successful episode\nprovides a strategy to adapt, not a trajectory to replay unchanged.","origin":"robot","zh":"控件RoboDojo双倍ARX-X5使用本地任务指令的臂章view_env_state.\n以固定种子和布局解决当前的任务,然后产生证据支持的记忆,用于对其他种子和布局的评价.\n这是勘探课1页:13.\n成功的剧集提供了一个适应的策略,而不是一个没有改变的重播轨迹."},{"en":"Before the first robot action:\n1. Read robots/robodojo/guides/GUIDE_RPENT.md completely.\n2. Inspect view_env_state and the head and wrist images. Read the native task\n   instruction and note both arms' initial end-effector positions and orientations.\n3. Read /example/memory/robodojo/MEMORY.md when present and relevant task-family notes.\n   Consult matching global lessons and successful task-specific JSON/JSONL pairs.\n4. Read /example/memory/robodojo/_internal/inbox/put_bottles_into_dustbin_s1_l0/wip/notes.md when present.\n\nUse the successful recipe to inspect VPP2 cadence. Preserve arm roles\nrequired by the native instruction and reconsider layout-specific roles. If\nmemory is absent, proceed from observation.\n\nBefore moving, state a brief plan with arm roles, observable subgoals and\nthe required final robot posture. Check episode_status.step_limit and remaining_steps.","origin":"robot","zh":"在第一个机器人动作前:\n1.\n读取robots/robodojo/guides/GUIDE_RPENT.md完全没有。\n2.\n检查view_env_state以及头部和手腕的图像。\n阅读本方任务指示,并注明武器最初的末端效果位置和方向。\n3.\n读取/example/memory/robodojo/MEMORY.md(d) 现有和相关的任务-家庭说明。\n与全球经验教训和针对具体任务的 JSON/JSONL双胞胎\n4.\n读取/example/memory/robodojo/_internal/inbox/put_bottles_into_dustbin_s1_l0/wip/notes.md当于现时.\n使用成功的食谱检查VPP2节奏。\n保留原生指令要求的臂部角色,重新考虑布局特定的角色.\n如果记忆缺失,请从观察开始.\n在移动前,请说明一个简短的计划,其中包含臂部角色,可观察到的子目标和所需的最终机器人姿态.\n ernal/inbox/put_bottles_into_dustbin_s1_l0/wip/notes.md.\n在每个重试上更改一个命名的变量:指令,手臂角色,动作顺序,块数,本地化或方法摆放.\n不要推断一项任务不可能从一个失败的方法中完成;将未知原因记录为未知原因。\n在有限度的尝试预算存在时,拒绝完成未解决的工作。\n本土成功后,停止运动;重置被拒绝.\n使用剩下的转弯来记录什么是有效的以及在叫完之前的不确定性."},{"en":"Placement and arrangement tasks commonly require both arms back at\ntheir initial end-effector positions and orientations. Check this after the\nobject goals are satisfied. Stop immediately on native success, even during\na planned return.\n\nReserve time to close out the attempt and write\n/example/runs/put_bottles_into_dustbin_s1_l0/put_bottles_into_dustbin_s1_l0.json before calling finish. Include task, seed,\nlayout, verbatim instruction, attempts, native_success, final_state,\nmemory_files_read and uncertainties. If unsolved, reference the failed-attempt\narchives and claim no successful trajectory.\n\nOn success, re-read the current attempt's recorded trajectory, starting after\nthe most recent reset if one occurred.\nIts ordered strategy_notes must account for every exported action and SAM3\ncall with actual parameters, trace step, phase, observed result and the reason\nfor any VPP2/primitive switch. Do not invent, omit or reorder calls.\nThe runner exports put_bottles_into_dustbin_s1_l0_recipe.jsonl from recorded motion commands\nand SAM3 calls that found a mask without an error, in invocation order.\nFinding a mask does not establish correct identity. Historical pixels, steps\nand coordinates are evidence, not targets to replay on a new layout.\nThe audit/recipe pair is published only when native success is confirmed.\n\nOnly after success, consolidate working notes and the successful\ntrajectory into /example/memory/robodojo/_internal/inbox/put_bottles_into_dustbin_s1_l0/task-family_put_bottles_into_dustbin_s1_l0_draft.md. Write a\ncompact reference that helps evaluation adapt the strategy to a new scene:\n- Recognition: observed visual cues, useful SAM3 descriptions and how identity\n  was checked; distinguish object recognition from locating a contact feature.\n- Phase plan: prerequisites, actions, visible completion gates, protected\n  relations and terminal actions. Explain arm roles and whether the instruction\n  requires them or the observed layout motivated them.\n- Control choices: VPP2 instructions, Primitive use, chunk choices and the\n  observed reason for continuing or switching. Keep exact tested parameters in\n  the audit; include reusable settings with their conditions of use.\n- Action costs: record observed costs for the main phases and required terminal\n  motions, distinguishing productive actions from failed attempts and recovery.\n  Treat these costs as evidence from this episode, not fixed budgets for new\n  scenes. Use recorded action counters; do not invent missing measurements.\n- Adaptation: what to re-identify, measure or decide on a new seed/layout,\n  including approach geometry, grasp offsets, clearance and release conditions.\n- Recovery and limits: failure evidence, changes tried, what subsequently\n  worked, unresolved causes and situations where the strategy may not apply.\n\nSeparate observed outcomes from explanations. A successful retry does not prove\nwhich change caused improvement. Do not invent causes or parameter ranges.\nKeep scene coordinates in the audit, not reusable guidance. One seed/layout\nsupports single-shot confidence, even after several attempts; it does not\nestablish robustness across scenes. Use the recorded evidence after success,\nnot additional robot motion, to prepare memory.\nIn the task-family frontmatter use suite robodojo, regime arx_x5,\ntask_id put_bottles_into_dustbin, the verbatim native instruction as task_language, and\nevidence.cells [\"put_bottles_into_dustbin_s1_l0\"] with the actual number of attempts.\n\nWhen evidence supports a cross-task lesson, write a separate\n/example/memory/robodojo/_internal/inbox/put_bottles_into_dustbin_s1_l0/new_global_\u003clesson-id>.md. Use scope: global, a bare descriptive\nid, title, applies_when, kind (one of primitive, perception, strategy, failure,\ninfra), and the same evidence and confidence fields. State the observation,\nhow to apply it, its limits and what would falsify it. A single layout warrants\nsingle-shot confidence only. Read existing relevant leaves before proposing\na lesson; avoid duplicates and record contradicting evidence explicitly.\nIf no new global lesson is supported, say so rather than inventing one.\n\nDuring failed attempts, write lessons only in wip/. Never write directly to\npublished memory. The shared finalizer merges valid inbox proposals and updates\nMEMORY.md after the run; do not claim publication before it completes.","origin":"robot","zh":"安置和安排任务通常要求武器在最初的末端效应位置和方向上都返回。\n在对象目标满足后选中此项 。\n立即停止在本土的成功, 即使在计划返回期间。\n结束尝试并写作的预留时间/example/runs/put_bottles_into_dustbin_s1_l0/put_bottles_into_dustbin_s1_l0.json在叫完之前。\n包含任务,种子,布局,逐字记录,尝试,native_success,final_state,memory_files_read和不确定因素。\n如果未解决,请引用失败的尝试档案, 并声称没有成功轨迹 。\n在成功时,重读当前尝试的录制轨迹,从最近的重置发生后开始.\n已经订好了strategy_notes必须对每一次出口行动进行衡算,并且SAM3调用实际参数、微量步骤、相位、观测到的结果以及任何VPP2/原始开关。\n不要发明、省略或重排电话。\n跑步输出put_bottles_into_dustbin_s1_l0_recipe.jsonl从记录的运动命令和SAM3找到一个没有错误的口罩的电话,按照引用顺序。\n找到面具并不能确定正确的身份。\n历史像素,步骤和坐标都是证据,而不是在新的布局上重放的目标.\n只有在本地成功得到确认时,才公布审计/记录对子。\n只有在成功之后,才能将工作说明和成功轨迹合并成/example/memory/robodojo/_internal/inbox/put_bottles_into_dustbin_s1_l0/task-family_put_bottles_into_dustbin_s1_l0_draft.md.\n写一个紧凑的参考,帮助评价使策略适应新场景:\n- 识别:观测到的视觉提示,有用SAM3描述和如何检查身份;区分对象识别和查找联系人特征。\n- 阶段计划:先决条件、行动、可见的完工门、受保护的关系和终端行动。\n解释臂部角色,以及指令是否要求它们或者所观察到的布局刺激它们.\n- 控制选择:VPP2指令、初级使用、块选择和观察到的继续或切换的理由。\n在审计中保留精确的测试参数;包括可重复使用的设置及其使用条件.\n- 行动费用:记录所观察到的主要阶段的费用和需要的终止动议,区分生产性行动与失败的尝试和回收。\n将这些费用作为本回合的证据,而不是新场景的固定预算.\n使用已记录的动作计数器;不要发明缺失的测量 。\n- 适应:如何重新识别、衡量或决定新的种子/播种,包括方法几何、把握抵消、清除和释放条件。\n- 恢复和限制:失败证据、尝试改变、后来起作用、未解决的原因以及战略可能不适用的情况。\n将观察到的结果与解释分开。\n成功的重试不能证明哪些变化导致了改进。\n不要发明原因或参数范围。\n在审计中保留场景坐标,不重复使用指导.\n一种种子/播种支持单发信心,即使经过多次尝试;它并没有建立横跨场景的稳健性.\n使用成功后记录的证据,而不是额外的机器人运动,来准备记忆.\n在任务家庭前题中使用套房 robodojo,政权arx_x5,task_idput_bott ible completion gates, protected\n  relations and terminal actions. Explain arm roles and whether the instruction\n  requires them or the observed layout motivated them.\n- Control choices: the original full task instruction, observed phase and\n  state at Awomo05 takeover, Primitive use, chunk choices and the\n  observed reason for continuing or switching. Keep exact tested parameters in\n  the audit; include reusable settings with their conditions of use.\n- Action costs: record observed costs for the main phases and required terminal\n  motions, distinguishing productive actions from failed attempts and recovery.\n  Treat these costs as evidence from this episode, not fixed budgets for new\n  scenes. Use recorded action counters; do not invent missing measurements.\n- Adaptation: what to re-identify, measure or decide on a new seed/layout,\n  including approach geometry, grasp offsets, clearance and release conditions.\n- Recovery and limits: failure evidence, changes tried, what subsequently\n  worked, unresolved causes and situations where the strategy may not apply.\n\nSeparate observed outcomes from explanations. A successful retry does not prove\nwhich change caused improvement. Do not invent causes or parameter ranges.\nKeep scene coordinates in the audit, not reusable guidance. One seed/layout\nsupports single-shot confidence, even after several attempts; it does not\nestablish robustness across scenes. Use the recorded evidence after success,\nnot additional robot motion, to prepare memory.\nTask-family frontmatter must be valid YAML delimited by --- lines:\n---\nscope: task-family\nsuite: robodojo\nregime: arx_x5\ntask_id: put_bottles_into_dustbin\ntask_language: >-\n  \u003cobserved native instruction>\nevidence:\n  cells: [put_bottles_into_dustbin_s1_l0]\n  attempts: \u003cnumber of attempts>\nconfidence: single-shot\n---\n\nWhen evidence supports a cross-task lesson, write a separate\n/example/memory/robodojo/_internal/inbox/put_bottles_into_dustbin_s1_l0/new_global_\u003clesson-id>.md. Use scope: global, a bare descriptive\nid, title, applies_when, kind (one of primitive, perception, strategy, failure,\ninfra), and the same evidence and confidence fields. State the observation,\nhow to apply it, its limits and what would falsify it. A single layout warrants\nsingle-shot confidence only. Read existing relevant leaves before proposing\na lesson; avoid duplicates and record contradicting evidence explicitly.\nIf no new global lesson is supported, say so rather than inventing one.\n\nDuring failed attempts, write lessons only in wip/. Never write directly to\npublished memory. The shared finalizer merges valid inbox proposals and updates\nMEMORY.md after the run; do not claim publication before it completes.","origin":"old","zh":"只有在成功之后,才能将工作说明和成功轨迹合并成/example/memory/robodojo/_internal/inbox/put_bottles_into_dustbin_s1_l0/task-family_put_bottles_into_dustbin_s1_l0_draft.md.\n写一个紧凑的参考,帮助评价使策略适应新场景:\n- 识别:观测到的视觉提示,有用SAM3描述和如何检查身份;区分对象识别和查找联系人特征。\n- 阶段计划:先决条件、行动、可见的完工门、受保护的关系和终端行动。\n解释臂部角色,以及指令是否要求它们或者所观察到的布局刺激它们.\n- 控制选择:最初的全部任务指示、观测阶段和状态Awomo05接管、初步使用、块选择和观察到的继续或切换的理由。\n在审计中保留精确的测试参数;包括可重复使用的设置及其使用条件.\n- 行动费用:记录所观察到的主要阶段的费用和需要的终止动议,区分生产性行动与失败的尝试和回收。\n将这些费用作为本回合的证据,而不是新场景的固定预算.\n使用已记录的动作计数器;不要发明缺失的测量 。\n- 适应:如何重新识别、衡量或决定新的种子/播种,包括方法几何、把握抵消、清除和释放条件。\n- 恢复和限制:失败证据、尝试改变、后来起作用、未解决的原因以及战略可能不适用的情况。\n将观察到的结果与解释分开。\n成功的重试不能证明哪些变化导致了改进。\n不要发明原因或参数范围。\n在审计中保留场景坐标,不重复使用指导.\n一种种子/播种支持单发信心,即使经过多次尝试;它并没有建立横跨场景的稳健性.\n使用成功后记录的证据,而不是额外的机器人运动,来准备记忆.\n任务家族前题必须有效 YAML , 以 -- --行定义 :\n---\nscope: task-family\nsuite: robodojo\nregime: arx_x5\ntask_id: put_bottles_into_dustbin\ntask_language: >- \u003cobserved native instruction>\nevidence:\ncells: [put_bottles_into_dustbin_s1_l0]\nattempts: \u003cnumber of attempts>\nconfidence: single-shot\n---\n当证据支持交叉任务课时,请另写一个/example/memory/robodojo/_internal/inbox/put_bottles_into_dustbin_s1_l0/new_global_\u003clesson-id>.md.\n使用范围:全局性、赤裸的描述性标识、标题、applies_when,类型(原始的,认知的,策略的,失败的,下面的),以及相同的证据和信心领域.\
