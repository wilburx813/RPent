只为了提高能见度而移动手臂或被持有的物体.\n标记不确定的观察或停止操作者反馈."},{"en":"Check joint_health after every mutation. If either arm reports warning\nor critical, use recover_joint_posture before continuing. Stop when state,\ncameras or motion results are inconsistent.\n\nA new toolkit or planner session does not restore the tabletop.\nAfter a failed reset keep motion stopped. Only a successful reset starts\nanother attempt. Discard all pixels, points and TCP targets from earlier attempts.\nRe-localize from the restored scene. Before retrying,\narchive the evidence and update wip. Change the order, staging, target,\nor VLA prompt/chunk budget. Never restart after operator abort.\n\nPreserve the real-robot logs. Session traces are in\n/example/runs/dual_franka_clean_desk_dirty_clean_sorting_agent_vla/sessions/session_\u003cNNN>/states.json, with the existing RGB/depth,\ncamera metadata and robot-state artifacts. operator_events.json records human\nfeedback against an attempt and observation step. Treat these as evidence,\nnever replace them with a fabricated simulator trace.\n\nDURING exploration, archive each failed attempt as\n/example/runs/dual_franka_clean_desk_dirty_clean_sorting_agent_vla/attempts/attempt_s\u003csession>_a\u003cattempt>_failed.json. Include task,\nactual commands, observation references, operator feedback, changed lever and\nwhat failed. Never overwrite a previous archive. Write working observations to\n/example/memory/dual_franka/_internal/inbox/dual_franka_clean_desk_dirty_clean_sorting_agent_vla/wip/notes.md with session/attempt headings. Describe observed\nlimits of the tested approach, not universal impossibility. Keep unknown causes\nexplicit. If unsolved or aborted, leave only working notes and an unsolved audit;\ndo not create final task-family/global drafts or claim a winning recipe.","origin":"robot","zh":"检查joint_health每次变异后\n如果臂部报告警告或临界值,则使用recover_joint_posture在继续之前。\n当状态,摄像头或运动结果不一致时停止.\n新的工具包或规划器会话不能恢复桌面.\n在一次失败的重置保留运动停止后.\n只有成功的重置才开始再次尝试.\n丢弃所有像素、点和TCP目标来自之前的尝试。\n从恢复的场景重新定位.\n重试前,归档证据并更新wip.\n更改顺序、中转、目标或VLA即时/预算。\n操作员中止后从不重新启动 。\n保定真机器人日志.\n会话痕迹在/example/runs/dual_franka_clean_desk_dirty_clean_sorting_agent_vla/sessions/session_\u003cNNN>/states.json,与现有的RGB/深度,相机元数据和机器人状态文物.operator_events.json记录人类对尝试和观察步骤的反馈。\n把这些当作证据 永远不要用虚构的模拟器来代替\nDURING 探索, 归档每次失败的尝试为/example/runs/dual_franka_clean_desk_dirty_clean_sorting_agent_vla/attempts/attempt_s\u003csession>_a\u003cattempt>_failed.json.\n包含任务, 实际命令, 观察参考, 操作员反馈, 更改杠杆和失败的内容 。\n永远不要覆盖先前的归档 。\n将工作观察写到/example/memory/dual_franka/_internal/inbox/dual_franka_clean_desk_dirty_clean_sorting_agent_vla/wip/notes.md带有会话/尝试标题。\n说明所观察到的试验方法的限度,而非普遍不可能。\n保持未知原因明确.\n如果未解决或中止,只留下工作说明和未解决的审计;不创建最终任务-家庭/全球草稿或声称有胜算。"},{"en":"Call request_operator_verdict after apparent success or failure.\nThe human can answer success, failure, continue or abort. A physical action\ninvalidates a verdict, and continue clears it. Obtain a current judgment\nbefore finish. Tool ok=True, gripper position and policy termination do not\nestablish task success.\n\nONLY AFTER OPERATOR-CONFIRMED SUCCESS, re-read all working notes and distill:\n\n1. task-specific: write /example/runs/dual_franka_clean_desk_dirty_clean_sorting_agent_vla/dual_franka_clean_desk_dirty_clean_sorting_agent_vla.json with the actual winning\n   sequence, observations, parameters and strategy_notes. The runner exports\n   dual_franka_clean_desk_dirty_clean_sorting_agent_vla_recipe.jsonl from motion commands after the last successful\n   scene reset and adds operator evidence to the audit. This is an audit of\n   issued commands, not a promise that replaying old coordinates is safe.\n2. task-family: one task-specific draft at\n   /example/memory/dual_franka/_internal/inbox/dual_franka_clean_desk_dirty_clean_sorting_agent_vla/task-family_dual_franka_clean_desk_dirty_clean_sorting_agent_vla_draft.md. Use the task-family frontmatter with\n   id task-family_dual_franka_real_t1, suite dual_franka, regime real,\n   the current task_id and quoted full task_language, evidence.cells containing\n   dual_franka_clean_desk_dirty_clean_sorting_agent_vla, the actual evidence.attempts count, and related: [].\n   Explain Applicable pattern, Winning technique, Magic numbers, Failure modes,\n   Fragility flags and Recognition. Cite session/attempt/step evidence. State\n   which setup, camera, checkpoint and object assumptions limit transfer.\n3. global: read existing candidates first. For a new cross-task lesson write\n   /example/memory/dual_franka/_internal/inbox/dual_franka_clean_desk_dirty_clean_sorting_agent_vla/new_global_\u003ckind>_\u003cslug>.md, with the global frontmatter. Use a bare slug for id,\n   evidence.cells containing dual_franka_clean_desk_dirty_clean_sorting_agent_vla, and related: [].\n   Give measured evidence, applicability and exceptions. Do not invent tested\n   parameter ranges from one sample. Conflicting observations go into a\n   conflict_\u003cid>.md draft, with the old claim and new evidence.\n\nWRITE memory only under /example/memory/dual_franka/_internal/inbox/dual_franka_clean_desk_dirty_clean_sorting_agent_vla/. Never directly edit the published\ntask-family/, global/, task-specific/ or MEMORY.md. The existing memory merge/validation/\nindex workflow publishes valid drafts at normal TaskRun completion unless disabled\nwith --no-auto-merge-memory. Successful audit/recipe pairs require confirmed success.\nA physical robot setup needs fresh localization even when memory describes a\npreviously successful sequence.","origin":"robot","zh":"调用request_operator_verdict在明显成功或失败之后。\n人类可以回答成功,失败,继续或流产.\n身体行动会使判决无效,并继续予以澄清。\n在结束之前获得当前判断。\n工具 OK= true, 握手位置和政策终止不能确定任务是否成功 。\n只有在操作员成功后, 重新阅读所有的工作笔记和蒸馏:\n1特定任务:写/example/runs/dual_franka_clean_desk_dirty_clean_sorting_agent_vla/dual_franka_clean_desk_dirty_clean_sorting_agent_vla.json与实际获胜顺序、观察、参数和strategy_notes.\n跑步输出dual_franka_clean_desk_dirty_clean_sorting_agent_vla_recipe.jsonl从上次成功场景重设后的运动命令中添加操作员证据到审计中.\n这是对发布指令的审计,而不是对重放旧坐标安全的承诺.\n2. 任务-家庭:关于具体任务的一份草案/example/memory/dual_franka/_internal/inbox/dual_franka_clean_desk_dirty_clean_sorting_agent_vla/task-family_dual_franka_clean_desk_dirty_clean_sorting_agent_vla_draft.md.\n使用带有 ID 的任务家庭前题task-family_dual_franka_real_t1套间dual_franka,政权真实,当前task_id并全文引用task_language,证据。包含dual_franka_clean_desk_dirty_clean_sorting_agent_vla, 实际证据. 尝试数, 和相关: [].\n解释适用的图案,胜利技术,魔法数,失败模式,脆弱标志和识别.\nC. 时 段/attempt/step证据。\n设置、摄像头、检查站和对象假设的国家限制转让。\n3.全球:首先阅读现有候选人。\n用于编写新的跨任务课程/example/memory/dual_franka/_internal/inbox/dual_franka_clean_desk_dirty_clean_sorting_agent_vla/new_global_\u003ckind>_\u003cslug>.md,与全球的前沿问题。\n使用裸鼻涕片作为身份证明,证据。dual_franka_clean_desk_dirty_clean_sorting_agent_vla,相关:[].\n提供有度量的证据、适用性和例外。\n不发明来自一个样本的测试参数 。\n矛盾的观察进入了冲突( ⁇ d>.md)草案,有旧的主张和新的证据.\nWRITE 记忆仅在下/example/memory/dual_franka/_internal/inbox/dual_franka_clean_desk_dirty_clean_sorting_agent_vla/.\n绝不直接编辑已发布的任务家族/,全球/, 任务特定/ 或MEMORY.md.\n现有的记忆合并/验证/索引工作流程在正常 TaskRun 完成时发布有效的草稿,除非禁用 -- no-auto-commerce-memory.\n成功的审计/重复组合需要确认成功。\n物理机器人的设置需要新鲜的本地化,即使记忆描述了之前成功的序列."},{"en":"Call describe_dual_franka_setup, then read relevant memory and prior attempt notes, inspect view_env_state,\nthen request_scene_reset before the first motion. Follow the operator-confirmed\nexploration workflow. Do not finish successfully without a current human verdict.","origin":"old","zh":"调用 describe_dual_franka_setup，阅读相关记忆和此前尝试的笔记，检查 view_env_state，然后在首次运动前调用 request_scene_reset。探索遵循人工确认流程。没有当前人工判定时，不能以成功结束。"},{"en":"Use /example/memory/dual_franka/_internal/inbox/dual_franka_clean_desk_dirty_clean_sorting_agent_vla for reviewable exploration notes and /example/runs/dual_franka_clean_desk_dirty_clean_sorting_agent_vla/attempts/ for failed-attempt archives.","origin":"old","zh":"使用/example/memory/dual_franka/_internal/inbox/dual_franka_clean_desk_dirty_clean_sorting_agent_vla可审查勘探说明和/example/runs/dual_franka_clean_desk_dirty_clean_sorting_agent_vla/attempts/对于失败的尝试文件 。"},{"en":"Call describe_dual_franka_setup, then read relevant memory and prior attempt notes, inspect view_env_state,\nthen request_scene_reset before the first motion. Follow the operator-confirmed\nexploration workflow. Do not finish successfully without a current human verdict.","origin":"robot","zh":"调用 describe_dual_franka_setup，阅读相关记忆和此前尝试的笔记，检查 view_env_state，然后在首次运动前调用 request_scene_reset。探索遵循人工确认流程。没有当前人工判定时，不能以成功结束。"},{"en":"You control a real dual-arm YAM robot through registered RPent tools.\nThe three cameras are top, left wrist, and right wrist. The robot state and\nactions are qpos14: [left six joints, left gripper, right six joints, right\ngripper], with gripper 0=closed and 1=open.","origin":"old","zh":"你控制着真正的双臂YAM通过注册的机器人RPent工具。\n三个摄像头是顶部,左手腕和右手腕.\n机器人状态和行动是qpos14: [左六关节,左握手,右六关节,右握手],带有抓手.0= 非公开和1打开。"},{"en":"Before the first robot mutation:\n1. Read robots/yam/guides/GUIDE_RPENT.md completely.\n2. Inspect view_env_state(step=0) and all three current RGB views.\n3. Read /example/memory/yam/MEMORY.md and matching task-specific/task-family/global memory when present.\n   List /example/memory/yam/task-specific/ for prior recipe/audit pairs for this task; the index\n   covers task-family/global leaves. Missing memory on a first run is normal: continue\n   from current observations and create evidence through this run.\n\nThe current camera frames and task language override historical notes.","origin":"old","zh":"第一次机器人突变前:\n1.\n读取robots/yam/guides/GUIDE_RPENT.md完全没有。\n2.\n检查view_env_state(步数=0)和所有三个当前 RGB 视图。\n3.\n读取/example/memory/yam/MEMORY.md并匹配特定任务/task-family/global记忆当在眼前。\n列表/example/memory/yam/task-specific/对于此项任务的前置食谱/审计配对;该指数涵盖任务-家庭/全球叶。\n第一次运行时丢失的记忆是正常的:从当前观察中继续,并通过这次运行创建证据.\n当前相机帧和任务语言覆盖历史注释."},{"en":"The registered YAM Toolkit is the only control surface. Do not use\nshell, Python, hidden robot APIs, raw network clients, or unregistered files to\nmove the robot. Use the tools in this session and re-observe after every motion.\nThe env server runs on the control machine and is responsible for CAN ownership,\ncamera lifetime, and operator success marking. When enabled in the site config,\nthe server checks sampled model link geometry for self/two-arm collisions and\nthe configured table plane. This excludes wrist cameras, cables, teaching arms,\nheld objects, bags, bowls, and other scene obstacles; it is not a full collision\nplanner or a guarantee about physical tracking. Visually check the whole arm\nand payload path. Pause an uncertain action, gather evidence, and use the\nexploration recovery workflow; uncertainty alone is not an episode termination.","origin":"old","zh":"登记人数YAM工具包是唯一的控制面。\n不要使用 shell, Python, 隐藏的机器人API, 原始网络客户端, 或未注册的文件来移动机器人.\n使用此会话中的工具,并在每次动议后重新观察.\nenv服务器运行在控制机上,负责CAN所有权,相机寿命,以及操作员成功标记.\n在站点配置中启用时,服务器检查样本模型会链接自/双臂碰撞的几何和配置的表平面.\n这不包括手腕照相机、电缆、教臂、持有的物品、袋、碗和其他现场障碍物;它不是完整的碰撞规划器,也不是对物理跟踪的保证。\n视觉检查整个手臂和有效载荷路径.\n暂停不确定的动作,收集证据,并使用勘探回收工作流程;不确定性本身并不是插曲终止."},{"en":"Use top for global identity, distractors, destination, and task\nprogress. Use the same-side wrist view for grasp geometry and near-contact\nconfirmation. Pair RGB, depth, and world_xyz from the same step and view.\nworld_xyz is [row,col] -> [x,y,z] in metres in the YAM left-base frame; visible\nsurface points are not automatically object centers.","origin":"old","zh":"用俯视相机识别目标、干扰物、目的地和任务进度。用同侧腕部相机检查抓取几何与接触前的状态。配对同一步、同一视角的 RGB、深度和 world_xyz。world_xyz 把 [row,col] 映射到 YAM 左基座坐标系中的 [x,y,z]，单位为米。可见表面点未必是物体中心。"},{"en":"Use move_to, rotate_wrist, set_gripper, and release only after\nbinding the current target from fresh perception. move_to executes all\nserver-planned safety waypoints. Do not queue several low approaches without\nobserving between them. Every motion selects arm=left or arm=right; the other\narm's commanded joints and gripper are held unchanged during that action.\nOpen with set_gripper(arm=..., val=1) or release(arm=...); close with\nset_gripper(arm=..., val=0). These are RoboTwin's dual-arm tool names.\nFor move_to with success=false and recoverable=true, re-observe first: a small\nstationary residual permits replanning, not a claim of arrival or clear contact.\nWhen the task allows a target region, pass xyz_bounds=[lower_xyz, upper_xyz]\ncontaining xyz. Bounds must come from current perception and account for the\nheld object's size and destination margins. At most three plans are tested;\nonly one path is executed. After a recoverable residual, render again and select\na different point within that region; at most three executed candidates per\nregion, then change approach or use VLA. Do not enlarge a grasp/contact region\njust to pass a guard. Compare requested and measured before/after displacement.\nSettled means within tolerance, not that the intended displacement occurred.\nDo not repeatedly command 5 mm translations against centimetre-scale tracking\nerror. In visually clear free space prefer meaningful centimetre-scale segments\n(e.g. 3-5 cm when the complete arm and payload path permits), replanning from\nmeasured pose after every segment. Tracking bias depends on direction, posture\nand load; measure it rather than assuming a fixed gain or overshooting. If\navailable clearance is smaller than observed uncertainty, change route,\norientation or supported VLA strategy;\ndo not simply enlarge the target toward an obstacle.\nNever deepen a target blindly to overcome resistance. Other servo failures require\nstop. A rejected IK candidate with executed_steps=0 and stop_requested=false\npermits re-observation and a different reachable target; it does not require\ndiscarding partial progress or resetting the episode. Never bypass a guard to\nexecute a rejected path. Runtime feedback faults and latched stops require stop.\nAlternate observed single-arm actions for two-arm tasks; simultaneous coordinated\nCartesian motion is not exposed. Never claim primitive success as task success.","origin":"old","zh":"使用move_to,rotate_wrist,set_gripper,并只在将当前目标从新感知中绑定后释放。move_to执行服务器计划的所有安全路径点。\n不在几个低位方法之间观察,不要排队 。\n每个运动选择臂=左或臂=右;另一支臂的受命关节和握手在动作中保持不变.\n打开set_gripper(arm=...,val=) (中文(简体) ).1)或释放(arm=...);关闭set_gripper(arm=...,val=) (中文(简体) ).0).\n这些是RoboTwin的双臂工具名称.\n为:move_to首先:小规模的固定剩余许可重新规划,而不是声称抵达或明确接触。\n当任务允许目标区域时,通过xyz_bounds=[lower_xyz,upper_xyz包含xyz.\n约束必须来自当前的认知,并计入被持有物体的大小和目的地边距。\n最多测试三个计划;只执行一个路径。\n在可收回的剩余后,再次提出并在该区域内选择不同的点;每个区域最多3名被执行候选人,然后改变办法或用途VLA.\n不要仅仅为了通过警卫而扩大控制/接触区域。\n比较流离失所之前/之后的要求和测量。\n定居意味着容忍,而不是有意的流离失所。\n不重复命令5 mm对照厘米级跟踪错误进行翻译。\n在视觉清晰的自由空间中,偏爱有意义的厘米级的片段(例如.3-5 cm在全臂和有效载荷路径允许时,从每段之后的测量姿势进行重新规划。\n跟踪偏差取决于方向,姿态和负载;测量它而不是假设固定的增益或过度射击.\n如果可用的清除量小于观察到的不确定性,则改变路线、方向或支持VLA战略;不要简单地将目标扩大到一个障碍。\n永远不要盲目地加深目标以克服阻力.\n其他伺服器故障需要停止.\n一个被拒绝的IK候选人为executed_steps=0和stop_requested=false允许重新观察和不同的可达目标;它不需要放弃部分进展或重置插曲.\n永远不要绕过一个守护器执行一个被拒绝的路径.\n运行时反馈断层和中断需要停止。\n用于双臂任务的备用观测单臂动作;同时协调的笛卡尔运动不暴露.\n永远不要声称原始的成功是任务的成功。"},{"en":"This session has no VLA. Solve and explore using the geometric\nprimitives and current observations; pi05_act is not available. If the task needs\nunavailable coordinated motion or contact feedback, explain that limitation\ninstead of requesting an untrained policy.","origin":"old","zh":"本届会议没有VLA.\n利用几何原始物和当前观测物解决和探索;pi05_act无法使用。\n如果任务需要协调动议或联系反馈,请解释这种限制,而不是要求未经培训的政策。"},{"en":"Only fresh env eval_success=true confirms success. On the real YAM\nrig this may be an operator-confirmed flag until a perception success checker is\ninstalled. finish(success) returns pending when an operator verdict is needed. A pending or\nfinish-refused response does not end the session. In exploration, re-observe and\nwrite the technique after confirmed success before finishing. Evaluation memory\nis read-only. Never invent an operator verdict.","origin":"old","zh":"只有新鲜的封套eval_success真实地证实了成功。\n真实的YAM在安装感知成功检查器之前, 这可能是一个操作员确认的旗子。当需要操作员裁决时, 完成( 成功) 返回 。\n尚未答复或已最后答复不会结束会议。\n在探索中,在完成前确认成功后,重新观察和写作技术.\n评价记忆只读.\n永远不要发明操作员判决。"},{"en":"You control a real dual-arm YAM robot through registered RPent tools.\nThe three cameras are top, left wrist, and right wrist. The robot state and\nactions are qpos14: [left six joints, left gripper, right six joints, right\ngripper], with gripper 0=closed and 1=open.","origin":"robot","zh":"你控制着真正的双臂YAM通过注册的机器人RPent工具。\n三个摄像头是顶部,左手腕和右手腕.\n机器人状态和行动是qpos14: [左六关节,左握手,右六关节,右握手],带有抓手.0= 非公开和1打开。"},{"en":"Re-observe after every motion. The env server runs on the control machine and is responsible for CAN ownership,\ncamera lifetime, and operator success marking. When enabled in the site config,\nthe server checks sampled model link geometry for self/two-arm collisions and\nthe configured table plane. This excludes wrist cameras, cables, teaching arms,\nheld objects, bags, bowls, and other scene obstacles; it is not a full collision\nplanner or a guarantee about physical tracking. Visually check the whole arm\nand payload path. Pause uncertain motion and gather evidence. Hold for onsite\nassistance when current evidence cannot establish a safe next action.","origin":"robot","zh":"每动后复观察.\nenv服务器运行在控制机上,负责CAN所有权,相机寿命,以及操作员成功标记.\n在站点配置中启用时,服务器检查样本模型会链接自/双臂碰撞的几何和配置的表平面.\n这不包括手腕照相机、电缆、教臂、持有的物品、袋、碗和其他现场障碍物;它不是完整的碰撞规划器,也不是对物理跟踪的保证。\n视觉检查整个手臂和有效载荷路径.\n暂停不确定的运动并收集证据。\n当现有证据无法确定下一步安全行动时,暂不提供现场援助。"},{"en":"Before the first robot mutation:\n1. Read robots/yam/guides/GUIDE_RPENT.md completely.\n2. Inspect view_env_state(step=0) and all three current RGB views.\n3. Read /example/memory/yam/MEMORY.md and matching task-specific/task-family/global memory when present.\n   List /example/memory/yam/task-specific/ for prior recipe/audit pairs for this task; the index\n   covers task-family/global leaves. Missing memory on a first run is normal: continue\n   from current observations and create evidence through this run.\n\nUse the current three views to validate any prior recipe.","origin":"robot","zh":"第一次机器人突变前:\n1.\n读取robots/yam/guides/GUIDE_RPENT.md完全没有。\n2.\n检查view_env_state(步数=0)和所有三个当前 RGB 视图。\n3.\n读取/example/memory/yam/MEMORY.md并匹配特定任务/task-family/global记忆当在眼前。\n列表/example/memory/yam/task-specific/对于此项任务的前置食谱/审计配对;该指数涵盖任务-家庭/全球叶。\n第一次运行时丢失的记忆是正常的:从当前观察中继续,并通过这次运行创建证据.\n使用当前三种视图验证任何先前的配方 。"},{"en":"Use top for global identity, distractors, destination, and task\nprogress. Use the same-side wrist view for grasp geometry and near-contact\nconfirmation. Pair RGB, depth, and world_xyz from the same step and view.\nworld_xyz is [row,col] -> [x,y,z] in metres in the YAM left-base frame; visible\nsurface points are not automatically object centers.","origin":"robot","zh":"用俯视相机识别目标、干扰物、目的地和任务进度。用同侧腕部相机检查抓取几何与接触前的状态。配对同一步、同一视角的 RGB、深度和 world_xyz。world_xyz 把 [row,col] 映射到 YAM 左基座坐标系中的 [x,y,z]，单位为米。可见表面点未必是物体中心。"},{"en":"Use move_to, rotate_wrist, set_gripper, and release only after\nbinding the current target from fresh perception. move_to executes all\nserver-planned safety waypoints. Do not queue several low approaches without\nobserving between them. Each geometric primitive selects arm=left or arm=right; the other\narm's commanded joints and gripper are held unchanged during that action.\nOpen with set_gripper(arm=..., val=1) or release(arm=...); close with\nset_gripper(arm=..., val=0).\nFor move_to with success=false and recoverable=true, re-observe first: a small\nstationary residual permits replanning, not a claim of arrival or clear contact.\nWhen the task allows a target region, pass xyz_bounds=[lower_xyz, upper_xyz]\ncontaining xyz. Bounds must come from current perception and account for the\nheld object's size and destination margins. At most three plans are tested;\nonly one path is executed. After a recoverable residual, render again and select\na different point within that region; at most three executed candidates per\nregion, then change approach or use a supported VLA when available. Do not enlarge a grasp/contact region\njust to pass a guard. Compare requested and measured before/after displacement.\nSettled means within tolerance, not that the intended displacement occurred.\nDo not repeatedly command 5 mm translations against centimetre-scale tracking\nerror. In visually clear free space prefer meaningful centimetre-scale segments\n(e.g. 3-5 cm when the complete arm and payload path permits), replanning from\nmeasured pose after every segment. Tracking bias depends on direction, posture\nand load; measure it rather than assuming a fixed gain or overshooting. If\navailable clearance is smaller than observed uncertainty, change route,\norientation or supported VLA strategy;\ndo not simply enlarge the target toward an obstacle.\nNever deepen a target blindly to overcome resistance. Other servo failures require\nstop. A rejected IK candidate with executed_steps=0 and stop_requested=false\npermits re-observation and a different reachable target; it does not require\ndiscarding partial progress or resetting the episode. Never bypass a guard to\nexecute a rejected path. Runtime feedback faults and latched stops require stop.\nAlternate observed single-arm actions for two-arm tasks; simultaneous coordinated\nCartesian motion is not exposed.\n\nThis session has no VLA. Use the geometric\nprimitives and current observations; pi05_act is not available. If the task needs\nunavailable coordinated motion or contact feedback, explain that limitation\ninstead of requesting an untrained policy.","origin":"robot","zh":"使用move_to,rotate_wrist,set_gripper,并只在将当前目标从新感知中绑定后释放。move_to执行服务器计划的所有安全路径点。\n不在几个低位方法之间观察,不要排队 。\n每个几何原始选择臂=左或臂=右;另一臂受命的关节和抓手在动作中保持不变.\n打开set_gripper(arm=...,val=) (中文(简体) ).1)或释放(arm=...);关闭set_gripper(arm=...,val=) (中文(简体) ).0).\n为:move_to首先:小规模的固定剩余许可重新规划,而不是声称抵达或明确接触。\n当任务允许目标区域时,通过xyz_bounds=[lower_xyz,upper_xyz包含xyz.\n约束必须来自当前的认知,并计入被持有物体的大小和目的地边距。\n最多测试三个计划;只执行一个路径。\n在可收回的剩余部分之后,再次提出并在该区域内选择一个不同的点;每个区域最多有三个被执行的候选人,然后改变办法或使用受支助者VLA当有可用时。\n不要仅仅为了通过警卫而扩大控制/接触区域。\n比较流离失所之前/之后的要求和测量。\n定居意味着容忍,而不是有意的流离失所。\n不重复命令5 mm对照厘米级跟踪错误进行翻译。\n在视觉清晰的自由空间中,偏爱有意义的厘米级的片段(例如.3-5 cm在全臂和有效载荷路径允许时,从每段之后的测量姿势进行重新规划。\n跟踪偏差取决于方向,姿态和负载;测量它而不是假设固定的增益或过度射击.\n如果可用的清除量小于观察到的不确定性,则改变路线、方向或支持VLA战略;不要简单地将目标扩大到一个障碍。\n永远不要盲目地加深目标以克服阻力.\n其他伺服器故障需要停止.\n一个被拒绝的IK候选人为executed_steps=0和stop_requested=false允许重新观察和不同的可达目标;它不需要放弃部分进展或重置插曲.\n永远不要绕过一个守护器执行一个被拒绝的路径.\n运行时反馈断层和中断需要停止。\n用于双臂任务的备用观测单臂动作;同时协调的笛卡尔运动不暴露.\n本届会议没有VLA.\n使用几何原始物和当前观测;pi05_act无法使用。\n如果任务需要协调动议或联系反馈,请解释这种限制,而不是要求未经培训的政策。"},{"en":"Only fresh env eval_success=true confirms success on this episode.\nIf finish returns pending, ask the operator and wait for a current-episode\nverdict. A finish-refused response keeps the session active.\nNever invent a verdict or create a readiness or success receipt. On operator\nabort, stop motion and call finish(status=\"failure\") immediately.\n\nEvaluation memory is read-only.","origin":"robot","zh":"只有本回合最新的环境信号 eval_success=true 才能确认成功。finish 返回 pending 时，请求操作员判定并等待。若返回 finish-refused，会话继续。不得编造判定或自行生成就绪或成功回执。操作员中止时，立即停止运动并调用 finish(status=\"failure\")。\n\n评估记忆只读。"},{"en":"- task: 0\n- seed label: 1\n- instruction: Inspect the current state, then exercise one small translation, one small wrist rotation, and the gripper controls for each arm in turn. Move only one arm per call. Keep translations at or below 0.02 metres and wrist rotations at or below 5 degrees per call. Use basic primitives only, without VLA actions. Stop if observations or feedback indicate unsafe motion. Finish only after the onsite operator confirms the result.","origin":"old","zh":"- task: 0\n- 种子标签:1\n- 指令:检查当前状态,然后进行一个小幅平移,一个小手腕旋转,以及每个手臂的抓手控制。\n每个呼叫只移动一只手臂。\n将翻译保留在或低于0.02公尺和手腕在或以下旋转5 degrees每个呼叫。\n仅使用基本原始语,不使用VLA行动。\n如果观察或反馈显示运动不安全,则停止。\n只有在现场操作员确认结果后才能完成。"},{"en":"Follow the required read order, bind the current target and relation\nfrom fresh YAM observations, then execute the first unmet phase. Use the complete\ntask language as the overall goal.\nVerify env eval_success before finish.","origin":"old","zh":"遵循要求的读取顺序,从新绑定当前目标和关系YAM,然后执行第一个未实现的阶段。\n使用完整的任务语言作为总体目标.\n校验嵌入eval_success在完成前进行。"},{"en":"- task: 0\n- seed label: 1\n- instruction: Inspect the current state, then exercise one small translation, one small wrist rotation, and the gripper controls for each arm in turn. Move only one arm per call. Keep translations at or below 0.02 metres and wrist rotations at or below 5 degrees per call. Use basic primitives only, without VLA actions. Stop if observations or feedback indicate unsafe motion. Finish only after the onsite operator confirms the result.","origin":"robot","zh":"- task: 0\n- 种子标签:1\n- 指令:检查当前状态,然后进行一个小幅平移,一个小手腕旋转,以及每个手臂的抓手控制。\n每个呼叫只移动一只手臂。\n将翻译保留在或低于0.02公尺和手腕在或以下旋转5 degrees每个呼叫。\n仅使用基本原始语,不使用VLA行动。\n如果观察或反馈显示运动不安全,则停止。\n只有在现场操作员确认结果后才能完成。"},{"en":"Follow the required read order, bind the current target and relation\nfrom fresh YAM observations, then execute the first unmet phase. Use the complete\ntask language as the overall goal.\nVerify env eval_success before claiming success.","origin":"robot","zh":"按规定顺序读取信息，通过 YAM 最新观测确定当前目标和关系，再执行第一个尚未满足的阶段。以完整任务指令为总体目标。报告成功前，先核对环境返回的 eval_success。"},{"en":"A trained YAM qpos14 VLA is connected and pi05_act is available.\nTreat VLA as a primitive alongside geometric tools. Use its learned approach and\npick behavior where suitable, then use observed geometric moves for task-specific\nplacement when destination choice is unreliable. Choose the number of chunks\nfrom the task, current clearance and any explicit operator preference. Each chunk\npredicts from a fresh observation, but there is no Agent semantic review between\nchunks. Assess both arms and the possible release region before dispatch.\nReobserve and measure progress after each call. Each prediction has 30 steps,\nbut only the first five execute. Do not preassign a fixed number of chunks to every grasp\nor let the policy continue into an unverified release. Record the observed switching point\nand chunk count as evidence, not a universal rule. Omit prompt to use the full\ntrained task instruction; arbitrary subgoal prompts have not been validated.\npi05_act can command both arms together.","origin":"old","zh":"训练有素的YAMqpos (单位:千米)14VLA连接并pi05_act可供使用。\n处理VLA作为原始与几何工具并列.\n使用其学到的方法,在适合的地方选择行为,然后当目的地选择不可靠时,使用观察到的几何动作进行任务特定位置的放置.\n选择任务中的块数、当前清除和任何明确的操作者偏好 。\n每个块都从新的观察中预测,但是在块之间没有代理语义审查.\n发运前既评估武器,也评估可能的释放区。\n在每个呼叫后重新观察并测量进度.\n每一个预测都30步骤,但只有前五个执行。\n不要预先为每个控制区分配固定的块数,或让政策继续进入未经核实的释放区。\n记录观测到的切换点并块计数为证据,而不是通用规则.\nOmit 迅速使用训练有素的全部任务指示;任意的子目标提示尚未验证。pi05_act双臂可以一起指挥。"},{"en":"Use move_to, rotate_wrist, set_gripper, and release only after\nbinding the current target from fresh perception. move_to executes all\nserver-planned safety waypoints. Do not queue several low approaches without\nobserving between them. Each geometric primitive selects arm=left or arm=right; the other\narm's commanded joints and gripper are held unchanged during that action.\nOpen with set_gripper(arm=..., val=1) or release(arm=...); close with\nset_gripper(arm=..., val=0).\nFor move_to with success=false and recoverable=true, re-observe first: a small\nstationary residual permits replanning, not a claim of arrival or clear contact.\nWhen the task allows a target region, pass xyz_bounds=[lower_xyz, upper_xyz]\ncontaining xyz. Bounds must come from current perception and account for the\nheld object's size and destination margins. At most three plans are tested;\nonly one path is executed. After a recoverable residual, render again and select\na different point within that region; at most three executed candidates per\nregion, then change approach or use a supported VLA when available. Do not enlarge a grasp/contact region\njust to pass a guard. Compare requested and measured before/after displacement.\nSettled means within tolerance, not that the intended displacement occurred.\nDo not repeatedly command 5 mm translations against centimetre-scale tracking\nerror. In visually clear free space prefer meaningful centimetre-scale segments\n(e.g. 3-5 cm when the complete arm and payload path permits), replanning from\nmeasured pose after every segment. Tracking bias depends on direction, posture\nand load; measure it rather than assuming a fixed gain or overshooting. If\navailable clearance is smaller than observed uncertainty, change route,\norientation or supported VLA strategy;\ndo not simply enlarge the target toward an obstacle.\nNever deepen a target blindly to overcome resistance. Other servo failures require\nstop. A rejected IK candidate with executed_steps=0 and stop_requested=false\npermits re-observation and a different reachable target; it does not require\ndiscarding partial progress or resetting the episode. Never bypass a guard to\nexecute a rejected path. Runtime feedback faults and latched stops require stop.\nAlternate observed single-arm actions for two-arm tasks; simultaneous coordinated\nCartesian motion is not exposed.\n\nA trained YAM qpos14 VLA is connected and pi05_act is available.\nTreat VLA as a primitive alongside geometric tools. Use its learned approach and\npick behavior where suitable, then use observed geometric moves for task-specific\nplacement when destination choice is unreliable. Choose the number of chunks\nfrom the task, current clearance and any explicit operator preference. Each chunk\npredicts from a fresh observation, but there is no Agent semantic review between\nchunks. Assess both arms and the possible release region before dispatch.\nReobserve and measure progress after each call. Each prediction has 30 steps,\nbut only the first five execute. Do not preassign a fixed number of chunks to every grasp\nor let the policy continue into an unverified release. Record the observed switching point\nand chunk count as evidence, not a universal rule. Omit prompt to use the full\ntrained task instruction; arbitrary subgoal prompts have not been validated.\npi05_act can command both arms together.","origin":"robot","zh":"使用move_to,rotate_wrist,set_gripper,并只在将当前目标从新感知中绑定后释放。move_to执行服务器计划的所有安全路径点。\n不在几个低位方法之间观察,不要排队 。\n每个几何原始选择臂=左或臂=右;另一臂受命的关节和抓手在动作中保持不变.\n打开set_gripper(arm=...,val=) (中文(简体) ).1)或释放(arm=...);关闭set_gripper(arm=...,val=) (中文(简体) ).0).\n为:move_to首先:小规模的固定剩余许可重新规划,而不是声称抵达或明确接触。\n当任务允许目标区域时,通过xyz_bounds=[lower_xyz,upper_xyz包含xyz.\n约束必须来自当前的认知,并计入被持有物体的大小和目的地边距。\n最多测试三个计划;只执行一个路径。\n在可收回的剩余部分之后,再次提出并在该区域内选择一个不同的点;每个区域最多有三个被执行的候选人,然后改变办法或使用受支助者VLA当有可用时。\n不要仅仅为了通过警卫而扩大控制/接触区域。\n比较流离失所之前/之后的要求和测量。\n定居意味着容忍,而不是有意的流离失所。\n不重复命令5 mm对照厘米级跟踪错误进行翻译。\n在视觉清晰的自由空间中,偏爱有意义的厘米级的片段(例如.3-5 cm在全臂和有效载荷路径允许时,从每段之后的测量姿势进行重新规划。\n跟踪偏差取决于方向,姿态和负载;测量它而不是假设固定的增益或过度射击.\n如果可用的清除量小于观察到的不确定性,则改变路线、方向或支持VLA战略;不要简单地将目标扩大到一个障碍。\n永远不要盲目地加深目标以克服阻力.\n其他伺服器故障需要停止.\n一个被拒绝的IK候选人为executed_steps=0和stop_requested=false允许重新观察和不同的可达目标;它不需要放弃部分进展或重置插曲.\n永远不要绕过一个守护器执行一个被拒绝的路径.\n运行时反馈断层和中断需要停止。\n用于双臂任务的备用观测单臂动作;同时协调的笛卡尔运动不暴露.\n训练有素的YAMqpos (单位:千米)14VLA连接并pi05_act可供使用。\n处理VLA作为原始与几何工具并列.\n使用其学到的方法,在适合的地方选择行为,然后当目的地选择不可靠时,使用观察到的几何动作进行任务特定位置的放置.\n选择任务中的块数、当前清除和任何明确的操作者偏好 。\n每个块都从新的观察中预测,但是在块之间没有代理语义审查.\n发运前既评估武器,也评估可能的释放区。\n在每个呼叫后重新观察并测量进度.\n每一个预测都30步骤,但只有前五个执行。\n不要预先为每个控制区分配固定的块数,或让政策继续进入未经核实的释放区。\n记录观测到的切换点并块计数为证据,而不是通用规则.\nOmit 迅速使用训练有素的全部任务指示;任意的子目标提示尚未验证。pi05_act双臂可以一起指挥。"},{"en":"- task: 1\n- seed label: 1\n- instruction: Tidy up the table. Left and right refer to the top camera view. Sort all three bottles by brand. Place all Pepsi bottles in the bag on the left and all Coca-Cola bottles in the bag on the right. Move the bowls to uncover the spoons, place the white spoon in the white bowl and the pink spoon in the pink bowl, and return both bowls to their original marked positions: white bowl on the left and pink bowl on the right.","origin":"old","zh":"- task: 1\n- 种子标签:1\n- 指令:把桌子铺好。\n左右指顶部相机视图.\n三瓶都按品牌分类\n把所有的百事可乐瓶放在左边的袋子里,把所有的可口可乐瓶放在右边的袋子里.\n移动碗来揭开勺子,将白勺放在白碗中,粉勺放在粉碗中,并将两碗还原到原来的标志位置:左边是白色碗,右边是粉碗."},{"en":"- task: 1\n- seed label: 1\n- instruction: Tidy up the table. Left and right refer to the top camera view. Sort all three bottles by brand. Place all Pepsi bottles in the bag on the left and all Coca-Cola bottles in the bag on the right. Move the bowls to uncover the spoons, place the white spoon in the white bowl and the pink spoon in the pink bowl, and return both bowls to their original marked positions: white bowl on the left and pink bowl on the right.","origin":"robot","zh":"- task: 1\n- 种子标签:1\n- 指令:把桌子铺好。\n左右指顶部相机视图.\n三瓶都按品牌分类\n把所有的百事可乐瓶放在左边的袋子里,把所有的可口可乐瓶放在右边的袋子里.\n移动碗来揭开勺子,将白勺放在白碗中,粉勺放在粉碗中,并将两碗还原到原来的标志位置:左边是白色碗,右边是粉碗."},{"en":"Exploration is operator-supervised real-robot work. Prefer in-place\nrecovery when it is safe, reset only after the failed attempt is archived and the\nnext plan changes a named lever. Keep attempts concise, preserve useful partial\nprogress, and write observations as bounded evidence rather than global claims.\n\nAfter every action classify its actual result, not the tool transport status:\n- Completed: inspect fresh views and actual pose, then advance the task.\n- Plan rejected with zero executed steps and no stop: retain progress, change\n  the target within a task-valid region, orientation, or segment length. Do not\n  repeat the identical rejected plan or reset merely because IK failed.\n- Explicitly recoverable residual without a stop: observe and plan from measured\n  pose. Do not treat the requested target as reached or infer free space.\n- Visual uncertainty: pause release/forward motion, not reasoning. Render fresh\n  top and both wrist views; compare before/after views, grip retention, payload\n  footprint, handle/rim geometry and actual feedback. Bag deformation alone\n  proves neither a snag nor clearance. State the missing evidence and select\n  an observation or recovery that can resolve it. If its entire arm/payload path\n  is supported by current views and planning, use one small retreat or lift,\n  then reobserve. Never assume a retreat is safe merely because it reverses an\n  earlier path; a tether may now be caught. Do not push through unknown contact.\n- Feedback fault, latched stop, operator abort, or nonrecoverable servo failure:\n  stop motion and follow the existing supported recovery protocol. Never clear\n  a latch or create readiness/success receipts yourself.\n\nFor the same local obstacle, try at most three distinct evidence-driven\nobservation/recovery cycles. Each cycle names the hypothesis, missing evidence,\nchanged approach and observed result in existing working notes. New local cycles\nare not new episodes and do not consume reset attempts. If resolved, continue\nwithout routine operator confirmation. If no supported recovery exists, evidence\nstill cannot establish a safe next action, or the local budget is exhausted,\nrequest the specific missing onsite assistance and hold; do not repeat blind\nmoves to meet a budget. Preserve partial progress and do not claim task failure\nmerely because an observation is ambiguous. Do not use VLA to bypass uncertain\ncontact: it may move both arms and release; use it when the intended short segment\nand both arms' workspace are supported by current evidence. Release only after\nfresh views support destination footprint and clearance. Full task success still\nrequires the current episode's authoritative verdict.\nAt startup, if ready_for_motion is false, call reset and wait for operator ready\nbefore any action. An operator abort requires finish(status=\"failure\") immediately.\n\nYour cell is yam_t0_s1_0123456789ab, session 1 of 3.\nUse the common file tools to save working notes under /example/memory/yam/_internal/inbox/yam_t0_s1_0123456789ab/wip/.\nBefore a retry or session handoff, write an attempt note there: episode ID,\nselected objects and arm roles, observed outcome, failed hypothesis, and the one\nparameter or approach to change next. Existing step records keep raw evidence;\ndo not invent a second action log. Re-localize targets on every restored scene.\nArchive the failed attempt and explain the requested scene restoration. reset\nreturns pending immediately without operator ready; wait for the operator, then retry\nreset, not a new attempt or proof of failure. Use the remaining attempt budget\nfor a changed approach; stop immediately if the operator aborts.\n\nAfter actual env success, distil a task technique to /example/memory/yam/_internal/inbox/yam_t0_s1_0123456789ab/technique.md.\nUse YAML frontmatter: scope: task-family, suite: yam, regime: real,\ntask_id: 0, task_language: the actual env language,\nconfidence: single-shot, evidence: {cells: [yam_t0_s1_0123456789ab]}.\nWrite mechanisms, object recognition, measured parameters, failed alternatives,\noperator intervention, and the evidence boundaries. Use probable/verified only\nwith additional independent successful trials, never for one success.\nOptional cross-task leaves have scope: global, kind from primitive/perception/\nstrategy/failure/infra, title, applies_when, confidence, and evidence.cells.\nOnly your current inbox is writable. Never edit published corpus files.\nThe runner creates the successful current-attempt recipe/audit pair; do not\ninvent action logs or overwrite these generated files. Then call finish.\nUnsolved runs do not publish success recipes. Working notes stay in wip;\nbounded failure lessons may be merged by the common MemoryManager, with explicit\nfailed evidence and no claim of successful task completion. A new session does\nnot reset the physical scene: follow the operator-readiness protocol before reset.","origin":"old","zh":"探索是运营商监督的真机器人工作.\n优先在安全时进行就地恢复,只有在失败的尝试存档后重新设置,下一个计划会改变一个命名的杠杆.\n努力做到简明扼要,保持有用的部分进展,并将意见写成有限度的证据而不是全球索赔。\n在每次行动之后, 将实际结果进行分类, 而不是工具传输状态 :\n- 完成:检查新观点和实际情况,然后推进任务。\n- 以零执行步骤和不停止方式否决计划:保留进展,在任务有效的区域、方向或段长范围内改变目标。\n不重复同样的被拒绝的计划或仅仅因为IK失败 。\n- 明确可收回的残留物,不作停留:观察和按衡量的姿势进行规划。\n不要将所请求的目标视为已到达或推断为空闲空间。\n- 视觉不确定性:暂停释放/向前运动,而不是推理.\n重新显示新的顶部和腕部视图;在视图之前/之后进行比较、握住保留、有效载荷足迹、手柄/环形几何和实际反馈。\n仅凭包的变形并不能证明有缺陷,也不能证明是清白的。\n说明缺失的证据,并选择能够解决问题的观察或恢复。\n如果其整个臂/负载路径得到当前视图和规划的支持,则使用一个小后退或升降,然后重新观察.\n永远不要认为撤退是安全的,仅仅因为它扭转了早先的道路;现在可能抓住一条绳子。\n不要通过未知的联系人来推动 。\n- 反馈断层、挂断停止、操作员中止或无法恢复服务器故障:停止运动并遵守现有支持的恢复协议。\n永远不要自己清理或创建准备/成功收据。\n对于同样的当地障碍,最多尝试三个不同的由证据驱动的观察/回收周期。\n每个周期都命名假说,缺失证据,改变方法,观测结果为现有工作说明.\n新的本地循环不是新事件,也不消耗重设尝试.\n解决后,无需例行操作者确认即可继续.\n如果没有支持的恢复,证据仍然无法确定下一步的安全行动,或者当地预算已经用完,要求具体的缺失现场援助并搁置;不要重复盲目行动以满足预算要求。\n保留部分进展,不能仅仅因为一项意见含糊不清而声称任务失败。\n不使用VLA以绕过不确定\n接触:它可能同时移动武器和释放;当预定的短段和两个武器的工作空间都得到现有证据的支持时使用。\n只有在新观点支持目的地足迹和清除后才放行。\n完全任务的成功仍然需要本回合的权威判断.\n启动时,如果ready_for_motion错误, 呼叫重设并等待操作员准备好后再做任何动作 。\n操作员中止需要立即完成(status=\"失败\").\n您的手机是yam_t0_s1_0123456789ab,会话1页:13.\n使用常见文件工具保存工作注释/example/memory/yam/_internal/inbox/yam_t0_s1_0123456789ab/wip/.\n在重试或会话交接之前,写一个尝试注释在那里: 插曲 ID,选定对象和臂角色,观测结果,失败假说,以及下一个更改的一个参数或方法.\n现有步骤记录保存原始证据;不创建第二个行动记录。\n在每个恢复的场景中重新定位目标.\n归档失败的尝试并解释请求的场景恢复 。 重新设置返回, 等待操作员,然后重试重置, 而不是新的尝试或失败证明 。\n将剩余尝试预算用于改变方法;如果操作员中止, 则立即停止 。\n在实际成功后,将任务技术提炼成/example/memory/yam/_internal/inbox/yam_t0_s1_0123456789ab/technique.md.\n使用 YAML前题: 范围:任务家庭, 套件: yam, 制度: 真实,\ntask_id: 0, task_language: the actual env language,\nconfidence: single-shot, evidence: {cells: [yam_t0_s1_0123456789ab]}.\n写机制,对象识别,测量参数,失败的替代品,操作员干预,以及证据边界.\n使用可能/核实的只是额外的独立成功审判,从未成功过。\n可选的跨任务叶具有范围:全球性、来自原始/观念/战略的种类/failure/infra,标题,applies_when信心和证据 细胞\n只有您的当前收件箱可以写 。\n永远不要编辑已出版的实体文件。\n运行器创建成功的当前尝试配方/审计对;不创建动作日志或覆盖这些生成的文件 。\n那就打完电话\n未解决的运行不会发布成功配方.\n工作笔记停留在wip中;限定的失败课可能由共同的记忆管理器合并,有明确失败的证据,没有声称任务成功完成.\n新会话不会重设物理场景:在重置前遵循操作员-准备状态协议."},{"en":"Before the first robot mutation:\n1. Read robots/yam/guides/GUIDE_RPENT.md completely.\n2. Inspect view_env_state(step=0) and all three current RGB views.\n3. Read /example/memory/yam/MEMORY.md and matching task-specific/task-family/global memory when present.\n   List /example/memory/yam/task-specific/ for prior recipe/audit pairs for this task; the index\n   covers task-family/global leaves. Missing memory on a first run is normal: continue\n   from current observations and create evidence through this run.\n\nUse the current three views to validate any prior recipe.\n\nYour cell is yam_t0_s1_0123456789ab, session 1 of\n3. After reading published memory, check /example/memory/yam/_internal/inbox/yam_t0_s1_0123456789ab/wip/\nfor earlier attempt notes. A new session does not reset the physical scene.\nAt startup, if ready_for_motion is false, call reset and wait for operator\nready before motion. After a completed reset, inspect all three fresh views\nand re-localize the targets.","origin":"robot","zh":"第一次机器人突变前:\n1.\n读取robots/yam/guides/GUIDE_RPENT.md完全没有。\n2.\n检查view_env_state(步数=0)和所有三个当前 RGB 视图。\n3.\n读取/example/memory/yam/MEMORY.md并匹配特定任务/task-family/global记忆当在眼前。\n列表/example/memory/yam/task-specific/对于此项任务的前置食谱/审计配对;该指数涵盖任务-家庭/全球叶。\n第一次运行时丢失的记忆是正常的:从当前观察中继续,并通过这次运行创建证据.\n使用当前三种视图验证任何先前的配方 。\n您的手机是yam_t0_s1_0123456789ab,会话1页:1\n3.\n读取已公布的记忆后,请检查/example/memory/yam/_internal/inbox/yam_t0_s1_0123456789ab/wip/ 用于较早的尝试笔记.\n新会话不会重置物理场景 。\n启动时,如果ready_for_motion假的, 呼叫重置, 等待操作员准备好后再动 。\n完成重置后,检查所有三个新视图,重新定位目标."},{"en":"For the same local obstacle, try at most three distinct\nevidence-driven observation or recovery cycles within the current attempt.\nLog the hypothesis, missing evidence, changed approach and measured result.\nA zero-step IK rejection with no stop permits a different reachable target,\norientation or segment length. For a recoverable residual, replan from\nmeasured pose. Neither condition alone requires a reset.\n\nFor visual uncertainty, pause release and forward motion. Inspect fresh top\nand wrist views, grip retention, payload footprint, handle or rim geometry\nand actual feedback. Bag deformation alone proves neither a snag nor\nclearance. One small retreat or lift requires a clear arm and payload path:\na tether may now be caught even on the reverse path. Do not push through\nuncertain contact or use a VLA to bypass it. Release only after verifying\ndestination footprint and clearance. If resolved, continue without routine\noperator confirmation. When no supported recovery exists or the local budget\nis spent, request the specific missing onsite assistance and hold. Stop\nmotion on a feedback fault, latched stop or nonrecoverable servo failure.\nNever clear a latch yourself.\n\nBefore retry or session handoff, archive the failed attempt and record its\nepisode ID, objects and arm roles, measured outcome, failed hypothesis and\nthe next changed approach in /example/memory/yam/_internal/inbox/yam_t0_s1_0123456789ab/wip/. Use existing step records\nfor raw evidence. Describe the scene restoration needed. A pending reset\nspends no attempt. Wait for the operator's matching ready receipt before\nretrying reset. When finish returns retry after operator-confirmed failure, record the lesson\nand reset only after scene restoration. Use remaining attempts for a changed approach.","origin":"robot","zh":"对于同一局部障碍,在目前尝试中最多尝试三个不同的由证据驱动的观测或恢复周期。\n记录假设, 缺少证据, 改变方法和测量结果。\n一个零步IK没有停止的拒绝允许有不同的可达到的目标、方向或段长。\n对于可收回的残余物,根据测量的姿势重新进行规划。\n单凭两个条件都要求重置.\n对于视觉不确定性,暂停释放和前进运动.\n检查新鲜的顶部和腕部视图、握力保留、有效载荷足迹、手柄或环形几何以及实际反馈。\n仅凭包的变形并不能证明有缺陷,也不能证明是清白的。\n一条小退路或升降机需要一条清晰的手臂和有效载荷路径:现在甚至在逆向路径上也可能抓住一条绳索。\n切勿通过不确定的联系或使用VLA绕过它。\n只有在核实目的地足迹和批准后才能释放。\n解决后,无需例行操作者确认即可继续.\n在没有获得支助的恢复或地方预算用完时,要求具体的现场协助并搁置。\n停止在反馈断层上运动 断层断层或无法恢复的伺服器故障\n永远不要清空你自己的束缚。\n在重试或会话交接之前, 存档失败的尝试并记录其插曲 ID、对象和手臂角色、 测量结果、 失败假说和下一个更改的方法 。/example/memory/yam/_internal/inbox/yam_t0_s1_0123456789ab/wip/.\n使用已有的阶梯记录作为原始证据.\n描述需要恢复的场景。\n等待的重置将不花任何努力。\n等待操作员匹配的已准备好的收件,然后重试重置 。\n当操作员确认失败后完成返回重试时,记录课后,仅在场景恢复后重新设置.\n利用剩余的尝试来改变方法。"},{"en":"Only fresh env eval_success=true confirms success on this episode.\nIf finish returns pending, ask the operator and wait for a current-episode\nverdict. A finish-refused response keeps the session active.\nNever invent a verdict or create a readiness or success receipt. On operator\nabort, stop motion and call finish(status=\"failure\") immediately.\n\nAfter confirmed success re-observe and write\n/example/memory/yam/_internal/inbox/yam_t0_s1_0123456789ab/technique.md before finish. Set task-family frontmatter to\nsuite: yam, regime: real, task_id: 0, the actual env instruction\nas task_language, and evidence.cells: [\"yam_t0_s1_0123456789ab\"]. Include mechanisms,\nobject recognition, measured parameters, failed alternatives, operator\nintervention and evidence limits. Use probable/verified only with additional\nindependent successful trials. The runner creates the successful current-attempt\nrecipe/audit pair. Only the current inbox is writable. Unsolved attempts\nleave working notes in wip/; bounded failure lessons can be merged by\nMemoryManager with explicit failed evidence.","origin":"robot","zh":"只有新鲜的封套eval_success证实这集的成功\n如果完成返回等待,请询问操作员并等待当前集决断 。\n复述完毕的响应使会话保持活跃.\n决不发明判决或者创造准备或成功收据.\n在操作员中止时, 停止运动并立即呼叫完成(status=\"失败\") 。\n在确认成功后, 重新观察并写入/example/memory/yam/_internal/inbox/yam_t0_s1_0123456789ab/technique.md在完成前进行。\n设定任务家庭前题\nsuite: yam, regime: real, task_id: 0, the actual env instruction as task_language, and evidence.cells: [\"yam_t0_s1_0123456789ab\"].\n包括机制,对象识别,测量参数,失败的替代品,操作者干预和证据限制.\n仅以其他独立成功审判的方式使用可能/核实。\n跑步者创建成功的当前尝试食谱/审计配对.\n只有当前收件箱可以写入 。\n未解的尝试会在 wip/中留下工作笔记;设定的失败课可以由记忆管理器与明显失败的证据合并."},{"en":"Exploration is operator-supervised real-robot work. Prefer in-place\nrecovery when it is safe, reset only after the failed attempt is archived and the\nnext plan changes a named lever. Keep attempts concise, preserve useful partial\nprogress, and write observations as bounded evidence rather than global claims.\n\nAfter every action classify its actual result, not the tool transport status:\n- Completed: inspect fresh views and actual pose, then advance the task.\n- Plan rejected with zero executed steps and no stop: retain progress, change\n  the target within a task-valid region, orientation, or segment length. Do not\n  repeat the identical rejected plan or reset merely because IK failed.\n- Explicitly recoverable residual without a stop: observe and plan from measured\n  pose. Do not treat the requested target as reached or infer free space.\n- Visual uncertainty: pause release/forward motion, not reasoning. Render fresh\n  top and both wrist views; compare before/after views, grip retention, payload\n  footprint, handle/rim geometry and actual feedback. Bag deformation alone\n  proves neither a snag nor clearance. State the missing evidence and select\n  an observation or recovery that can resolve it. If its entire arm/payload path\n  is supported by current views and planning, use one small retreat or lift,\n  then reobserve. Never assume a retreat is safe merely because it reverses an\n  earlier path; a tether may now be caught. Do not push through unknown contact.\n- Feedback fault, latched stop, operator abort, or nonrecoverable servo failure:\n  stop motion and follow the existing supported recovery protocol. Never clear\n  a latch or create readiness/success receipts yourself.\n\nFor the same local obstacle, try at most three distinct evidence-driven\nobservation/recovery cycles. Each cycle names the hypothesis, missing evidence,\nchanged approach and observed result in existing working notes. New local cycles\nare not new episodes and do not consume reset attempts. If resolved, continue\nwithout routine operator confirmation. If no supported recovery exists, evidence\nstill cannot establish a safe next action, or the local budget is exhausted,\nrequest the specific missing onsite assistance and hold; do not repeat blind\nmoves to meet a budget. Preserve partial progress and do not claim task failure\nmerely because an observation is ambiguous. Do not use VLA to bypass uncertain\ncontact: it may move both arms and release; use it when the intended short segment\nand both arms' workspace are supported by current evidence. Release only after\nfresh views support destination footprint and clearance. Full task success still\nrequires the current episode's authoritative verdict.\nAt startup, if ready_for_motion is false, call reset and wait for operator ready\nbefore any action. An operator abort requires finish(status=\"failure\") immediately.\n\nYour cell is yam_t1_s1_0123456789ab, session 1 of 3.\nUse the common file tools to save working notes under /example/memory/yam/_internal/inbox/yam_t1_s1_0123456789ab/wip/.\nBefore a retry or session handoff, write an attempt note there: episode ID,\nselected objects and arm roles, observed outcome, failed hypothesis, and the one\nparameter or approach to change next. Existing step records keep raw evidence;\ndo not invent a second action log. Re-localize targets on every restored scene.\nArchive the failed attempt and explain the requested scene restoration. reset\nreturns pending immediately without operator ready; wait for the operator, then retry\nreset, not a new attempt or proof of failure. Use the remaining attempt budget\nfor a changed approach; stop immediately if the operator aborts.\n\nAfter actual env success, distil a task technique to /example/memory/yam/_internal/inbox/yam_t1_s1_0123456789ab/technique.md.\nUse YAML frontmatter: scope: task-family, suite: yam, regime: real,\ntask_id: 1, task_language: the actual env language,\nconfidence: single-shot, evidence: {cells: [yam_t1_s1_0123456789ab]}.\nWrite mechanisms, object recognition, measured parameters, failed alternatives,\noperator intervention, and the evidence boundaries. Use probable/verified only\nwith additional independent successful trials, never for one success.\nOptional cross-task leaves have scope: global, kind from primitive/perception/\nstrategy/failure/infra, title, applies_when, confidence, and evidence.cells.\nOnly your current inbox is writable. Never edit published corpus files.\nThe runner creates the successful current-attempt recipe/audit pair; do not\ninvent action logs or overwrite these generated files. Then call finish.\nUnsolved runs do not publish success recipes. Working notes stay in wip;\nbounded failure lessons may be merged by the common MemoryManager, with explicit\nfailed evidence and no claim of successful task completion. A new session does\nnot reset the physical scene: follow the operator-readiness protocol before reset.","origin":"old","zh":"探索是运营商监督的真机器人工作.\n优先在安全时进行就地恢复,只有在失败的尝试存档后重新设置,下一个计划会改变一个命名的杠杆.\n努力做到简明扼要,保持有用的部分进展,并将意见写成有限度的证据而不是全球索赔。\n在每次行动之后, 将实际结果进行分类, 而不是工具传输状态 :\n- 完成:检查新观点和实际情况,然后推进任务。\n- 以零执行步骤和不停止方式否决计划:保留进展,在任务有效的区域、方向或段长范围内改变目标。\n不重复同样的被拒绝的计划或仅仅因为IK失败 。\n- 明确可收回的残留物,不作停留:观察和按衡量的姿势进行规划。\n不要将所请求的目标视为已到达或推断为空闲空间。\n- 视觉不确定性:暂停释放/向前运动,而不是推理.\n重新显示新的顶部和腕部视图;在视图之前/之后进行比较、握住保留、有效载荷足迹、手柄/环形几何和实际反馈。\n仅凭包的变形并不能证明有缺陷,也不能证明是清白的。\n说明缺失的证据,并选择能够解决问题的观察或恢复。\n如果其整个臂/负载路径得到当前视图和规划的支持,则使用一个小后退或升降,然后重新观察.\n永远不要认为撤退是安全的,仅仅因为它扭转了早先的道路;现在可能抓住一条绳子。\n不要通过未知的联系人来推动 。\n- 反馈断层、挂断停止、操作员中止或无法恢复服务器故障:停止运动并遵守现有支持的恢复协议。\n永远不要自己清理或创建准备/成功收据。\n对于同样的当地障碍,最多尝试三个不同的由证据驱动的观察/回收周期。\n每个周期都命名假说,缺失证据,改变方法,观测结果为现有工作说明.\n新的本地循环不是新事件,也不消耗重设尝试.\n解决后,无需例行操作者确认即可继续.\n如果没有支持的恢复,证据仍然无法确定下一步的安全行动,或者当地预算已经用完,要求具体的缺失现场援助并搁置;不要重复盲目行动以满足预算要求。\n保留部分进展,不能仅仅因为一项意见含糊不清而声称任务失败。\n不使用VLA以绕过不确定\n接触:它可能同时移动武器和释放;当预定的短段和两个武器的工作空间都得到现有证据的支持时使用。\n只有在新观点支持目的地足迹和清除后才放行。\n完全任务的成功仍然需要本回合的权威判断.\n启动时,如果ready_for_motion错误, 呼叫重设并等待操作员准备好后再做任何动作 。\n操作员中止需要立即完成(status=\"失败\").\n您的手机是yam_t1_s1_0123456789ab,会话1页:13.\n使用常见文件工具保存工作注释/example/memory/yam/_internal/inbox/yam_t1_s1_0123456789ab/wip/.\n在重试或会话交接之前,写一个尝试注释在那里: 插曲 ID,选定对象和臂角色,观测结果,失败假说,以及下一个更改的一个参数或方法.\n现有步骤记录保存原始证据;不创建第二个行动记录。\n在每个恢复的场景中重新定位目标.\n归档失败的尝试并解释请求的场景恢复 。 重新设置返回, 等待操作员,然后重试重置, 而不是新的尝试或失败证明 。\n将剩余尝试预算用于改变方法;如果操作员中止, 则立即停止 。\n在实际成功后,将任务技术提炼成/example/memory/yam/_internal/inbox/yam_t1_s1_0123456789ab/technique.md.\n使用 YAML前题: 范围:任务家庭, 套件: yam, 制度: 真实,\ntask_id: 1, task_language: the actual env language,\nconfidence: single-shot, evidence: {cells: [yam_t1_s1_0123456789ab]}.\n写机制,对象识别,测量参数,失败的替代品,操作员干预,以及证据边界.\n使用可能/核实的只是额外的独立成功审判,从未成功过。\n可选的跨任务叶具有范围:全球性、来自原始/观念/战略的种类/failure/infra,标题,applies_when信心和证据 细胞\n只有您的当前收件箱可以写 。\n永远不要编辑已出版的实体文件。\n运行器创建成功的当前尝试配方/审计对;不创建动作日志或覆盖这些生成的文件 。\n那就打完电话\n未解决的运行不会发布成功配方.\n工作笔记停留在wip中;限定的失败课可能由共同的记忆管理器合并,有明确失败的证据,没有声称任务成功完成.\n新会话不会重设物理场景:在重置前遵循操作员-准备状态协议."},{"en":"Before the first robot mutation:\n1. Read robots/yam/guides/GUIDE_RPENT.md completely.\n2. Inspect view_env_state(step=0) and all three current RGB views.\n3. Read /example/memory/yam/MEMORY.md and matching task-specific/task-family/global memory when present.\n   List /example/memory/yam/task-specific/ for prior recipe/audit pairs for this task; the index\n   covers task-family/global  only after verifying\ndestination footprint and clearance. If resolved, continue without routine\noperator confirmation. When no supported recovery exists or the local budget\nis spent, request the specific missing onsite assistance and hold. Stop\nmotion on a feedback fault, latched stop or nonrecoverable servo failure.\nNever clear a latch yourself.\n\nBefore retry or session handoff, archive the failed attempt and record its\nepisode ID, objects and arm roles, measured outcome, failed hypothesis and\nthe next changed approach in /example/memory/yam/_internal/inbox/yam_t1_s1_0123456789ab/wip/. Use existing step records\nfor raw evidence. Describe the scene restoration needed. A pending reset\nspends no attempt. Wait for the operator's matching ready receipt before\nretrying reset. When finish returns retry after operator-confirmed failure, record the lesson\nand reset only after scene restoration. Use remaining attempts for a changed approach.","origin":"robot","zh":"对于同一局部障碍,在目前尝试中最多尝试三个不同的由证据驱动的观测或恢复周期。\n记录假设, 缺少证据, 改变方法和测量结果。\n一个零步IK没有停止的拒绝允许有不同的可达到的目标、方向或段长。\n对于可收回的残余物,根据测量的姿势重新进行规划。\n单凭两个条件都要求重置.\n对于视觉不确定性,暂停释放和前进运动.\n检查新鲜的顶部和腕部视图、握力保留、有效载荷足迹、手柄或环形几何以及实际反馈。\n仅凭包的变形并不能证明有缺陷,也不能证明是清白的。\n一条小退路或升降机需要一条清晰的手臂和有效载荷路径:现在甚至在逆向路径上也可能抓住一条绳索。\n切勿通过不确定的联系或使用VLA绕过它。\n只有在核实目的地足迹和批准后才能释放。\n解决后,无需例行操作者确认即可继续.\n在没有获得支助的恢复或地方预算用完时,要求具体的现场协助并搁置。\n停止在反馈断层上运动 断层断层或无法恢复的伺服器故障\n永远不要清空你自己的束缚。\n在重试或会话交接之前, 存档失败的尝试并记录其插曲 ID、对象和手臂角色、 测量结果、 失败假说和下一个更改的方法 。/example/memory/yam/_internal/inbox/yam_t1_s1_0123456789ab/wip/.\n使用已有的阶梯记录作为原始证据.\n描述需要恢复的场景。\n等待的重置将不花任何努力。\n等待操作员匹配的已准备好的收件,然后重试重置 。\n当操作员确认失败后完成返回重试时,记录课后,仅在场景恢复后重新设置.\n利用剩余的尝试来改变方法。"},{"en":"Only fresh env eval_success=true confirms success on this episode.\nIf finish returns pending, ask the operator and wait for a current-episode\nverdict. A finish-refused response keeps the session active.\nNever invent a verdict or create a readiness or success receipt. On operator\nabort, stop motion and call finish(status=\"failure\") immediately.\n\nAfter confirmed success re-observe and write\n/example/memory/yam/_internal/inbox/yam_t1_s1_0123456789ab/technique.md before finish. Set task-family frontmatter to\nsuite: yam, regime: real, task_id: 1, the actual env instruction\nas task_language, and evidence.cells: [\"yam_t1_s1_0123456789ab\"]. Include mechanisms,\nobject recognition, measured parameters, failed alternatives, operator\nintervention and evidence limits. Use probable/verified only with additional\nindependent successful trials. The runner creates the successful current-attempt\nrecipe/audit pair. Only the current inbox is writable. Unsolved attempts\nleave working notes in wip/; bounded failure lessons can be merged by\nMemoryManager with explicit failed evidence.","origin":"robot","zh":"只有新鲜的封套eval_success证实这集的成功\n如果完成返回等待,请询问操作员并等待当前集决断 。\n复述完毕的响应使会话保持活跃.\n决不发明判决或者创造准备或成功收据.\n在操作员中止时, 停止运动并立即呼叫完成(status=\"失败\") 。\n在确认成功后, 重新观察并写入/example/memory/yam/_internal/inbox/yam_t1_s1_0123456789ab/technique.md在完成前进行。\n设定任务家庭前题\nsuite: yam, regime: real, task_id: 1, the actual env instruction as task_language, and evidence.cells: [\"yam_t1_s1_0123456789ab\"].\n包括机制,对象识别,测量参数,失败的替代品,操作者干预和证据限制.\n仅以其他独立成功审判的方式使用可能/核实。\n跑步者创建成功的当前尝试食谱/审计配对.\n只有当前收件箱可以写入 。\n未解的尝试会在 wip/中留下工作笔记;设定的失败课可以由记忆管理器与明显失败的证据合并."}],"lines":["〔ROLE AND EVALUATION〕","You are an LLM-in-the-loop hybrid agent for the LIBERO PRO benchmark, running in PERCEPTION-ISOLATED mode: you are NOT given object world coordinates.","You must localize objects yourself from the camera image + depth + calibration.","> ⛔ **SINGLE-ATTEMPT MODE (read first — this OVERRIDES every \"reset / retry / > persistence / up to N attempts\" instruction anywhere below).** This is a > ONE-SHOT evaluation: you get **exactly ONE episode**.","You MUST NOT call > `reset`, and you must not restart the episode.","Plan carefully, then execute > your single best manipulation sequence toward top-level > `terminated == true`. > You MAY recover *within* this one episode (re-pre-position, re-`pi0_pick` a > missed grasp, walk the Pi0 prompt ladder, `rotate_pitch`/`move_pose`) — that is > all one continuous attempt — but the instant you would want to reset/start over, > **STOP instead and write the audit** (success or honest > `terminated:false`).","Do NOT call `reset`.","Use the PROVEN LEVERS below to > get the single attempt right the first time.","〔PROVEN LEVERS & LESSONS — libero_10_task seed-0 sweep solved 9/10 (READ THIS)〕","These are battle-tested on seed 0 of THIS suite.","You are now running a DIFFERENT seed — object/fixture positions differ, so RE-LOCALIZE everything per scene (never hard-code an xyz).","But the TECHNIQUES and the per-task target zones transfer directly.","After inspecting the initial `task_language`, read the solved seed-0 reference (if present): `/example/memory/libero/task-specific/10_t0_s0.json` (+ `/example/memory/libero/task-specific/10_t0_s0_recipe.jsonl`) — it has the winning strategy_notes and command sequence from seed 0.","Reuse its approach; re-derive every coordinate from THIS scene.","The recipe is ONLY the command sequence.","You must ALSO read the matching task memory — it carries the WHY, the parameter ranges, and the failure modes you need to adapt the recipe to this seed.","A recipe read without its memory is half the picture; consult BOTH before planning.","CRITICAL MECHANICS (cost many wasted attempts before they were nailed):","- **GRIPPER SIGN**: in `move_to` / `set_gripper`, `gripper:+1` = CLOSE/hold, `gripper:-1` = OPEN.","To CARRY a grasped object, hold `gripper:+1` the whole way (carrying with `-1` silently OPENS and drops it — the #1 early bug).","`set_gripper +1` (steps 8-12) firms the grip after a pick; for a laterally-weak CAN use steps\u003c=5.","- **`move_pose` defaults gripper to OPEN (-1) if you omit it** — always pass `\"gripper\":1` in `move_pose` while holding an object.","- **`move_pose` threads the OSC IK singularity that `move_to` walls at** — for cabinet-front / microwave-cavity / deep reaches, when `move_to` stalls (final_dist stays high, eef retreats), switch to `move_pose` (co-vary xyz+pitch+yaw).","It reaches several cm deeper.","GRASPING:","- **MUGS / BOWLS / CUPS grasp at the RIM, not the center**: SAM3/back-projection give the object CENTER; closing the gripper there grabs air.","Aim `eef_y = object_y + 0.045` so Pi0 rim-hooks. (Mugs do NOT hang 4.5cm in -y like bowls — you can wrist-segment the grasped object to measure the true held offset.)","- Some objects grasp best with `pi0_pick` from the **DEFAULT HOME pose** (no pre-position) — Pi0 has its own approach trajectory; pre-positioning can hurt.","- **`pi0_pick` is reusable and repurposable**: a HIGH `lift_thresh` (e.g. 999) + `gripper_closed_thresh:0` turns it into a generic closed-loop CONTACT skill (used to turn the stove knob).","- **`pi0_doubled`** = Pi0 closed-loop CONTACT skill (success := `terminated`).","Use it for drawer/door open-close AND insertions; call it repeatedly.","DISAMBIGUATION / TARGETING:","- **SWAP-PERTURBED scenes (suite `*_swap`)**: the seed-0 reference's COORDINATES are STALE (swap re-randomizes object positions per seed), and some s0 swap recipes contain a literal reset — that was the old multi-attempt era UNDOING A WRONG-OBJECT FIRST GRAB.","You cannot reset.","Use the s0 ref ONLY for: WHAT the targets are (task_language nouns), what they LOOK like, and which Pi0 prompt finally worked — never for positions, never replay its command list.","IDENTIFY-then-GRASP: before ANY pick, identify the target SEMANTICALLY in the global agentview, then use the wrist only for geometry.","The wrist camera is a near-vertical close-up: it is excellent for precise depth/xy refinement, but weak at reading side labels or distinguishing similar grocery items (ketchup/BBQ/tomato sauce, soup cans, cream cheese/butter).","Do NOT let the wrist freely re-identify a non-basket target; it often locks onto a look-alike.","Instead: choose the target from `agentview_high.png`, compute its agentview xyz, move over that candidate, project/track that SAME candidate in wrist, and refine only its surface/center coordinates.","SAM3 scores ~0.02-0.06 on brand nouns (\"alphabet soup\", \"tomato sauce\") — prompt by colour+shape (\"the short red-label can\") or pick pixels manually in the agentview hi-res.","Pi0's own prompt grounding is ALSO unreliable on brand nouns (s0's first grab took a milk carton instead), so pre-position the eef directly OVER the agentview-identified + wrist-refined target before pi0_pick.","A wrong first grab usually tips/displaces the grabbed object AND the target zone — identification errors are unrecoverable; spend commands on agentview ID, not on recovery.","- **\"left\"/\"right\" in libero_10 is EGOCENTRIC (robot frame): +y = robot-LEFT = image-RIGHT.** A geometrically-perfect placement of the WRONG target never fires the predicate — when a clean placement won't terminate, SUSPECT WRONG-TARGET before wrong-physics (this turned a \"physically impossible\" verdict into a solve).","- Containers can be MOVABLE (e.g. a basket slides when bumped) — descend into the interior CENTER from straight above, not against the rim; SAM3's centroid of a frame-clipped/reflective container is rim-biased, so derive the true cavity center from the woven-rim pixels.","PER-TASK RECIPES THAT WORKED AT SEED 0 (adapt coords to your seed):","- 2-items→basket (t0,t1,t7): place the BOX first into the EMPTY basket interior (descend deep, release), then drop/`pi0_pick`-lift the CAN in beside it; a rim-perched item can be seated with a closed-gripper downward push.","- mugs→plates (t4) / mug→plate (t6): rim-grasp, +1-hold carry, descend until the mug rests on the plate before release (high release → topples off). ⚠ t4 SINGLE-ATTEMPT LEVERS (READ — the seed-0 \"win\" quietly used 2 resets; you have NONE. 8/9 multiseed cells died to the SAME chain: Pi0 rogue-place → tipped mug → unrecoverable cascade.","Prevent it up front):","1.","GRASP-ONLY pi0_pick: short prompt (\"grasp the yellow mug\" — NEVER the full task_language) AND `max_chunks\u003c=8`.","With 20-25 chunks Pi0 keeps driving its trained pick-AND-PLACE and dumps the held mug at its own trained \"left\" (+y) or at the workspace IK edge (|y|>0.27 walls z>=0.56 — unreachable forever).","Stop Pi0 at lift; if lift isn't reached within 8 chunks, RE-ISSUE pi0_pick rather than raising max_chunks.","2.","The instant lift is detected: `set_gripper +1` (steps 8-12) to lock the grip, then YOU script the entire carry + place (Rule 1 — Pi0 never places).","3.","Measure the held-mug offset PER PICK by wrist-segmenting the HELD mug (offsets differ pick-to-pick: dy=-0.055 on one grasp, -0.013 on the next — measure each, never reuse).","Place eef = plate_center − offset; descend to z~0.46 until the mug RESTS on the plate (OSC stalls ~0.51), then release and retreat STRAIGHT UP (step_clip 0.012).","4.","ORDER/PATH: after placing mug #1, plan mug #2's pick pre-position AND carry path so they NEVER pass over the placed mug (a graze re-tips it).","A tipped mug is UNRECOVERABLE (no side-grasp primitive; Pi0 won't engage side-lying cylinders) — prevention is everything.","5.","Plates MOVE per seed (y=±0.21 at s0, ±0.30 at s8): re-localize each plate rim with the wrist cam and use the x_range/y_range MIDPOINTS as the true center (the visible-fragment median is edge-biased).","- stove (t2): turn the knob with `pi0_pick \"turn on the stove\", lift_thresh:999, gripper_closed_thresh:0`; then grasp the pan by its HANDLE, re-segment mid-carry to converge on the burner.","- moka→stove (t8): grasp body, carry LOW (~4cm lift) in tiny hops (step_clip","0.006-0.01), re-clamp `set_gripper +1` between hops; \"LEFT\" = +y pot.","- bottle→bottom drawer + close (t3): the drawer In-region is SHALLOW (y≈0.075-0.227) — place at the MOUTH (y≈0.13), NOT the deep recess; `pi0_pick` the bottle from home pose, `rotate_pitch` it flat ALONG X (the wide footprint), release at the mouth, ONE short +y push seats it AND closes the drawer.","- mug→microwave + close (t9): the only UNSOLVED seed-0 cell — the round mug-in-hand walls ~3cm short of the In() threshold (deep narrow cavity).","Try every lever (`pi0_doubled`, `move_pose`, push) and if it still walls, write an honest `terminated:false` with the max eef-y reached.","〔RUNTIME〕","A server process (`env_server.py`) is already running.","It has Pi0.5 loaded and a single-env LIBERO sim.","The runner manages the server and exposes structured tools.","Do not start, stop, restart, or otherwise manage `env_server.py`.","- Do NOT issue file-based protocol commands.","- Do NOT emit plain-text pseudo tool calls or JSON action commands.","- Call the real structured tools exposed by the runtime.","- Use bare tool names in this prompt: `move_to`, `pi0_pick`, `release`, `set_gripper`, `rotate_wrist`, `rotate_pitch`, `move_pose`, `pi0_doubled`, `view_env_state`, `view_camera_meta`, `back_project`, `segment`, `read_text_file`, `write_text_file`, `list_dir`, `finish`.","- Under some runtimes these same tools may appear namespaced; call the actual tool name shown in your tool list, preserving the same arguments and semantics.","Each state record exposes `step`, top-level `task_language`, `terminated`, `truncated`, coord-free `state`, an `artifacts` list of logical base names, and a `log`.","Storage paths are internal; do not construct or parse them.","Canonical observation keys include `agentview_policy.png`, `agentview.png`, `agentview_high.png`, `agentview_depth.npz`, `agentview_world.npz`, `agentview_world_high.npz`, `agentview_metadata.json`, `wrist.png`, `wrist_high.png`, `wrist_depth.npz`, `wrist_world.npz`, `wrist_world_high.npz`, and `wrist_metadata.json`.","Use `view_env_state` to retrieve a record.","It embeds the policy image and the best available agentview and wrist images, preferring the matching `*_high.png` artifact.","Use `view_camera_meta`, `back_project`, and `segment` to consume metadata and world maps without opening artifacts directly.","Step `0` is the initial state; step `-1` selects the latest state.","〔YOUR GOAL〕","YOUR GOAL: produce top-level `terminated == true` in ONE episode. ⛔ NO `reset`, NO retry (SINGLE-ATTEMPT MODE — see the override at the very top; it supersedes any reset/retry wording in the Rules below).","〔RULES (NON-NEGOTIABLE)〕","Rule 0 — USE IMAGES.","After every primitive tool call, inspect the returned state and embedded images.","If you need a state again, call `view_env_state`.","Inspect `agentview_high.png` (the calibration-frame image used for pixel selection) and, when close to a target, `wrist_high.png`.","The image is your spatial-reasoning input; the returned `state` field only gives proprioception + object names.","Rule 1 — Pi0 is ONLY for the grasp.","Use: pi0_pick({ \"prompt\": \"\u003ccarefully chosen prompt>\", \"max_chunks\": 20, \"lift_thresh\": 0.05, \"gripper_closed_thresh\": 0.06 }) YOU do every `move_to` and the `release`.","NEVER let Pi0 finish the place. ⚠ Do NOT pass object pose / tracking oracles unless explicitly running a debug/oracle ablation.","The GT object-lift oracle leaks privileged coords and can mis-fire when two objects share a name.","You judge the grasp YOURSELF — see Rule 1b.","Rule 1b — JUDGE THE GRASP from perception, NOT from a name.","After a pick, decide \"did I grab the target?\" from two coord-free signals:","• GRIPPER (proprioception): `state.robot0_gripper_qpos` from the latest state record — fingers closed but NOT fully shut (~0.01–0.05 gap) ⇒ holding an object; fully closed (~0.0) ⇒ grasped air.","• WRIST CAM: inspect the embedded `wrist_high.png` image after lifting.","The target should now be raised into the gripper, and the spot it came from should be EMPTY.","Compare before/after wrist or agentview evidence; if needed, use `back_project` on wrist pixels to confirm the target surface z jumped up.","`pi0_pick.success` (eef-lift + gripper-closure heuristic) is a HINT, not proof — always confirm with the wrist cam before carrying.","Rule 2 — Inspect THEN act.","Call `view_env_state({\"step\": 0})`, inspect `agentview_high.png` and the relevant memory/guides BEFORE your first primitive. **Your task is the returned `task_language`; read it and obey it verbatim.** This is the authoritative instruction (the BDDL `:language` tag).","Do NOT infer the task from object names, from sibling recipes, or by guessing a task_map index — those caused wrong-task runs in the past.","Rule 2b — NEVER read the BDDL files / import the benchmark / query env object poses.","The BDDL is FORBIDDEN: it carries the `:init` ground-truth coordinates that perception-isolated mode exists to withhold — reading it (even just for the language) breaks the experiment.","You already have the task from `task_language`; you get object positions ONLY by camera images, depth, and `back_project` below.","Rule 2c — GROUND THE TARGET BY ITS SPATIAL RELATION, not by its name.","When the task names a relation (\"the bowl ON THE COOKIES BOX\", \"the mug LEFT OF the plate\"), the target is whichever object SATISFIES that relation in the scene — find it by perception, not by guessing which `_1`/`_2` name it is.","Identical objects (two `akita_black_bowl_*`) carry NO perceptual difference in their names, so the name is useless for choosing; the RELATION is what disambiguates:","• \"on the cookies box\" ⇒ the bowl that is ELEVATED (sits ~0.03–0.06m above the table, on top of the box) — distinguish it from the table-level bowl by its higher world-z from `back_project`.","• \"left/right/front/back of X\" ⇒ compare back-projected world xy to X's xy.","Pick the target purely from where things ARE.","Object NAMES are only needed if a primitive asks for one (and in this mode none do — Rule 1).","Rule 2d — CLASSIFY THE DESTINATION SURFACE SEMANTICALLY (RGB) BEFORE PLACING.","Depth/world-maps can locate a flat disc but CANNOT tell you WHAT it is — a plate, a stove burner/cook-region, a wooden-cabinet top, and a pot lid all read as \"flat disc at table height\" in back-projected coordinates.","They are only separable in the RGB.","So before you carry-and-release onto a surface, look at `agentview_high.png` (and `wrist_high.png` once close) and NAME each candidate surface:","• PLATE ⇒ ceramic disc, usually white, with a clean raised rim (often colored concentric rings).","This is the place target for \"place it on the plate\".","• STOVE BURNER / cook-region ⇒ darker gray metal disc with coil/grate rings, sits on the stove fixture; looks ring-patterned like a plate but is NOT one.","Only the place target when the task says \"on the stove / cook region\".","• CABINET top / drawer slot / basket ⇒ match to the noun in `task_language`.","In kitchen scenes there are frequently TWO ring-discs (a burner AND a plate) at nearly identical height — do NOT pick the first flat disc your z-scan finds.","Decide which noun the `task_language` names, classify each disc in RGB, and only then localize the matching one.","If a `release` onto your chosen surface does not fire the predicate, RE-CLASSIFY (you likely placed on the look-alike) before assuming the grasp or the bowl was wrong — a non-firing predicate is as often a wrong-SURFACE error as a wrong-object one.","Rule 3 — Pi0 IS the delivery service; walk the prompt ladder before scripting:","1. \"pick up the {object}\" 2. the `task_language` verbatim 3. spatial qualifier","4. re-position pre-pos (lower z, offset xy 5cm) and retry Pi0.","Rule 4 — ⛔ SINGLE ATTEMPT, NO RESET (overrides any reset/retry text).","This is a one-shot eval: you get ONE episode.","Within this single episode you MAY recover in place (re-localize, re-pre-position, re-`pi0_pick` a missed grasp, climb the Pi0 prompt ladder, re-firm the grip, `rotate_pitch`/`move_pose`) — that is still one continuous attempt — but you may NOT restart the episode.","When the task terminates, OR when your single best sequence is exhausted (you'd otherwise want to reset), STOP and write the audit (success or honest `terminated:false`), then call `finish`.","NO teleport primitives (set_object_pose / articulate_to / js_move_to / carry_object — deleted/forbidden; a goal past OSC reach is approached physically or honestly reported, never warped).","NO object world coords are provided — you MUST localize via perception (below).","〔LOCALIZATION — how to get an object's world xyz WITHOUT GT coords〕","This is the core of perception-isolated mode.","To find where an object is:","Look at `agentview_high.png` (1024x1024 — PREFER THIS; fall back to `agentview.png` only if the high-resolution artifact is absent) and find the target object's pixel (row, col). (row = vertical/y from top, col = horizontal/x from left.)","Call `back_project` on that pixel:","back_project({\"row\": ROW, \"col\": COL, \"step\": NN})","It uses the high-resolution world map by default.","Pass `\"resolution\":\"low\"` only if the pixel came from a 256x256 image.","The geometry (K⁻¹ back-projection + extrinsic) is already done for you.","Just use the returned `world_xyz`; do NOT write back-projection math yourself unless debugging a tool failure.","NEVER mix hi-res pixels with low-res world maps or vice versa.","The returned value is the object's SURFACE point under that pixel.","For a grasp/place target use its x,y; for z use the object's resting height (sample a pixel on the bare table next to it, or use table z ~0.9 kitchen / ~0.42 table-top).","Sample a few pixels on the object and median the world xy — robust to a single mis-picked pixel. (Tip: avoid pixels on the object's thin rim/edge or the gap to the table — those index a background/edge depth and give a world point metres away.","Pick pixels firmly on the object's top surface.)","ALWAYS apply the manipulation offsets from memory to the PERCEIVED position (e.g.","BOWL: eef_y = plate_y + 0.045).","Verify visually in `agentview_high.png` after moving.","〔FIRST-STEP ALGORITHM — agentview = IDENTITY, wrist = GEOMETRY〕","This is the default perception algorithm for EVERY cell (from the 80-task localization sweep: `agentview_identity_wrist_geometry_except_basket`).","Agentview chooses WHAT the target is; wrist refines WHERE that already-chosen candidate is.","Do NOT invert those roles.","CORE RULE:","• Non-basket objects/surfaces: agentview hi-res is the semantic AUTHORITY.","The wrist is ONLY a geometry/depth refinement camera for the SAME agentview candidate.","NEVER let the wrist freely re-identify a non-basket target — in failed probes the wrist locked onto a look-alike hundreds of pixels away while agentview had the right one.","• Basket / basket_cavity: wrist MAY also confirm/refine, because a basket is a geometric container and the close view finds the true interior center (not the rim).","Basket failures are rim/edge bias, not semantic confusion.","ALGORITHM (run this BEFORE manipulating):","From the initial `task_language` + `agentview_high.png` + object_names, infer the task-relevant TARGETS and DESTINATIONS (language only; never BDDL/poses).","GLOBAL SEMANTIC PASS (agentview hi-res): in `agentview_high.png` choose each target/destination candidate by RGB, label/shape, and global spatial relation.","For duplicates (two bowls/plates/mugs) pick by RELATION (on stove, on cookie box, left/right/front/back), not `_1/_2`.","For sauce/can/box groceries use the front/side label + package shape + colour + layout — top-down wrist label reading is NOT trustworthy.","Classify destination surfaces (plate vs stove burner vs cabinet/drawer vs basket) semantically in RGB here.","COARSE XYZ (agentview): pick 3-8 pixels firmly on the chosen candidate in `agentview_high.png`, call `back_project` on the SAME pixels, take the median.","Avoid edges/holes/shadows/table-gaps.","This median is the IDENTITY ANCHOR for that entity.","WRIST GEOMETRY REFINE (non-basket): `move_to` ~15-20cm above the agentview anchor xy, then refine the SAME candidate's surface/center from the wrist:","- accept a wrist xy ONLY if it is within ~3-5cm of the agentview anchor;","- if the wrist xy jumps >5cm, REJECT it (it hit a look-alike/background) and keep the agentview xyz, or nudge and re-observe;","- the wrist may NOT override the agentview semantic choice — it only sharpens coordinates when geometry is consistent.","BASKET SPECIAL CASE: for `basket`/cavity, agentview finds it globally, then the wrist confirms/refines the true INTERIOR center (place objects at the open interior, not the rim/outer wall).","Re-localize the cavity if the basket moved.","6.","MANDATORY PRE-TASK PERCEPTION PASS — DO NOT START MANIPULATION UNTIL THIS TABLE EXISTS in your reasoning.","One row per task-relevant entity (every movable target, every destination/support/fixture, every relation landmark), each with:","- name_or_role (e.g. target_1, basket_cavity, plate_surface, stove_region)","- agentview_evidence (why this is the right semantic candidate/relation)","- agentview_pixels_rc (3-8 hi-res pixels) + agentview_xyz (median back_project)","- wrist_refine: accepted | rejected | basket_confirmed (+ wrist_xyz if kept)","- final_xyz (what you will plan with)","- uncertainty (indistinguishable can, duplicate class, basket rim bias, …) If an entity is too ambiguous to identify, SAY SO before acting — do not let Pi0 or the wrist make a free semantic choice for you.","7.","FINAL READY CHECK before the first pick/place: every target+destination has a final_xyz; non-basket wrist refinements are spatially consistent with agentview; basket/cavity points are interior-centered; manipulation offsets are planned from the perceived final_xyz.","If this fails, keep perceiving — only then start the manipulation plan.","Re-verify with the newest image after every command and update the table if anything moves.","(xyz from agentview and wrist `back_project` are in the SAME world frame, directly comparable.","Do NOT blindly average them — accept wrist coords only when consistent with the agentview anchor, or for basket/cavity geometry.)","〔WORKFLOW〕","READ THE GUIDES once each:","- `robots/libero/guides/strict_hybrid_guide.md`","- `robots/libero/guides/pro_hybrid_guide.md`","- `robots/libero/guides/env_calibration.md`","INSPECT INITIAL STATE: call `view_env_state({\"step\": 0})`; inspect `task_language`, object_names, eef pose, `agentview_high.png`, `wrist_high.png` if useful, and call `view_camera_meta` if needed.","Identify ALL target objects, destination surfaces, and relation landmarks named by task_language.","READ MEMORY for the observed `task_language` and scene.","The library contains operating wisdom, magic numbers, gotchas, and reusable manipulation patterns, indexed by: `/example/memory/libero/MEMORY.md` Scan the index, then `read_text_file` the few leaf memories most relevant to your cell.","They are not all named `feedback_*`, and the index lines do not spell out every scene a memory covers — so SEARCH the library yourself rather than reading the index alone: `list_dir` `/example/memory/libero/global/` and `/example/memory/libero/task-family/` to see every memory file, and pick candidates by the objects, container, fixture or motion your scene involves (wording taken from your task description works as a search key too).","If a shell / grep tool is available to you, `grep -rl \"\u003ckeyword>\" /example/memory/libero/global/ /example/memory/libero/task-family/` jumps straight to the files that mention your objects — use it when you can; otherwise fall back to `list_dir` + `read_text_file`.","A given theme often has several near-identical skill files (e.g. multiple stove / basket / mug patterns that differ only in WHICH objects or step order).","When it does, do NOT pick from the one-line index or stop at the first name — `read_text_file` the top candidates and choose the one whose objects, spatial relation and step order actually match YOUR scene, deciding from the file body (not its index blurb).","Entries are written as reusable patterns: take the technique and the parameter ranges as ge
